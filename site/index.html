<script id="knowledge-data" type="application/json">{"title":"软件世界模型","groups":[{"id":"computation","name":"计算与运行","question":"规则怎样变成实际行为？","description":"从程序、运行环境走到资源与算法。"},{"id":"state","name":"数据与状态","question":"系统怎样组织与记住信息？","description":"连接数据模型、状态、存储与一致性。"},{"id":"communication","name":"通信与协作","question":"分散的部分怎样一起工作？","description":"理解前后端、接口、信息流与时间。"},{"id":"architecture","name":"边界与架构","question":"复杂系统怎样分工和连接？","description":"用职责、抽象和依赖理解整体结构。"},{"id":"reliability","name":"可靠性与信任","question":"失败和限制下，怎样保持正确？","description":"看见失败、权限、观测与资源取舍。"},{"id":"evolution","name":"演进与交付","question":"软件怎样到达用户并持续变化？","description":"理解交付、版本、迁移与验证。"},{"id":"ai","name":"AI 软件","question":"模型在系统中承担什么职责？","description":"把模型、Agent 和人的判断放回地图。"}],"pages":[{"id":"world-map","group":"orientation","title":"你点一下，软件里面发生了什么？","question":"你点一下，软件里面发生了什么？","summary":"你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点：有人发出要求，程序按规则做事，系统记住结果。","terms":["软件世界模型"],"aliases":["软件世界模型",""],"related":["program","state","boundaries"],"html":"\u003cp>你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点：\u003cstrong>有人发出要求，程序按规则做事，系统记住结果。\u003c/strong>\u003c/p>\n\u003cp>软件世界模型，就是把这些看不见的工作连起来。你能在脑中解释“它为什么会这样”，技术名词才有地方安放。\u003c/p>\n\u003ch2 id=\"section-1\">从一个阅读助手看进去\u003c/h2>\n\u003cp>假设我们做一个阅读助手：你放入文章，它帮你收藏、搜索，还能用 AI 写摘要。这是全库用来讲原理的虚构产品，你不需要真的把它做出来。\u003c/p>\n\u003cp>你看见的是屏幕上的文章、按钮和摘要。屏幕背后，有程序判断你点了什么，有地方保存文章；如果需要 AI，还要把文章交给模型，再把回答带回来。\u003cstrong>界面是你接触软件的入口，背后还有负责做事和记事的部分。\u003c/strong>\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNzM1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuS4gOS4quiBlOe9kemYheivu+WKqeaJi+eahOW3peS9nOWIhuW4gyI+PHRpdGxlPuS4gOS4quiBlOe9kemYheivu+WKqeaJi+eahOW3peS9nOWIhuW4gzwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDci 03cp>这四件事经常一起发生。收藏既是一次处理，也改变了记忆；搜索既要读取记忆，也要计算结果。\u003c/p>\n\u003ch2 id=\"section-4\">七个方向，是七种看同一软件的方式\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你现在的疑问\u003c/th>\n\u003cth>从这里进入\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>电脑怎么照着代码做事？\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">计算与运行\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>软件记住了什么，记在哪里？\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">数据与状态\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手机和远处的程序怎样联系？\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">通信与协作\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一大堆工作怎样分给不同部分？\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">边界与架构\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样应对失败、权限和速度问题？\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">可靠性与信任\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做好的软件怎样上线、更新和检查？\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">演进与交付\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 在其中负责哪一部分？\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 软件\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-5\">换成一个不联网的记事本\u003c/h2>\n\u003cp>同样是点“保存”，离线记事本可以由本机程序把文字写入本机文件，再显示成功。它仍有规则、运行中的记忆和长期记录，但不必经过远处账号服务，也不必调用 AI。\u003c/p>\n\u003cp>如果增加“手机电脑同步”，就要补两边传递记录、确认最新版本和处理同时编辑的安排。\u003cstrong>需求改变，才产生新的合作需要\u003c/strong>。七个方向帮助你追问这些关系，并不是让你给每个软件都凑齐一套部件。\u003c/p>\n\u003ch2 id=\"section-6\">第一次来，读这六篇就能连成一张图\u003c/h2>\n\u003cp>\u003ca href=\"#/program\">程序\u003c/a> → \u003ca href=\"#/runtime\">运行\u003c/a> → \u003ca href=\"#/state\">状态\u003c/a> → \u003ca href=\"#/client-server\">前后端\u003c/a> → \u003ca href=\"#/boundaries\">分工\u003c/a> → \u003ca href=\"#/model\">AI 模型\u003c/a>。这是阅读建议，所有文章都可以直接打开。\u003c/p>\n\u003cp>暂时不用背名词。先能说出“这个产品要做哪些事、记住哪些事、让哪些部分合作”，你就在建立自己的软件地图。\u003c/p>\n","text":"你点一下，软件里面发生了什么？ 你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点： 有人发出要求，程序按规则做事，系统记住结果。 软件世界模型，就是把这些看不见的工作连起来。你能在脑中解释“它为什么会这样”，技术名词才有地方安放。 从一个阅读助手看进去 假设我们做一个阅读助手：你放入文章，它帮你收藏、搜索，还能用 AI 写摘要。这是全库用来讲原理的虚构产品，你不需要真的把它做出来。 你看见的是屏幕上的文章、按钮和摘要。屏幕背后，有程序判断你点了什么，有地方保存文章；如果需要 AI，还要把文章交给模型，再把回答带回来。 界面是你接触软件的入口，背后还有负责做事和记事的部分。 手机上是操作入口；远处的电脑负责按规则处理要求，保存区留住文章，AI 提供摘要。连线表示信息往来；只有需要联网协作时，才有远处这些部分。 这张图画的是一个联网产品。一个离线笔记本可以把处理和保存都放在自己的电脑上。软件不一定都长得一样，值得追问的是：这些工作由谁完成，在哪里完成？ 跟完一次收藏，就能把它们连起来 在这个虚构产品里，假设文章 A 已经存在，你也已经登录。一次顺利收藏可以这样发生： 1. 手机页面记得你正在看文章 A。你点星星，页面产生“收藏 A”的要求。 2. 页面把要求送到服务端，也就是接受并处理要求的程序那里；它带上文章编号和登录凭据。凭据让服务端核实你对应哪个账号，不能只相信页面自称是谁。 3. 服务端查明你可以访问 A，再按收藏规则处理：还没有这条收藏就添加，已经有了就保留一条。 4. 保存部分确认记录写好了，服务端才返回“已收藏”。页面据此亮起星星。 5. 你在另一台设备打开收藏夹。那里的页面向服务端要当前账号的收藏，读到刚保存的 A，再把它画出来。 于是，手机的星星和电脑的收藏夹能够对应上，靠的是它们读写了同一账号下的记录。模型并没有参与这次收藏；只有你要求理解文章、生成摘要时，软件才可能把相应材料交给 AI。 如果第2步断网，后面的保存就不会因为你点过按钮而自动发生；如果记录已存好但回复丢了，页面又可能不知道已经成功。同一个可见现象“还在转圈”，背后可以是不同的经过。各篇文章会把这些分岔展开。 先抓住四件事 做事 ：程序收到“收藏这篇”的要求，执行收藏规则。没有规则，按钮就只是一张能点击的图。看程序怎样做事。 记事 ：收藏之后，系统要留下“这篇属于我的收藏”的记录，下次打开才找得到。看软件怎样记住事情。 合作 ：手机、负责处理的程序、保存文章的地方，可能不在同一台设备上。它们需要传递信息。看前端和后端。 持续可用 ：网络会断，用户会变多，产品会更新。还要安排失败后的处理和修改后的检查。看系统为什么会失败。 这四件事经常一起发生。收藏既是一次处理，也改变了记忆；搜索既要读取记忆，也要计算结果。 七个方向，是七种看同一软件的方式 你现在的疑问 从这里进入 --- --- 电脑怎么照着代码做事？ 计算与运行 软件记住了什么，记在哪里？ 数据与状态 手机和远处的程序怎样联系？ 通信与协作 一大堆工作怎样分给不同部分？ 边界与架构 怎样应对失败、权限和速度问题？ 可靠性与信任 做好的软件怎样上线、更新和检查？ 演进与交付 AI 在其中负责哪一部分？ AI 软件 换成一个不联网的记事本 同样是点“保存”，离线记事本可以由本机程序把文字写入本机文件，再显示成功。它仍有规则、运行中的记忆和长期记录，但不必经过远处账号服务，也不必调用 AI。 如果增加“手机电脑同步”，就要补两边传递记录、确认最新版本和处理同时编辑的安排。 需求改变，才产生新的合作需要 。七个方向帮助你追问这些关系，并不是让你给每个软件都凑齐一套部件。 第一次来，读这六篇就能连成一张图 程序 → 运行 → 状态 → 前后端 → 分工 → AI 模型。这是阅读建议，所有文章都可以直接打开。 暂时不用背名词。先能说出“这个产品要做哪些事、记住哪些事、让哪些部分合作”，你就在建立自己的软件地图。","outline":[{"id":"section-1","title":"从一个阅读助手看进去","depth":2},{"id":"section-2","title":"跟完一次收藏，就能把它们连起来","depth":2},{"id":"section-3","title":"先抓住四件事","depth":2},{"id":"section-4","title":"七个方向，是七种看同一软件的方式","depth":2},{"id":"section-5","title":"换成一个不联网的记事本","depth":2},{"id":"section-6","title":"第一次来，读这六篇就能连成一张图","depth":2}]},{"id":"program","group":"computation","title":"点一个按钮，电脑怎么知道要做什么？","question":"点一个按钮，电脑怎么知道要做什么？","summary":"你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。","terms":["程序","函数","副作用"],"aliases":["程序","","函数","","副作用","Side effect"],"related":["runtime","state"],"html":"\u003cp>你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。\u003c/p>\n\u003cp>\u003cstrong>程序是一套让电脑执行的规则。代码是人用编程语言写下这些规则的表达\u003c/strong>。你现在不需要认识代码的写法，先看规则怎样产生行为。\u003c/p>\n\u003ch2 id=\"section-1\">把一个收藏动作拆开看\u003c/h2>\n\u003cp>假设阅读助手收到“把文章 A 加入我的收藏”。它需要知道是哪位用户、哪篇文章，然后查看有没有已经收藏。还没有，就加入记录；已经有了，就保持一条，避免每点一次都多出一篇。\u003c/p>\n\u003cp>这里的“文章 A、我的账号、收藏要求”是\u003cstrong>输入\u003c/strong>，也就是交给程序的信息。检查和加入是处理。最后，程序告诉页面“收藏成功”，页面亮起星星，这就是你看到的\u003cstrong>输出\u003c/strong>。\u003c/p>\n\u003cp>已有收藏记录也会影响处理。把程序想成一个只管输入输出的计算器还不够：很多程序会读取以前留下的信息，再决定这次怎么办。以前留下的信息叫\u003ca href=\"#/state\">状态\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">同一个按钮，怎样得到不同结果？\u003c/h2>\n\u003cp>沿用虚构阅读助手，设小林的收藏起初为空。一次规则执行的过程可以写成普通话：\u003c/p>\n\u003col>\n\u003cli>收到“收藏文章 A”，先核实当前账号是小林，并检查 A 存在且允许他阅读。\u003c/li>\n\u003cli>查小林与 A 之间有没有收藏记录。没有，才尝试写入一条。\u003c/li>\n\u003cli>保存成功以后，把“已收藏”交回页面；页面把空星星改为亮星星。\u003c/li>\n\u003cli>小林再点一次时，已经能找到这条记录，程序不再新增，仍返回“已收藏”。\u003c/li>\n\u003c/ol>\n\u003cp>如果账号没有登录，过程停在身份检查；如果 A 已删除，过程停在文章检查；如果保存失败，不能给出已经保存成功的结果。\u003cstrong>程序的行为，是输入、已有记录和规则共同决定的\u003c/strong>。真正防止两次同时操作产生重复记录，还需要保存部分的约束，见\u003ca href=\"#/data-model\">数据模型\u003c/a>。\u003c/p>\n\u003cp>这也解释了为什么“加一个收藏按钮”并不是完整的要求：按钮只给了操作入口，上面几种结果怎样处理，仍需要规则。\u003c/p>\n\u003ch2 id=\"section-3\">规则里的两种基本安排\u003c/h2>\n\u003cp>一种是“满足条件，才做某事”。例如用户已登录，才把收藏记到他的账号下；没登录，就请他先登录。电脑必须有清楚的条件，不能自己猜“应该知道我是谁”。\u003c/p>\n\u003cp>另一种是“对一批东西重复做同类事情”。例如显示收藏夹时，把每篇文章的标题依次取出、摆到页面上。文章有多少篇，这个过程就要处理多少项。\u003c/p>\n\u003cp>条件判断和重复处理，是很多软件行为的基础。复杂软件会把许多规则组合起来，规则也可能在等待用户或其他程序的消息之后，才继续执行。\u003c/p>\n\u003ch2 id=\"section-4\">为什么代码里经常有“函数”？\u003c/h2>\n\u003cp>如果显示页面、搜索结果、收藏夹都需要“取出文章标题”，可以把这项工作写成一个可重复使用的小单元，给它名字。其他地方把文章交给它，就拿到标题。这种可调用的工作单元叫\u003cstrong>函数\u003c/strong>。\u003c/p>\n\u003cp>你可以把函数先理解成“有名字的一项工作”。它可以只算出一个结果，也可以顺便改变外面的东西，例如保存记录。程序员把这类对外部信息或世界的改变叫\u003cstrong>副作用\u003c/strong>，这个词不表示它一定有害。\u003c/p>\n\u003ch2 id=\"section-5\">函数不是另一个工作人员\u003c/h2>\n\u003cp>假设程序把“根据文章编号取出标题”写成函数。显示收藏夹时，它把 A 的编号交给这个函数，函数执行相应步骤，返回标题；调用它的那段程序再把标题放到页面。\u003c/p>\n\u003cp>给工作起名字，并不会让它自动开始、独立运行或变得聪明。它仍要被调用，输入不合要求也可能失败；一次函数调用还可能继续调用其他函数。你可以先把它看成程序组织和复用步骤的方式。\u003c/p>\n\u003cp>换成“删除文章”，需要先明确谁能删除、收藏里还指向这篇文章怎么办、删除成功后显示什么。把这些规则说清，再让 AI 写实现，就能检查它是否只做了按钮，还是把后面的行为也接上了。\u003c/p>\n\u003ch2 id=\"section-6\">软件的聪明从哪里来？\u003c/h2>\n\u003cp>传统程序做的是事先写清的处理。你希望它知道“收藏后不重复、删除前需确认”，就要把这些行为安排进去。AI 能帮助写规则，但目标含糊时，也可能写出符合字面要求、却不符合你真实意图的规则。\u003c/p>\n\u003cp>理解软件的第一步，可以从这里开始：一个动作带进了什么信息，触发了哪些规则，留下了什么结果。至于这些规则怎样真正动起来，继续看\u003ca href=\"#/runtime\">运行\u003c/a>。\u003c/p>\n","text":"点一个按钮，电脑怎么知道要做什么？ 你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。 程序是一套让电脑执行的规则。代码是人用编程语言写下这些规则的表达 。你现在不需要认识代码的写法，先看规则怎样产生行为。 把一个收藏动作拆开看 假设阅读助手收到“把文章 A 加入我的收藏”。它需要知道是哪位用户、哪篇文章，然后查看有没有已经收藏。还没有，就加入记录；已经有了，就保持一条，避免每点一次都多出一篇。 这里的“文章 A、我的账号、收藏要求”是 输入 ，也就是交给程序的信息。检查和加入是处理。最后，程序告诉页面“收藏成功”，页面亮起星星，这就是你看到的 输出 。 已有收藏记录也会影响处理。把程序想成一个只管输入输出的计算器还不够：很多程序会读取以前留下的信息，再决定这次怎么办。以前留下的信息叫状态。 同一个按钮，怎样得到不同结果？ 沿用虚构阅读助手，设小林的收藏起初为空。一次规则执行的过程可以写成普通话： 1. 收到“收藏文章 A”，先核实当前账号是小林，并检查 A 存在且允许他阅读。 2. 查小林与 A 之间有没有收藏记录。没有，才尝试写入一条。 3. 保存成功以后，把“已收藏”交回页面；页面把空星星改为亮星星。 4. 小林再点一次时，已经能找到这条记录，程序不再新增，仍返回“已收藏”。 如果账号没有登录，过程停在身份检查；如果 A 已删除，过程停在文章检查；如果保存失败，不能给出已经保存成功的结果。 程序的行为，是输入、已有记录和规则共同决定的 。真正防止两次同时操作产生重复记录，还需要保存部分的约束，见数据模型。 这也解释了为什么“加一个收藏按钮”并不是完整的要求：按钮只给了操作入口，上面几种结果怎样处理，仍需要规则。 规则里的两种基本安排 一种是“满足条件，才做某事”。例如用户已登录，才把收藏记到他的账号下；没登录，就请他先登录。电脑必须有清楚的条件，不能自己猜“应该知道我是谁”。 另一种是“对一批东西重复做同类事情”。例如显示收藏夹时，把每篇文章的标题依次取出、摆到页面上。文章有多少篇，这个过程就要处理多少项。 条件判断和重复处理，是很多软件行为的基础。复杂软件会把许多规则组合起来，规则也可能在等待用户或其他程序的消息之后，才继续执行。 为什么代码里经常有“函数”？ 如果显示页面、搜索结果、收藏夹都需要“取出文章标题”，可以把这项工作写成一个可重复使用的小单元，给它名字。其他地方把文章交给它，就拿到标题。这种可调用的工作单元叫 函数 。 你可以把函数先理解成“有名字的一项工作”。它可以只算出一个结果，也可以顺便改变外面的东西，例如保存记录。程序员把这类对外部信息或世界的改变叫 副作用 ，这个词不表示它一定有害。 函数不是另一个工作人员 假设程序把“根据文章编号取出标题”写成函数。显示收藏夹时，它把 A 的编号交给这个函数，函数执行相应步骤，返回标题；调用它的那段程序再把标题放到页面。 给工作起名字，并不会让它自动开始、独立运行或变得聪明。它仍要被调用，输入不合要求也可能失败；一次函数调用还可能继续调用其他函数。你可以先把它看成程序组织和复用步骤的方式。 换成“删除文章”，需要先明确谁能删除、收藏里还指向这篇文章怎么办、删除成功后显示什么。把这些规则说清，再让 AI 写实现，就能检查它是否只做了按钮，还是把后面的行为也接上了。 软件的聪明从哪里来？ 传统程序做的是事先写清的处理。你希望它知道“收藏后不重复、删除前需确认”，就要把这些行为安排进去。AI 能帮助写规则，但目标含糊时，也可能写出符合字面要求、却不符合你真实意图的规则。 理解软件的第一步，可以从这里开始：一个动作带进了什么信息，触发了哪些规则，留下了什么结果。至于这些规则怎样真正动起来，继续看运行。","outline":[{"id":"section-1","title":"把一个收藏动作拆开看","depth":2},{"id":"section-2","title":"同一个按钮，怎样得到不同结果？","depth":2},{"id":"section-3","title":"规则里的两种基本安排","depth":2},{"id":"section-4","title":"为什么代码里经常有“函数”？","depth":2},{"id":"section-5","title":"函数不是另一个工作人员","depth":2},{"id":"section-6","title":"软件的聪明从哪里来？","depth":2}]},{"id":"runtime","group":"computation","title":"代码放在那里，为什么软件还没开始工作？","question":"代码放在那里，为什么软件还没开始工作？","summary":"一份菜谱放在桌上，饭不会自己出现。同样，写好的代码放在文件里，也不会自动回应你的点击。运行，就是让电脑开始执行代码里描述的工作。","terms":["运行时","进程","依赖"],"aliases":["运行时","Runtime","进程","Process","依赖","Dependency"],"related":["resources","delivery"],"html":"\u003cp>一份菜谱放在桌上，饭不会自己出现。同样，写好的代码放在文件里，也不会自动回应你的点击。\u003cstrong>运行，就是让电脑开始执行代码里描述的工作。\u003c/strong>\u003c/p>\n\u003cp>菜谱只用来说明“说明书和实际做事不同”。电脑执行的是明确的指令，没有厨师那样的生活理解能力。\u003c/p>\n\u003ch2 id=\"section-1\">文件是静止的，运行会占用电脑\u003c/h2>\n\u003cp>假设阅读助手的代码已经写好。启动以前，代码是一批保存着的文件。启动以后，电脑开始处理点击、读取文章，还要暂存当前打开的内容。\u003c/p>\n\u003cp>这份正在进行的程序活动，会占用电脑的计算和记忆空间。操作系统把这样的运行实例叫作\u003cstrong>进程\u003c/strong>。操作系统就是电脑上负责安排各个程序使用机器的基础软件，例如 Windows 或 macOS。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNjEwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuS4gOS7veS7o+eggeS4juS4pOS4qui/kOihjOWunuS+iyI+PHRpdGxlPuS4gOS7veS7o+eggeS4juS4pOS4qui/kOihjOWunuS+izwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI2MTAiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5P 3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjUwMCI+5Li05pe26K6w5b+GPC90ZXh0Pjx0ZXh0IHg9IjIwMCIgeT0iNTc5IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNTAwIj7ku6PnoIHnm7jlkIzvvIzov5DooYzkuK3nmoTmtLvliqjlkIToh6rlrZjlnKg8L3RleHQ+PC9nPjwvc3ZnPg==\" alt=\"上方的代码文件没有运行；启动后，同一份代码可以产生两个运行实例，它们各自占用临时记忆。关闭一个实例会结束这份活动，代码文件仍然保留。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>上方的代码文件没有运行；启动后，同一份代码可以产生两个运行实例，它们各自占用临时记忆。关闭一个实例会结束这份活动，代码文件仍然保留。\u003c/figcaption>\u003c/figure>\n\u003cp>图中两扇窗口代表两个运行实例，不表示每个真实窗口都恰好对应一个进程。你需要先看懂的是：\u003cstrong>一份代码，可以产生多份正在工作的实例。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-2\">谁把代码里的话变成机器动作？\u003c/h2>\n\u003cp>机器最终执行自己的指令。人写的编程语言，需要相应的软件来执行或转换。不同语言的过程有所不同：有些先转换成机器能执行的形式，有些交给语言执行器处理。\u003c/p>\n\u003cp>执行代码时所需的这套支持，常被称为\u003cstrong>运行时\u003c/strong>。例如浏览器带有执行 JavaScript 的能力，所以网页中的这类代码能在浏览器里工作。你不必先学 JavaScript，先理解“代码需要与它匹配的执行能力”。\u003c/p>\n\u003cp>运行时和操作系统各管一层：前者支持特定语言的执行，后者安排程序使用电脑。仅有操作系统，未必已经有某种代码需要的全部支持。\u003c/p>\n\u003ch2 id=\"section-3\">从双击图标到能回应你，中间发生什么？\u003c/h2>\n\u003cp>以本机阅读助手为教学示例，先忽略不同系统的具体启动细节：\u003c/p>\n\u003col>\n\u003cli>你点图标，操作系统找到启动入口，开始安排这份程序活动使用内存和处理时间。\u003c/li>\n\u003cli>执行代码所需的支持被准备好。网页中的 JavaScript 由浏览器提供执行支持，其他程序可能使用随软件一起提供的运行时，或直接执行提前转换好的机器指令。\u003c/li>\n\u003cli>程序做启动工作，例如读设置、准备文章列表，建立等待用户操作的入口。\u003c/li>\n\u003cli>你点文章标题，程序处理这个动作，再把结果交给界面显示。\u003c/li>\n\u003c/ol>\n\u003cp>如果第2步缺少所需执行能力，程序可能根本启动不了；如果第3步找不到文章文件，窗口可能已经出现，正文却还不能读。“进程存在”“页面出现”“功能可用”是逐步成立的不同结果。\u003c/p>\n\u003cp>程序也可能启动后一直等待请求，暂时不做新的计算。处于运行中，不表示它每一瞬间都在忙碌；操作系统可以先把处理时间交给别的程序。\u003c/p>\n\u003ch2 id=\"section-4\">为什么换一台电脑，程序可能跑不起来？\u003c/h2>\n\u003cp>代码可能还需要别的现成软件，比如读取 PDF 的组件。它用到了对方的能力，就对对方形成了\u003cstrong>依赖\u003c/strong>。新电脑如果没准备这些组件，即使代码一样，也可能无法完成工作。\u003c/p>\n\u003cp>因此“软件能运行”要同时具备：要执行的代码、合适的执行支持，以及它需要的其他能力。这些条件合在一起，可以叫运行环境。\u003c/p>\n\u003cp>例如两台电脑都有同一份代码，但其中一台缺少读取 PDF 的组件，打开普通文字可能成功，打开 PDF 才失败。因此环境问题既可能在启动时暴露，也可能等到某项能力被使用时才暴露。\u003c/p>\n\u003cp>让 AI 交付软件时，可以要求它说明：启动入口是什么、需要准备哪些执行支持和组件、用什么可见结果确认已能工作。换电脑时逐项准备这些条件，比只复制一份文件更接近“把同一个软件运行起来”。\u003c/p>\n\u003cp>关闭软件会结束一些运行中的活动和临时记忆，已经保存到文件里的内容则可以继续留下。理解这个区别，接着读\u003ca href=\"#/resources\">计算、内存和存储\u003c/a>，就容易知道机器各部分在做什么。\u003c/p>\n","text":"代码放在那里，为什么软件还没开始工作？ 一份菜谱放在桌上，饭不会自己出现。同样，写好的代码放在文件里，也不会自动回应你的点击。 运行，就是让电脑开始执行代码里描述的工作。 菜谱只用来说明“说明书和实际做事不同”。电脑执行的是明确的指令，没有厨师那样的生活理解能力。 文件是静止的，运行会占用电脑 假设阅读助手的代码已经写好。启动以前，代码是一批保存着的文件。启动以后，电脑开始处理点击、读取文章，还要暂存当前打开的内容。 这份正在进行的程序活动，会占用电脑的计算和记忆空间。操作系统把这样的运行实例叫作 进程 。操作系统就是电脑上负责安排各个程序使用机器的基础软件，例如 Windows 或 macOS。 上方的代码文件没有运行；启动后，同一份代码可以产生两个运行实例，它们各自占用临时记忆。关闭一个实例会结束这份活动，代码文件仍然保留。 图中两扇窗口代表两个运行实例，不表示每个真实窗口都恰好对应一个进程。你需要先看懂的是： 一份代码，可以产生多份正在工作的实例。 谁把代码里的话变成机器动作？ 机器最终执行自己的指令。人写的编程语言，需要相应的软件来执行或转换。不同语言的过程有所不同：有些先转换成机器能执行的形式，有些交给语言执行器处理。 执行代码时所需的这套支持，常被称为 运行时 。例如浏览器带有执行 JavaScript 的能力，所以网页中的这类代码能在浏览器里工作。你不必先学 JavaScript，先理解“代码需要与它匹配的执行能力”。 运行时和操作系统各管一层：前者支持特定语言的执行，后者安排程序使用电脑。仅有操作系统，未必已经有某种代码需要的全部支持。 从双击图标到能回应你，中间发生什么？ 以本机阅读助手为教学示例，先忽略不同系统的具体启动细节： 1. 你点图标，操作系统找到启动入口，开始安排这份程序活动使用内存和处理时间。 2. 执行代码所需的支持被准备好。网页中的 JavaScript 由浏览器提供执行支持，其他程序可能使用随软件一起提供的运行时，或直接执行提前转换好的机器指令。 3. 程序做启动工作，例如读设置、准备文章列表，建立等待用户操作的入口。 4. 你点文章标题，程序处理这个动作，再把结果交给界面显示。 如果第2步缺少所需执行能力，程序可能根本启动不了；如果第3步找不到文章文件，窗口可能已经出现，正文却还不能读。“进程存在”“页面出现”“功能可用”是逐步成立的不同结果。 程序也可能启动后一直等待请求，暂时不做新的计算。处于运行中，不表示它每一瞬间都在忙碌；操作系统可以先把处理时间交给别的程序。 为什么换一台电脑，程序可能跑不起来？ 代码可能还需要别的现成软件，比如读取 PDF 的组件。它用到了对方的能力，就对对方形成了 依赖 。新电脑如果没准备这些组件，即使代码一样，也可能无法完成工作。 因此“软件能运行”要同时具备：要执行的代码、合适的执行支持，以及它需要的其他能力。这些条件合在一起，可以叫运行环境。 例如两台电脑都有同一份代码，但其中一台缺少读取 PDF 的组件，打开普通文字可能成功，打开 PDF 才失败。因此环境问题既可能在启动时暴露，也可能等到某项能力被使用时才暴露。 让 AI 交付软件时，可以要求它说明：启动入口是什么、需要准备哪些执行支持和组件、用什么可见结果确认已能工作。换电脑时逐项准备这些条件，比只复制一份文件更接近“把同一个软件运行起来”。 关闭软件会结束一些运行中的活动和临时记忆，已经保存到文件里的内容则可以继续留下。理解这个区别，接着读计算、内存和存储，就容易知道机器各部分在做什么。","outline":[{"id":"section-1","title":"文件是静止的，运行会占用电脑","depth":2},{"id":"section-2","title":"谁把代码里的话变成机器动作？","depth":2},{"id":"section-3","title":"从双击图标到能回应你，中间发生什么？","depth":2},{"id":"section-4","title":"为什么换一台电脑，程序可能跑不起来？","depth":2}]},{"id":"resources","group":"computation","title":"电脑的计算、内存和硬盘，各忙什么？","question":"电脑的计算、内存和硬盘，各忙什么？","summary":"你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。","terms":["处理器","内存","操作系统"],"aliases":["处理器","","内存","","操作系统",""],"related":["algorithms","storage"],"html":"\u003cp>你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。\u003c/p>\n\u003cp>先把机器里的三项工作分开：\u003cstrong>计算要有人做，正在用的东西要有地方放，下次还要用的东西要留得住。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">处理器做计算，内存放眼前的材料\u003c/h2>\n\u003cp>电脑里执行机器指令的部分，叫处理器，常见缩写是 CPU。比较标题、统计字数、处理页面动作，都需要计算。\u003c/p>\n\u003cp>程序打开一篇文章时，需要能快速拿到它的内容和当前阅读位置。用于承载运行中数据的空间，叫\u003cstrong>内存\u003c/strong>。你可以把它想成工作桌：正在处理的材料放手边，读写快，但空间有限。\u003c/p>\n\u003cp>打开更多文章，就可能要同时占用更多内存。计算越多，也越需要处理器的时间。因此“卡”可能来自做不过来，也可能来自工作桌太满，不能只靠一个“电脑慢”解释所有情况。\u003c/p>\n\u003ch2 id=\"section-2\">硬盘像能留到下次的档案柜\u003c/h2>\n\u003cp>关掉程序后还想保留文章，就要写到文件、数据库等能长期保存记录的地方。电脑本地常用的物理载体是硬盘或固态硬盘。\u003c/p>\n\u003cp>它们通常容量更大，也能在断电后保留数据，但访问速度一般比内存慢。工作桌与档案柜的类比说明了寿命和使用方式的区别，真实电脑里两者都是电子设备。\u003c/p>\n\u003cp>“放在硬盘里”也不等于永远安全。误删、设备损坏或写入未完成，仍可能让信息丢失；重要内容还需要备份等安排。\u003c/p>\n\u003ch2 id=\"section-3\">打开、修改、保存，一篇文章走过哪些地方？\u003c/h2>\n\u003cp>假设文章原先保存在本机硬盘里。你打开它，程序借助操作系统读取文件，把正在用的内容放入内存；处理器执行排版等指令，让界面显示文字。\u003c/p>\n\u003cp>你改掉一个标题，新的文字可以先只存在内存中。点保存后，程序请求把修改写到长期存储，并按其保存机制确认结果。此后重启再读取，才有机会拿到新标题。程序可能有自动保存或缓存，实际何时完成要看它的安排。\u003c/p>\n\u003cp>如果保存前程序退出，原文件可能还在，刚改的标题却没了。这里没有矛盾：原文件与尚未保存的修改，放在了寿命不同的地方。内存负责眼前工作，长期存储负责跨越这次运行留下结果。\u003c/p>\n\u003ch2 id=\"section-4\">谁防止几个程序抢成一团？\u003c/h2>\n\u003cp>你同时开浏览器、音乐播放器和阅读助手，它们都想用计算、内存、文件和网络。负责安排这些使用的软件叫\u003cstrong>操作系统\u003c/strong>。\u003c/p>\n\u003cp>它给程序提供使用机器的方式，分配处理时间，也尽量把不同程序的运行活动隔开。所以代码通常通过操作系统提供的能力读文件、建立网络连接。\u003c/p>\n\u003ch2 id=\"section-5\">远处的服务器也有这些限制\u003c/h2>\n\u003cp>联网软件把部分工作放到远处的电脑上，并没有消除物理限制。远处也需要处理器、内存和存储，也可能忙不过来。\u003c/p>\n\u003cp>假设慢的是打开几十篇大文章，关闭部分文章后明显好转，内存占用就是值得查看的线索；若每次都在等远处模型，换更大的本机硬盘通常不能让模型提前生成完。这些只是定位方向，仍要查看实际使用量和耗时，不能单凭“卡”就断定原因。\u003c/p>\n\u003cp>对 AI 描述性能要求时，可以说清规模和动作，例如“同时打开十篇长文章时仍能流畅切换”。“换更好的机器”只是一个可能措施，先知道哪种资源限制了哪个步骤，才能判断花费是否有用。\u003c/p>\n\u003cp>于是，软件的组织方式会影响它用了多少机器资源。用更少步骤找到文章，可能减少计算；把常用结果留在手边，可能减少等待。前者连接\u003ca href=\"#/algorithms\">算法\u003c/a>，后者连接\u003ca href=\"#/storage\">存储与缓存\u003c/a>。\u003c/p>\n","text":"电脑的计算、内存和硬盘，各忙什么？ 你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。 先把机器里的三项工作分开： 计算要有人做，正在用的东西要有地方放，下次还要用的东西要留得住。 处理器做计算，内存放眼前的材料 电脑里执行机器指令的部分，叫处理器，常见缩写是 CPU。比较标题、统计字数、处理页面动作，都需要计算。 程序打开一篇文章时，需要能快速拿到它的内容和当前阅读位置。用于承载运行中数据的空间，叫 内存 。你可以把它想成工作桌：正在处理的材料放手边，读写快，但空间有限。 打开更多文章，就可能要同时占用更多内存。计算越多，也越需要处理器的时间。因此“卡”可能来自做不过来，也可能来自工作桌太满，不能只靠一个“电脑慢”解释所有情况。 硬盘像能留到下次的档案柜 关掉程序后还想保留文章，就要写到文件、数据库等能长期保存记录的地方。电脑本地常用的物理载体是硬盘或固态硬盘。 它们通常容量更大，也能在断电后保留数据，但访问速度一般比内存慢。工作桌与档案柜的类比说明了寿命和使用方式的区别，真实电脑里两者都是电子设备。 “放在硬盘里”也不等于永远安全。误删、设备损坏或写入未完成，仍可能让信息丢失；重要内容还需要备份等安排。 打开、修改、保存，一篇文章走过哪些地方？ 假设文章原先保存在本机硬盘里。你打开它，程序借助操作系统读取文件，把正在用的内容放入内存；处理器执行排版等指令，让界面显示文字。 你改掉一个标题，新的文字可以先只存在内存中。点保存后，程序请求把修改写到长期存储，并按其保存机制确认结果。此后重启再读取，才有机会拿到新标题。程序可能有自动保存或缓存，实际何时完成要看它的安排。 如果保存前程序退出，原文件可能还在，刚改的标题却没了。这里没有矛盾：原文件与尚未保存的修改，放在了寿命不同的地方。内存负责眼前工作，长期存储负责跨越这次运行留下结果。 谁防止几个程序抢成一团？ 你同时开浏览器、音乐播放器和阅读助手，它们都想用计算、内存、文件和网络。负责安排这些使用的软件叫 操作系统 。 它给程序提供使用机器的方式，分配处理时间，也尽量把不同程序的运行活动隔开。所以代码通常通过操作系统提供的能力读文件、建立网络连接。 远处的服务器也有这些限制 联网软件把部分工作放到远处的电脑上，并没有消除物理限制。远处也需要处理器、内存和存储，也可能忙不过来。 假设慢的是打开几十篇大文章，关闭部分文章后明显好转，内存占用就是值得查看的线索；若每次都在等远处模型，换更大的本机硬盘通常不能让模型提前生成完。这些只是定位方向，仍要查看实际使用量和耗时，不能单凭“卡”就断定原因。 对 AI 描述性能要求时，可以说清规模和动作，例如“同时打开十篇长文章时仍能流畅切换”。“换更好的机器”只是一个可能措施，先知道哪种资源限制了哪个步骤，才能判断花费是否有用。 于是，软件的组织方式会影响它用了多少机器资源。用更少步骤找到文章，可能减少计算；把常用结果留在手边，可能减少等待。前者连接算法，后者连接存储与缓存。","outline":[{"id":"section-1","title":"处理器做计算，内存放眼前的材料","depth":2},{"id":"section-2","title":"硬盘像能留到下次的档案柜","depth":2},{"id":"section-3","title":"打开、修改、保存，一篇文章走过哪些地方？","depth":2},{"id":"section-4","title":"谁防止几个程序抢成一团？","depth":2},{"id":"section-5","title":"远处的服务器也有这些限制","depth":2}]},{"id":"algorithms","group":"computation","title":"为什么做同一件事，有的软件快得多？","question":"为什么做同一件事，有的软件快得多？","summary":"要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。","terms":["算法","数据结构","复杂度","二分查找"],"aliases":["算法","","数据结构","","复杂度","Complexity","二分查找","Binary search"],"related":["performance","data-model"],"html":"\u003cp>要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。\u003c/p>\n\u003cp>两种办法都可能找对，花的工作量却不同。\u003cstrong>解决问题的步骤安排，叫算法；信息怎样组织，影响哪些步骤做起来方便。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">先整理，可能让以后少找很多次\u003c/h2>\n\u003cp>假设所有标题乱放，每次搜索都可能要查看大部分文章。若额外建立“标题对应文章位置”的索引，就能利用索引更快地定位。\u003c/p>\n\u003cp>索引像书末的词条目录：你付出一次整理工作，之后多次查找就能少翻页。软件中的索引也要占空间，文章变化时还要维护，所以加索引同时带来查找收益和维护成本。\u003c/p>\n\u003ch2 id=\"section-2\">不靠“查得更聪明”，也能看见少做了什么\u003c/h2>\n\u003cp>看一个缩小的教学例子：八份记录按编号1到8排好，要找编号7。\u003c/p>\n\u003cp>逐项查找会依次比较1、2、3、4、5、6、7，共七次。另一种办法是先看中间的4：7比4大，前半不用再找；再看后半中间的6，仍偏小；再看7，找到了。这次用了三次比较。\u003c/p>\n\u003cp>每次比较都利用“编号已经排好”的条件，排除一部分不可能的位置。没有这个条件，看到4就不能断定7一定在后面。这个反复缩小范围的办法，叫二分查找；例子的次数只描述这八项数据，不是所有查询的固定耗时。\u003c/p>\n\u003cp>索引会用适合查询的结构保存可查信息和记录位置。它不一定就是这套二分步骤，但共同思路是：\u003cstrong>利用已经组织好的信息，避免每次重新查看全部材料\u003c/strong>。\u003c/p>\n\u003ch2 id=\"section-3\">数据的摆法，是解决办法的一部分\u003c/h2>\n\u003cp>把文章逐项放成清单，适合按顺序浏览；按标题组织查找表，适合通过标题找位置。程序里这类信息组织方式叫\u003cstrong>数据结构\u003c/strong>。\u003c/p>\n\u003cp>它和算法配合。信息的摆法可能让某种操作很方便，也让另一种操作更费事。选哪一种，要看软件经常做什么，不能只说一种结构“更高级”。\u003c/p>\n\u003ch2 id=\"section-4\">用户变多以后，差别才可能明显\u003c/h2>\n\u003cp>十篇文章时，逐个查也很快。一万篇时，同样的办法要做更多比较。如果某个办法需要把每篇与所有其他文章都比较，数量翻倍，比较次数可能增长得更快。\u003c/p>\n\u003cp>描述“规模变大，工作量怎样增长”的概念，叫\u003cstrong>复杂度\u003c/strong>。它帮助我们看增长趋势，不能单独告诉你某台电脑会花几秒；机器速度、具体写法和数据情况也会影响耗时。\u003c/p>\n\u003ch2 id=\"section-5\">新增文章时，之前省的工作也要维护\u003c/h2>\n\u003cp>如果标题目录还写着“旅行→第7份记录”，原文改名或搬了位置，目录不更新就可能找错。维护索引需要额外记录、存储空间和写入工作；数据库通常可以替应用维护其索引，但仍有资源成本。\u003c/p>\n\u003cp>换成一个只读十篇说明的离线手册，逐项搜索可能足够简单；换成反复查询的大型文章库，预先整理的收益可能更明显。选择办法时要把“查多少次、改多少次、有多少记录”一起看，不能只比较一次查找的演示。\u003c/p>\n\u003ch2 id=\"section-6\">算法好，整个软件就一定快吗？\u003c/h2>\n\u003cp>如果查找本来只花很短时间，真正慢的是等 AI 写摘要，那么改搜索算法对整体等待帮助有限。要先知道时间花在哪里，才能知道减少哪项工作有用。\u003c/p>\n\u003cp>所以软件速度既与做事的方法有关，也与网络、存储、机器能力有关。算法这一格告诉你：\u003cstrong>同一个目标，可以有工作量很不同的实现办法\u003c/strong>。整体速度继续看\u003ca href=\"#/performance\">性能与成本\u003c/a>。\u003c/p>\n","text":"为什么做同一件事，有的软件快得多？ 要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。 两种办法都可能找对，花的工作量却不同。 解决问题的步骤安排，叫算法；信息怎样组织，影响哪些步骤做起来方便。 先整理，可能让以后少找很多次 假设所有标题乱放，每次搜索都可能要查看大部分文章。若额外建立“标题对应文章位置”的索引，就能利用索引更快地定位。 索引像书末的词条目录：你付出一次整理工作，之后多次查找就能少翻页。软件中的索引也要占空间，文章变化时还要维护，所以加索引同时带来查找收益和维护成本。 不靠“查得更聪明”，也能看见少做了什么 看一个缩小的教学例子：八份记录按编号1到8排好，要找编号7。 逐项查找会依次比较1、2、3、4、5、6、7，共七次。另一种办法是先看中间的4：7比4大，前半不用再找；再看后半中间的6，仍偏小；再看7，找到了。这次用了三次比较。 每次比较都利用“编号已经排好”的条件，排除一部分不可能的位置。没有这个条件，看到4就不能断定7一定在后面。这个反复缩小范围的办法，叫二分查找；例子的次数只描述这八项数据，不是所有查询的固定耗时。 索引会用适合查询的结构保存可查信息和记录位置。它不一定就是这套二分步骤，但共同思路是： 利用已经组织好的信息，避免每次重新查看全部材料 。 数据的摆法，是解决办法的一部分 把文章逐项放成清单，适合按顺序浏览；按标题组织查找表，适合通过标题找位置。程序里这类信息组织方式叫 数据结构 。 它和算法配合。信息的摆法可能让某种操作很方便，也让另一种操作更费事。选哪一种，要看软件经常做什么，不能只说一种结构“更高级”。 用户变多以后，差别才可能明显 十篇文章时，逐个查也很快。一万篇时，同样的办法要做更多比较。如果某个办法需要把每篇与所有其他文章都比较，数量翻倍，比较次数可能增长得更快。 描述“规模变大，工作量怎样增长”的概念，叫 复杂度 。它帮助我们看增长趋势，不能单独告诉你某台电脑会花几秒；机器速度、具体写法和数据情况也会影响耗时。 新增文章时，之前省的工作也要维护 如果标题目录还写着“旅行→第7份记录”，原文改名或搬了位置，目录不更新就可能找错。维护索引需要额外记录、存储空间和写入工作；数据库通常可以替应用维护其索引，但仍有资源成本。 换成一个只读十篇说明的离线手册，逐项搜索可能足够简单；换成反复查询的大型文章库，预先整理的收益可能更明显。选择办法时要把“查多少次、改多少次、有多少记录”一起看，不能只比较一次查找的演示。 算法好，整个软件就一定快吗？ 如果查找本来只花很短时间，真正慢的是等 AI 写摘要，那么改搜索算法对整体等待帮助有限。要先知道时间花在哪里，才能知道减少哪项工作有用。 所以软件速度既与做事的方法有关，也与网络、存储、机器能力有关。算法这一格告诉你： 同一个目标，可以有工作量很不同的实现办法 。整体速度继续看性能与成本。","outline":[{"id":"section-1","title":"先整理，可能让以后少找很多次","depth":2},{"id":"section-2","title":"不靠“查得更聪明”，也能看见少做了什么","depth":2},{"id":"section-3","title":"数据的摆法，是解决办法的一部分","depth":2},{"id":"section-4","title":"用户变多以后，差别才可能明显","depth":2},{"id":"section-5","title":"新增文章时，之前省的工作也要维护","depth":2},{"id":"section-6","title":"算法好，整个软件就一定快吗？","depth":2}]},{"id":"data-model","group":"state","title":"软件怎么把“人和文章”记成数据？","question":"软件怎么把“人和文章”记成数据？","summary":"你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。","terms":["实体","标识","约束"],"aliases":["实体","","标识","","约束",""],"related":["state","consistency"],"html":"\u003cp>你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。\u003c/p>\n\u003cp>\u003cstrong>数据模型，就是软件选择用哪些记录和关系，来表示它关心的世界\u003c/strong>。它像一套有明确栏目和连接方式的登记簿。\u003c/p>\n\u003ch2 id=\"section-1\">同叫《旅行》，不代表是同一篇\u003c/h2>\n\u003cp>假设阅读助手里有两篇文章都叫《旅行》。只用标题识别文章，收藏和删除时就可能混淆。\u003c/p>\n\u003cp>程序可以为每篇文章分配不重复的编号，例如 A17 和 A28。这个用来辨认具体对象的值，叫\u003cstrong>标识\u003c/strong>，常见名字是 ID。你看到标题，程序用编号确认到底是哪一篇。\u003c/p>\n\u003cp>需要独立辨认的对象，比如用户、文章、收藏记录，常叫\u003cstrong>实体\u003c/strong>。实体可以有多个信息项，程序员会叫它们字段：文章的编号、标题、正文就是不同字段。\u003c/p>\n\u003ch2 id=\"section-2\">单个记录之外，还需要关系\u003c/h2>\n\u003cp>“小林收藏了 A17”连接了用户和文章。文章本身不必复制一份到每个人名下，可以另外保留“用户是谁、文章是谁”的收藏记录。\u003c/p>\n\u003cp>这样两个人收藏同一篇文章，能表示为两条关系；文章只有一份正文。到底共用正文还是各自保留快照，取决于产品希望文章更新后收藏者看到什么。\u003c/p>\n\u003ch2 id=\"section-3\">从记录走到“我的收藏夹”\u003c/h2>\n\u003cp>把这个虚构例子写成三类记录，就能看见查询需要什么：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>记录种类\u003c/th>\n\u003cth>示例内容\u003c/th>\n\u003cth>用来区分什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>用户\u003c/td>\n\u003ctd>U1：小林；U2：小周\u003c/td>\n\u003ctd>两位名字相同的人也应有不同编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文章\u003c/td>\n\u003ctd>A17：旅行；A28：旅行\u003c/td>\n\u003ctd>标题相同的两篇文章\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收藏关系\u003c/td>\n\u003ctd>U1收藏A17；U2收藏A17；U1收藏A28\u003c/td>\n\u003ctd>谁与哪篇文章建立了关系\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>小林打开收藏夹，程序先找到用户 U1，再找属于 U1 的收藏关系，得到 A17 和 A28；随后按编号取出两篇文章的标题。页面虽然显示两次“旅行”，仍能分别打开正确正文，因为操作时用的是各自编号。\u003c/p>\n\u003cp>如果 A17 改名，“U1收藏A17”这条关系不必因标题改变而换成另一篇文章。这就是稳定标识的作用：名称可以变化，被指向的对象仍然能认出来。\u003c/p>\n\u003ch2 id=\"section-4\">软件能做什么，取决于记住了什么区别\u003c/h2>\n\u003cp>如果只保存“这篇被收藏过”，却没保存是谁收藏，就无法准确生成每个人自己的收藏夹。如果希望区分草稿和已发布文章，就要留下这个区别，并规定它怎样改变。\u003c/p>\n\u003cp>这些要求还可以形成\u003cstrong>约束\u003c/strong>，也就是记录必须符合的规则：编号不能重复、收藏对应的文章必须存在。例如数据库可以帮助检查某些约束，但仍需要人先明确规则。\u003c/p>\n\u003ch2 id=\"section-5\">规则怎样拦住错误记录？\u003c/h2>\n\u003cp>假设规定“一个用户对一篇文章最多一条收藏”。可以让保存部分对“用户编号、文章编号”这一对值检查唯一性：U1与A17已经存在，再尝试写入同一对时，就不允许留下第二条。两个人收藏A17却是两对不同的值，仍然允许。\u003c/p>\n\u003cp>只让页面先看“好像还没收藏”，挡不住两次同时提出的写入。真正负责保存的地方也落实规则，才有机会处理这种竞争。至于文章被删后收藏怎么办，需要再选择：阻止删除、连同收藏一起删，还是保留一条“原文已删除”的提示。\u003c/p>\n\u003cp>换成“一个人可以创建多个文件夹”，就要增加文件夹记录和它与收藏的关系。先问要表达的区别，再增加数据；单纯多加一个输入框，不会让系统自动记住这个关系。\u003c/p>\n\u003ch2 id=\"section-6\">数据模型和数据库是什么关系？\u003c/h2>\n\u003cp>数据模型描述“我们需要表达什么”。数据库是帮助保存和管理这些信息的软件。模型也可以被写进文件，数据库里也可能放着设计不清的记录。\u003c/p>\n\u003cp>先把对象、信息项和关系想清楚，存储工具才知道要保存什么。信息接下来怎样变化，交给\u003ca href=\"#/state\">状态\u003c/a>解释；怎样保存与查找，交给\u003ca href=\"#/storage\">存储\u003c/a>。\u003c/p>\n","text":"软件怎么把“人和文章”记成数据？ 你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。 数据模型，就是软件选择用哪些记录和关系，来表示它关心的世界 。它像一套有明确栏目和连接方式的登记簿。 同叫《旅行》，不代表是同一篇 假设阅读助手里有两篇文章都叫《旅行》。只用标题识别文章，收藏和删除时就可能混淆。 程序可以为每篇文章分配不重复的编号，例如 A17 和 A28。这个用来辨认具体对象的值，叫 标识 ，常见名字是 ID。你看到标题，程序用编号确认到底是哪一篇。 需要独立辨认的对象，比如用户、文章、收藏记录，常叫 实体 。实体可以有多个信息项，程序员会叫它们字段：文章的编号、标题、正文就是不同字段。 单个记录之外，还需要关系 “小林收藏了 A17”连接了用户和文章。文章本身不必复制一份到每个人名下，可以另外保留“用户是谁、文章是谁”的收藏记录。 这样两个人收藏同一篇文章，能表示为两条关系；文章只有一份正文。到底共用正文还是各自保留快照，取决于产品希望文章更新后收藏者看到什么。 从记录走到“我的收藏夹” 把这个虚构例子写成三类记录，就能看见查询需要什么： 记录种类 示例内容 用来区分什么 --- --- --- 用户 U1：小林；U2：小周 两位名字相同的人也应有不同编号 文章 A17：旅行；A28：旅行 标题相同的两篇文章 收藏关系 U1收藏A17；U2收藏A17；U1收藏A28 谁与哪篇文章建立了关系 小林打开收藏夹，程序先找到用户 U1，再找属于 U1 的收藏关系，得到 A17 和 A28；随后按编号取出两篇文章的标题。页面虽然显示两次“旅行”，仍能分别打开正确正文，因为操作时用的是各自编号。 如果 A17 改名，“U1收藏A17”这条关系不必因标题改变而换成另一篇文章。这就是稳定标识的作用：名称可以变化，被指向的对象仍然能认出来。 软件能做什么，取决于记住了什么区别 如果只保存“这篇被收藏过”，却没保存是谁收藏，就无法准确生成每个人自己的收藏夹。如果希望区分草稿和已发布文章，就要留下这个区别，并规定它怎样改变。 这些要求还可以形成 约束 ，也就是记录必须符合的规则：编号不能重复、收藏对应的文章必须存在。例如数据库可以帮助检查某些约束，但仍需要人先明确规则。 规则怎样拦住错误记录？ 假设规定“一个用户对一篇文章最多一条收藏”。可以让保存部分对“用户编号、文章编号”这一对值检查唯一性：U1与A17已经存在，再尝试写入同一对时，就不允许留下第二条。两个人收藏A17却是两对不同的值，仍然允许。 只让页面先看“好像还没收藏”，挡不住两次同时提出的写入。真正负责保存的地方也落实规则，才有机会处理这种竞争。至于文章被删后收藏怎么办，需要再选择：阻止删除、连同收藏一起删，还是保留一条“原文已删除”的提示。 换成“一个人可以创建多个文件夹”，就要增加文件夹记录和它与收藏的关系。先问要表达的区别，再增加数据；单纯多加一个输入框，不会让系统自动记住这个关系。 数据模型和数据库是什么关系？ 数据模型描述“我们需要表达什么”。数据库是帮助保存和管理这些信息的软件。模型也可以被写进文件，数据库里也可能放着设计不清的记录。 先把对象、信息项和关系想清楚，存储工具才知道要保存什么。信息接下来怎样变化，交给状态解释；怎样保存与查找，交给存储。","outline":[{"id":"section-1","title":"同叫《旅行》，不代表是同一篇","depth":2},{"id":"section-2","title":"单个记录之外，还需要关系","depth":2},{"id":"section-3","title":"从记录走到“我的收藏夹”","depth":2},{"id":"section-4","title":"软件能做什么，取决于记住了什么区别","depth":2},{"id":"section-5","title":"规则怎样拦住错误记录？","depth":2},{"id":"section-6","title":"数据模型和数据库是什么关系？","depth":2}]},{"id":"state","group":"state","title":"为什么软件能记得你刚才做过什么？","question":"为什么软件能记得你刚才做过什么？","summary":"你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。","terms":["状态","生命周期","派生状态"],"aliases":["状态","State","生命周期","","派生状态",""],"related":["storage","consistency"],"html":"\u003cp>你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。\u003c/p>\n\u003cp>原因是系统留下了“你收藏过这篇文章”的信息。\u003cstrong>那些留在系统里、会影响接下来行为的信息，就是状态。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">先看一个动作前后的区别\u003c/h2>\n\u003cp>在这个假设的阅读助手里，点击以前，你的收藏清单里没有文章 A。点击以后，清单里有了文章 A。页面再查这份清单，就知道应该把星星点亮。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNTkyIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuS4gOasoeaUtuiXj+WmguS9leaUueWPmOezu+e7n+iusOW/hiI+PHRpdGxlPuS4gOasoeaUtuiXj+WmguS9leaUueWPmOezu+e7n+iusOW/hjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI1OTIiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuaUtuiXj+S5i+WJjTwvdGV4dD48cmVjdCB4PSIzOSIgeT0iNzMiIHdpZHRoPSI5NCIgaGVpZ2h0PSIxNTUiIHJ4PSIxNiIgZmlsbD0iI2U2ZTZkZSIgc3Ryb2tlPSIjZTZlNmRlIiBzdHJva2Utd2lkdGg9IjIiLz48cmVjdCB4PSIzNSIgeT0iNjYiIHdpZHRoPSI5NCIgaGVpZ2h0PSIxNTUiIHJ4PSIxNiIgZmlsbD0iI2ZmZmRmOSIgc3Ryb2tlPSIjMTgzZDNhIiBzdHJva2Utd2lkdGg9IjI 2 id=\"section-4\">一份事实，可以带出几种显示\u003c/h2>\n\u003cp>如果清单里有三篇收藏，页面可以显示“收藏 3 篇”。这个数字能由清单数出来。程序员会叫它\u003cstrong>派生状态\u003c/strong>：从已有信息算出的信息。\u003c/p>\n\u003cp>于是这里有三种不同东西：收藏清单是记录；“3 篇”是从记录算出的结果；当前展开哪个目录是界面临时记住的选择。分清它们，才容易说明哪份东西改变时，什么显示要跟着改变。\u003c/p>\n\u003ch2 id=\"section-5\">收藏数量为什么也会算错？\u003c/h2>\n\u003cp>假设清单原有三篇，加入 A 后已有四篇；页角却仍显示“3篇”。保存记录未必有错，可能只是页面没有重新计算。若又把数量独立保存，加入和删除还要同时维护两个地方，漏改一次就会不一致。\u003c/p>\n\u003cp>能直接从清单算出的数量，可以尽量从清单取得；确实为了速度预先保存计数，也要规定谁更新、何时校正。这个判断也适用于购物车金额和未读消息数：先找决定事实的记录，再找由它算出的显示。\u003c/p>\n\u003ch2 id=\"section-6\">从“能记住”走到“记在哪里”\u003c/h2>\n\u003cp>只在你的手机保存收藏，另一台电脑通常看不到它。希望跨设备使用，就需要一份两边都能访问的记录，或者安排两边交换更新。\u003c/p>\n\u003cp>这自然引出\u003ca href=\"#/storage\">存储\u003c/a>和\u003ca href=\"#/consistency\">一致性\u003c/a>：前者解释怎么留住和找出信息，后者解释多份信息怎样对上。你现在先抓住一个判断：\u003cstrong>软件会因为已经记住的事情，而对下一次输入作出不同反应。\u003c/strong>\u003c/p>\n","text":"为什么软件能记得你刚才做过什么？ 你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。 原因是系统留下了“你收藏过这篇文章”的信息。 那些留在系统里、会影响接下来行为的信息，就是状态。 先看一个动作前后的区别 在这个假设的阅读助手里，点击以前，你的收藏清单里没有文章 A。点击以后，清单里有了文章 A。页面再查这份清单，就知道应该把星星点亮。 收藏前，文章 A 不在收藏记录里，星星是空的；收藏后，记录多了一条文章 A，星星变亮。决定下次显示的，是留下来的记录。 亮星星是显示给你的结果。背后的记录解释了为什么下次还能显示同样的结果。有些产品会先亮星星，再等待保存成功；这时亮了也可能还没真正保存。 屏幕上的样子和背后的记录，需要配合。 星星先亮，后来却灭了，是怎么回事？ 有的产品为了及时回应，会先把页面里的“已收藏”改为真，显示亮星星，同时把保存要求送出去。这叫先在界面预示一个预计成功的结果，而不是已经证明记录写好了。 接下来需要接住两种结果：服务端确认保存，页面保留亮星星；服务端明确拒绝，页面恢复空星星并说明原因。如果只是一直收不到回复，不能立刻断定保存失败，还要重新查询或让用户重试确认，详见失败。 所以同一时刻可能有“页面预计的状态”和“已经保存的状态”。程序要安排它们如何重新对上。也可以采用更保守的界面：先显示“收藏中”，等确认后再点亮。两种选择改变的是等待体验与恢复工作，并没有省掉保存本身。 软件的记忆有长有短 你还可能展开目录、输入一半搜索词、选中一篇文章。软件也要记住这些信息，才能继续当前操作。它们同样是状态，但不一定值得永久保存。 想象一张工作桌：手边便签帮助你处理眼前的事，归档的记录留到下次使用。软件中也有这类区别：有些信息只留在运行中的临时记忆里，有些写到可以长期保留的文件或数据库里。数据库是帮助程序组织、查找、修改记录的软件。 这只是寿命的类比。临时和长期信息都可能在你的设备上，也都可能在远处的电脑上；不能只凭“前端”或“后端”判断是否会丢。 一份事实，可以带出几种显示 如果清单里有三篇收藏，页面可以显示“收藏 3 篇”。这个数字能由清单数出来。程序员会叫它 派生状态 ：从已有信息算出的信息。 于是这里有三种不同东西：收藏清单是记录；“3 篇”是从记录算出的结果；当前展开哪个目录是界面临时记住的选择。分清它们，才容易说明哪份东西改变时，什么显示要跟着改变。 收藏数量为什么也会算错？ 假设清单原有三篇，加入 A 后已有四篇；页角却仍显示“3篇”。保存记录未必有错，可能只是页面没有重新计算。若又把数量独立保存，加入和删除还要同时维护两个地方，漏改一次就会不一致。 能直接从清单算出的数量，可以尽量从清单取得；确实为了速度预先保存计数，也要规定谁更新、何时校正。这个判断也适用于购物车金额和未读消息数：先找决定事实的记录，再找由它算出的显示。 从“能记住”走到“记在哪里” 只在你的手机保存收藏，另一台电脑通常看不到它。希望跨设备使用，就需要一份两边都能访问的记录，或者安排两边交换更新。 这自然引出存储和一致性：前者解释怎么留住和找出信息，后者解释多份信息怎样对上。你现在先抓住一个判断： 软件会因为已经记住的事情，而对下一次输入作出不同反应。","outline":[{"id":"section-1","title":"先看一个动作前后的区别","depth":2},{"id":"section-2","title":"星星先亮，后来却灭了，是怎么回事？","depth":2},{"id":"section-3","title":"软件的记忆有长有短","depth":2},{"id":"section-4","title":"一份事实，可以带出几种显示","depth":2},{"id":"section-5","title":"收藏数量为什么也会算错？","depth":2},{"id":"section-6","title":"从“能记住”走到“记在哪里”","depth":2}]},{"id":"storage","group":"state","title":"文章、账号、图片，为什么不全放在一个地方？","question":"文章、账号、图片，为什么不全放在一个地方？","summary":"阅读助手需要保留文章正文、谁收藏了什么、封面图片。它还希望你打开常看的文章时快一点。不同东西，保存和取用的需要并不相同。","terms":["数据库","对象存储","缓存"],"aliases":["数据库","Database","对象存储","","缓存","Cache"],"related":["performance","change"],"html":"\u003cp>阅读助手需要保留文章正文、谁收藏了什么、封面图片。它还希望你打开常看的文章时快一点。不同东西，保存和取用的需要并不相同。\u003c/p>\n\u003cp>\u003cstrong>存储负责留住信息，也决定程序用什么方式把信息找回来\u003c/strong>。文件、数据库、缓存，是常见的三种安排。\u003c/p>\n\u003ch2 id=\"section-1\">文件适合留下一整份东西\u003c/h2>\n\u003cp>一张图片、一份 PDF、一段录音，可以作为完整文件保存。程序根据文件的名字或地址把它取回来。\u003c/p>\n\u003cp>联网产品里，大量这类文件可以交给专门的文件保存服务。其中常见一种叫\u003cstrong>对象存储\u003c/strong>：程序把一份内容作为一个对象存入，再凭它的标识取出。它擅长管理整份内容，不负责替你理解其中每个人的收藏关系。\u003c/p>\n\u003ch2 id=\"section-2\">数据库适合管理能查、能改的记录\u003c/h2>\n\u003cp>想查“小林收藏了哪些文章”，就要在许多记录中筛选；取消一篇收藏，还要改掉对应关系。\u003cstrong>数据库\u003c/strong>帮助程序组织记录、查找和更新，也能检查一些约束。\u003c/p>\n\u003cp>它像带检索能力的登记系统。记录可以保存文字，也可以保存指向图片文件的地址。因此数据库和文件经常合作，并非只能二选一。\u003c/p>\n\u003ch2 id=\"section-3\">缓存把常用结果留在近处\u003c/h2>\n\u003cp>假设每次打开首页都重新统计文章数量。程序可以把刚算出的数量暂存起来，下次先复用，减少重复工作。这份为加快使用而保留的结果，叫\u003cstrong>缓存\u003c/strong>。\u003c/p>\n\u003cp>缓存像手边的一张速查纸，通常能从原始记录重新获得。如果新增文章后还使用旧数量，就会暂时看到过期信息。缓存需要安排何时更新或作废。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNjY5IiByb2xlP 方式把信息找回来 。文件、数据库、缓存，是常见的三种安排。 文件适合留下一整份东西 一张图片、一份 PDF、一段录音，可以作为完整文件保存。程序根据文件的名字或地址把它取回来。 联网产品里，大量这类文件可以交给专门的文件保存服务。其中常见一种叫 对象存储 ：程序把一份内容作为一个对象存入，再凭它的标识取出。它擅长管理整份内容，不负责替你理解其中每个人的收藏关系。 数据库适合管理能查、能改的记录 想查“小林收藏了哪些文章”，就要在许多记录中筛选；取消一篇收藏，还要改掉对应关系。 数据库 帮助程序组织记录、查找和更新，也能检查一些约束。 它像带检索能力的登记系统。记录可以保存文字，也可以保存指向图片文件的地址。因此数据库和文件经常合作，并非只能二选一。 缓存把常用结果留在近处 假设每次打开首页都重新统计文章数量。程序可以把刚算出的数量暂存起来，下次先复用，减少重复工作。这份为加快使用而保留的结果，叫 缓存 。 缓存像手边的一张速查纸，通常能从原始记录重新获得。如果新增文章后还使用旧数量，就会暂时看到过期信息。缓存需要安排何时更新或作废。 长期记录在保存区；程序把常用文章的副本放在手边，后续读取可以少走远路。原始文章改变以后，近处副本可能还是旧的，需要更新。 一次读取，怎样用到原始记录和缓存？ 以虚构阅读助手的文章 A 为例，假设数据库保存标题和正文，缓存保存最近取出的文章副本： 1. 第一次打开 A，程序先查缓存，没有找到，便去数据库读出文章。 2. 程序把读到的内容交给页面，并留一份副本在缓存里。 3. 再次打开时，若副本仍有效，就直接复用，少做一次数据库读取。这叫缓存命中；没找到可用副本，则叫未命中。 4. 作者修改了正文，程序保存新内容后，还要按约定更新缓存或让旧副本作废。否则下一次可能仍读到旧文章。 也可以规定副本过一段时间自行过期，再次访问时重新读取。这种办法接受一段旧内容仍可见的时间；要求刚改就必须读到新的地方，需要更及时的更新安排。缓存把读取变方便，也增加了“副本是否仍可相信”的判断。 如果缓存丢了，通常还能从原始记录重建；如果原始记录没了，缓存不一定有完整副本，也未必能作为备份。因此重要资料是否可恢复，要另做备份和恢复安排。 给阅读助手选保存方式 文章正文和收藏关系需要按用户查询，可以放进合适的数据库；大封面图可以保存在文件服务，数据库留它的地址。打开收藏夹时，先查记录知道有哪些文章，再取标题和图片。 若改成一个人的离线便签，本机文件也可能满足需要。数据库能保存正文、文件也能保存结构化记录，工具不是按名称硬分工；要看查询、修改、容量、共享和恢复要求，选择能落实这些行为的方式。 保存地点，还决定谁能取到 只留在本机的记录，另一台设备通常不能直接访问。共同放在可访问的服务上，就方便多设备读取，但也要处理权限、网络和多人修改。 选存储时，先问：要留住什么，谁需要取到，需要查哪些信息，能允许多旧的结果？不用先背品牌。知道这些需要，再理解多份信息怎样对上就有了基础。","outline":[{"id":"section-1","title":"文件适合留下一整份东西","depth":2},{"id":"section-2","title":"数据库适合管理能查、能改的记录","depth":2},{"id":"section-3","title":"缓存把常用结果留在近处","depth":2},{"id":"section-4","title":"一次读取，怎样用到原始记录和缓存？","depth":2},{"id":"section-5","title":"给阅读助手选保存方式","depth":2},{"id":"section-6","title":"保存地点，还决定谁能取到","depth":2}]},{"id":"consistency","group":"state","title":"两台设备看到不同的收藏，究竟哪份算数？","question":"两台设备看到不同的收藏，究竟哪份算数？","summary":"你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。","terms":["一致性","事务","冲突","原子性","版本号"],"aliases":["一致性","Consistency","事务","","冲突","","原子性","Atomicity","版本号","Version"],"related":["time","failure"],"html":"\u003cp>你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。\u003c/p>\n\u003cp>当信息存在多处，或者几个人同时修改，就要安排它们怎样对上。\u003cstrong>一致性关心的是：这些记录和显示，应当满足什么关系。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">复制方便使用，也带来时间差\u003c/h2>\n\u003cp>假设手机和电脑都显示同一个收藏夹。手机发出收藏要求，服务端保存成功；电脑需要再次读取，才知道有了新收藏。保存和传播不是一个瞬间完成的动作。\u003c/p>\n\u003cp>产品可以允许电脑短暂显示旧结果，并随后刷新；也可以在某些操作中要求先确认最新记录。不同场景需要的保证不同。普通收藏允许短暂落后，最后一件库存的售卖则不能随意让两人都买走。\u003c/p>\n\u003ch2 id=\"section-2\">一件事有两步时，怎样避免只做一半？\u003c/h2>\n\u003cp>想象一个示意性的积分转赠：给小林扣10分，再给小周加10分。若扣分后中断，另一边没有增加，两个人的总积分就少了。\u003c/p>\n\u003cp>先把这个虚构例子的数字固定下来：小林有100分，小周有20分，总共120分。我们希望转赠后变成90分和30分，总数仍是120。这条“转赠不凭空增加或减少积分”的要求，是人先确定的规则。\u003c/p>\n\u003cp>如果把扣分和加分当成两个独立保存动作，第一个保存成功、第二个失败，就会停在90分和20分。电脑没有读懂“这其实是一件事”，它只是按收到的两个动作分别做了。\u003c/p>\n\u003cp>程序需要明确告诉数据库：\u003cstrong>把扣分和加分放进同一次事务，全部做成以后再提交\u003c/strong>。可以沿着下面的过程看：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>发生到哪里\u003c/th>\n\u003cth>这次修改处于什么状态\u003c/th>\n\u003cth>其他普通读取会得到什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>开始之前\u003c/td>\n\u003ctd>正式记录是100分、20分\u003c/td>\n\u003ctd>100分、20分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事务内已扣10分，尚未加分\u003c/td>\n\u003ctd>扣分仍是未提交的修改，不是独立完成的一笔转赠\u003c/td>\n\u003ctd>不会把未提交的90分、20分当作已完成结果读走\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加分成功，事务提交\u003c/td>\n\u003ctd>两项修改一起成为正式结果\u003c/td>\n\u003ctd>后续读取可以得到90分、30分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加分失败，事务撤销\u003c/td>\n\u003ctd>本次未提交的修改取消\u003c/td>\n\u003ctd>正式结果仍是100分、20分\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>数据库会管理尚未提交的修改，并保留按其机制恢复所需的记录。正常出错可以撤销；运行中断后也能按恢复规则处理未完成事务。并不是出错以后，再靠人从屏幕上猜应该补回多少分。把一组修改作为一个成功或失败的整体，叫\u003cstrong>原子性\u003c/strong>。\u003c/p>\n\u003ch3 id=\"section-3\">中断以后，数据库凭什么恢复？\u003c/h3>\n\u003cp>以正常提供持久性保证的 PostgreSQL 为例，它会先把描述修改的日志可靠写下，再按提交要求确认成功。数据文件不一定在同一瞬间全部写完；如果随后中断，可以根据日志把应当保留的修改重新落实。这说明“已经提交”不是只在内存里放一个成功提示。\u003c/p>\n\u003cp>对于没有成功提交的事务，恢复和可见性机制不会让它的半份修改变成一笔已完成转赠。数据库怎样组织日志、旧版本和恢复步骤各有实现，你在这里先抓住提交这道分界：提交前还没正式完成，提交后才算这次修改已经成立。不同读取还可能看到先前的完整版本，具体由隔离规则决定。\u003c/p>\n\u003cp>事务也不替你决定业务是否合理。程序如果写成“扣10分、加20分”，全部成功照样不符合转赠规则；两个人同时扣同一账户，还需要相应的余额检查和并发控制。\u003cstrong>事务保证的范围，要和你想一起完成的修改对上。\u003c/strong>\u003c/p>\n\u003cp>假设还要发一封“转赠成功”的邮件。邮件已经发出去，数据库不能把收件箱里的邮件收回来。常见安排是：在同一事务里保存积分变化和一条“待发送通知”；提交后另一个程序读取通知并发送，失败再试。这样避免积分没转成却先发成功通知，但发送本身仍可能重复，需要用通知编号识别。跨系统合作的失败继续见\u003ca href=\"#/failure\">超时与重试\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-4\">同时编辑，也需要明确处理办法\u003c/h2>\n\u003cp>两个人都打开旧标题，一人改成“旅行记录”，一人改成“周末游记”。若后来的保存直接覆盖，前一个修改可能消失。\u003c/p>\n\u003cp>这类相互不兼容的修改叫\u003cstrong>冲突\u003c/strong>。系统要检测它，得留下比较依据，不能只收一个新标题就知道你是从哪个旧标题改的。\u003c/p>\n\u003cp>一种办法是给文章保留版本号。下面仍是教学示意，不表示所有软件都采用同一种做法：\u003c/p>\n\u003col>\n\u003cli>小林和小周打开文章，都拿到标题“旅行”和版本7。\u003c/li>\n\u003cli>小林提交“旅行记录”，同时说明“我是在版本7上改的”。保存程序只有在当前版本仍是7时，才接受这次修改，并一起更新为版本8。\u003c/li>\n\u003cli>小周随后提交“周末游记”，带来的仍是版本7。当前已经是8，保存程序拒绝直接覆盖，返回“文章已被修改”，并保留小周尚未保存的文字。\u003c/li>\n\u003cli>页面并排显示当前标题和小周的草稿，让他重新选择。若他确认使用自己的标题，就以最新版本再次提交；也可以保留当前标题，或手动改成第三个标题。\u003c/li>\n\u003c/ol>\n\u003cp>比较版本和保存新内容必须作为一个不可被另一份保存插入的操作来执行。若先检查、隔一会儿再无条件保存，两次检查仍可能都通过，又回到互相覆盖的问题。\u003c/p>\n\u003cp>系统在这里发现了“你的修改基于旧版本”，\u003cstrong>没有替两个人判断哪个标题更好\u003c/strong>。不同段落的文字有时能合并，同一个标题的两种意思却未必能自动合并；产品也可以明确允许后保存者覆盖，但应让使用者知道这个规则。\u003c/p>\n\u003ch2 id=\"section-5\">“正确”要用产品规则说明\u003c/h2>\n\u003cp>一致性不只是“所有地方永远长得一模一样”。你在手机展开目录，通常无须让电脑也展开；共享收藏记录，却可能需要同步。\u003c/p>\n\u003cp>先确定哪些信息共享、哪些只是各自的临时选择，再规定何时需要一致、冲突怎样处理。这连接了\u003ca href=\"#/state\">状态\u003c/a>、\u003ca href=\"#/time\">时间与等待\u003c/a>和\u003ca href=\"#/failure\">失败\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-6\">换成最后一件库存，应该怎样想？\u003c/h2>\n\u003cp>虚构商店只剩一本书，两个人都在页面上看到“剩余1件”。这个显示可以已经过时，不能凭它直接生成两个成功订单。处理购买的程序要把“确认仍有库存、扣减库存、建立对应订单”协调好，让两个购买请求不能都占用同一件。\u003c/p>\n\u003cp>一个实现方向是：在同一事务范围里，只在库存仍大于零时扣减；真正扣减成功的请求才能建立订单，失败的请求显示售罄。具体还要按数据库的并发规则实现。它和收藏的差别在于：收藏列表暂时少显示一篇通常还能刷新，卖出并不存在的第二本书却破坏了产品规则。\u003c/p>\n\u003cp>因此遇到“一致性”，可以提出三类不同的问题：这里是显示还没更新，还是相关修改只做了一半，还是两个人争着修改同一份记录？它们都涉及正确关系，但不能靠一句“同步一下”解决。\u003c/p>\n","text":"两台设备看到不同的收藏，究竟哪份算数？ 你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。 当信息存在多处，或者几个人同时修改，就要安排它们怎样对上。 一致性关心的是：这些记录和显示，应当满足什么关系。 复制方便使用，也带来时间差 假设手机和电脑都显示同一个收藏夹。手机发出收藏要求，服务端保存成功；电脑需要再次读取，才知道有了新收藏。保存和传播不是一个瞬间完成的动作。 产品可以允许电脑短暂显示旧结果，并随后刷新；也可以在某些操作中要求先确认最新记录。不同场景需要的保证不同。普通收藏允许短暂落后，最后一件库存的售卖则不能随意让两人都买走。 一件事有两步时，怎样避免只做一半？ 想象一个示意性的积分转赠：给小林扣10分，再给小周加10分。若扣分后中断，另一边没有增加，两个人的总积分就少了。 先把这个虚构例子的数字固定下来：小林有100分，小周有20分，总共120分。我们希望转赠后变成90分和30分，总数仍是120。这条“转赠不凭空增加或减少积分”的要求，是人先确定的规则。 如果把扣分和加分当成两个独立保存动作，第一个保存成功、第二个失败，就会停在90分和20分。电脑没有读懂“这其实是一件事”，它只是按收到的两个动作分别做了。 程序需要明确告诉数据库： 把扣分和加分放进同一次事务，全部做成以后再提交 。可以沿着下面的过程看： 发生到哪里 这次修改处于什么状态 其他普通读取会得到什么 --- --- --- 开始之前 正式记录是100分、20分 100分、20分 事务内已扣10分，尚未加分 扣分仍是未提交的修改，不是独立完成的一笔转赠 不会把未提交的90分、20分当作已完成结果读走 加分成功，事务提交 两项修改一起成为正式结果 后续读取可以得到90分、30分 加分失败，事务撤销 本次未提交的修改取消 正式结果仍是100分、20分 数据库会管理尚未提交的修改，并保留按其机制恢复所需的记录。正常出错可以撤销；运行中断后也能按恢复规则处理未完成事务。并不是出错以后，再靠人从屏幕上猜应该补回多少分。把一组修改作为一个成功或失败的整体，叫 原子性 。 中断以后，数据库凭什么恢复？ 以正常提供持久性保证的 PostgreSQL 为例，它会先把描述修改的日志可靠写下，再按提交要求确认成功。数据文件不一定在同一瞬间全部写完；如果随后中断，可以根据日志把应当保留的修改重新落实。这说明“已经提交”不是只在内存里放一个成功提示。 对于没有成功提交的事务，恢复和可见性机制不会让它的半份修改变成一笔已完成转赠。数据库怎样组织日志、旧版本和恢复步骤各有实现，你在这里先抓住提交这道分界：提交前还没正式完成，提交后才算这次修改已经成立。不同读取还可能看到先前的完整版本，具体由隔离规则决定。 事务也不替你决定业务是否合理。程序如果写成“扣10分、加20分”，全部成功照样不符合转赠规则；两个人同时扣同一账户，还需要相应的余额检查和并发控制。 事务保证的范围，要和你想一起完成的修改对上。 假设还要发一封“转赠成功”的邮件。邮件已经发出去，数据库不能把收件箱里的邮件收回来。常见安排是：在同一事务里保存积分变化和一条“待发送通知”；提交后另一个程序读取通知并发送，失败再试。这样避免积分没转成却先发成功通知，但发送本身仍可能重复，需要用通知编号识别。跨系统合作的失败继续见超时与重试。 同时编辑，也需要明确处理办法 两个人都打开旧标题，一人改成“旅行记录”，一人改成“周末游记”。若后来的保存直接覆盖，前一个修改可能消失。 这类相互不兼容的修改叫 冲突 。系统要检测它，得留下比较依据，不能只收一个新标题就知道你是从哪个旧标题改的。 一种办法是给文章保留版本号。下面仍是教学示意，不表示所有软件都采用同一种做法： 1. 小林和小周打开文章，都拿到标题“旅行”和版本7。 2. 小林提交“旅行记录”，同时说明“我是在版本7上改的”。保存程序只有在当前版本仍是7时，才接受这次修改，并一起更新为版本8。 3. 小周随后提交“周末游记”，带来的仍是版本7。当前已经是8，保存程序拒绝直接覆盖，返回“文章已被修改”，并保留小周尚未保存的文字。 4. 页面并排显示当前标题和小周的草稿，让他重新选择。若他确认使用自己的标题，就以最新版本再次提交；也可以保留当前标题，或手动改成第三个标题。 比较版本和保存新内容必须作为一个不可被另一份保存插入的操作来执行。若先检查、隔一会儿再无条件保存，两次检查仍可能都通过，又回到互相覆盖的问题。 系统在这里发现了“你的修改基于旧版本”， 没有替两个人判断哪个标题更好 。不同段落的文字有时能合并，同一个标题的两种意思却未必能自动合并；产品也可以明确允许后保存者覆盖，但应让使用者知道这个规则。 “正确”要用产品规则说明 一致性不只是“所有地方永远长得一模一样”。你在手机展开目录，通常无须让电脑也展开；共享收藏记录，却可能需要同步。 先确定哪些信息共享、哪些只是各自的临时选择，再规定何时需要一致、冲突怎样处理。这连接了状态、时间与等待和失败。 换成最后一件库存，应该怎样想？ 虚构商店只剩一本书，两个人都在页面上看到“剩余1件”。这个显示可以已经过时，不能凭它直接生成两个成功订单。处理购买的程序要把“确认仍有库存、扣减库存、建立对应订单”协调好，让两个购买请求不能都占用同一件。 一个实现方向是：在同一事务范围里，只在库存仍大于零时扣减；真正扣减成功的请求才能建立订单，失败的请求显示售罄。具体还要按数据库的并发规则实现。它和收藏的差别在于：收藏列表暂时少显示一篇通常还能刷新，卖出并不存在的第二本书却破坏了产品规则。 因此遇到“一致性”，可以提出三类不同的问题：这里是显示还没更新，还是相关修改只做了一半，还是两个人争着修改同一份记录？它们都涉及正确关系，但不能靠一句“同步一下”解决。","outline":[{"id":"section-1","title":"复制方便使用，也带来时间差","depth":2},{"id":"section-2","title":"一件事有两步时，怎样避免只做一半？","depth":2},{"id":"section-3","title":"中断以后，数据库凭什么恢复？","depth":3},{"id":"section-4","title":"同时编辑，也需要明确处理办法","depth":2},{"id":"section-5","title":"“正确”要用产品规则说明","depth":2},{"id":"section-6","title":"换成最后一件库存，应该怎样想？","depth":2}]},{"id":"client-server","group":"communication","title":"前端、后端、服务器，分别在哪里？","question":"前端、后端、服务器，分别在哪里？","summary":"你用手机打开阅读助手，朋友用电脑打开同一个产品。两人看的是各自的屏幕，却可能读到同一篇文章。这意味着：各自的操作入口，在和某个共同提供能力的地方合作。","terms":["客户端","服务端","前端","后端"],"aliases":["客户端","","服务端","","前端","","后端",""],"related":["interface","trust"],"html":"\u003cp>你用手机打开阅读助手，朋友用电脑打开同一个产品。两人看的是各自的屏幕，却可能读到同一篇文章。这意味着：各自的操作入口，在和某个共同提供能力的地方合作。\u003c/p>\n\u003cp>\u003cstrong>客户端是你使用的一端，服务端是接受要求、提供能力的一端\u003c/strong>。浏览器里的网页和手机 App 都可以是客户端。\u003c/p>\n\u003ch2 id=\"section-1\">你面前的界面做哪些事？\u003c/h2>\n\u003cp>页面把文章排好、显示按钮、响应点击，还可能先检查搜索词是否为空。这些靠近用户交互的工作，通常归到\u003cstrong>前端\u003c/strong>。\u003c/p>\n\u003cp>你在屏幕上点收藏时，前端可以把“当前用户想收藏文章 A”送出去。这个向对方提出的要求，叫请求。它收到结果后，再告诉你成功还是失败。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgODA2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuWuouaIt+err+S4juacjeWKoeerr+S5i+mXtOeahOivt+axguWSjOWTjeW6lCI+PHRpdGxlPuWuouaIt+err+S4juacjeWKoeerr+S5i+mXtOeahOivt+axguWSjOWTjeW6lDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMy  。浏览器里的网页和手机 App 都可以是客户端。 你面前的界面做哪些事？ 页面把文章排好、显示按钮、响应点击，还可能先检查搜索词是否为空。这些靠近用户交互的工作，通常归到 前端 。 你在屏幕上点收藏时，前端可以把“当前用户想收藏文章 A”送出去。这个向对方提出的要求，叫请求。它收到结果后，再告诉你成功还是失败。 上方是你设备上的界面；绿色箭头把收藏要求送到远处程序，返回箭头带回结果。远处程序检查规则并保存记录。前后端描述工作分工，联网是这个示例选择的运行方式。 共同使用的部分做哪些事？ 服务端可以确认是谁在操作、检查权限，再把收藏记录保存下来。这里处理共享记录和业务规则的工作，通常叫 后端 。 把共同的规则放在这里，各种客户端就能使用同一套收藏规定。但客户端也可以做本地计算和保存；“前端只负责好看”会漏掉很多实际工作。 手机收藏后，电脑怎样也能看见？ 假设小林在手机和电脑上登录同一个账号。手机收藏 A 时，前端送出收藏要求；后端核实身份与文章权限，把“小林收藏A”交给保存部分。保存确认后，后端返回结果，手机更新星星。 电脑并不会因为手机的星星亮了就自动知道。它要再次向后端查询，或由系统安排接收更新通知。后端按小林的账号取出收藏记录，电脑前端拿到 A 的编号和标题，再显示这篇文章。 因此跨设备可见依赖两件事：保存的记录能被双方访问，另一端有取得更新的过程。仅把相同页面放在两台设备上，并不会自动共享各自在本地留下的记录。 假如手机已经断网，页面仍可能显示先前下载的文章，这属于客户端利用本地材料继续工作；新收藏是否已送达远处，要另外标明。一个产品可以有离线能力，同时也保留联网后端。 “服务器”是程序，还是电脑？ 这个词在日常说法里可以指提供服务的程序，也可以指运行这些程序的机器。听见“服务器出问题”，还需要看说的是哪一层。 机器可能放在机房里，也可能租用云平台的计算能力。“云”仍然依靠真实电脑，只是使用者通过网络取得能力，不需要把那台机器放在自己的桌边。 所有软件都要有远处后端吗？ 离线笔记软件可以在本机完成显示、处理和保存。联网阅读助手把共享内容和账号记录放到远处，是为了跨设备和多人访问等需要。 前后端主要描述工作职责；本机和远处描述位置。两者要一起看，不能仅凭词判断所有信息在哪里。设计一个只有你使用的工具时，可以先问“是否必须让另一台设备或另一个人共享记录”。若没有这个需要，本机也能完成许多工作；若有，就要说明共同记录由谁管理，以及客户端怎样取得变化。 双方怎样互相听懂，接着看接口与协议。","outline":[{"id":"section-1","title":"你面前的界面做哪些事？","depth":2},{"id":"section-2","title":"共同使用的部分做哪些事？","depth":2},{"id":"section-3","title":"手机收藏后，电脑怎样也能看见？","depth":2},{"id":"section-4","title":"“服务器”是程序，还是电脑？","depth":2},{"id":"section-5","title":"所有软件都要有远处后端吗？","depth":2}]},{"id":"interface","group":"communication","title":"API 是什么，为什么程序要通过它合作？","question":"API 是什么，为什么程序要通过它合作？","summary":"你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。","terms":["接口","API","协议"],"aliases":["接口","Interface","API","Application Programming Interface","协议",""],"related":["boundaries","change"],"html":"\u003cp>你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。\u003c/p>\n\u003cp>程序也需要清楚的交接方式：能要求对方做什么，要交哪些信息，能收到什么结果。\u003cstrong>这套可用能力和交接约定，就是接口\u003c/strong>。咖啡店只是帮助理解交接，真实程序交换的是结构明确的信息。\u003c/p>\n\u003ch2 id=\"section-1\">用收藏动作认识一个 API\u003c/h2>\n\u003cp>假设文章服务提供“加入收藏”能力。其他程序调用它时，要给出用户和文章的身份信息；它返回“成功”“已经收藏”或“没有权限”等结果。\u003c/p>\n\u003cp>这就是一个供程序使用的接口，常见名字是 \u003cstrong>API\u003c/strong>。不只是 AI 公司有 API，操作系统、数据库、软件内部模块都可以提供程序接口。\u003c/p>\n\u003cp>它把“如何提出要求”与“内部如何完成”分开。调用者不必自己了解收藏表的每一个保存细节，但必须遵守约定，也必须处理对方可能返回的错误。\u003c/p>\n\u003ch2 id=\"section-2\">把“加入收藏”写成一份可交接的约定\u003c/h2>\n\u003cp>下面是虚构接口的普通话版本，不需要先看代码：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>交接项目\u003c/th>\n\u003cth>约定内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>想做什么\u003c/td>\n\u003ctd>把文章 A17 加入当前账号收藏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调用方提供什么\u003c/td>\n\u003ctd>文章编号A17，以及服务端能够核验的登录凭据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接收方检查什么\u003c/td>\n\u003ctd>登录是否有效、文章是否存在、当前账号是否有访问权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成功意味着什么\u003c/td>\n\u003ctd>该账号与A17的收藏关系已经保存；原先已收藏也不增加第二条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失败怎样区分\u003c/td>\n\u003ctd>没登录、无权限、文章不存在、暂时不能保存，各自返回可识别的结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>前端收到成功，才按约定显示已收藏；收到登录失效，就提示重新登录；没有收到结果，则要按超时策略确认，而不是把三种情况都显示成成功。\u003c/p>\n\u003cp>双方约定“成功”只是已收到要求，和约定“成功”代表已完成保存，会产生不同界面行为。\u003cstrong>接口不只约定字段，也约定这些字段和结果究竟意味着什么\u003c/strong>。\u003c/p>\n\u003cp>服务端还要从可信凭据确定账号，不能让调用方填一句“用户是管理员”就获得权限。接口提供了进入能力的入口，入口后面的\u003ca href=\"#/trust\">权限检查\u003c/a>仍然需要执行。\u003c/p>\n\u003ch2 id=\"section-3\">接口和界面，有什么不同？\u003c/h2>\n\u003cp>按钮和输入框主要给人操作；API 主要给程序使用。一个“收藏”按钮背后，可以调用加入收藏的 API，再把结果显示给人。\u003c/p>\n\u003cp>人能靠上下文猜意思，程序之间通常需要准确格式：文章编号放哪个位置、成功怎样表示、缺信息时怎样回复。格式不匹配，就像订单上填错栏目，对方未必能按你希望的方式处理。\u003c/p>\n\u003ch2 id=\"section-4\">协议是双方交换信息时遵守的规矩\u003c/h2>\n\u003cp>如果程序隔着网络合作，还需要规定消息怎样发送、怎样确认结果。这类交流规则叫\u003cstrong>协议\u003c/strong>。HTTP 是网页和许多网络 API 常用的一种请求与响应协议。\u003c/p>\n\u003cp>可以把协议想成寄送方式，把 API 想成对方接受哪些具体订单。许多不同服务都使用同一种协议，但各自提供的能力和要求并不相同。\u003c/p>\n\u003ch2 id=\"section-5\">换一个模型服务，要检查哪些约定？\u003c/h2>\n\u003cp>假设服务甲接受“正文”，直接返回摘要；服务乙要求“消息列表”，先返回任务编号，稍后才能查询摘要。两者虽然都叫摘要 API，交接并不相同。\u003c/p>\n\u003cp>替换时，软件要把输入整理成乙接受的形式，记住任务编号，等待并查询完成结果，最后再交给原页面。若只替换一个网址，其余仍按甲的方式读取结果，合作就接不上。协议相同，不代表能力约定也相同。\u003c/p>\n\u003ch2 id=\"section-6\">有接口，为什么仍然会出错？\u003c/h2>\n\u003cp>约定清楚，只是合作的一项条件。信息可能填错，对方可能拒绝，网络也可能让你收不到回复。因此接口还要说明错误、等待限制、版本等行为。\u003c/p>\n\u003cp>世界模型里的接口是一条合作边：它告诉你两个部分怎样交接。它是否稳定，会直接影响\u003ca href=\"#/boundaries\">分工\u003c/a>和\u003ca href=\"#/dependency\">修改带来的影响\u003c/a>。\u003c/p>\n","text":"API 是什么，为什么程序要通过它合作？ 你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。 程序也需要清楚的交接方式：能要求对方做什么，要交哪些信息，能收到什么结果。 这套可用能力和交接约定，就是接口 。咖啡店只是帮助理解交接，真实程序交换的是结构明确的信息。 用收藏动作认识一个 API 假设文章服务提供“加入收藏”能力。其他程序调用它时，要给出用户和文章的身份信息；它返回“成功”“已经收藏”或“没有权限”等结果。 这就是一个供程序使用的接口，常见名字是 API 。不只是 AI 公司有 API，操作系统、数据库、软件内部模块都可以提供程序接口。 它把“如何提出要求”与“内部如何完成”分开。调用者不必自己了解收藏表的每一个保存细节，但必须遵守约定，也必须处理对方可能返回的错误。 把“加入收藏”写成一份可交接的约定 下面是虚构接口的普通话版本，不需要先看代码： 交接项目 约定内容 --- --- 想做什么 把文章 A17 加入当前账号收藏 调用方提供什么 文章编号A17，以及服务端能够核验的登录凭据 接收方检查什么 登录是否有效、文章是否存在、当前账号是否有访问权 成功意味着什么 该账号与A17的收藏关系已经保存；原先已收藏也不增加第二条 失败怎样区分 没登录、无权限、文章不存在、暂时不能保存，各自返回可识别的结果 前端收到成功，才按约定显示已收藏；收到登录失效，就提示重新登录；没有收到结果，则要按超时策略确认，而不是把三种情况都显示成成功。 双方约定“成功”只是已收到要求，和约定“成功”代表已完成保存，会产生不同界面行为。 接口不只约定字段，也约定这些字段和结果究竟意味着什么 。 服务端还要从可信凭据确定账号，不能让调用方填一句“用户是管理员”就获得权限。接口提供了进入能力的入口，入口后面的权限检查仍然需要执行。 接口和界面，有什么不同？ 按钮和输入框主要给人操作；API 主要给程序使用。一个“收藏”按钮背后，可以调用加入收藏的 API，再把结果显示给人。 人能靠上下文猜意思，程序之间通常需要准确格式：文章编号放哪个位置、成功怎样表示、缺信息时怎样回复。格式不匹配，就像订单上填错栏目，对方未必能按你希望的方式处理。 协议是双方交换信息时遵守的规矩 如果程序隔着网络合作，还需要规定消息怎样发送、怎样确认结果。这类交流规则叫 协议 。HTTP 是网页和许多网络 API 常用的一种请求与响应协议。 可以把协议想成寄送方式，把 API 想成对方接受哪些具体订单。许多不同服务都使用同一种协议，但各自提供的能力和要求并不相同。 换一个模型服务，要检查哪些约定？ 假设服务甲接受“正文”，直接返回摘要；服务乙要求“消息列表”，先返回任务编号，稍后才能查询摘要。两者虽然都叫摘要 API，交接并不相同。 替换时，软件要把输入整理成乙接受的形式，记住任务编号，等待并查询完成结果，最后再交给原页面。若只替换一个网址，其余仍按甲的方式读取结果，合作就接不上。协议相同，不代表能力约定也相同。 有接口，为什么仍然会出错？ 约定清楚，只是合作的一项条件。信息可能填错，对方可能拒绝，网络也可能让你收不到回复。因此接口还要说明错误、等待限制、版本等行为。 世界模型里的接口是一条合作边：它告诉你两个部分怎样交接。它是否稳定，会直接影响分工和修改带来的影响。","outline":[{"id":"section-1","title":"用收藏动作认识一个 API","depth":2},{"id":"section-2","title":"把“加入收藏”写成一份可交接的约定","depth":2},{"id":"section-3","title":"接口和界面，有什么不同？","depth":2},{"id":"section-4","title":"协议是双方交换信息时遵守的规矩","depth":2},{"id":"section-5","title":"换一个模型服务，要检查哪些约定？","depth":2},{"id":"section-6","title":"有接口，为什么仍然会出错？","depth":2}]},{"id":"flow","group":"communication","title":"点“生成摘要”后，文章内容去了哪里？","question":"点“生成摘要”后，文章内容去了哪里？","summary":"你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线：材料经过哪里、变成了什么；哪些动作让工作开始或继续。","terms":["数据流","控制流","事件"],"aliases":["数据流","","控制流","","事件",""],"related":["time","observability"],"html":"\u003cp>你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线：\u003cstrong>材料经过哪里、变成了什么；哪些动作让工作开始或继续。\u003c/strong>\u003c/p>\n\u003cp>这两条线分别叫数据流和控制流。分开看，复杂流程就更容易理解。\u003c/p>\n\u003ch2 id=\"section-1\">先跟着材料走\u003c/h2>\n\u003cp>假设阅读助手把文章正文取出来，和“请用三句话概括”的要求放在一起，交给 AI。AI 返回摘要，软件再把摘要放到页面上。\u003c/p>\n\u003cp>这里的材料发生了变化：保存着的正文，变成供模型阅读的输入，再产生一份摘要。追踪信息来自哪里、经过哪些处理、最后在哪里使用，就是看\u003cstrong>数据流\u003c/strong>。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNTMyIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuadkOaWmeWPmOaNouWSjOWKqOS9nOinpuWPkeeahOS4pOS4quinhuinkiI+PHRpdGxlPuadkOaWmeWPmOaNouWSjOWKqOS9nOinpuWPkeeahOS4pOS4quinhuinkjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI1MzIiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPueci+adkOaWme+8muWGheWuueWPkeeUn+WPmOWMljwvdGV4dD48cmVjdCB4PSIzNyIgeT0iODgiIHdpZHRoPSI3NSIgaGVpZ2h0PSIxNDAiIHJ4PSI0IiBmaWxsPSIjZmZmZGY5IiBzdHJva2U9IiMx /td>\n\u003ctd>把A的编号交给后端，请求生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端\u003c/td>\n\u003ctd>A的编号与核验后的账号身份\u003c/td>\n\u003ctd>查权限，取出A的正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摘要部分\u003c/td>\n\u003ctd>正文与“三句话摘要”的要求\u003c/td>\n\u003ctd>整理模型输入，发出调用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型\u003c/td>\n\u003ctd>实际提供的正文和要求\u003c/td>\n\u003ctd>生成摘要并返回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端与页面\u003c/td>\n\u003ctd>返回的摘要\u003c/td>\n\u003ctd>按产品约定保存，再显示或提示保存结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>第一行只传编号，不代表模型也只收到编号。中间“按编号取正文”这一步，才把它变成模型能够阅读的材料。如果取正文失败，控制流程就应停在这里，返回失败；不能跳过后继续让模型猜文章内容。\u003c/p>\n\u003cp>相反，模型可能已经生成摘要，但保存失败。此时数据已经走到“有一份摘要”，控制流程却还没达到“保存成功”。产品可以让用户先看临时结果并明确未保存，也可以要求保存完成才确认；需要把这条分支说清。\u003c/p>\n\u003ch2 id=\"section-4\">两条线有联系，却不能互相替代\u003c/h2>\n\u003cp>点击按钮让生成开始，但“点击了”这件事不是摘要的主要材料；正文才是。模型可能从数据库取得文章，这说明信息来源，也不说明数据库会主动决定什么时候生成。\u003c/p>\n\u003cp>因此画图时，箭头要说明含义：在传材料，还是在触发动作？如果一个箭头同时表示三种事情，读者就很难知道软件怎样工作。\u003c/p>\n\u003ch2 id=\"section-5\">从这两条线看整个产品\u003c/h2>\n\u003cp>做阅读助手时，数据线帮你看见文章、提示要求、摘要的去向；动作线帮你看见点击、等待、成功或失败。这也让你知道需要保存哪些信息，以及等待时页面应该显示什么。\u003c/p>\n\u003cp>换成图片识别也能用同样方法：点按钮是触发，图片是材料，识别文本是输出。检查设计图时，逐条问“谁收到什么，为什么能继续”，就能发现只画了一个AI方框，却漏了取文件、检查访问权或保存结果的情况。\u003c/p>\n\u003cp>到了 AI Agent，这个过程会反复发生：取得材料、决定行动、执行、看到新结果，再决定下一步。先把这两条线分清，后面理解\u003ca href=\"#/agent\">Agent\u003c/a>就有支点。\u003c/p>\n","text":"点“生成摘要”后，文章内容去了哪里？ 你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线： 材料经过哪里、变成了什么；哪些动作让工作开始或继续。 这两条线分别叫数据流和控制流。分开看，复杂流程就更容易理解。 先跟着材料走 假设阅读助手把文章正文取出来，和“请用三句话概括”的要求放在一起，交给 AI。AI 返回摘要，软件再把摘要放到页面上。 这里的材料发生了变化：保存着的正文，变成供模型阅读的输入，再产生一份摘要。追踪信息来自哪里、经过哪些处理、最后在哪里使用，就是看 数据流 。 上半幅跟着材料看：长文章交给模型后，输出较短摘要；下半幅跟着动作看：点击启动生成，收到回复后显示。材料变化与动作先后是两个观察方向。 再跟着动作走 你点击按钮，软件开始请求摘要；收到回复，软件才显示摘要。如果请求失败，可能显示失败提示。这些动作何时发生、什么条件让它们发生，就是 控制流 。 “被点击”“收到回复”这类发生了的事情，叫 事件 。程序可以安排：当某个事件发生，就执行相应工作。它解释了为什么软件常常需要等待用户或消息，并不一直沿着一条直线往下跑。 把一次摘要的交接摊开 下面沿用虚构产品，假设使用远处模型： 谁在做 收到或取到什么材料 做完以后，谁能继续 --- --- --- 页面 用户点了文章A的生成按钮 把A的编号交给后端，请求生成 后端 A的编号与核验后的账号身份 查权限，取出A的正文 摘要部分 正文与“三句话摘要”的要求 整理模型输入，发出调用 模型 实际提供的正文和要求 生成摘要并返回 后端与页面 返回的摘要 按产品约定保存，再显示或提示保存结果 第一行只传编号，不代表模型也只收到编号。中间“按编号取正文”这一步，才把它变成模型能够阅读的材料。如果取正文失败，控制流程就应停在这里，返回失败；不能跳过后继续让模型猜文章内容。 相反，模型可能已经生成摘要，但保存失败。此时数据已经走到“有一份摘要”，控制流程却还没达到“保存成功”。产品可以让用户先看临时结果并明确未保存，也可以要求保存完成才确认；需要把这条分支说清。 两条线有联系，却不能互相替代 点击按钮让生成开始，但“点击了”这件事不是摘要的主要材料；正文才是。模型可能从数据库取得文章，这说明信息来源，也不说明数据库会主动决定什么时候生成。 因此画图时，箭头要说明含义：在传材料，还是在触发动作？如果一个箭头同时表示三种事情，读者就很难知道软件怎样工作。 从这两条线看整个产品 做阅读助手时，数据线帮你看见文章、提示要求、摘要的去向；动作线帮你看见点击、等待、成功或失败。这也让你知道需要保存哪些信息，以及等待时页面应该显示什么。 换成图片识别也能用同样方法：点按钮是触发，图片是材料，识别文本是输出。检查设计图时，逐条问“谁收到什么，为什么能继续”，就能发现只画了一个AI方框，却漏了取文件、检查访问权或保存结果的情况。 到了 AI Agent，这个过程会反复发生：取得材料、决定行动、执行、看到新结果，再决定下一步。先把这两条线分清，后面理解Agent就有支点。","outline":[{"id":"section-1","title":"先跟着材料走","depth":2},{"id":"section-2","title":"再跟着动作走","depth":2},{"id":"section-3","title":"把一次摘要的交接摊开","depth":2},{"id":"section-4","title":"两条线有联系，却不能互相替代","depth":2},{"id":"section-5","title":"从这两条线看整个产品","depth":2}]},{"id":"time","group":"communication","title":"软件为什么要“等待”，又怎样同时做几件事？","question":"软件为什么要“等待”，又怎样同时做几件事？","summary":"你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。","terms":["同步","异步","并发","队列"],"aliases":["同步","","异步","","并发","Concurrency","队列","Queue"],"related":["consistency","failure"],"html":"\u003cp>你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。\u003c/p>\n\u003cp>\u003cstrong>等待期间能不能继续别的工作，是软件需要明确安排的行为\u003c/strong>。它和“一项工作本身有多快”是两件事。\u003c/p>\n\u003ch2 id=\"section-1\">同步与异步，说的是等待关系\u003c/h2>\n\u003cp>调用一项工作时，要等它返回才能继续当前这段工作，可以先理解为\u003cstrong>同步\u003c/strong>。把任务交出去，当前部分先继续，结果后来再处理，可以先理解为\u003cstrong>异步\u003c/strong>。\u003c/p>\n\u003cp>异步像取号等餐：你不用一直站在柜台，可以先找座位。厨房未必因此做得更快，变化的是你在等待时能否做其他事。软件也一样，异步不自动缩短模型生成的时间。\u003c/p>\n\u003ch2 id=\"section-2\">生成没结束，页面怎样继续工作？\u003c/h2>\n\u003cp>以虚构摘要任务为例，一种安排是先把请求交出去，页面继续响应翻页；等回复回来，再执行“放上摘要”的处理。在同一段等待期间，页面不必一直卡在原来的调用上。\u003c/p>\n\u003cp>如果生成可能很久，还可以让后端先建立任务 T81，立即返回“已接受”和任务编号。页面显示“等待中”，稍后用编号查询进展；后端完成后把任务记为成功，并关联摘要。页面取得这个结果，才从等待切换成可阅读摘要。也可以由服务端主动通知，查询只是其中一种方式。\u003c/p>\n\u003cp>用户关闭页面，任务是否继续，取决于任务由谁保管和执行。只存在网页临时记忆里的工作可能随页面结束；若后端已把任务可靠保存并有程序接手，就有条件继续。\u003cstrong>异步只说明怎样等待，不自动承诺关掉页面也不会丢任务\u003c/strong>。\u003c/p>\n\u003ch2 id=\"section-3\">几件事交错推进，叫并发\u003c/h2>\n\u003cp>你在读文章，摘要在生成，另一个收藏请求也在处理。这些工作在一段时间里都在推进，叫\u003cstrong>并发\u003c/strong>。\u003c/p>\n\u003cp>它们可能由机器交替处理，也可能真的由不同处理器同时做。物理上同一时刻执行多个工作，通常叫并行。先理解“多项工作可以重叠推进”，再区分机器是否真的同时执行。\u003c/p>\n\u003cp>并发让系统可以利用等待时间，也让多个人同时改记录等问题出现，因此需要\u003ca href=\"#/consistency\">一致性\u003c/a>里的协调规则。\u003c/p>\n\u003ch2 id=\"section-4\">来不及做的工作，可以先排队\u003c/h2>\n\u003cp>一百个人同时请求摘要，系统一时只能处理其中一部分。把待办任务先记录下来、逐步取出处理，这种安排叫\u003cstrong>队列\u003c/strong>。\u003c/p>\n\u003cp>队列可以承接突然增加的任务，但如果长期进入速度快于处理速度，队伍会越积越长。它需要处理能力、容量和等待上限等安排，不能把“已经排队”当成“很快会完成”。\u003c/p>\n\u003ch2 id=\"section-5\">排队以后，仍要有人接手和回报\u003c/h2>\n\u003cp>假设 T81、T82、T83 已经排好，当前只允许两项生成同时进行。两个执行程序分别领取 T81 和 T82，记为处理中；T83 继续等待。有一个完成，保存摘要和完成状态，再让空出的执行能力接下一项。\u003c/p>\n\u003cp>领取后执行程序也可能中断。一种安排是先给任务一段处理期限：领取时暂时不再交给其他执行者，执行者完成并确认后才结束这次待办；期限到了仍未确认，就让任务重新可领取。若处理确实需要更久，可以按规则续期，不能只把期限无限拉长。\u003c/p>\n\u003cp>这不代表系统能立刻知道原执行者究竟死机、断网，还是只是很慢。原执行者也可能已经保存结果，却没来得及确认，任务便被重新交出。因此仍要按任务编号识别已有结果，避免重试生成多条正式记录。具体队列也可能有重复投递，暂时保留处理权并不等于保证只执行一次。\u003c/p>\n\u003cp>队列若只放在某个进程的内存里，进程结束可能一起丢失；需要跨重启继续的任务，必须选择相应的可靠保存方式。对用户来说，至少要分清排队、处理中、完成和失败，而不是收到编号就显示“摘要已生成”。\u003c/p>\n\u003cp>换成导出大文件也一样：先给任务入口，让用户之后能查到结果；队列缓解的是短时拥挤，长期处理不过来仍要减少工作或增加能力。\u003c/p>\n\u003ch2 id=\"section-6\">开始、完成、失败，是不同结果\u003c/h2>\n\u003cp>异步任务通常要记录它还在等待、已经运行、成功还是失败。用户点了按钮，只说明任务开始被提交；它可能尚未完成。\u003c/p>\n\u003cp>队列里的任务也可能因重试再次执行。需要系统安排如何避免重复带来错误。你已经可以把时间这部分放回地图：它负责协调工作的先后、重叠和等待，而\u003ca href=\"#/failure\">失败\u003c/a>解释中断后该怎样处理。\u003c/p>\n","text":"软件为什么要“等待”，又怎样同时做几件事？ 你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。 等待期间能不能继续别的工作，是软件需要明确安排的行为 。它和“一项工作本身有多快”是两件事。 同步与异步，说的是等待关系 调用一项工作时，要等它返回才能继续当前这段工作，可以先理解为 同步 。把任务交出去，当前部分先继续，结果后来再处理，可以先理解为 异步 。 异步像取号等餐：你不用一直站在柜台，可以先找座位。厨房未必因此做得更快，变化的是你在等待时能否做其他事。软件也一样，异步不自动缩短模型生成的时间。 生成没结束，页面怎样继续工作？ 以虚构摘要任务为例，一种安排是先把请求交出去，页面继续响应翻页；等回复回来，再执行“放上摘要”的处理。在同一段等待期间，页面不必一直卡在原来的调用上。 如果生成可能很久，还可以让后端先建立任务 T81，立即返回“已接受”和任务编号。页面显示“等待中”，稍后用编号查询进展；后端完成后把任务记为成功，并关联摘要。页面取得这个结果，才从等待切换成可阅读摘要。也可以由服务端主动通知，查询只是其中一种方式。 用户关闭页面，任务是否继续，取决于任务由谁保管和执行。只存在网页临时记忆里的工作可能随页面结束；若后端已把任务可靠保存并有程序接手，就有条件继续。 异步只说明怎样等待，不自动承诺关掉页面也不会丢任务 。 几件事交错推进，叫并发 你在读文章，摘要在生成，另一个收藏请求也在处理。这些工作在一段时间里都在推进，叫 并发 。 它们可能由机器交替处理，也可能真的由不同处理器同时做。物理上同一时刻执行多个工作，通常叫并行。先理解“多项工作可以重叠推进”，再区分机器是否真的同时执行。 并发让系统可以利用等待时间，也让多个人同时改记录等问题出现，因此需要一致性里的协调规则。 来不及做的工作，可以先排队 一百个人同时请求摘要，系统一时只能处理其中一部分。把待办任务先记录下来、逐步取出处理，这种安排叫 队列 。 队列可以承接突然增加的任务，但如果长期进入速度快于处理速度，队伍会越积越长。它需要处理能力、容量和等待上限等安排，不能把“已经排队”当成“很快会完成”。 排队以后，仍要有人接手和回报 假设 T81、T82、T83 已经排好，当前只允许两项生成同时进行。两个执行程序分别领取 T81 和 T82，记为处理中；T83 继续等待。有一个完成，保存摘要和完成状态，再让空出的执行能力接下一项。 领取后执行程序也可能中断。一种安排是先给任务一段处理期限：领取时暂时不再交给其他执行者，执行者完成并确认后才结束这次待办；期限到了仍未确认，就让任务重新可领取。若处理确实需要更久，可以按规则续期，不能只把期限无限拉长。 这不代表系统能立刻知道原执行者究竟死机、断网，还是只是很慢。原执行者也可能已经保存结果，却没来得及确认，任务便被重新交出。因此仍要按任务编号识别已有结果，避免重试生成多条正式记录。具体队列也可能有重复投递，暂时保留处理权并不等于保证只执行一次。 队列若只放在某个进程的内存里，进程结束可能一起丢失；需要跨重启继续的任务，必须选择相应的可靠保存方式。对用户来说，至少要分清排队、处理中、完成和失败，而不是收到编号就显示“摘要已生成”。 换成导出大文件也一样：先给任务入口，让用户之后能查到结果；队列缓解的是短时拥挤，长期处理不过来仍要减少工作或增加能力。 开始、完成、失败，是不同结果 异步任务通常要记录它还在等待、已经运行、成功还是失败。用户点了按钮，只说明任务开始被提交；它可能尚未完成。 队列里的任务也可能因重试再次执行。需要系统安排如何避免重复带来错误。你已经可以把时间这部分放回地图：它负责协调工作的先后、重叠和等待，而失败解释中断后该怎样处理。","outline":[{"id":"section-1","title":"同步与异步，说的是等待关系","depth":2},{"id":"section-2","title":"生成没结束，页面怎样继续工作？","depth":2},{"id":"section-3","title":"几件事交错推进，叫并发","depth":2},{"id":"section-4","title":"来不及做的工作，可以先排队","depth":2},{"id":"section-5","title":"排队以后，仍要有人接手和回报","depth":2},{"id":"section-6","title":"开始、完成、失败，是不同结果","depth":2}]},{"id":"boundaries","group":"architecture","title":"软件那么多工作，怎样分给不同部分？","question":"软件那么多工作，怎样分给不同部分？","summary":"假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。","terms":["模块","职责","边界"],"aliases":["模块","","职责","","边界",""],"related":["dependency","shape"],"html":"\u003cp>假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。\u003c/p>\n\u003cp>\u003cstrong>分工的目的，是让每一部分有明确的工作范围，其他部分能放心使用它提供的能力\u003c/strong>。这就是理解软件结构的起点。\u003c/p>\n\u003ch2 id=\"section-1\">像一间有分区的工作室\u003c/h2>\n\u003cp>一间工作室里，可以划出接待区、档案区和写作区。分区以后，接待者知道去哪里取档案，写作者也知道谁负责保存成品。它们仍可以在同一间屋子里。\u003c/p>\n\u003cp>软件里，围绕一项职责组织起来的一部分代码，叫\u003cstrong>模块\u003c/strong>。例如阅读助手可以有文章管理模块、账号模块、摘要模块。模块的名字要回答“它负责什么”。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNjY1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuiBjOi0o+WIkuWIhuS4jui/kOihjOS9jee9rueahOS4pOenjeWuieaOkiI+PHRpdGxlPuiBjOi0o+WIkuWIhuS4jui/kOihjOS9jee9rueahOS4pOenjeWuieaOkjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI2NjUiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuWIhuW3pe+8muWQjOS4gOWkhOi/kOihjDwvdGV4dD48cmVjdCB4PSIyNiIgeT0iNjciIHdpZHRoPSIzNDgiIGhlaWdodD0iMjMwIiByeD0iMyIgZmlsbD0iI2Y0ZWNkYyIgc3Ryb2tlPSIjMTgzZDNhIiBzdHJva2Utd2lkdGg9IjIiLz48cmVjdCB4PSI0NSIgeT0iOTAiIHdpZHRoPSI5OCIgaGVpZ2h0PSIxNzYiIHJ4PSIzIiBmaWxsPSIjZGNlZWU3IiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9IjE1MSIgeT0iOTAiIHdpZHRoPSI5OCIgaGVpZ2h0PSIxNzYiIHJ4PSIzIiBmaWxsPSIjZjllMGQ1IiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9IjI1NyIgeT0iOTAiIHdpZHRoPSI5OCIgaGVpZ2h0PSIxNzYiIHJ4PSIzIiBmaWxsPSIjZTRlN2YyIiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9IjY4IiB5PSIxMTgiIHdpZHRoPSI1MCIgaGVpZ2h0PSI2MyIgcng9IjQiIGZpbGw9IiNmZmZkZjkiIHN0cm9rZT0iIzE4M2QzYSIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iT
