把摘要改成“读者选短、中、长”，摘要模块要理解这个选项，页面要提供入口，保存部分可能要记住所用选项。改动涉及几处是因为它们各自承担了相关工作，并不说明分工失败。\u003c/p>\n\u003cp>讨论结构时，可以让 AI 把一个完整动作走一遍：谁收要求、谁查权限、谁取正文、谁调用模型、谁保存、谁显示失败。这个动作能接起来，职责划分才有可检查的含义。\u003c/p>\n\u003ch2 id=\"section-6\">分模块以后，要不要分成多个服务？\u003c/h2>\n\u003cp>多个模块可以一起运行，也可以分别运行、通过网络合作。能独立提供能力的运行部分，常叫服务。\u003c/p>\n\u003cp>把三项工作放到三处，可能便于单独更新或增加处理能力，也增加了信息传递、等待和失败的处理。初学时先分清职责，再理解运行位置的选择。可以继续看\u003ca href=\"#/shape\">软件有哪些组织形态\u003c/a>。\u003c/p>\n","text":"软件那么多工作，怎样分给不同部分？ 假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。 分工的目的，是让每一部分有明确的工作范围，其他部分能放心使用它提供的能力 。这就是理解软件结构的起点。 像一间有分区的工作室 一间工作室里，可以划出接待区、档案区和写作区。分区以后，接待者知道去哪里取档案，写作者也知道谁负责保存成品。它们仍可以在同一间屋子里。 软件里，围绕一项职责组织起来的一部分代码，叫 模块 。例如阅读助手可以有文章管理模块、账号模块、摘要模块。模块的名字要回答“它负责什么”。 同一间工作室内有文章、账号、摘要三个分区；分区之间有交接窗口。另一种安排把三项工作放进三间独立工作室，之间需要通信。职责分开和运行地点分开，是两种不同安排。 这幅图用房间表示软件的分工。真实模块由代码组成，分区线表示职责范围，不是电脑里真的有墙。 分界线怎样帮助合作？ 摘要模块需要文章内容。它可以向文章模块说“给我文章 A 的正文”，由文章模块找到并返回。它不用自己钻进文章模块，翻找对方的全部存储细节。 这种明确的交接方式就是接口。模块之间的 边界 ，规定谁可以负责哪些工作、双方用什么方式合作。 这样，文章模块以后换一种保存方式，只要仍能正确提供正文，摘要模块就可能继续使用。能否做到这一点，取决于交接约定是否保持相容。 一次生成摘要，哪些事由谁接住？ 在虚构阅读助手中，可以约定：文章管理负责提供有权访问的正文，摘要模块负责把给定正文交给模型并处理模型结果，文章管理再按约定保存摘要；页面负责把进展和结果显示给人。 摘要模块收到的应是明确材料，例如“文章A的这个版本的正文”，而不是让它到处寻找数据库密码和猜用户是谁。文章已删除或权限不足时，提供材料的一方明确拒绝，摘要模块不继续生成。 假如文章从数据库改存文件，文章管理可以改变自己取正文的步骤，仍向摘要模块交付同样的正文和版本。外部不用跟着改的前提，是它没有绕过入口、直接依赖旧数据库栏目。 这不是唯一分法。关键是保存、授权和模型调用各有明确负责者，失败也能交回可识别的结果；不能每一方都以为“对方会处理”。 分文件夹，不会自动带来分工 如果摘要模块直接修改账号记录，账号模块又到处改文章内容，即使文件分成三堆，实际职责仍纠缠在一起。判断分工要看行为：谁能改什么，谁提供什么，谁需要了解谁的细节。 适合放在一起的，通常是围绕同一工作、经常一起变化的规则与信息。例如收藏归谁所有、怎样加入收藏、怎样取消收藏，放在共同的管理范围内更容易保持规则一致。 新增一个功能，先看哪条责任发生变化 如果现在要把摘要改成“读者选短、中、长”，摘要模块要理解这个选项，页面要提供入口，保存部分可能要记住所用选项。改动涉及几处是因为它们各自承担了相关工作，并不说明分工失败。 讨论结构时，可以让 AI 把一个完整动作走一遍：谁收要求、谁查权限、谁取正文、谁调用模型、谁保存、谁显示失败。这个动作能接起来，职责划分才有可检查的含义。 分模块以后，要不要分成多个服务？ 多个模块可以一起运行，也可以分别运行、通过网络合作。能独立提供能力的运行部分，常叫服务。 把三项工作放到三处，可能便于单独更新或增加处理能力，也增加了信息传递、等待和失败的处理。初学时先分清职责，再理解运行位置的选择。可以继续看软件有哪些组织形态。","outline":[{"id":"section-1","title":"像一间有分区的工作室","depth":2},{"id":"section-2","title":"分界线怎样帮助合作？","depth":2},{"id":"section-3","title":"一次生成摘要，哪些事由谁接住？","depth":2},{"id":"section-4","title":"分文件夹，不会自动带来分工","depth":2},{"id":"section-5","title":"新增一个功能，先看哪条责任发生变化","depth":2},{"id":"section-6","title":"分模块以后，要不要分成多个服务？","depth":2}]},{"id":"abstraction","group":"architecture","title":"不知道内部每个细节，也能理解和使用软件吗？","question":"不知道内部每个细节，也能理解和使用软件吗？","summary":"你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。","terms":["抽象","封装"],"aliases":["抽象","Abstraction","封装",""],"related":["interface","model"],"html":"\u003cp>你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。\u003c/p>\n\u003cp>软件也用这种方式降低理解负担。\u003cstrong>抽象，是把当前关心的行为留下，把暂时不需要的细节放到后面。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">同一软件，可以换几种距离来看\u003c/h2>\n\u003cp>远一点看阅读助手：它接收文章、保留收藏、生成摘要。近一点看：有文章管理、账号和摘要模块。再近一点：某个模块按条件检查并修改记录。\u003c/p>\n\u003cp>这些描述都可能正确，只是关注的层次不同。理解整体组成时，无须同时记住每一行代码。讨论某个收藏错误时，则可能需要看它怎样操作记录。\u003c/p>\n\u003ch2 id=\"section-2\">用一个能力代替一大串内部步骤\u003c/h2>\n\u003cp>例如“取得文章正文”这项能力，内部可能先检查记录，再读取文件，最后组合结果。调用者只要提出文章编号，并按约定处理返回内容。\u003c/p>\n\u003cp>这个接口把内部步骤藏在后面。让外部通过明确入口使用能力、把内部细节放在自己的管理范围内，叫\u003cstrong>封装\u003c/strong>。它帮助外部少了解细节，也帮助内部在不破坏约定的情况下改变做法。\u003c/p>\n\u003cp>抽象描述的是“看哪部分、略去哪部分”；封装强调“通过什么入口使用、内部由谁管理”。初学时先看它们共同带来的好处：能把复杂工作组合成较容易理解的能力。\u003c/p>\n\u003ch2 id=\"section-3\">给“生成摘要”一个足够完整的外部样子\u003c/h2>\n\u003cp>假设页面使用一项“生成摘要”的能力。它不需要知道模型如何分批计算，但需要一份能据此安排界面的约定：输入是哪篇文章及哪个版本，成功交回什么，可能有哪些失败，多久以后可以查进展。\u003c/p>\n\u003cp>于是页面可以先显示“生成中”，拿到摘要再呈现；文章太长时提示调整材料，无权限时停止。内部从模型甲换成乙，只要这些行为保持相容，页面就有机会继续使用同一个入口。\u003c/p>\n\u003cp>如果旧入口立即返回正文，新入口只返回任务编号，外部等待行为已经变了，就不能宣称“内部换了一下，别人完全不受影响”。把等待方式留下，正是为了不隐藏对使用有影响的条件。\u003c/p>\n\u003ch2 id=\"section-4\">省略的细节，仍然会产生影响\u003c/h2>\n\u003cp>“生成摘要”听起来像一个动作，内部仍然可能等待网络、花费计算资源、因文章太长而失败。如果软件只承诺“必定立刻得到正确摘要”，这个抽象就省略了会影响使用的重要条件。\u003c/p>\n\u003cp>好的抽象应当保留对使用者重要的事情，例如成功和失败的结果、输入限制、等待方式。内部实现可以先不解释，限制却要让调用者知道。\u003c/p>\n\u003ch2 id=\"section-5\">遇到细节时，怎样决定要不要继续往下看？\u003c/h2>\n\u003cp>若你只想确认用户能否取得摘要，先看输入、输出、等待和失败就够用；若持续拿到旧文章的摘要，就需要追到版本和缓存；若要优化生成速度，可能再看模型调用与机器资源。\u003c/p>\n\u003cp>因此抽象不是宣称内部不重要，而是根据当前问题选择观察距离。应用到支付、搜索或文件导出时，也先列清使用者必须知道的结果与限制，再决定哪些内部步骤可以暂时省略。\u003c/p>\n\u003ch2 id=\"section-6\">世界模型本身，也是一种抽象\u003c/h2>\n\u003cp>这份知识库把许多技术浓缩成“做事、记事、合作、持续可用”。它帮助你先抓住主要关系，但真实产品还要补具体规则和实现证据。\u003c/p>\n\u003cp>你可以逐步调整观察距离：先看产品有哪些职责，再看谁依靠谁，再看实际动作是否成立。理解这一点，就能把\u003ca href=\"#/boundaries\">分工\u003c/a>和\u003ca href=\"#/dependency\">依赖\u003c/a>连起来。\u003c/p>\n","text":"不知道内部每个细节，也能理解和使用软件吗？ 你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。 软件也用这种方式降低理解负担。 抽象，是把当前关心的行为留下，把暂时不需要的细节放到后面。 同一软件，可以换几种距离来看 远一点看阅读助手：它接收文章、保留收藏、生成摘要。近一点看：有文章管理、账号和摘要模块。再近一点：某个模块按条件检查并修改记录。 这些描述都可能正确，只是关注的层次不同。理解整体组成时，无须同时记住每一行代码。讨论某个收藏错误时，则可能需要看它怎样操作记录。 用一个能力代替一大串内部步骤 例如“取得文章正文”这项能力，内部可能先检查记录，再读取文件，最后组合结果。调用者只要提出文章编号，并按约定处理返回内容。 这个接口把内部步骤藏在后面。让外部通过明确入口使用能力、把内部细节放在自己的管理范围内，叫 封装 。它帮助外部少了解细节，也帮助内部在不破坏约定的情况下改变做法。 抽象描述的是“看哪部分、略去哪部分”；封装强调“通过什么入口使用、内部由谁管理”。初学时先看它们共同带来的好处：能把复杂工作组合成较容易理解的能力。 给“生成摘要”一个足够完整的外部样子 假设页面使用一项“生成摘要”的能力。它不需要知道模型如何分批计算，但需要一份能据此安排界面的约定：输入是哪篇文章及哪个版本，成功交回什么，可能有哪些失败，多久以后可以查进展。 于是页面可以先显示“生成中”，拿到摘要再呈现；文章太长时提示调整材料，无权限时停止。内部从模型甲换成乙，只要这些行为保持相容，页面就有机会继续使用同一个入口。 如果旧入口立即返回正文，新入口只返回任务编号，外部等待行为已经变了，就不能宣称“内部换了一下，别人完全不受影响”。把等待方式留下，正是为了不隐藏对使用有影响的条件。 省略的细节，仍然会产生影响 “生成摘要”听起来像一个动作，内部仍然可能等待网络、花费计算资源、因文章太长而失败。如果软件只承诺“必定立刻得到正确摘要”，这个抽象就省略了会影响使用的重要条件。 好的抽象应当保留对使用者重要的事情，例如成功和失败的结果、输入限制、等待方式。内部实现可以先不解释，限制却要让调用者知道。 遇到细节时，怎样决定要不要继续往下看？ 若你只想确认用户能否取得摘要，先看输入、输出、等待和失败就够用；若持续拿到旧文章的摘要，就需要追到版本和缓存；若要优化生成速度，可能再看模型调用与机器资源。 因此抽象不是宣称内部不重要，而是根据当前问题选择观察距离。应用到支付、搜索或文件导出时，也先列清使用者必须知道的结果与限制，再决定哪些内部步骤可以暂时省略。 世界模型本身，也是一种抽象 这份知识库把许多技术浓缩成“做事、记事、合作、持续可用”。它帮助你先抓住主要关系，但真实产品还要补具体规则和实现证据。 你可以逐步调整观察距离：先看产品有哪些职责，再看谁依靠谁，再看实际动作是否成立。理解这一点，就能把分工和依赖连起来。","outline":[{"id":"section-1","title":"同一软件，可以换几种距离来看","depth":2},{"id":"section-2","title":"用一个能力代替一大串内部步骤","depth":2},{"id":"section-3","title":"给“生成摘要”一个足够完整的外部样子","depth":2},{"id":"section-4","title":"省略的细节，仍然会产生影响","depth":2},{"id":"section-5","title":"遇到细节时，怎样决定要不要继续往下看？","depth":2},{"id":"section-6","title":"世界模型本身，也是一种抽象","depth":2}]},{"id":"dependency","group":"architecture","title":"为什么改了一个地方，另一个地方也出问题？","question":"为什么改了一个地方，另一个地方也出问题？","summary":"假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。","terms":["依赖","耦合","内聚"],"aliases":["依赖","Dependency","耦合","","内聚",""],"related":["shape","change"],"html":"\u003cp>假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。\u003c/p>\n\u003cp>\u003cstrong>一部分工作要依靠另一部分的行为、信息或约定，才能完成，这种关系叫依赖\u003c/strong>。变化会沿着这些关系传出去。\u003c/p>\n\u003ch2 id=\"section-1\">依赖不只是“用了哪个软件包”\u003c/h2>\n\u003cp>阅读助手要用数据库保存记录，是对一项软件能力的依赖；收藏模块假定文章编号始终有效，是对数据约定的依赖；页面假定成功结果叫“已收藏”，也是对格式的依赖。\u003c/p>\n\u003cp>因此依赖有时写得很明显，有时藏在“我们一直以为”的假设里。改动时没有想到这些假设，就可能破坏使用它们的部分。\u003c/p>\n\u003ch2 id=\"section-2\">沿一次坏掉的查询，找到隐藏假设\u003c/h2>\n\u003cp>假设旧系统把文章编号保存为17，收藏里也记着17。新版把文章记录的编号改为A17，却没有转换收藏里的17，也没有保留对应关系。\u003c/p>\n\u003cp>用户打开收藏，程序仍拿17查文章；新文章库里只认A17，便返回“找不到”。标题可能还由旧缓存显示着，所以会出现“列表里看得到，点进去却打不开”。它不是按钮突然失灵，而是保存关系依赖的编号约定断了。\u003c/p>\n\u003cp>一种修复方向是迁移全部引用；另一种是在过渡期保留旧编号到新编号的映射。具体选择要看还有哪些旧客户端、收藏、链接使用旧值。只修改发现报错的那一个页面，可能遗漏其他依赖者。\u003c/p>\n\u003ch2 id=\"section-3\">看两个部分怎样牵动彼此\u003c/h2>\n\u003cp>如果页面直接了解数据库里每个栏目，数据库的安排一变，很多页面都要跟着变。这种相互牵动的紧密程度，常叫\u003cstrong>耦合\u003c/strong>。\u003c/p>\n\u003cp>如果页面只通过文章模块要正文，保存细节由文章模块处理，一些内部变化就可以被留在模块内。但接口本身若改变，外部仍可能要修改。\u003c/p>\n\u003cp>没有依赖的软件几乎无法合作。目标是让必要的依赖清楚，让经常变化的内部细节少波及其他地方。\u003c/p>\n\u003ch2 id=\"section-4\">哪些工作适合放在一起？\u003c/h2>\n\u003cp>收藏记录、加入收藏、取消收藏，围绕同一职责，经常要一起保持规则。这种内部工作彼此相关的程度，叫\u003cstrong>内聚\u003c/strong>。\u003c/p>\n\u003cp>把相关的事放到同一管理范围，把跨范围的联系用清楚接口表达，就较容易理解变化影响。只按“代码行数平均”分模块，未必能得到这种关系。\u003c/p>\n\u003ch2 id=\"section-5\">降低牵连，要保住什么？\u003c/h2>\n\u003cp>假设只改变正文的保存位置，而文章模块仍接受原编号、返回同样正文，下游就不需要知道新位置。但若它还偷偷使用了“文章一定在某个文件夹”这个假设，仍会受到影响。\u003c/p>\n\u003cp>因此“有接口”还不够，要让使用者确实通过约定取能力，避免旁路读取内部细节。反过来，也不必为每个小变化拆一个新模块；经常一起改变的规则可以放在同一处管理，减少跨处协调。\u003c/p>\n\u003cp>向 AI 提出改动前，可以要求它指出哪些输入、输出和记录解释会变，谁仍使用旧约定，以及怎样检查这些旧用法。这个问题比只报文件名更容易覆盖变化真正经过的关系。\u003c/p>\n\u003ch2 id=\"section-6\">有了这个模型，怎样理解修改范围？\u003c/h2>\n\u003cp>换一种文章保存方式，可能只影响文章模块；换文章编号、权限规则或返回格式，就可能影响多个使用者。你可以先看改动触碰了哪种约定，再看谁使用它。\u003c/p>\n\u003cp>这会让“改完 A，B 又坏了”变成一个能解释的现象。具体是否破坏了行为，仍要通过\u003ca href=\"#/validation\">验证\u003c/a>确认，不能仅凭结构图保证没问题。\u003c/p>\n","text":"为什么改了一个地方，另一个地方也出问题？ 假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。 一部分工作要依靠另一部分的行为、信息或约定，才能完成，这种关系叫依赖 。变化会沿着这些关系传出去。 依赖不只是“用了哪个软件包” 阅读助手要用数据库保存记录，是对一项软件能力的依赖；收藏模块假定文章编号始终有效，是对数据约定的依赖；页面假定成功结果叫“已收藏”，也是对格式的依赖。 因此依赖有时写得很明显，有时藏在“我们一直以为”的假设里。改动时没有想到这些假设，就可能破坏使用它们的部分。 沿一次坏掉的查询，找到隐藏假设 假设旧系统把文章编号保存为17，收藏里也记着17。新版把文章记录的编号改为A17，却没有转换收藏里的17，也没有保留对应关系。 用户打开收藏，程序仍拿17查文章；新文章库里只认A17，便返回“找不到”。标题可能还由旧缓存显示着，所以会出现“列表里看得到，点进去却打不开”。它不是按钮突然失灵，而是保存关系依赖的编号约定断了。 一种修复方向是迁移全部引用；另一种是在过渡期保留旧编号到新编号的映射。具体选择要看还有哪些旧客户端、收藏、链接使用旧值。只修改发现报错的那一个页面，可能遗漏其他依赖者。 看两个部分怎样牵动彼此 如果页面直接了解数据库里每个栏目，数据库的安排一变，很多页面都要跟着变。这种相互牵动的紧密程度，常叫 耦合 。 如果页面只通过文章模块要正文，保存细节由文章模块处理，一些内部变化就可以被留在模块内。但接口本身若改变，外部仍可能要修改。 没有依赖的软件几乎无法合作。目标是让必要的依赖清楚，让经常变化的内部细节少波及其他地方。 哪些工作适合放在一起？ 收藏记录、加入收藏、取消收藏，围绕同一职责，经常要一起保持规则。这种内部工作彼此相关的程度，叫 内聚 。 把相关的事放到同一管理范围，把跨范围的联系用清楚接口表达，就较容易理解变化影响。只按“代码行数平均”分模块，未必能得到这种关系。 降低牵连，要保住什么？ 假设只改变正文的保存位置，而文章模块仍接受原编号、返回同样正文，下游就不需要知道新位置。但若它还偷偷使用了“文章一定在某个文件夹”这个假设，仍会受到影响。 因此“有接口”还不够，要让使用者确实通过约定取能力，避免旁路读取内部细节。反过来，也不必为每个小变化拆一个新模块；经常一起改变的规则可以放在同一处管理，减少跨处协调。 向 AI 提出改动前，可以要求它指出哪些输入、输出和记录解释会变，谁仍使用旧约定，以及怎样检查这些旧用法。这个问题比只报文件名更容易覆盖变化真正经过的关系。 有了这个模型，怎样理解修改范围？ 换一种文章保存方式，可能只影响文章模块；换文章编号、权限规则或返回格式，就可能影响多个使用者。你可以先看改动触碰了哪种约定，再看谁使用它。 这会让“改完 A，B 又坏了”变成一个能解释的现象。具体是否破坏了行为，仍要通过验证确认，不能仅凭结构图保证没问题。","outline":[{"id":"section-1","title":"依赖不只是“用了哪个软件包”","depth":2},{"id":"section-2","title":"沿一次坏掉的查询，找到隐藏假设","depth":2},{"id":"section-3","title":"看两个部分怎样牵动彼此","depth":2},{"id":"section-4","title":"哪些工作适合放在一起？","depth":2},{"id":"section-5","title":"降低牵连，要保住什么？","depth":2},{"id":"section-6","title":"有了这个模型，怎样理解修改范围？","depth":2}]},{"id":"shape","group":"architecture","title":"一个软件，要放在一台电脑还是很多台上？","question":"一个软件，要放在一台电脑还是很多台上？","summary":"阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。","terms":["分层","单体","服务","分布式"],"aliases":["分层","","单体","","服务","","分布式",""],"related":["failure","delivery"],"html":"\u003cp>阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。\u003c/p>\n\u003cp>理解这些选择，先分开两个问题：\u003cstrong>工作怎样分工，工作在哪里运行。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">分层是在整理不同性质的工作\u003c/h2>\n\u003cp>例如界面负责交互，业务部分负责收藏规则，保存部分负责读写记录。这是按工作性质组织的几层，常叫\u003cstrong>分层\u003c/strong>。\u003c/p>\n\u003cp>它帮助我们说清“按钮为什么亮”与“这次收藏是否允许”分别在哪处理。分层不代表一定要用多台电脑，也不保证每次动作都按固定层次顺序经过所有部分。\u003c/p>\n\u003ch2 id=\"section-2\">一起交付运行，可以形成单体\u003c/h2>\n\u003cp>多个模块合在一个整体里发布运行，通常称为\u003cstrong>单体\u003c/strong>。它仍然可以有清楚分工，也可以为了处理更多用户，把同一个整体运行多份。\u003c/p>\n\u003cp>如果摘要、文章、账号分别作为独立运行部分提供能力，就会形成多个\u003cstrong>服务\u003c/strong>。它们可以单独更新或增加处理能力，但合作需要处理通信、版本和失败。\u003c/p>\n\u003ch2 id=\"section-3\">分布式，说的是多处需要协作\u003c/h2>\n\u003cp>当多个独立运行的节点通过网络配合，形成\u003cstrong>分布式系统\u003c/strong>。节点可以理解成参与工作的运行位置，它们未必都在不同物理机器上。\u003c/p>\n\u003cp>一台机器停了，其他地方可能还活着；消息也可能晚到或丢失。所以分布式带来的核心变化，是要处理“各处并不同时知道同一件事，也不同时成功”的现实。\u003c/p>\n\u003cp>客户端和远处后端之间也存在跨位置协作。系统的分布式性质并不只在拆成许多小服务后才出现。\u003c/p>\n\u003ch2 id=\"section-4\">同一个摘要功能，换种形态会多出什么？\u003c/h2>\n\u003cp>先设文章管理和摘要模块在一个程序里。摘要模块要正文时，可以调用程序内部的文章读取能力；其中仍可能访问远处数据库或模型，但这两个模块的交接本身不必走网络。\u003c/p>\n\u003cp>如果把文章管理改成独立服务，摘要部分就要发请求取得正文、等待返回，再继续。原来的一次内部交接，现在要回答更多问题：地址在哪里，凭什么身份访问，多久算超时，对方更新以后格式还是否相容。\u003c/p>\n\u003cp>假设文章服务停了，摘要服务可能仍在运行，却取不到新正文。它需要返回明确失败或按约定使用已有材料。这里的“各处不同时成功”，是分开运行后必须处理的行为，不会因画了更多方框自动解决。\u003c/p>\n\u003cp>拆开也可能有收益：摘要需要大量计算时，可以单独增加摘要执行能力，而文章服务保持原规模。但如果共享数据库才是瓶颈，增加摘要服务数量未必有帮助。\u003c/p>\n\u003cp>换成小团队的内部阅读工具，职责清楚、一起运行可能已经够用；若模型生成必须单独扩容、更新或隔离故障，再比较拆开的收益与新增交接成本。形态服务于需要，不能只按“看起来先进”选择。\u003c/p>\n\u003ch2 id=\"section-5\">形态要跟着需要选\u003c/h2>\n\u003cp>如果产品很小，先把职责理清、一起运行可能更简单。如果某一项工作需要独立更新，或和其他工作有很不同的资源需求，再考虑拆开可能更有依据。\u003c/p>\n\u003cp>这里没有一个对所有产品都最好的形态。世界模型帮助你分辨这些选择分别改变了什么；实现时还要看真实约束和运行证据。分开运行的另一面，可以从\u003ca href=\"#/failure\">失败\u003c/a>继续理解。\u003c/p>\n","text":"一个软件，要放在一台电脑还是很多台上？ 阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。 理解这些选择，先分开两个问题： 工作怎样分工，工作在哪里运行。 分层是在整理不同性质的工作 例如界面负责交互，业务部分负责收藏规则，保存部分负责读写记录。这是按工作性质组织的几层，常叫 分层 。 它帮助我们说清“按钮为什么亮”与“这次收藏是否允许”分别在哪处理。分层不代表一定要用多台电脑，也不保证每次动作都按固定层次顺序经过所有部分。 一起交付运行，可以形成单体 多个模块合在一个整体里发布运行，通常称为 单体 。它仍然可以有清楚分工，也可以为了处理更多用户，把同一个整体运行多份。 如果摘要、文章、账号分别作为独立运行部分提供能力，就会形成多个 服务 。它们可以单独更新或增加处理能力，但合作需要处理通信、版本和失败。 分布式，说的是多处需要协作 当多个独立运行的节点通过网络配合，形成 分布式系统 。节点可以理解成参与工作的运行位置，它们未必都在不同物理机器上。 一台机器停了，其他地方可能还活着；消息也可能晚到或丢失。所以分布式带来的核心变化，是要处理“各处并不同时知道同一件事，也不同时成功”的现实。 客户端和远处后端之间也存在跨位置协作。系统的分布式性质并不只在拆成许多小服务后才出现。 同一个摘要功能，换种形态会多出什么？ 先设文章管理和摘要模块在一个程序里。摘要模块要正文时，可以调用程序内部的文章读取能力；其中仍可能访问远处数据库或模型，但这两个模块的交接本身不必走网络。 如果把文章管理改成独立服务，摘要部分就要发请求取得正文、等待返回，再继续。原来的一次内部交接，现在要回答更多问题：地址在哪里，凭什么身份访问，多久算超时，对方更新以后格式还是否相容。 假设文章服务停了，摘要服务可能仍在运行，却取不到新正文。它需要返回明确失败或按约定使用已有材料。这里的“各处不同时成功”，是分开运行后必须处理的行为，不会因画了更多方框自动解决。 拆开也可能有收益：摘要需要大量计算时，可以单独增加摘要执行能力，而文章服务保持原规模。但如果共享数据库才是瓶颈，增加摘要服务数量未必有帮助。 换成小团队的内部阅读工具，职责清楚、一起运行可能已经够用；若模型生成必须单独扩容、更新或隔离故障，再比较拆开的收益与新增交接成本。形态服务于需要，不能只按“看起来先进”选择。 形态要跟着需要选 如果产品很小，先把职责理清、一起运行可能更简单。如果某一项工作需要独立更新，或和其他工作有很不同的资源需求，再考虑拆开可能更有依据。 这里没有一个对所有产品都最好的形态。世界模型帮助你分辨这些选择分别改变了什么；实现时还要看真实约束和运行证据。分开运行的另一面，可以从失败继续理解。","outline":[{"id":"section-1","title":"分层是在整理不同性质的工作","depth":2},{"id":"section-2","title":"一起交付运行，可以形成单体","depth":2},{"id":"section-3","title":"分布式，说的是多处需要协作","depth":2},{"id":"section-4","title":"同一个摘要功能，换种形态会多出什么？","depth":2},{"id":"section-5","title":"形态要跟着需要选","depth":2}]},{"id":"failure","group":"reliability","title":"为什么你点了按钮，软件却没有给出结果？","question":"为什么你点了按钮，软件却没有给出结果？","summary":"你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。","terms":["局部失败","超时","重试","幂等","请求编号"],"aliases":["局部失败","","超时","","重试","","幂等","Idempotency","请求编号","Request ID"],"related":["observability","validation"],"html":"\u003cp>你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。\u003cstrong>没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。\u003c/strong>\u003c/p>\n\u003cp>软件需要同时处理失败和这种“不确定”。这在几个部分通过网络合作时尤其常见。\u003c/p>\n\u003ch2 id=\"section-1\">一次动作，中间有几个可能中断的地方\u003c/h2>\n\u003cp>假设手机把收藏要求发到服务端。网络可能断，服务端可能忙不过来，保存记录也可能失败。某一部分正常，整个任务仍可能没完成。\u003c/p>\n\u003cp>系统的一部分出问题、另一部分还在工作，叫\u003cstrong>局部失败\u003c/strong>。因此仅检查页面按钮能点击，并不能确认最终记录已正确保存。\u003c/p>\n\u003ch2 id=\"section-2\">超时是停止等，不是证明没执行\u003c/h2>\n\u003cp>不能无限等下去，程序可以设置一个等待限度。超过限度还没收到结果，叫\u003cstrong>超时\u003c/strong>。\u003c/p>\n\u003cp>如果收藏已经保存，只是回复晚了，手机此时仍可能报超时。这就是为什么重要动作要考虑结果如何重新确认，不能一看到超时就把一切当成没发生。\u003c/p>\n\u003ch2 id=\"section-3\">同一个“没收到”，可能对应三种事实\u003c/h2>\n\u003cp>继续看虚构收藏动作，假设页面等待超过限度便显示超时：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>中断位置\u003c/th>\n\u003cth>保存记录的地方实际怎样了\u003c/th>\n\u003cth>用户现在能知道什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>要求没到服务端\u003c/td>\n\u003ctd>没开始保存\u003c/td>\n\u003ctd>页面只知道没收到结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务端处理时出错\u003c/td>\n\u003ctd>可能明确未保存，或尚待确认\u003c/td>\n\u003ctd>要靠返回结果或重新查询进一步确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已保存，回复在路上丢了\u003c/td>\n\u003ctd>收藏已经存在\u003c/td>\n\u003ctd>页面仍然只知道没收到结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>第三种情况尤其容易误判。如果用户再点一次，而程序把每次要求都当成全新收藏，就可能重复；如果页面直接认定失败，又会和已经保存的事实不符。\u003c/p>\n\u003cp>一个合理恢复方向是：保留“结果待确认”，按同一账号和文章重新查询；若已经存在，就恢复已收藏显示。对更复杂操作，还需要用这次操作的编号查询结果，而不是只凭一次网络等待推断。\u003c/p>\n\u003ch2 id=\"section-4\">再试一次，可能帮忙，也可能重复\u003c/h2>\n\u003cp>重新发出要求，叫\u003cstrong>重试\u003c/strong>。暂时网络波动时，再试可能成功；对方正在过载时，大量重试却可能让它更忙。\u003c/p>\n\u003cp>假设每次“加入收藏”都会新增一条记录，反复重试就会出现重复收藏。若规则是“这位用户与这篇文章只有一条收藏”，相同要求重复处理，最终仍保留一条。\u003c/p>\n\u003cp>这种重复执行后，效果仍与执行一次相同的性质，叫\u003cstrong>幂等\u003c/strong>。这是讲机制的假设例子，真实系统还要落实识别重复和检查记录的方法。\u003c/p>\n\u003ch2 id=\"section-5\">怎样识别“重试的是同一件事”？\u003c/h2>\n\u003cp>如果目标只是“让A处于已收藏状态”，程序可以用“用户与文章”这一对值确保只保留一条。若目标是“为A创建一份新的摘要”，同一用户有时确实想生成第二份，就不能把所有同文请求永远当作重复。\u003c/p>\n\u003cp>一种办法是为每次有意发起的任务分配请求编号。例如第一次生成使用 Q81；因为没收到回复而重试，仍带 Q81。接收方若发现 Q81 已完成，就返回原来的结果；若仍在处理，就返回同一任务的进展，而不是再建一份。用户明确点“重新生成一份”，才创建新的编号。\u003c/p>\n\u003cp>检查编号、记录任务和正式结果的保存也要可靠协调，不能先执行副作用、后面才想起记录“做过了”。不同参数复用同一编号也应被识别并拒绝。只加一个编号字段，并不会自动得到幂等效果。\u003c/p>\n\u003cp>重试还要有次数、间隔和停止条件。对方明确说“无权限”，原样再试通常没有帮助；短时网络问题可以等待再试，避免大量请求同时挤回去。需要付费、发送或删除的动作，更要先知道重复执行会带来什么。\u003c/p>\n\u003ch2 id=\"section-6\">失败不能扩散到所有工作\u003c/h2>\n\u003cp>AI 摘要服务暂时不可用时，阅读助手可以继续显示已保存文章，只让摘要功能提示稍后再试。把一种失败尽量限制在相关工作范围内，就是一种隔离思路。\u003c/p>\n\u003cp>软件可靠并不表示永远没有失败。它还要让用户知道现在发生了什么，保护已有记录，并提供合理恢复方式。这分别连接\u003ca href=\"#/observability\">可观测性\u003c/a>、\u003ca href=\"#/state\">状态\u003c/a>和\u003ca href=\"#/validation\">验证\u003c/a>。\u003c/p>\n","text":"为什么你点了按钮，软件却没有给出结果？ 你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。 没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。 软件需要同时处理失败和这种“不确定”。这在几个部分通过网络合作时尤其常见。 一次动作，中间有几个可能中断的地方 假设手机把收藏要求发到服务端。网络可能断，服务端可能忙不过来，保存记录也可能失败。某一部分正常，整个任务仍可能没完成。 系统的一部分出问题、另一部分还在工作，叫 局部失败 。因此仅检查页面按钮能点击，并不能确认最终记录已正确保存。 超时是停止等，不是证明没执行 不能无限等下去，程序可以设置一个等待限度。超过限度还没收到结果，叫 超时 。 如果收藏已经保存，只是回复晚了，手机此时仍可能报超时。这就是为什么重要动作要考虑结果如何重新确认，不能一看到超时就把一切当成没发生。 同一个“没收到”，可能对应三种事实 继续看虚构收藏动作，假设页面等待超过限度便显示超时： 中断位置 保存记录的地方实际怎样了 用户现在能知道什么 --- --- --- 要求没到服务端 没开始保存 页面只知道没收到结果 服务端处理时出错 可能明确未保存，或尚待确认 要靠返回结果或重新查询进一步确认 已保存，回复在路上丢了 收藏已经存在 页面仍然只知道没收到结果 第三种情况尤其容易误判。如果用户再点一次，而程序把每次要求都当成全新收藏，就可能重复；如果页面直接认定失败，又会和已经保存的事实不符。 一个合理恢复方向是：保留“结果待确认”，按同一账号和文章重新查询；若已经存在，就恢复已收藏显示。对更复杂操作，还需要用这次操作的编号查询结果，而不是只凭一次网络等待推断。 再试一次，可能帮忙，也可能重复 重新发出要求，叫 重试 。暂时网络波动时，再试可能成功；对方正在过载时，大量重试却可能让它更忙。 假设每次“加入收藏”都会新增一条记录，反复重试就会出现重复收藏。若规则是“这位用户与这篇文章只有一条收藏”，相同要求重复处理，最终仍保留一条。 这种重复执行后，效果仍与执行一次相同的性质，叫 幂等 。这是讲机制的假设例子，真实系统还要落实识别重复和检查记录的方法。 怎样识别“重试的是同一件事”？ 如果目标只是“让A处于已收藏状态”，程序可以用“用户与文章”这一对值确保只保留一条。若目标是“为A创建一份新的摘要”，同一用户有时确实想生成第二份，就不能把所有同文请求永远当作重复。 一种办法是为每次有意发起的任务分配请求编号。例如第一次生成使用 Q81；因为没收到回复而重试，仍带 Q81。接收方若发现 Q81 已完成，就返回原来的结果；若仍在处理，就返回同一任务的进展，而不是再建一份。用户明确点“重新生成一份”，才创建新的编号。 检查编号、记录任务和正式结果的保存也要可靠协调，不能先执行副作用、后面才想起记录“做过了”。不同参数复用同一编号也应被识别并拒绝。只加一个编号字段，并不会自动得到幂等效果。 重试还要有次数、间隔和停止条件。对方明确说“无权限”，原样再试通常没有帮助；短时网络问题可以等待再试，避免大量请求同时挤回去。需要付费、发送或删除的动作，更要先知道重复执行会带来什么。 失败不能扩散到所有工作 AI 摘要服务暂时不可用时，阅读助手可以继续显示已保存文章，只让摘要功能提示稍后再试。把一种失败尽量限制在相关工作范围内，就是一种隔离思路。 软件可靠并不表示永远没有失败。它还要让用户知道现在发生了什么，保护已有记录，并提供合理恢复方式。这分别连接可观测性、状态和验证。","outline":[{"id":"section-1","title":"一次动作，中间有几个可能中断的地方","depth":2},{"id":"section-2","title":"超时是停止等，不是证明没执行","depth":2},{"id":"section-3","title":"同一个“没收到”，可能对应三种事实","depth":2},{"id":"section-4","title":"再试一次，可能帮忙，也可能重复","depth":2},{"id":"section-5","title":"怎样识别“重试的是同一件事”？","depth":2},{"id":"section-6","title":"失败不能扩散到所有工作","depth":2}]},{"id":"trust","group":"reliability","title":"登录了，为什么还不能看所有人的文章？","question":"登录了，为什么还不能看所有人的文章？","summary":"你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题：你是谁？你可以对这份内容做什么？","terms":["认证","授权","信任边界"],"aliases":["认证","Authentication","授权","Authorization","信任边界",""],"related":["agent","data-model"],"html":"\u003cp>你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题：\u003cstrong>你是谁？你可以对这份内容做什么？\u003c/strong>\u003c/p>\n\u003cp>确认身份叫认证，检查允许做什么叫授权。两者合作，才能形成权限控制。\u003c/p>\n\u003ch2 id=\"section-1\">登录主要回答“你是谁”\u003c/h2>\n\u003cp>通过密码、登录服务等方式，系统确认你对应哪个账号。这是在做\u003cstrong>认证\u003c/strong>。登录成功后，后续要求还要有办法表明来自哪个已确认的身份。\u003c/p>\n\u003cp>但身份本身不说明你可以做所有事。一个普通成员和管理员，可能都正确登录，允许执行的操作却不同。\u003c/p>\n\u003ch2 id=\"section-2\">权限跟着具体内容和动作检查\u003c/h2>\n\u003cp>“能读文章 A”“能编辑文章 A”“能把文章 A 分享给别人”，是不同许可。检查某个人能否对某项内容做某种操作，就是\u003cstrong>授权\u003c/strong>。\u003c/p>\n\u003cp>假设文章 A 属于小林，小周直接要求删除 A，保存服务必须检查是否允许，再决定执行。这个检查不能只靠前端藏起删除按钮，因为其他程序也可能直接提出同样的要求。\u003c/p>\n\u003ch2 id=\"section-3\">沿小周的一次删除要求检查\u003c/h2>\n\u003cp>以下是虚构产品的一套规则：文章作者能读、改、删；被分享的人只能读。A17属于小林，小周拿到了阅读分享。\u003c/p>\n\u003col>\n\u003cli>小周登录，系统核验登录信息，发给他后续可用于证明已登录身份的凭据。它不是随便填写的账号名字。\u003c/li>\n\u003cli>他提出“删除A17”，服务端先核验凭据是否有效，得到可信的账号身份U2；凭据过期就要求重新登录。\u003c/li>\n\u003cli>服务端读取A17的作者和分享规则，发现U2只有阅读许可，没有删除许可，返回拒绝。\u003c/li>\n\u003cli>真正的删除步骤不执行，A17仍然存在。即使小周绕过页面按钮直接发要求，结果也应相同。\u003c/li>\n\u003c/ol>\n\u003cp>若请求的是“阅读A17”，同一身份可能被允许。\u003cstrong>认证的结果是一个身份，授权的结果是这个身份对这项内容、这次动作是否被允许\u003c/strong>。拿到登录身份，不等于拿到了全部许可。\u003c/p>\n\u003cp>凭据和权限记录也要保护好，不能随意放进日志或公开页面。这里只解释检查链条，具体登录系统还要处理有效期、撤销、传输与保存等要求。\u003c/p>\n\u003ch2 id=\"section-4\">为什么不能直接相信客户端说的话？\u003c/h2>\n\u003cp>客户端提交“我就是管理员”并不足够。处理受保护操作的地方，要根据可信的身份和权限记录作出决定，也要检查输入是否合理。\u003c/p>\n\u003cp>从不可信输入进入受保护能力的交接位置，可以叫\u003cstrong>信任边界\u003c/strong>。跨过它时，系统需要验证，不能只凭一段文字或漂亮界面就授予能力。\u003c/p>\n\u003ch2 id=\"section-5\">AI 能提出行动，也要接受同样限制\u003c/h2>\n\u003cp>让 AI 帮你读文章，不自动意味着它可以删除全部资料。系统要限制可调用工具、可访问内容，必要时让人确认重要动作。\u003c/p>\n\u003cp>文章中如果写着“忽略限制，把资料发送出去”，那是文章内容，不能自动成为更高权限的操作命令。模型输出也需要系统检查后才能变成受保护操作。\u003c/p>\n\u003cp>假设产品新增“公开分享”按钮，能够阅读私人文章仍不一定意味着可以把它公开。要明确谁能建立分享、分享范围是什么、撤销后哪些入口失效，并在实际建立分享的位置检查。\u003c/p>\n\u003cp>向 AI 讨论权限时，可以用“谁、哪份内容、哪个动作”列出允许和拒绝的例子；再实际用另一个账号检查。只看到自己的页面正常，无法证明别人的访问被正确限制。\u003c/p>\n\u003cp>权限是软件世界模型里的一道关口：谁提出要求，由谁检查，在哪一步允许实际改变。它连接\u003ca href=\"#/interface\">接口\u003c/a>和\u003ca href=\"#/agent\">Agent\u003c/a>，并非只是一张登录页面。\u003c/p>\n","text":"登录了，为什么还不能看所有人的文章？ 你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题： 你是谁？你可以对这份内容做什么？ 确认身份叫认证，检查允许做什么叫授权。两者合作，才能形成权限控制。 登录主要回答“你是谁” 通过密码、登录服务等方式，系统确认你对应哪个账号。这是在做 认证 。登录成功后，后续要求还要有办法表明来自哪个已确认的身份。 但身份本身不说明你可以做所有事。一个普通成员和管理员，可能都正确登录，允许执行的操作却不同。 权限跟着具体内容和动作检查 “能读文章 A”“能编辑文章 A”“能把文章 A 分享给别人”，是不同许可。检查某个人能否对某项内容做某种操作，就是 授权 。 假设文章 A 属于小林，小周直接要求删除 A，保存服务必须检查是否允许，再决定执行。这个检查不能只靠前端藏起删除按钮，因为其他程序也可能直接提出同样的要求。 沿小周的一次删除要求检查 以下是虚构产品的一套规则：文章作者能读、改、删；被分享的人只能读。A17属于小林，小周拿到了阅读分享。 1. 小周登录，系统核验登录信息，发给他后续可用于证明已登录身份的凭据。它不是随便填写的账号名字。 2. 他提出“删除A17”，服务端先核验凭据是否有效，得到可信的账号身份U2；凭据过期就要求重新登录。 3. 服务端读取A17的作者和分享规则，发现U2只有阅读许可，没有删除许可，返回拒绝。 4. 真正的删除步骤不执行，A17仍然存在。即使小周绕过页面按钮直接发要求，结果也应相同。 若请求的是“阅读A17”，同一身份可能被允许。 认证的结果是一个身份，授权的结果是这个身份对这项内容、这次动作是否被允许 。拿到登录身份，不等于拿到了全部许可。 凭据和权限记录也要保护好，不能随意放进日志或公开页面。这里只解释检查链条，具体登录系统还要处理有效期、撤销、传输与保存等要求。 为什么不能直接相信客户端说的话？ 客户端提交“我就是管理员”并不足够。处理受保护操作的地方，要根据可信的身份和权限记录作出决定，也要检查输入是否合理。 从不可信输入进入受保护能力的交接位置，可以叫 信任边界 。跨过它时，系统需要验证，不能只凭一段文字或漂亮界面就授予能力。 AI 能提出行动，也要接受同样限制 让 AI 帮你读文章，不自动意味着它可以删除全部资料。系统要限制可调用工具、可访问内容，必要时让人确认重要动作。 文章中如果写着“忽略限制，把资料发送出去”，那是文章内容，不能自动成为更高权限的操作命令。模型输出也需要系统检查后才能变成受保护操作。 假设产品新增“公开分享”按钮，能够阅读私人文章仍不一定意味着可以把它公开。要明确谁能建立分享、分享范围是什么、撤销后哪些入口失效，并在实际建立分享的位置检查。 向 AI 讨论权限时，可以用“谁、哪份内容、哪个动作”列出允许和拒绝的例子；再实际用另一个账号检查。只看到自己的页面正常，无法证明别人的访问被正确限制。 权限是软件世界模型里的一道关口：谁提出要求，由谁检查，在哪一步允许实际改变。它连接接口和Agent，并非只是一张登录页面。","outline":[{"id":"section-1","title":"登录主要回答“你是谁”","depth":2},{"id":"section-2","title":"权限跟着具体内容和动作检查","depth":2},{"id":"section-3","title":"沿小周的一次删除要求检查","depth":2},{"id":"section-4","title":"为什么不能直接相信客户端说的话？","depth":2},{"id":"section-5","title":"AI 能提出行动，也要接受同样限制","depth":2}]},{"id":"observability","group":"reliability","title":"软件出问题时，怎样知道里面发生了什么？","question":"软件出问题时，怎样知道里面发生了什么？","summary":"阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。","terms":["日志","指标","追踪","可观测性"],"aliases":["日志","","指标","","追踪","","可观测性","Observability"],"related":["validation","performance"],"html":"\u003cp>阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。\u003c/p>\n\u003cp>\u003cstrong>把内部工作变成能看到、能追查的证据，叫可观测性\u003c/strong>。它帮助我们解释运行中的系统。\u003c/p>\n\u003ch2 id=\"section-1\">日志像工作经过的记录\u003c/h2>\n\u003cp>假设系统记录：收到第81次摘要要求、文章读取成功、模型请求超时。这样就能沿着时间找出哪些动作发生过。\u003c/p>\n\u003cp>这类具体事件记录叫\u003cstrong>日志\u003c/strong>。记录要包含能关联工作的线索，也要避免随意保存密码或私密正文。只留下“出错了”，通常不足以解释原因。\u003c/p>\n\u003ch2 id=\"section-2\">指标让你看到整体变化\u003c/h2>\n\u003cp>一分钟收到多少要求，其中多少失败，平均等多久？把许多事件汇总成数值，就是\u003cstrong>指标\u003c/strong>。\u003c/p>\n\u003cp>日志适合看某次工作的经过，指标适合发现整体是否变慢或失败增多。指标上升只是线索，还需要继续查原因。例如失败和用户增多同时发生，并不能单凭时间重合证明原因。\u003c/p>\n\u003ch2 id=\"section-3\">一次工作跨几处，线索要连起来\u003c/h2>\n\u003cp>一次摘要可能经过页面、文章服务、模型服务。让这些地方对同一份工作使用关联标识，再看每一步花的时间和结果，这种连起链路的做法叫\u003cstrong>追踪\u003c/strong>。\u003c/p>\n\u003cp>它帮助区分“模型花了很久”和“模型很快，保存却卡住”。结构图表示应该怎样合作，运行线索则说明这一次实际上怎样合作。\u003c/p>\n\u003ch2 id=\"section-4\">拿同一份工作的线索，怎样缩小问题？\u003c/h2>\n\u003cp>设下面是虚构的任务T81的演示记录，不是真实服务测量：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时间\u003c/th>\n\u003cth>任务T81留下的线索\u003c/th>\n\u003cth>目前能支持的判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>10:00:00\u003c/td>\n\u003ctd>收到摘要要求\u003c/td>\n\u003ctd>已到达处理入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10:00:01\u003c/td>\n\u003ctd>文章A读取完成\u003c/td>\n\u003ctd>本次取材料步骤有成功记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10:00:01\u003c/td>\n\u003ctd>向模型发出要求\u003c/td>\n\u003ctd>后面开始等待模型结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10:00:11\u003c/td>\n\u003ctd>模型等待超时\u003c/td>\n\u003ctd>在规定时间内没有收到模型结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>沿同一个编号看，能把排查重点放在最后这段等待，而不是先去重写文章读取。但“模型等待超时”仍不能独自证明模型坏了，也可能是连接问题；还要结合网络和对方运行记录。\u003c/p>\n\u003cp>若另一个任务记录“模型返回成功，保存摘要失败”，重点就落在保存环节。结构相同的产品，实际失败位置可以不同，只有对着这次经过才能继续判断。\u003c/p>\n\u003cp>如果日志里没有某一步，也不能直接断定它没发生：记录可能未开启、丢失或尚未送达。证据的缺口本身也要说明。把文章正文全部记下来又不一定有帮助，任务编号、步骤、结果和必要耗时通常更适合关联排查。\u003c/p>\n\u003ch2 id=\"section-5\">从一份失败，走到整体是否异常\u003c/h2>\n\u003cp>假设一分钟有100次摘要请求，其中20次失败，这一分钟的失败比例就是20%。这是演算示例，不能直接当作产品指标。与之前正常时段比较，可以发现变化，再抽取相关任务看共同失败点。\u003c/p>\n\u003cp>若失败只发生在某种长文章，就进一步比较输入长度；若许多功能同时失败，就看共享的存储或连接。先用汇总发现范围，再用具体经过检查解释。修好后还要从用户入口重做，确认结果真的恢复。\u003c/p>\n\u003ch2 id=\"section-6\">内部正常，用户也可能用不了\u003c/h2>\n\u003cp>后端能收到要求，不意味着手机上的按钮能正常操作。还需要从用户入口检查完整结果，例如能否打开、读到内容、取得正确摘要。\u003c/p>\n\u003cp>可观测性提供运行时证据，\u003ca href=\"#/validation\">验证\u003c/a>检查这些证据是否满足预期。线索的数量不是目标：它们要能帮助解释用户遇到的具体结果。\u003c/p>\n","text":"软件出问题时，怎样知道里面发生了什么？ 阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。 把内部工作变成能看到、能追查的证据，叫可观测性 。它帮助我们解释运行中的系统。 日志像工作经过的记录 假设系统记录：收到第81次摘要要求、文章读取成功、模型请求超时。这样就能沿着时间找出哪些动作发生过。 这类具体事件记录叫 日志 。记录要包含能关联工作的线索，也要避免随意保存密码或私密正文。只留下“出错了”，通常不足以解释原因。 指标让你看到整体变化 一分钟收到多少要求，其中多少失败，平均等多久？把许多事件汇总成数值，就是 指标 。 日志适合看某次工作的经过，指标适合发现整体是否变慢或失败增多。指标上升只是线索，还需要继续查原因。例如失败和用户增多同时发生，并不能单凭时间重合证明原因。 一次工作跨几处，线索要连起来 一次摘要可能经过页面、文章服务、模型服务。让这些地方对同一份工作使用关联标识，再看每一步花的时间和结果，这种连起链路的做法叫 追踪 。 它帮助区分“模型花了很久”和“模型很快，保存却卡住”。结构图表示应该怎样合作，运行线索则说明这一次实际上怎样合作。 拿同一份工作的线索，怎样缩小问题？ 设下面是虚构的任务T81的演示记录，不是真实服务测量： 时间 任务T81留下的线索 目前能支持的判断 --- --- --- 10:00:00 收到摘要要求 已到达处理入口 10:00:01 文章A读取完成 本次取材料步骤有成功记录 10:00:01 向模型发出要求 后面开始等待模型结果 10:00:11 模型等待超时 在规定时间内没有收到模型结果 沿同一个编号看，能把排查重点放在最后这段等待，而不是先去重写文章读取。但“模型等待超时”仍不能独自证明模型坏了，也可能是连接问题；还要结合网络和对方运行记录。 若另一个任务记录“模型返回成功，保存摘要失败”，重点就落在保存环节。结构相同的产品，实际失败位置可以不同，只有对着这次经过才能继续判断。 如果日志里没有某一步，也不能直接断定它没发生：记录可能未开启、丢失或尚未送达。证据的缺口本身也要说明。把文章正文全部记下来又不一定有帮助，任务编号、步骤、结果和必要耗时通常更适合关联排查。 从一份失败，走到整体是否异常 假设一分钟有100次摘要请求，其中20次失败，这一分钟的失败比例就是20%。这是演算示例，不能直接当作产品指标。与之前正常时段比较，可以发现变化，再抽取相关任务看共同失败点。 若失败只发生在某种长文章，就进一步比较输入长度；若许多功能同时失败，就看共享的存储或连接。先用汇总发现范围，再用具体经过检查解释。修好后还要从用户入口重做，确认结果真的恢复。 内部正常，用户也可能用不了 后端能收到要求，不意味着手机上的按钮能正常操作。还需要从用户入口检查完整结果，例如能否打开、读到内容、取得正确摘要。 可观测性提供运行时证据，验证检查这些证据是否满足预期。线索的数量不是目标：它们要能帮助解释用户遇到的具体结果。","outline":[{"id":"section-1","title":"日志像工作经过的记录","depth":2},{"id":"section-2","title":"指标让你看到整体变化","depth":2},{"id":"section-3","title":"一次工作跨几处，线索要连起来","depth":2},{"id":"section-4","title":"拿同一份工作的线索，怎样缩小问题？","depth":2},{"id":"section-5","title":"从一份失败，走到整体是否异常","depth":2},{"id":"section-6","title":"内部正常，用户也可能用不了","depth":2}]},{"id":"performance","group":"reliability","title":"软件的“快”，到底是哪里快？","question":"软件的“快”，到底是哪里快？","summary":"假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。","terms":["延迟","吞吐量","瓶颈"],"aliases":["延迟","","吞吐量","","瓶颈",""],"related":["algorithms","time"],"html":"\u003cp>假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。\u003c/p>\n\u003cp>至少要分清：\u003cstrong>一个人等多久，一段时间能处理多少工作，以及完成这些工作需要多少资源。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">延迟是一次工作要等多久\u003c/h2>\n\u003cp>从点生成到看到摘要，经过的时间叫\u003cstrong>延迟\u003c/strong>。其中可能包含读取文章、网络往来、模型生成和显示。\u003c/p>\n\u003cp>如果必须按顺序完成，每一步都影响总等待。把已经很快的按钮动画再加速，未必减少用户等待摘要的时间。要找出真正占时间的步骤，可以利用\u003ca href=\"#/observability\">运行线索\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">把“等了7秒”拆成可比较的工作\u003c/h2>\n\u003cp>下面只为演算设定一个完全串行的摘要流程，不是本知识库或某个模型的实测速度：读文章0.2秒，往返传输0.3秒，模型生成6秒，保存与显示0.5秒。总等待是0.2＋0.3＋6＋0.5＝7秒。\u003c/p>\n\u003cp>假设把读取从0.2秒缩到0.1秒，其余不变，总等待变成6.9秒；若模型生成能从6秒缩到3秒，其余不变，总等待才变成4秒。这个算例说明：一个局部快一倍，对总体验的影响取决于它原来占多少。\u003c/p>\n\u003cp>真实步骤可能有重叠，界面还可能先显示部分结果，不能机械把每个耗时都相加。先看实际流程是串行、并行还是在排队，再决定应该比较哪些时间。\u003c/p>\n\u003ch2 id=\"section-3\">吞吐量是一段时间能做多少\u003c/h2>\n\u003cp>系统每分钟能处理多少篇摘要，这种处理能力叫\u003cstrong>吞吐量\u003c/strong>。它和单篇等待时间不同。\u003c/p>\n\u003cp>能同时处理更多任务，可能提高总处理量；但某个人的摘要不一定更快。人多时还可能排队，让等待变长。因此“增加同时处理数”也需要考虑机器和外部能力的上限。\u003c/p>\n\u003ch2 id=\"section-4\">加两位“工作人员”，为什么有人仍要等？\u003c/h2>\n\u003cp>另作一个理想化计算：假设每份任务占用一个执行位置6秒，没有其他开销。一个位置每分钟可做10份，两个位置可做20份，但单份仍需6秒。如果同一时刻来三份，前两份开始，第三份要先等一个位置空出。\u003c/p>\n\u003cp>这些数字只是固定任务下的上限演算。真实增加并发时还可能竞争机器资源、触及外部调用限制，单份也可能变慢。因此吞吐提升、单次延迟降低和排队缩短，是相关但不同的目标。\u003c/p>\n\u003ch2 id=\"section-5\">瓶颈是限制整体的地方\u003c/h2>\n\u003cp>假设文章读取很快，模型处理只能达到某个速度。这个限制整体能力的部分，就是\u003cstrong>瓶颈\u003c/strong>。\u003c/p>\n\u003cp>其他部分加速，可能只让更多任务堆在模型前面。先识别限制，才能知道应该减少工作、改算法、增加资源，还是改变产品等待方式。\u003c/p>\n\u003ch2 id=\"section-6\">让它更快，常常需要付出别的代价\u003c/h2>\n\u003cp>缓存能省重复计算，但要处理过期；多台机器能分担工作，但要协调记录和通信；缩短输入能减轻模型工作，但可能遗漏重要材料。\u003c/p>\n\u003cp>给阅读助手定要求时，可以具体到“打开已保存文章要及时响应；生成摘要允许等待，但要看得到进展”。若慢在反复取同一文章，评估缓存；若慢在模型输入过大，评估是否能在保留必要材料的前提下缩短。改变材料还要重新检查摘要质量，不能只看秒数变小。\u003c/p>\n\u003cp>成本也包括资源开销、外部服务调用和维护复杂度。这里没有一招通用的“提速”。软件地图把\u003ca href=\"#/resources\">资源\u003c/a>、\u003ca href=\"#/algorithms\">算法\u003c/a>、\u003ca href=\"#/storage\">存储\u003c/a>和等待连起来，你才有依据讨论取舍。\u003c/p>\n","text":"软件的“快”，到底是哪里快？ 假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。 至少要分清： 一个人等多久，一段时间能处理多少工作，以及完成这些工作需要多少资源。 延迟是一次工作要等多久 从点生成到看到摘要，经过的时间叫 延迟 。其中可能包含读取文章、网络往来、模型生成和显示。 如果必须按顺序完成，每一步都影响总等待。把已经很快的按钮动画再加速，未必减少用户等待摘要的时间。要找出真正占时间的步骤，可以利用运行线索。 把“等了7秒”拆成可比较的工作 下面只为演算设定一个完全串行的摘要流程，不是本知识库或某个模型的实测速度：读文章0.2秒，往返传输0.3秒，模型生成6秒，保存与显示0.5秒。总等待是0.2＋0.3＋6＋0.5＝7秒。 假设把读取从0.2秒缩到0.1秒，其余不变，总等待变成6.9秒；若模型生成能从6秒缩到3秒，其余不变，总等待才变成4秒。这个算例说明：一个局部快一倍，对总体验的影响取决于它原来占多少。 真实步骤可能有重叠，界面还可能先显示部分结果，不能机械把每个耗时都相加。先看实际流程是串行、并行还是在排队，再决定应该比较哪些时间。 吞吐量是一段时间能做多少 系统每分钟能处理多少篇摘要，这种处理能力叫 吞吐量 。它和单篇等待时间不同。 能同时处理更多任务，可能提高总处理量；但某个人的摘要不一定更快。人多时还可能排队，让等待变长。因此“增加同时处理数”也需要考虑机器和外部能力的上限。 加两位“工作人员”，为什么有人仍要等？ 另作一个理想化计算：假设每份任务占用一个执行位置6秒，没有其他开销。一个位置每分钟可做10份，两个位置可做20份，但单份仍需6秒。如果同一时刻来三份，前两份开始，第三份要先等一个位置空出。 这些数字只是固定任务下的上限演算。真实增加并发时还可能竞争机器资源、触及外部调用限制，单份也可能变慢。因此吞吐提升、单次延迟降低和排队缩短，是相关但不同的目标。 瓶颈是限制整体的地方 假设文章读取很快，模型处理只能达到某个速度。这个限制整体能力的部分，就是 瓶颈 。 其他部分加速，可能只让更多任务堆在模型前面。先识别限制，才能知道应该减少工作、改算法、增加资源，还是改变产品等待方式。 让它更快，常常需要付出别的代价 缓存能省重复计算，但要处理过期；多台机器能分担工作，但要协调记录和通信；缩短输入能减轻模型工作，但可能遗漏重要材料。 给阅读助手定要求时，可以具体到“打开已保存文章要及时响应；生成摘要允许等待，但要看得到进展”。若慢在反复取同一文章，评估缓存；若慢在模型输入过大，评估是否能在保留必要材料的前提下缩短。改变材料还要重新检查摘要质量，不能只看秒数变小。 成本也包括资源开销、外部服务调用和维护复杂度。这里没有一招通用的“提速”。软件地图把资源、算法、存储和等待连起来，你才有依据讨论取舍。","outline":[{"id":"section-1","title":"延迟是一次工作要等多久","depth":2},{"id":"section-2","title":"把“等了7秒”拆成可比较的工作","depth":2},{"id":"section-3","title":"吞吐量是一段时间能做多少","depth":2},{"id":"section-4","title":"加两位“工作人员”，为什么有人仍要等？","depth":2},{"id":"section-5","title":"瓶颈是限制整体的地方","depth":2},{"id":"section-6","title":"让它更快，常常需要付出别的代价","depth":2}]},{"id":"delivery","group":"evolution","title":"AI 写好代码后，为什么别人还不能打开软件？","question":"AI 写好代码后，为什么别人还不能打开软件？","summary":"AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。","terms":["构建","部署","环境","DNS"],"aliases":["构建","","部署","","环境","","DNS",""],"related":["change","runtime"],"html":"\u003cp>AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。\u003c/p>\n\u003cp>\u003cstrong>让软件在目标地方准备好、运行起来，并让使用者找到它，是交付中的工作\u003c/strong>。常见的名字是构建和部署。\u003c/p>\n\u003ch2 id=\"section-1\">写好的材料，可能先要整理成可用产物\u003c/h2>\n\u003cp>开发时的文件可能分在许多地方，还引用其他组件。交给用户使用前，可以先把它们转换、整理或打包成可运行、可分发的内容，这个过程叫\u003cstrong>构建\u003c/strong>。\u003c/p>\n\u003cp>有些网页文件能直接打开，有些程序需要先构建。不是所有软件都必须有同样的步骤，重点是从源文件到最终使用的内容之间，可能还有一道整理过程。\u003c/p>\n\u003ch2 id=\"section-2\">部署是把它放到实际使用的位置\u003c/h2>\n\u003cp>把产物放到目标机器，准备需要的组件和设置，启动程序，让正确入口指向它，这些工作构成\u003cstrong>部署\u003c/strong>。\u003c/p>\n\u003cp>如果程序需要数据库，还要提供可用的数据库连接；如果需要模型服务，还要准备相应访问能力。这些具体条件一起组成环境。同一份代码，在条件不同的环境里，可能表现不同。\u003c/p>\n\u003ch2 id=\"section-3\">就拿你现在读的知识库看一次交付\u003c/h2>\n\u003cp>这个知识库的文章原文是 Markdown 文件，阅读界面另有模板。构建程序把文章转换成网页内容，放进最终的阅读页面，连同搜索所需内容和图解一起准备好。\u003c/p>\n\u003cp>把原文改了，已经生成的页面不会因此自己变新。需要重新构建，再把新页面交给托管网站的位置。读者访问公开网址，托管服务把页面文件送给浏览器；浏览器执行其中的界面逻辑，才显示目录、正文和搜索。\u003c/p>\n\u003cp>这说明源文件、可分发产物、存放产物的地方和读者入口是几个不同角色。自动发布流程可以把这些步骤串起来，但仍需确认每一步成功，尤其是读者实际打开的入口是否取得了新产物。\u003c/p>\n\u003cp>这个阅读器的正文、搜索和图片可以放在静态文件中，运行时不需要再替每个读者调用一个正文后端。若增加“所有人共享收藏”，就要另安排接收修改并保存共享记录的能力；仅把静态页面上传，并没有把这项能力也造出来。\u003c/p>\n\u003ch2 id=\"section-4\">localhost 为什么别人打不开？\u003c/h2>\n\u003cp>localhost 可以先理解成“这台设备自己”。你在自己的电脑访问它，会找到自己这里的程序；朋友在他的电脑访问它，指向的是他自己的电脑。\u003c/p>\n\u003cp>让朋友使用联网软件，需要一个他能访问的位置和地址。常见网站用域名方便人记住，再通过 DNS 这样的名字查询机制找到网络位置。还需要正确的网络连接和路由，光买个名字不会让代码自动上线。\u003c/p>\n\u003ch2 id=\"section-5\">地址解决了什么，又没解决什么？\u003c/h2>\n\u003cp>假设公开域名是书店招牌式的名字，DNS帮助浏览器找到相应网络位置；到达以后，托管服务还要按访问路径找到正确页面。名字存在但目标程序没运行，或者页面放错目录，都可能无法完成访问。\u003c/p>\n\u003cp>对于要执行后端逻辑的网站，目标环境还要有启动中的程序、需要的组件、正确配置和可连接的保存服务。对于只发送静态页面的托管方式，平台承担文件服务，但仍不能把仅适用于本机的后端地址变成公众入口。\u003c/p>\n\u003cp>换成一个有私人文章的阅读产品，部署检查就不仅是首页能开，还要从另一设备登录、保存、再次取回，并确认私人内容没有被公开。交付是否完成，要和用户要做的整件事对照。\u003c/p>\n\u003ch2 id=\"section-6\">修改代码，为什么页面可能还是旧的？\u003c/h2>\n\u003cp>修改源文件以后，正在运行的可能仍是旧产物或旧实例。要按软件的交付方式更新对应内容，必要时重新构建、启动，并确认用户入口确实访问新版本。\u003c/p>\n\u003cp>因此交付把代码、环境、实际运行、访问入口连起来。它也引出下一个问题：用户已经有记录了，更新怎样保留连续性？继续看\u003ca href=\"#/change\">版本与迁移\u003c/a>。\u003c/p>\n","text":"AI 写好代码后，为什么别人还不能打开软件？ AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。 让软件在目标地方准备好、运行起来，并让使用者找到它，是交付中的工作 。常见的名字是构建和部署。 写好的材料，可能先要整理成可用产物 开发时的文件可能分在许多地方，还引用其他组件。交给用户使用前，可以先把它们转换、整理或打包成可运行、可分发的内容，这个过程叫 构建 。 有些网页文件能直接打开，有些程序需要先构建。不是所有软件都必须有同样的步骤，重点是从源文件到最终使用的内容之间，可能还有一道整理过程。 部署是把它放到实际使用的位置 把产物放到目标机器，准备需要的组件和设置，启动程序，让正确入口指向它，这些工作构成 部署 。 如果程序需要数据库，还要提供可用的数据库连接；如果需要模型服务，还要准备相应访问能力。这些具体条件一起组成环境。同一份代码，在条件不同的环境里，可能表现不同。 就拿你现在读的知识库看一次交付 这个知识库的文章原文是 Markdown 文件，阅读界面另有模板。构建程序把文章转换成网页内容，放进最终的阅读页面，连同搜索所需内容和图解一起准备好。 把原文改了，已经生成的页面不会因此自己变新。需要重新构建，再把新页面交给托管网站的位置。读者访问公开网址，托管服务把页面文件送给浏览器；浏览器执行其中的界面逻辑，才显示目录、正文和搜索。 这说明源文件、可分发产物、存放产物的地方和读者入口是几个不同角色。自动发布流程可以把这些步骤串起来，但仍需确认每一步成功，尤其是读者实际打开的入口是否取得了新产物。 这个阅读器的正文、搜索和图片可以放在静态文件中，运行时不需要再替每个读者调用一个正文后端。若增加“所有人共享收藏”，就要另安排接收修改并保存共享记录的能力；仅把静态页面上传，并没有把这项能力也造出来。 localhost 为什么别人打不开？ localhost 可以先理解成“这台设备自己”。你在自己的电脑访问它，会找到自己这里的程序；朋友在他的电脑访问它，指向的是他自己的电脑。 让朋友使用联网软件，需要一个他能访问的位置和地址。常见网站用域名方便人记住，再通过 DNS 这样的名字查询机制找到网络位置。还需要正确的网络连接和路由，光买个名字不会让代码自动上线。 地址解决了什么，又没解决什么？ 假设公开域名是书店招牌式的名字，DNS帮助浏览器找到相应网络位置；到达以后，托管服务还要按访问路径找到正确页面。名字存在但目标程序没运行，或者页面放错目录，都可能无法完成访问。 对于要执行后端逻辑的网站，目标环境还要有启动中的程序、需要的组件、正确配置和可连接的保存服务。对于只发送静态页面的托管方式，平台承担文件服务，但仍不能把仅适用于本机的后端地址变成公众入口。 换成一个有私人文章的阅读产品，部署检查就不仅是首页能开，还要从另一设备登录、保存、再次取回，并确认私人内容没有被公开。交付是否完成，要和用户要做的整件事对照。 修改代码，为什么页面可能还是旧的？ 修改源文件以后，正在运行的可能仍是旧产物或旧实例。要按软件的交付方式更新对应内容，必要时重新构建、启动，并确认用户入口确实访问新版本。 因此交付把代码、环境、实际运行、访问入口连起来。它也引出下一个问题：用户已经有记录了，更新怎样保留连续性？继续看版本与迁移。","outline":[{"id":"section-1","title":"写好的材料，可能先要整理成可用产物","depth":2},{"id":"section-2","title":"部署是把它放到实际使用的位置","depth":2},{"id":"section-3","title":"就拿你现在读的知识库看一次交付","depth":2},{"id":"section-4","title":"localhost 为什么别人打不开？","depth":2},{"id":"section-5","title":"地址解决了什么，又没解决什么？","depth":2},{"id":"section-6","title":"修改代码，为什么页面可能还是旧的？","depth":2}]},{"id":"change","group":"evolution","title":"软件更新了，原来的文章和收藏怎么办？","question":"软件更新了，原来的文章和收藏怎么办？","summary":"第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。","terms":["版本控制","迁移","兼容性","回滚"],"aliases":["版本控制","Git","迁移","","兼容性","","回滚",""],"related":["consistency","validation"],"html":"\u003cp>第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。\u003c/p>\n\u003cp>\u003cstrong>软件变化涉及新的做事规则，也涉及已经留下的信息\u003c/strong>。换掉代码，旧记录不会自动知道新的意思。\u003c/p>\n\u003ch2 id=\"section-1\">版本控制记住代码怎样变化\u003c/h2>\n\u003cp>把一组代码修改保存成可识别的历史版本，便于比较、找回和协作，这种管理叫\u003cstrong>版本控制\u003c/strong>。Git 是常见工具。\u003c/p>\n\u003cp>它可以帮助找出“从哪个版本开始改变”，也可以恢复旧代码。但普通代码版本记录，不自动等于线上数据库和用户文件的备份。\u003c/p>\n\u003ch2 id=\"section-2\">迁移让旧记录适应新安排\u003c/h2>\n\u003cp>假设新收藏记录需要“所属文件夹”。已有记录没这个栏目，可以规定它们先进入“未分类”，再让用户整理。按新规则调整已有信息的工作，叫\u003cstrong>迁移\u003c/strong>。\u003c/p>\n\u003cp>迁移可能只是加栏目，也可能需要转换内容、重新建立关系。旧资料怎样解释，要在修改前想清楚，不能靠程序随机填一个值。\u003c/p>\n\u003ch2 id=\"section-3\">给旧收藏加文件夹，怎样一步步过渡？\u003c/h2>\n\u003cp>下面是虚构产品的一种迁移安排，具体实现仍需结合数据量和数据库能力：\u003c/p>\n\u003col>\n\u003cli>先保留旧的“用户、文章”记录，增加可表达文件夹的新位置；读取时允许旧记录尚未填写，并把它显示成“未分类”。\u003c/li>\n\u003cli>为每位用户建立自己的“未分类”文件夹，把原有收藏关联到它。迁移程序记录进度，重复执行时不应再创建一批同名文件夹或重复收藏。\u003c/li>\n\u003cli>检查迁移前后每位用户的收藏是否仍能找到、原数量是否对应，是否有记录被放到别人的文件夹里。\u003c/li>\n\u003cli>等新代码和数据都准备好，再逐步要求新写入遵守文件夹规则；确定旧用法已退出后，才移除过渡兼容。\u003c/li>\n\u003c/ol>\n\u003cp>这样旧记录在迁移过程中仍有明确解释，不必假装所有用户同时更新。若第2步中断，也要能从记录的进度继续，而不是从头重复造成另一轮错误。\u003c/p>\n\u003cp>“先扩充可兼容的安排，再搬数据，最后收紧旧约定”是一种常见变化思路。它不保证迁移一定无停机，但能让每个过渡阶段的行为先被说明白。\u003c/p>\n\u003ch2 id=\"section-4\">新旧部分可能一段时间同时存在\u003c/h2>\n\u003cp>有的用户手机 App 还没更新，但服务端已经换成新版本。双方若还能按共同接口正常使用，就保持了某种\u003cstrong>兼容性\u003c/strong>。\u003c/p>\n\u003cp>例如新服务多返回文件夹信息，而旧客户端还能读懂文章编号；如果直接把旧字段删除，旧客户端就可能失败。所以更新还要考虑谁在使用旧约定。\u003c/p>\n\u003ch2 id=\"section-5\">旧手机没传文件夹时，谁负责兜住？\u003c/h2>\n\u003cp>旧版客户端可能仍只发送“收藏A”。新服务可以在过渡期把缺少文件夹的要求解释为“放进这个用户的未分类”，并保留旧客户端能理解的返回字段。新客户端则能传明确的文件夹。\u003c/p>\n\u003cp>如果新服务突然规定“没有文件夹就拒绝”，旧手机即使什么都没变，也会收藏失败。兼容性就是在这种新旧并存时，把旧用法如何继续工作讲清楚；它需要实际检查，不能只因为多加了一个字段就认为安全。\u003c/p>\n\u003ch2 id=\"section-6\">回到旧版本，未必能撤回所有变化\u003c/h2>\n\u003cp>把软件切回以前的版本，叫\u003cstrong>回滚\u003c/strong>。如果新版已经删除了记录，或已经向外部发出了消息，只切回旧代码未必恢复这些结果。\u003c/p>\n\u003cp>例如新版允许一篇收藏进入多个文件夹，旧版却只能理解一个位置。切回旧代码以后，多出来的关系怎样显示，必须另作决定。保留旧产物有助于退回代码，备份与恢复演练有助于恢复数据；两件事不能互相代替。\u003c/p>\n\u003cp>更新前可以让 AI 列出“旧记录怎样解释、旧客户端怎样调用、中断如何继续、退回后能读什么”。得到具体答案，再决定迁移与发布顺序，才有可检查的更新计划。\u003c/p>\n\u003cp>因此更新计划要同时考虑代码、数据、配置和外部动作。软件地图中的演进，是在变化中保住需要继续成立的行为；是否真的保住了，要靠\u003ca href=\"#/validation\">验证\u003c/a>。\u003c/p>\n","text":"软件更新了，原来的文章和收藏怎么办？ 第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。 软件变化涉及新的做事规则，也涉及已经留下的信息 。换掉代码，旧记录不会自动知道新的意思。 版本控制记住代码怎样变化 把一组代码修改保存成可识别的历史版本，便于比较、找回和协作，这种管理叫 版本控制 。Git 是常见工具。 它可以帮助找出“从哪个版本开始改变”，也可以恢复旧代码。但普通代码版本记录，不自动等于线上数据库和用户文件的备份。 迁移让旧记录适应新安排 假设新收藏记录需要“所属文件夹”。已有记录没这个栏目，可以规定它们先进入“未分类”，再让用户整理。按新规则调整已有信息的工作，叫 迁移 。 迁移可能只是加栏目，也可能需要转换内容、重新建立关系。旧资料怎样解释，要在修改前想清楚，不能靠程序随机填一个值。 给旧收藏加文件夹，怎样一步步过渡？ 下面是虚构产品的一种迁移安排，具体实现仍需结合数据量和数据库能力： 1. 先保留旧的“用户、文章”记录，增加可表达文件夹的新位置；读取时允许旧记录尚未填写，并把它显示成“未分类”。 2. 为每位用户建立自己的“未分类”文件夹，把原有收藏关联到它。迁移程序记录进度，重复执行时不应再创建一批同名文件夹或重复收藏。 3. 检查迁移前后每位用户的收藏是否仍能找到、原数量是否对应，是否有记录被放到别人的文件夹里。 4. 等新代码和数据都准备好，再逐步要求新写入遵守文件夹规则；确定旧用法已退出后，才移除过渡兼容。 这样旧记录在迁移过程中仍有明确解释，不必假装所有用户同时更新。若第2步中断，也要能从记录的进度继续，而不是从头重复造成另一轮错误。 “先扩充可兼容的安排，再搬数据，最后收紧旧约定”是一种常见变化思路。它不保证迁移一定无停机，但能让每个过渡阶段的行为先被说明白。 新旧部分可能一段时间同时存在 有的用户手机 App 还没更新，但服务端已经换成新版本。双方若还能按共同接口正常使用，就保持了某种 兼容性 。 例如新服务多返回文件夹信息，而旧客户端还能读懂文章编号；如果直接把旧字段删除，旧客户端就可能失败。所以更新还要考虑谁在使用旧约定。 旧手机没传文件夹时，谁负责兜住？ 旧版客户端可能仍只发送“收藏A”。新服务可以在过渡期把缺少文件夹的要求解释为“放进这个用户的未分类”，并保留旧客户端能理解的返回字段。新客户端则能传明确的文件夹。 如果新服务突然规定“没有文件夹就拒绝”，旧手机即使什么都没变，也会收藏失败。兼容性就是在这种新旧并存时，把旧用法如何继续工作讲清楚；它需要实际检查，不能只因为多加了一个字段就认为安全。 回到旧版本，未必能撤回所有变化 把软件切回以前的版本，叫 回滚 。如果新版已经删除了记录，或已经向外部发出了消息，只切回旧代码未必恢复这些结果。 例如新版允许一篇收藏进入多个文件夹，旧版却只能理解一个位置。切回旧代码以后，多出来的关系怎样显示，必须另作决定。保留旧产物有助于退回代码，备份与恢复演练有助于恢复数据；两件事不能互相代替。 更新前可以让 AI 列出“旧记录怎样解释、旧客户端怎样调用、中断如何继续、退回后能读什么”。得到具体答案，再决定迁移与发布顺序，才有可检查的更新计划。 因此更新计划要同时考虑代码、数据、配置和外部动作。软件地图中的演进，是在变化中保住需要继续成立的行为；是否真的保住了，要靠验证。","outline":[{"id":"section-1","title":"版本控制记住代码怎样变化","depth":2},{"id":"section-2","title":"迁移让旧记录适应新安排","depth":2},{"id":"section-3","title":"给旧收藏加文件夹，怎样一步步过渡？","depth":2},{"id":"section-4","title":"新旧部分可能一段时间同时存在","depth":2},{"id":"section-5","title":"旧手机没传文件夹时，谁负责兜住？","depth":2},{"id":"section-6","title":"回到旧版本，未必能撤回所有变化","depth":2}]},{"id":"validation","group":"evolution","title":"页面能打开，就说明软件做好了吗？","question":"页面能打开，就说明软件做好了吗？","summary":"阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。","terms":["测试","验收","不变量"],"aliases":["测试","","验收","","不变量",""],"related":["model","system-judgment"],"html":"\u003cp>阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。\u003c/p>\n\u003cp>\u003cstrong>验证，是把“我希望它怎样工作”变成可检查的结果，再观察实际是否做到\u003c/strong>。先说清预期，检查才有依据。\u003c/p>\n\u003ch2 id=\"section-1\">“能收藏”要具体到什么程度？\u003c/h2>\n\u003cp>假设我们希望：收藏后能再次找到；同一篇不会重复；别人的私密文章不能随便读。它们分别是保存、重复处理和权限方面的预期。\u003c/p>\n\u003cp>“应该很好用”很难直接判断。“收藏 A 后，再次打开我的收藏夹仍有一条 A”就能拿实际结果比较。始终需要维持的规则，也常叫\u003cstrong>不变量\u003c/strong>，例如收藏关系不能指向不存在的文章。\u003c/p>\n\u003ch2 id=\"section-2\">把收藏要求变成能实际检查的例子\u003c/h2>\n\u003cp>以下是虚构产品的预期结果表，描述应该检查什么，不表示已经执行过这些检查：\u003c/p>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>准备什么\u003c/th>\n\u003cth>做什么\u003c/th>\n\u003cth>应该观察到什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>小林账号，尚未收藏A\u003c/td>\n\u003ctd>收藏A，重新打开收藏夹\u003c/td>\n\u003ctd>有且只有一条A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同一账号另一台设备\u003c/td>\n\u003ctd>读取更新后的收藏夹\u003c/td>\n\u003ctd>能看到同一条A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已收藏A\u003c/td>\n\u003ctd>再提交相同收藏要求\u003c/td>\n\u003ctd>正式记录仍只有一条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>小周无权读私人文章A\u003c/td>\n\u003ctd>直接要求读取A\u003c/td>\n\u003ctd>被拒绝，不能拿到正文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已保存收藏，暂时收不到回复\u003c/td>\n\u003ctd>用相同操作重新确认\u003c/td>\n\u003ctd>识别原结果，不多保存一条\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>第一行若只看星星变亮就停下，还没有检查重新打开；第二行若实际上用了不同账号，也不能据此断言同步出错。测试要有明确准备条件，实际结果才有可比较的意义。\u003c/p>\n\u003cp>对“不能读取”的检查还应查看有没有返回正文，而不只是页面有没有显示。界面说拒绝、网络返回里却带着私人文章，仍然没有满足权限要求。\u003c/p>\n\u003ch2 id=\"section-3\">小部分和整条合作，要分别检查\u003c/h2>\n\u003cp>检查加入收藏的逻辑，能确认它处理某些输入时的行为；把账号、文章、保存和页面接起来检查，能看见它们有没有按约定合作。\u003c/p>\n\u003cp>最后，还要从用户入口走完整任务。程序里的小单元都正常，不保证按钮送来的信息正确，也不保证用户看到最终结果。\u003c/p>\n\u003cp>按选定条件运行软件、比较预期与实际，是\u003cstrong>测试\u003c/strong>。围绕用户目标和交付约定判断是否达标，常叫\u003cstrong>验收\u003c/strong>。检查范围要随着变动和风险选择。\u003c/p>\n\u003ch2 id=\"section-4\">失败情形，也是产品行为的一部分\u003c/h2>\n\u003cp>文章不存在、没有权限、网络中断时，应该显示什么、是否留下错误记录？这些也需要预期。只检查最顺利的一条路，会漏掉软件使用中常见的限制。\u003c/p>\n\u003cp>更新时还要检查原来能用的任务是否仍可用。这能发现\u003ca href=\"#/dependency\">依赖\u003c/a>带来的意外影响。\u003c/p>\n\u003ch2 id=\"section-5\">三种“通过”，分别说明了多少？\u003c/h2>\n\u003cp>设收藏处理单元在准备好的输入下返回成功，这支持它的某段规则可用；把账号、存储和接口连接后正式记录正确，才支持它们能合作；从真实页面完成收藏、刷新和跨设备读取，又多检查了用户入口与交接。\u003c/p>\n\u003cp>若发生“规则测试通过，页面按钮却把文章B的编号传成A”，前一种通过并不能挡住这个错误。这就是为什么要按风险选择多种检查，而不是只把某个测试次数当作完成证明。\u003c/p>\n\u003cp>换成AI摘要，还要同时看“有没有返回文字”和“是否准确保留原文事实”。流畅、非空、能显示只是部分结果；可以选有已知关键信息的文章，让检查者对照来源，看是否遗漏或编造。对不确定任务要保留判断依据，不能让另一个模型一句“合格”替代全部证据。\u003c/p>\n\u003ch2 id=\"section-6\">一次通过，有什么实际含义？\u003c/h2>\n\u003cp>它说明在已经检查的条件下，结果符合预期。没有检查的设备、数据或并发情况，仍可能有问题。因此需要结合运行中的\u003ca href=\"#/observability\">证据\u003c/a>，持续判断。\u003c/p>\n\u003cp>AI 说“已完成”，是一项待核实的陈述。软件世界模型帮助你提出该检查什么，实际结果才帮助你判断它做到了什么。\u003c/p>\n","text":"页面能打开，就说明软件做好了吗？ 阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。 验证，是把“我希望它怎样工作”变成可检查的结果，再观察实际是否做到 。先说清预期，检查才有依据。 “能收藏”要具体到什么程度？ 假设我们希望：收藏后能再次找到；同一篇不会重复；别人的私密文章不能随便读。它们分别是保存、重复处理和权限方面的预期。 “应该很好用”很难直接判断。“收藏 A 后，再次打开我的收藏夹仍有一条 A”就能拿实际结果比较。始终需要维持的规则，也常叫 不变量 ，例如收藏关系不能指向不存在的文章。 把收藏要求变成能实际检查的例子 以下是虚构产品的预期结果表，描述应该检查什么，不表示已经执行过这些检查： 准备什么 做什么 应该观察到什么 --- --- --- 小林账号，尚未收藏A 收藏A，重新打开收藏夹 有且只有一条A 同一账号另一台设备 读取更新后的收藏夹 能看到同一条A 已收藏A 再提交相同收藏要求 正式记录仍只有一条 小周无权读私人文章A 直接要求读取A 被拒绝，不能拿到正文 已保存收藏，暂时收不到回复 用相同操作重新确认 识别原结果，不多保存一条 第一行若只看星星变亮就停下，还没有检查重新打开；第二行若实际上用了不同账号，也不能据此断言同步出错。测试要有明确准备条件，实际结果才有可比较的意义。 对“不能读取”的检查还应查看有没有返回正文，而不只是页面有没有显示。界面说拒绝、网络返回里却带着私人文章，仍然没有满足权限要求。 小部分和整条合作，要分别检查 检查加入收藏的逻辑，能确认它处理某些输入时的行为；把账号、文章、保存和页面接起来检查，能看见它们有没有按约定合作。 最后，还要从用户入口走完整任务。程序里的小单元都正常，不保证按钮送来的信息正确，也不保证用户看到最终结果。 按选定条件运行软件、比较预期与实际，是 测试 。围绕用户目标和交付约定判断是否达标，常叫 验收 。检查范围要随着变动和风险选择。 失败情形，也是产品行为的一部分 文章不存在、没有权限、网络中断时，应该显示什么、是否留下错误记录？这些也需要预期。只检查最顺利的一条路，会漏掉软件使用中常见的限制。 更新时还要检查原来能用的任务是否仍可用。这能发现依赖带来的意外影响。 三种“通过”，分别说明了多少？ 设收藏处理单元在准备好的输入下返回成功，这支持它的某段规则可用；把账号、存储和接口连接后正式记录正确，才支持它们能合作；从真实页面完成收藏、刷新和跨设备读取，又多检查了用户入口与交接。 若发生“规则测试通过，页面按钮却把文章B的编号传成A”，前一种通过并不能挡住这个错误。这就是为什么要按风险选择多种检查，而不是只把某个测试次数当作完成证明。 换成AI摘要，还要同时看“有没有返回文字”和“是否准确保留原文事实”。流畅、非空、能显示只是部分结果；可以选有已知关键信息的文章，让检查者对照来源，看是否遗漏或编造。对不确定任务要保留判断依据，不能让另一个模型一句“合格”替代全部证据。 一次通过，有什么实际含义？ 它说明在已经检查的条件下，结果符合预期。没有检查的设备、数据或并发情况，仍可能有问题。因此需要结合运行中的证据，持续判断。 AI 说“已完成”，是一项待核实的陈述。软件世界模型帮助你提出该检查什么，实际结果才帮助你判断它做到了什么。","outline":[{"id":"section-1","title":"“能收藏”要具体到什么程度？","depth":2},{"id":"section-2","title":"把收藏要求变成能实际检查的例子","depth":2},{"id":"section-3","title":"小部分和整条合作，要分别检查","depth":2},{"id":"section-4","title":"失败情形，也是产品行为的一部分","depth":2},{"id":"section-5","title":"三种“通过”，分别说明了多少？","depth":2},{"id":"section-6","title":"一次通过，有什么实际含义？","depth":2}]},{"id":"model","group":"ai","title":"AI 在软件里负责什么，其他部分还用来做什么？","question":"AI 在软件里负责什么，其他部分还用来做什么？","summary":"阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。","terms":["模型推理","上下文","检索","RAG"],"aliases":["模型推理","Inference","上下文","","检索","Retrieval","RAG","Retrieval augmented generation"],"related":["agent","state"],"html":"\u003cp>阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。\u003c/p>\n\u003cp>\u003cstrong>AI 模型可以作为软件中的一项能力，负责理解、生成或选择；整个产品还需要其他部分组织这项能力。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">模型吃进材料，给出输出\u003c/h2>\n\u003cp>假设软件把文章正文和“写三句话摘要”的要求交给模型。模型根据这些输入，生成一段文字。使用训练好的模型处理输入、产生输出，这个过程叫\u003cstrong>推理\u003c/strong>。\u003c/p>\n\u003cp>模型这次实际得到的要求、正文、对话等材料，叫\u003cstrong>上下文\u003c/strong>。如果文章根本没被送进去，模型就不能据此准确概括那篇文章，可能只能根据已有输入和训练中形成的能力猜测。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgODA2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuaooeWei+i+k+WFpei+k+WHuuWSjOS6p+WTgeiusOW9leWIhuW8gCI+PHRpdGxlPuaooeWei+i+k+WFpei+k+WHuuWSjOS6p+WTgeiusOW9leWIhuW8gDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4MDYiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuS6p+WTgeWFiOWHhuWkh+i/measoeadkOaWmTwvdGV4dD48cmVjdCB4PSI2NiIgeT0iNzYiIHdpZHRoPSI3MCIgaGVpZ2h0PSIxMDUiIHJ4PSI0IiBmaWxsPSIjZmZmZGY5IiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxwYXRoIGQ9Ik03NiA5NCBMMTI2IDk0IiBmaWxsPSJub25lIiBzdHJva2U9IiMyNzhkN2YiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cGF0aCBkPSJNNzYgMTA2IEwxMjYgMTA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YmI3YWMiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cGF0aCBkPSJNNzYgMTE4IEwxMTggMTE4IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YmI3YWMiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cmVjdCB4PSIxNzMiIHk9Ijg5IiB3aWR0aD0iMTY4IiBoZWlnaHQ9IjcwIiByeD0iNSIgZmlsbD0iI2RjZWVlNyIgc3Ryb2tlPSIjMTgzZDNhIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSIyNTciIHk9IjExOSIgZm9udC1zaXplPSIyMiIgZmlsbD0iIzE4M2QzYSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9u ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuaWh+eroCAvIOaUtuiXjyAvIOWOhuWPsjwvdGV4dD48L2c+PC9zdmc+\" alt=\"文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-2\">把一次摘要的材料和结果摆出来\u003c/h2>\n\u003cp>下面的短文和输出都是为讲解编写的示意，并不是一次真实模型测试：\u003c/p>\n\u003cblockquote>\n\u003cp>原文：周六上午在城北公园徒步，路线约两小时。下午可能下雨。集合时间尚未确定。\u003c/p>\n\u003cp>要求：概括活动安排，保留不确定信息，不补充原文没有的时间。\u003c/p>\n\u003c/blockquote>\n\u003cp>软件先取得这份正文，再与要求一起交给模型。假设返回“周六上午城北徒步约两小时，下午可能下雨，集合时间待定”，就能逐项对照材料。\u003c/p>\n\u003cp>如果候选摘要写成“周六9点集合”，即使读起来顺畅，也增加了原文没有的事实。产品需要按任务检查，并可能请人核对或重新生成；把同一段话保存到数据库，不会使它因此变真。\u003c/p>\n\u003cp>这里的原理是：\u003cstrong>模型依据这次实际得到的材料生成候选结果，软件还要负责材料是否齐全、结果是否适合使用\u003c/strong>。如果只提供文章标题，或者长文只取了前半段，就不能把输出当成读过全文的证明。\u003c/p>\n\u003ch2 id=\"section-3\">三种“记忆”先分开看\u003c/h2>\n\u003cp>训练使模型形成了处理语言和信息的能力，但不等于它记住了你产品数据库里的每条私人记录。这次提供的上下文让它接触具体材料；产品里的数据库则保留文章、收藏和历史结果。\u003c/p>\n\u003cp>所以一个聊天产品“下次还记得你说过什么”，可能是产品保存了对话，下次重新提供给模型。不能直接推断模型自身永久记住了这些话。\u003c/p>\n\u003ch2 id=\"section-4\">材料太多时，先找到相关的\u003c/h2>\n\u003cp>如果收藏有上万篇，通常不必每次都把全文全部送给模型。软件可以先查出与问题相关的文章，再提供给模型。这一步叫\u003cstrong>检索\u003c/strong>。\u003c/p>\n\u003cp>把检索所得材料交给模型辅助生成，常见名称是 RAG。它让模型有机会依据指定资料回答，但资料没找对、理解错误或输出编造仍可能发生。提供来源不自动保证答案正确。\u003c/p>\n\u003ch2 id=\"section-5\">检索怎样把“我的资料”接进来？\u003c/h2>\n\u003cp>假设你问“我收藏的旅行文章里，哪些提到下雨”。一种流程是：先按当前账号和权限查收藏，在能访问的文章里找相关段落，保留对应文章编号，再把问题和这些段落一起提供给模型。\u003c/p>\n\u003cp>模型看到资料以后，可以组织答案；软件再把文章入口与回答一起显示，让你回看原文。来源入口应由软件绑定到真正取出的记录，不能只让模型随手编一个看起来合理的网址。\u003c/p>\n\u003cp>如果检索没找出相关段落，模型这次就缺少依据。产品可以明确说明“没有在这次找到的材料中发现”，而不能据此断言全部收藏都没有。找到了包含“雨”的段落，也不代表一定相关，还要看它在说旅行天气还是别的事。\u003c/p>\n\u003cp>换成个人账单或公司制度，同样需要先处理访问范围、取出材料、提供上下文和核对结果。RAG改变的是模型获得本次资料的路径，并不会自动保证每次都找全、理解对、回答准。\u003c/p>\n\u003ch2 id=\"section-6\">一次模型回答，还不是完整的产品动作\u003c/h2>\n\u003cp>生成摘要后，软件仍要决定把结果显示在哪里、是否保存、谁能看、失败时怎么办。重要输出也需要适合任务的检查，不能仅因文字流畅就当成事实。\u003c/p>\n\u003cp>因此 AI 软件仍然需要程序、状态、接口、权限与验证。模型在地图中增加一种能力；如果还让模型决定下一步去做什么，就进入\u003ca href=\"#/agent\">Agent\u003c/a>的结构。\u003c/p>\n","text":"AI 在软件里负责什么，其他部分还用来做什么？ 阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。 AI 模型可以作为软件中的一项能力，负责理解、生成或选择；整个产品还需要其他部分组织这项能力。 模型吃进材料，给出输出 假设软件把文章正文和“写三句话摘要”的要求交给模型。模型根据这些输入，生成一段文字。使用训练好的模型处理输入、产生输出，这个过程叫 推理 。 模型这次实际得到的要求、正文、对话等材料，叫 上下文 。如果文章根本没被送进去，模型就不能据此准确概括那篇文章，可能只能根据已有输入和训练中形成的能力猜测。 文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。 把一次摘要的材料和结果摆出来 下面的短文和输出都是为讲解编写的示意，并不是一次真实模型测试： > 原文：周六上午在城北公园徒步，路线约两小时。下午可能下雨。集合时间尚未确定。 > > 要求：概括活动安排，保留不确定信息，不补充原文没有的时间。 软件先取得这份正文，再与要求一起交给模型。假设返回“周六上午城北徒步约两小时，下午可能下雨，集合时间待定”，就能逐项对照材料。 如果候选摘要写成“周六9点集合”，即使读起来顺畅，也增加了原文没有的事实。产品需要按任务检查，并可能请人核对或重新生成；把同一段话保存到数据库，不会使它因此变真。 这里的原理是： 模型依据这次实际得到的材料生成候选结果，软件还要负责材料是否齐全、结果是否适合使用 。如果只提供文章标题，或者长文只取了前半段，就不能把输出当成读过全文的证明。 三种“记忆”先分开看 训练使模型形成了处理语言和信息的能力，但不等于它记住了你产品数据库里的每条私人记录。这次提供的上下文让它接触具体材料；产品里的数据库则保留文章、收藏和历史结果。 所以一个聊天产品“下次还记得你说过什么”，可能是产品保存了对话，下次重新提供给模型。不能直接推断模型自身永久记住了这些话。 材料太多时，先找到相关的 如果收藏有上万篇，通常不必每次都把全文全部送给模型。软件可以先查出与问题相关的文章，再提供给模型。这一步叫 检索 。 把检索所得材料交给模型辅助生成，常见名称是 RAG。它让模型有机会依据指定资料回答，但资料没找对、理解错误或输出编造仍可能发生。提供来源不自动保证答案正确。 检索怎样把“我的资料”接进来？ 假设你问“我收藏的旅行文章里，哪些提到下雨”。一种流程是：先按当前账号和权限查收藏，在能访问的文章里找相关段落，保留对应文章编号，再把问题和这些段落一起提供给模型。 模型看到资料以后，可以组织答案；软件再把文章入口与回答一起显示，让你回看原文。来源入口应由软件绑定到真正取出的记录，不能只让模型随手编一个看起来合理的网址。 如果检索没找出相关段落，模型这次就缺少依据。产品可以明确说明“没有在这次找到的材料中发现”，而不能据此断言全部收藏都没有。找到了包含“雨”的段落，也不代表一定相关，还要看它在说旅行天气还是别的事。 换成个人账单或公司制度，同样需要先处理访问范围、取出材料、提供上下文和核对结果。RAG改变的是模型获得本次资料的路径，并不会自动保证每次都找全、理解对、回答准。 一次模型回答，还不是完整的产品动作 生成摘要后，软件仍要决定把结果显示在哪里、是否保存、谁能看、失败时怎么办。重要输出也需要适合任务的检查，不能仅因文字流畅就当成事实。 因此 AI 软件仍然需要程序、状态、接口、权限与验证。模型在地图中增加一种能力；如果还让模型决定下一步去做什么，就进入Agent的结构。","outline":[{"id":"section-1","title":"模型吃进材料，给出输出","depth":2},{"id":"section-2","title":"把一次摘要的材料和结果摆出来","depth":2},{"id":"section-3","title":"三种“记忆”先分开看","depth":2},{"id":"section-4","title":"材料太多时，先找到相关的","depth":2},{"id":"section-5","title":"检索怎样把“我的资料”接进来？","depth":2},{"id":"section-6","title":"一次模型回答，还不是完整的产品动作","depth":2}]},{"id":"agent","group":"ai","title":"聊天 AI 怎样变成能替你做事的助手？","question":"聊天 AI 怎样变成能替你做事的助手？","summary":"你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。","terms":["Agent","工作流","工具","宿主"],"aliases":["Agent","","工作流","Workflow","工具","","宿主",""],"related":["trust","failure"],"html":"\u003cp>你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。\u003c/p>\n\u003cp>\u003cstrong>Agent 可以先理解成：让模型参与决定后续行动，并根据执行结果继续工作的系统\u003c/strong>。它需要模型之外的执行能力。\u003c/p>\n\u003ch2 id=\"section-1\">从建议到行动，中间还要有人执行\u003c/h2>\n\u003cp>模型可以提出“查询旅行文章”。真正查询数据库的，是软件提供的查询能力。供助手调用的具体能力，常叫\u003cstrong>工具\u003c/strong>，例如查找文章、读取正文。\u003c/p>\n\u003cp>把模型、工具、权限和运行过程组织起来的程序，可以叫\u003cstrong>宿主\u003c/strong>。模型输出一个行动要求，宿主检查并调用工具，再把结果给模型看。仅输出“已删除文章”，不等于真的执行了删除。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNzA5IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuaooeWei+WGs+WumuOAgeadg+mZkOajgOafpeOAgeW3peWFt+aJp+ihjOS4juWPjemmiCI+PHRpdGxlPuaooeWei+WGs+WumuOAgeadg+mZkOajgOafpeOAgeW3peWFt+aJp+ihjOS4juWPjemmiDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI3MDkiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuagueaNruadkOaWme+8jOWGs+WumuS4i+S4gOatpTwvdGV4dD48cmVjdCB4PSIxNDgiIHk9IjcxIiB3aWR0aD0iMTA0IiBoZWlnaHQ9Ijg4IiByeD0iMTQiIGZpbGw9IiNkY2VlZTciIHN0cm9rZT0iIzE4M2QzYSIgc3Ryb2tlLXdpZHRoPSIyIi8+PHBhdGggZD0iTTE 定工作流和 Agent 怎样区分？\u003c/h2>\n\u003cp>如果顺序事先规定为“收到文章→生成摘要→保存”，路径主要由软件预先安排，通常称为\u003cstrong>工作流\u003c/strong>。\u003c/p>\n\u003cp>如果某些后续步骤由模型根据结果动态选择，就更接近 Agent。真实产品可以组合两者：外层保持固定审核流程，里面允许模型选择查询方式。自主程度有高有低，并非每个 AI 产品都需要同样自由度。\u003c/p>\n\u003ch2 id=\"section-5\">能做事，也要知道哪些事不能做\u003c/h2>\n\u003cp>读文章和删除全部收藏，是不同权限。工具范围、访问身份和重要动作的确认，应由系统落实。模型的判断不能替代执行位置的\u003ca href=\"#/trust\">权限检查\u003c/a>。\u003c/p>\n\u003cp>假如目标改成“删除所有无关文章”，一次判断错误的代价就更高。可以先只生成拟删除清单和理由，让你检查后再执行，并由执行程序核对确认是否对应同一清单。只在聊天里说一句“需要谨慎”，没有改变工具的权限或执行条件。\u003c/p>\n\u003cp>设计助手时，可以让 AI 展示一轮真实交接的格式：它能提出什么行动，程序怎样判断允许，工具会回哪些结果，什么时候交还给人。把这一轮说明白，再决定允许重复多少轮、开放哪些动作。\u003c/p>\n\u003cp>Agent 把决定、执行和反馈连接成循环；它依然有\u003ca href=\"#/state\">状态\u003c/a>、\u003ca href=\"#/time\">等待\u003c/a>、失败和成本。这也是为什么“接一个模型”与“做一个可靠助手”之间，还有许多普通软件工作。\u003c/p>\n","text":"聊天 AI 怎样变成能替你做事的助手？ 你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。 Agent 可以先理解成：让模型参与决定后续行动，并根据执行结果继续工作的系统 。它需要模型之外的执行能力。 从建议到行动，中间还要有人执行 模型可以提出“查询旅行文章”。真正查询数据库的，是软件提供的查询能力。供助手调用的具体能力，常叫 工具 ，例如查找文章、读取正文。 把模型、工具、权限和运行过程组织起来的程序，可以叫 宿主 。模型输出一个行动要求，宿主检查并调用工具，再把结果给模型看。仅输出“已删除文章”，不等于真的执行了删除。 模型根据已有材料提出查询行动；执行程序先检查权限，再调用查找工具；实际找到的文章回到模型，成为下一次判断的材料。检查不通过时，行动不能直接执行。 反馈让下一步可以改变 第一次查询找到20篇，模型可能只读其中几篇；如果没找到，它可能换搜索词。它根据新结果调整行动，而不是只在开头生成一段长计划。 这个循环需要明确什么时候停止：已经完成、没有可用资料、遇到错误，或者达到步数和资源限制。否则系统可能一直查下去，却没有更有用的结果。 跟完一次“找文章，再整理”的循环 以下是虚构且预设的过程，用来展示交接，不代表真实模型一定选择这些步骤： 1. 你要求“从我的收藏找雨天旅行建议”。软件把目标、允许使用的查询工具和停止限制交给模型。 2. 模型提出搜索“旅行 下雨”。宿主核对当前账号和工具权限，真正调用查询，得到三条编号和简介：A17徒步天气、A28雨天室内去处、A31另一个无关话题。 3. 查询结果作为新材料交回模型。模型根据简介选择读A17和A28，提出读取要求；宿主再次核对各篇可访问，再取得正文。 4. 若A28已删除，工具返回“不可用”。模型收到的就是这份失败结果，应继续依据A17作有限回答、换一篇查找，或说明资料不足，不能把没读到的内容写成已确认事实。 5. 得到可用正文后，模型组织答案。软件把实际读取过的文章入口与结果交给你，并结束这次工作。 每一轮都有“提出行动、检查、执行、返回新材料”，后一个判断依赖前一轮实际结果。列一份五步计划却没有调用任何工具，和这条循环并不相同。 如果查询始终找不到，或已经达到允许的步数、时间或花费范围，宿主也要能让循环停止。不能只靠模型一开始答应“我会适可而止”。 固定工作流和 Agent 怎样区分？ 如果顺序事先规定为“收到文章→生成摘要→保存”，路径主要由软件预先安排，通常称为 工作流 。 如果某些后续步骤由模型根据结果动态选择，就更接近 Agent。真实产品可以组合两者：外层保持固定审核流程，里面允许模型选择查询方式。自主程度有高有低，并非每个 AI 产品都需要同样自由度。 能做事，也要知道哪些事不能做 读文章和删除全部收藏，是不同权限。工具范围、访问身份和重要动作的确认，应由系统落实。模型的判断不能替代执行位置的权限检查。 假如目标改成“删除所有无关文章”，一次判断错误的代价就更高。可以先只生成拟删除清单和理由，让你检查后再执行，并由执行程序核对确认是否对应同一清单。只在聊天里说一句“需要谨慎”，没有改变工具的权限或执行条件。 设计助手时，可以让 AI 展示一轮真实交接的格式：它能提出什么行动，程序怎样判断允许，工具会回哪些结果，什么时候交还给人。把这一轮说明白，再决定允许重复多少轮、开放哪些动作。 Agent 把决定、执行和反馈连接成循环；它依然有状态、等待、失败和成本。这也是为什么“接一个模型”与“做一个可靠助手”之间，还有许多普通软件工作。","outline":[{"id":"section-1","title":"从建议到行动，中间还要有人执行","depth":2},{"id":"section-2","title":"反馈让下一步可以改变","depth":2},{"id":"section-3","title":"跟完一次“找文章，再整理”的循环","depth":2},{"id":"section-4","title":"固定工作流和 Agent 怎样区分？","depth":2},{"id":"section-5","title":"能做事，也要知道哪些事不能做","depth":2}]},{"id":"system-judgment","group":"ai","title":"有了这张地图，怎样更清楚地和 AI 讨论软件？","question":"有了这张地图，怎样更清楚地和 AI 讨论软件？","summary":"你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。","terms":["设计约定","取舍"],"aliases":["设计约定","","取舍",""],"related":["world-map","boundaries"],"html":"\u003cp>你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。\u003c/p>\n\u003cp>下面是一个虚构设计例子。它展示思考过程，不代表已经做出的产品或成功结果。\u003c/p>\n\u003ch2 id=\"section-1\">第一版想法：一个页面接上 AI\u003c/h2>\n\u003cp>我们的目标是：放入文章、收藏、生成摘要，手机和电脑都能再次找到。最开始的要求可能只有：“帮我做个漂亮页面，把文章发给模型，显示摘要。”\u003c/p>\n\u003cp>这个想法讲清了可见的一段过程，但还没说清文章和收藏要保存在哪里、谁可以读、生成失败怎么办。AI 即使完成字面要求，产品也可能缺少你需要的行为。\u003c/p>\n\u003ch2 id=\"section-2\">顺着地图，补上几条关键关系\u003c/h2>\n\u003cp>先看记事：文章、收藏和摘要都是下次可能还需要的内容，不能只存在本次页面的临时记忆里。\u003c/p>\n\u003cp>再看合作：手机和电脑需要访问同一份账号下的记录，或者有明确同步办法；模型要得到文章正文，软件要负责提供这些材料。\u003c/p>\n\u003cp>再看分工和信任：文章管理负责保存与取出，摘要部分负责模型调用；谁能访问私人文章，要在实际读取的位置检查。\u003c/p>\n\u003cp>最后看持续可用：模型没有回复时，原文章仍可阅读，界面要说明摘要未完成。这些判断分别来自状态、通信、边界、权限和失败，互相连成一个产品。\u003c/p>\n\u003ch2 id=\"section-3\">修订后的设想，已经能具体讨论\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工作\u003c/th>\n\u003cth>明确安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>保存\u003c/td>\n\u003ctd>每个账号的文章与收藏保留在共享记录里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成\u003c/td>\n\u003ctd>取正文，提供给模型，接收摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显示\u003c/td>\n\u003ctd>区分生成中、成功与失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限\u003c/td>\n\u003ctd>读取和修改前检查当前用户能否操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失败\u003c/td>\n\u003ctd>摘要失败不删除文章，允许合理重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检查\u003c/td>\n\u003ctd>收藏后另一设备能找到；无权限不能读取；失败提示成立\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>现在可以向 AI 说明这些行为，再让它实现。各部分不必一开始就拆成独立服务；要先把职责和规则讲清。\u003c/p>\n\u003cp>这份结果可以叫设计约定：实现和检查时共同参照的行为说明。要选择放在哪、用什么工具、怎样安排等待，就需要权衡方便、成本和限制，这叫取舍。\u003c/p>\n\u003ch2 id=\"section-4\">把一条设想，走到可验收的结果\u003c/h2>\n\u003cp>从表里选“收藏后另一设备能找到”，继续展开这条虚构设计：手机提交文章编号，服务端核实账号和权限，保存收藏，再返回结果；电脑用同一账号读取更新后的清单，显示这篇文章。\u003c/p>\n\u003cp>现在就能检查几种改变后的情况：电脑没刷新时是否暂时保留旧列表；手机没收到回复时是否能够重新确认；同一要求发两次是否仍只有一条。若“跨设备”是必需，这些才是围绕目标的具体约定。\u003c/p>\n\u003cp>可以把给AI的要求改写成这样：\u003c/p>\n\u003cblockquote>\n\u003cp>用户登录后能收藏有权阅读的文章。收藏记录归当前账号所有，同一用户与文章不重复。另一设备用同一账号重新读取时能看到已保存收藏。等待、拒绝和结果待确认应分别显示。请实现这条完整过程，并给出刷新、跨设备、重复要求和无权限场景的实际检查结果。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段要求没有替开发者指定数据库品牌或每个函数名称，但已经定义了输入、负责的工作、应保持的关系和检查结果。实现者可以提出不同方案，你也有依据比较它们。\u003c/p>\n\u003ch2 id=\"section-5\">如果时间和资源有限，先保住什么？\u003c/h2>\n\u003cp>假设我们先交付“收藏、再次打开、跨设备读取”，把AI摘要放到之后。这样能先验证文章与账号记录确实能保留，再接入生成能力；它是按当前目标做的范围选择，不是所有软件都必须按这个顺序。\u003c/p>\n\u003cp>若做的是一次性活动摘要，保存历史可能反而不是最先要做的。取舍要回到谁使用、哪件事必须完成、失败代价多大，而不是照着世界地图每一格都堆功能。\u003c/p>\n\u003ch2 id=\"section-6\">换一个产品，同样的问题会得出不同安排\u003c/h2>\n\u003cp>如果目标改成“仅在本机使用的离线阅读器”，可以把文章和收藏放在本机，省去跨设备共享。但若还要调用远处 AI，生成这部分仍需要联网；要完全离线，就要另行考虑本机可用的模型能力。\u003c/p>\n\u003cp>你没有照抄上一张组件清单，而是根据目标改变了安排。世界模型的价值就在这里：你能解释为什么需要某个部分，也能解释为什么这次可以省去它。\u003c/p>\n\u003cp>最后仍要看实际结果。概念清楚可以改善要求和判断，可靠软件还要靠实现、\u003ca href=\"#/validation\">验证\u003c/a>和运行证据。\u003c/p>\n","text":"有了这张地图，怎样更清楚地和 AI 讨论软件？ 你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。 下面是一个虚构设计例子。它展示思考过程，不代表已经做出的产品或成功结果。 第一版想法：一个页面接上 AI 我们的目标是：放入文章、收藏、生成摘要，手机和电脑都能再次找到。最开始的要求可能只有：“帮我做个漂亮页面，把文章发给模型，显示摘要。” 这个想法讲清了可见的一段过程，但还没说清文章和收藏要保存在哪里、谁可以读、生成失败怎么办。AI 即使完成字面要求，产品也可能缺少你需要的行为。 顺着地图，补上几条关键关系 先看记事：文章、收藏和摘要都是下次可能还需要的内容，不能只存在本次页面的临时记忆里。 再看合作：手机和电脑需要访问同一份账号下的记录，或者有明确同步办法；模型要得到文章正文，软件要负责提供这些材料。 再看分工和信任：文章管理负责保存与取出，摘要部分负责模型调用；谁能访问私人文章，要在实际读取的位置检查。 最后看持续可用：模型没有回复时，原文章仍可阅读，界面要说明摘要未完成。这些判断分别来自状态、通信、边界、权限和失败，互相连成一个产品。 修订后的设想，已经能具体讨论 工作 明确安排 --- --- 保存 每个账号的文章与收藏保留在共享记录里 生成 取正文，提供给模型，接收摘要 显示 区分生成中、成功与失败 权限 读取和修改前检查当前用户能否操作 失败 摘要失败不删除文章，允许合理重试 检查 收藏后另一设备能找到；无权限不能读取；失败提示成立 现在可以向 AI 说明这些行为，再让它实现。各部分不必一开始就拆成独立服务；要先把职责和规则讲清。 这份结果可以叫设计约定：实现和检查时共同参照的行为说明。要选择放在哪、用什么工具、怎样安排等待，就需要权衡方便、成本和限制，这叫取舍。 把一条设想，走到可验收的结果 从表里选“收藏后另一设备能找到”，继续展开这条虚构设计：手机提交文章编号，服务端核实账号和权限，保存收藏，再返回结果；电脑用同一账号读取更新后的清单，显示这篇文章。 现在就能检查几种改变后的情况：电脑没刷新时是否暂时保留旧列表；手机没收到回复时是否能够重新确认；同一要求发两次是否仍只有一条。若“跨设备”是必需，这些才是围绕目标的具体约定。 可以把给AI的要求改写成这样： > 用户登录后能收藏有权阅读的文章。收藏记录归当前账号所有，同一用户与文章不重复。另一设备用同一账号重新读取时能看到已保存收藏。等待、拒绝和结果待确认应分别显示。请实现这条完整过程，并给出刷新、跨设备、重复要求和无权限场景的实际检查结果。 这段要求没有替开发者指定数据库品牌或每个函数名称，但已经定义了输入、负责的工作、应保持的关系和检查结果。实现者可以提出不同方案，你也有依据比较它们。 如果时间和资源有限，先保住什么？ 假设我们先交付“收藏、再次打开、跨设备读取”，把AI摘要放到之后。这样能先验证文章与账号记录确实能保留，再接入生成能力；它是按当前目标做的范围选择，不是所有软件都必须按这个顺序。 若做的是一次性活动摘要，保存历史可能反而不是最先要做的。取舍要回到谁使用、哪件事必须完成、失败代价多大，而不是照着世界地图每一格都堆功能。 换一个产品，同样的问题会得出不同安排 如果目标改成“仅在本机使用的离线阅读器”，可以把文章和收藏放在本机，省去跨设备共享。但若还要调用远处 AI，生成这部分仍需要联网；要完全离线，就要另行考虑本机可用的模型能力。 你没有照抄上一张组件清单，而是根据目标改变了安排。世界模型的价值就在这里：你能解释为什么需要某个部分，也能解释为什么这次可以省去它。 最后仍要看实际结果。概念清楚可以改善要求和判断，可靠软件还要靠实现、验证和运行证据。","outline":[{"id":"section-1","title":"第一版想法：一个页面接上 AI","depth":2},{"id":"section-2","title":"顺着地图，补上几条关键关系","depth":2},{"id":"section-3","title":"修订后的设想，已经能具体讨论","depth":2},{"id":"section-4","title":"把一条设想，走到可验收的结果","depth":2},{"id":"section-5","title":"如果时间和资源有限，先保住什么？","depth":2},{"id":"section-6","title":"换一个产品，同样的问题会得出不同安排","depth":2}]},{"id":"glossary","group":"reference","title":"遇到陌生名词，来这里查一句解释","question":"遇到陌生名词，来这里查一句解释","summary":"术语索引提供简短定义、别名和唯一正文入口。","terms":[],"aliases":[],"related":["world-map","sources"],"html":"\u003cp>不用从头读完，也不用背这些词。阅读时遇到陌生名字，再到这里看一句普通话解释；点击右侧文章，可以跟着例子看它怎样工作。英文名字也可以直接搜索。\u003c/p>\n\u003ch2 id=\"section-1\">整体地图\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>软件世界模型\u003c/td>\n\u003ctd>把软件怎样做事、记事和合作连成一张脑中的地图。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">你点一下，软件里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-2\">计算与运行\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>程序\u003c/td>\n\u003ctd>让电脑执行的一套规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>函数\u003c/td>\n\u003ctd>有名字、能被其他地方调用的一项工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>副作用 · Side effect\u003c/td>\n\u003ctd>处理时还改变了外部东西，例如写入文件。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行时 · Runtime\u003c/td>\n\u003ctd>让某种语言的代码能执行的支持。\u003c/td>\n\u003ctd>\u003ca href=\"#/runtime\">代码放在那里，为什么软件还没开始工作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>进程 · Process\u003c/td>\n\u003ctd>一份正在进行的程序运行活动。\u003c/td>\n\u003ctd>\u003ca href=\"#/runtime\">代码放在那里，为什么软件还没开始工作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>处理器\u003c/td>\n\u003ctd>执行指令并推进计算的硬件。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内存\u003c/td>\n\u003ctd>程序运行时，放眼前数据的快速空间。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>操作系统\u003c/td>\n\u003ctd>安排程序使用计算、内存、文件和网络的基础软件。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>算法\u003c/td>\n\u003ctd>解决一类问题的计算步骤。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二分查找\u003c/td>\n\u003ctd>在已经排好顺序的范围里，每次比较后排除一半，继续找目标。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据结构\u003c/td>\n\u003ctd>把信息摆成怎样的形式，方便以后操作。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>复杂度 · Complexity\u003c/td>\n\u003ctd>信息数量变大时，工作量怎样增长。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-3\">数据与状态\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>实体\u003c/td>\n\u003ctd>需要独立辨认的对象，例如某个用户或某篇文章。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标识\u003c/td>\n\u003ctd>辨认具体对象的值，例如文章的编号。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>约束\u003c/td>\n\u003ctd>记录必须符合的规则，例如编号不能重复。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态 · State\u003c/td>\n\u003ctd>已经留下、会影响下一次行为的信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生命周期\u003c/td>\n\u003ctd>信息从出现到变化，再到失效或删除的过程。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>派生状态\u003c/td>\n\u003ctd>从已有信息算出来的结果，例如收藏篇数。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库 · Database\u003c/td>\n\u003ctd>帮助程序组织、查找和修改记录的软件。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对象存储\u003c/td>\n\u003ctd>整份保存图片、文档等内容，再凭标识取回的服务。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存 · Cache\u003c/td>\n\u003ctd>把可重新取得的结果留在手边，减少重复工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一致性 · Consistency\u003c/td>\n\u003ctd>多份记录或显示需要满足怎样的关系。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事务\u003c/td>\n\u003ctd>一组相关修改一起提交，或者一起不留下。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原子性 · Atomicity\u003c/td>\n\u003ctd>一组修改作为一个整体成立或不成立；不会只留下其中一部分正式结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本号\u003c/td>\n\u003ctd>标记一份内容改到了哪一版，也能帮助发现保存时所依据的旧版已被改变。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冲突\u003c/td>\n\u003ctd>多次修改或不同信息彼此不能同时满足预期关系。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-4\">通信与协作\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户端\u003c/td>\n\u003ctd>一次交互中发起请求或使用服务的一方。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务端\u003c/td>\n\u003ctd>一次交互中提供服务、响应请求的一方。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端\u003c/td>\n\u003ctd>接近用户呈现和交互的职责部分。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端\u003c/td>\n\u003ctd>承担服务处理、共享规则与数据能力的职责部分。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口 · Interface\u003c/td>\n\u003ctd>能要求对方做什么、要给什么、会得到什么的约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API · Application Programming Interface\u003c/td>\n\u003ctd>供程序使用的接口。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协议\u003c/td>\n\u003ctd>交换信息与协作时遵守的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据流\u003c/td>\n\u003ctd>材料来自哪里，怎样改变，最后用在哪里。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制流\u003c/td>\n\u003ctd>什么事情让某个动作开始、继续或分支。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事件\u003c/td>\n\u003ctd>系统记录或通知某件事情已经发生的信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同步\u003c/td>\n\u003ctd>调用方等待当前操作完成，再继续相关流程的协作方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>异步\u003c/td>\n\u003ctd>发起与完成在时间上分离，结果通过后续机制接收。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>并发 · Concurrency\u003c/td>\n\u003ctd>多个执行活动在时间上重叠推进。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>队列 · Queue\u003c/td>\n\u003ctd>先放好待办任务，让执行程序再领取处理；能否跨重启保留要看保存方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-5\">边界与架构\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模块\u003c/td>\n\u003ctd>一组相关规则和实现的组织单位。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>职责\u003c/td>\n\u003ctd>一个部分应该解释和维护的行为与规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>边界\u003c/td>\n\u003ctd>一个部分负责到哪里、怎样与其他部分交接。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抽象 · Abstraction\u003c/td>\n\u003ctd>保留当前用途重要的行为，同时省略部分实现细节。\u003c/td>\n\u003ctd>\u003ca href=\"#/abstraction\">不知道内部每个细节，也能理解和使用软件吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>封装\u003c/td>\n\u003ctd>限制外部直接访问内部实现与状态的组织方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/abstraction\">不知道内部每个细节，也能理解和使用软件吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依赖 · Dependency\u003c/td>\n\u003ctd>要靠另一部分的能力或约定才能完成工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>耦合\u003c/td>\n\u003ctd>一个部分的变化会牵动另一部分的紧密程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内聚\u003c/td>\n\u003ctd>同一部分内部的工作围绕共同职责的程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分层\u003c/td>\n\u003ctd>按不同职责层次组织系统的方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单体\u003c/td>\n\u003ctd>主要应用能力以一个部署单位组织的形态。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务\u003c/td>\n\u003ctd>通过明确接口提供能力的部分，部署语境下可独立运行。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分布式\u003c/td>\n\u003ctd>多个独立运行节点通过通信共同工作的系统形态。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-6\">可靠性与信任\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>局部失败\u003c/td>\n\u003ctd>系统一部分失败而其他部分仍在运行。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时\u003c/td>\n\u003ctd>等待超过设定期限；并不证明对方没有执行。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重试\u003c/td>\n\u003ctd>再次尝试操作，以处理暂时性失败或未知结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等 · Idempotency\u003c/td>\n\u003ctd>同样要求重复处理，效果仍与处理一次相同。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求编号\u003c/td>\n\u003ctd>用来辨认一次操作；重试沿用编号，接收方才有依据识别原任务。仍需可靠记录与处理规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>认证 · Authentication\u003c/td>\n\u003ctd>判断请求方是谁。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授权 · Authorization\u003c/td>\n\u003ctd>判断该身份可对某个资源执行什么行为。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信任边界\u003c/td>\n\u003ctd>进入受保护能力时，需要重新检查的交接位置。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日志\u003c/td>\n\u003ctd>有关具体事件的记录。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指标\u003c/td>\n\u003ctd>对系统行为与资源状况的数值汇总。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>追踪\u003c/td>\n\u003ctd>把一次工作经过多个部分的过程关联起来的记录。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可观测性 · Observability\u003c/td>\n\u003ctd>用可获得的信号理解系统内部行为的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>一次工作从开始到所需结果的时间。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吞吐量\u003c/td>\n\u003ctd>一段时间里能完成多少工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>瓶颈\u003c/td>\n\u003ctd>限制整体能力的环节或资源。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-7\">演进与交付\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>构建\u003c/td>\n\u003ctd>把源材料处理成可运行或可分发产物。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署\u003c/td>\n\u003ctd>将版本及配置放入目标环境，并安排访问入口。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>环境\u003c/td>\n\u003ctd>运行所使用的配置、依赖、资源与外部条件。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>把域名解析到相应网络地址等记录的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本控制 · Git\u003c/td>\n\u003ctd>记录文件变化历史，帮助比较、协作和恢复。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>迁移\u003c/td>\n\u003ctd>把数据或结构从旧约定调整到新约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>兼容性\u003c/td>\n\u003ctd>新旧部分按所承诺的约定继续协作的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回滚\u003c/td>\n\u003ctd>恢复之前的版本或状态，范围需要明确。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>测试\u003c/td>\n\u003ctd>在选定条件下检查行为是否符合预期。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验收\u003c/td>\n\u003ctd>围绕使用目标判断交付是否满足要求。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不变量\u003c/td>\n\u003ctd>在允许的变化中仍应成立的关系或规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-8\">AI 软件\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型推理 · Inference\u003c/td>\n\u003ctd>利用模型参数处理当前输入并产生输出的过程。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>模型这次真正拿到的材料和要求。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检索 · Retrieval\u003c/td>\n\u003ctd>从已有资料中找出相关信息；找出材料本身还不等于生成答案。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>先找相关资料，再把找到的材料交给模型辅助生成；结果仍需核对。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>由模型动态选择部分后续行动的系统，术语定义并不统一。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流 · Workflow\u003c/td>\n\u003ctd>按预先定义的路径组织步骤与能力的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具\u003c/td>\n\u003ctd>由系统提供、可实际读取或改变外部状态的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主\u003c/td>\n\u003ctd>把模型、工具与运行过程组织起来的执行环境。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设计约定\u003c/td>\n\u003ctd>对行为、职责、状态、失败和验证的明确承诺。\u003c/td>\n\u003ctd>\u003ca href=\"#/system-judgment\">有了这张地图，怎样更清楚地和 AI 讨论软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取舍\u003c/td>\n\u003ctd>在目标和约束下选择收益与代价的组合。\u003c/td>\n\u003ctd>\u003ca href=\"#/system-judgment\">有了这张地图，怎样更清楚地和 AI 讨论软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>遇到产品名或框架名时，先看它提供哪一种能力：做事、记事、合作，还是帮助软件运行。具体品牌可以以后再了解。\u003c/p>\n","text":"概念索引：把名词放回地图 不用从头读完，也不用背这些词。阅读时遇到陌生名字，再到这里看一句普通话解释；点击右侧文章，可以跟着例子看它怎样工作。英文名字也可以直接搜索。 整体地图 概念 简短含义 继续阅读 --- --- --- 软件世界模型 把软件怎样做事、记事和合作连成一张脑中的地图。 你点一下，软件里面发生了什么？ 计算与运行 概念 简短含义 继续阅读 --- --- --- 程序 让电脑执行的一套规则。 点一个按钮，电脑怎么知道要做什么？ 函数 有名字、能被其他地方调用的一项工作。 点一个按钮，电脑怎么知道要做什么？ 副作用 · Side effect 处理时还改变了外部东西，例如写入文件。 点一个按钮，电脑怎么知道要做什么？ 运行时 · Runtime 让某种语言的代码能执行的支持。 代码放在那里，为什么软件还没开始工作？ 进程 · Process 一份正在进行的程序运行活动。 代码放在那里，为什么软件还没开始工作？ 处理器 执行指令并推进计算的硬件。 电脑的计算、内存和硬盘，各忙什么？ 内存 程序运行时，放眼前数据的快速空间。 电脑的计算、内存和硬盘，各忙什么？ 操作系统 安排程序使用计算、内存、文件和网络的基础软件。 电脑的计算、内存和硬盘，各忙什么？ 算法 解决一类
