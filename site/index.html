<script id="knowledge-data" type="application/json">{"title":"软件世界模型","groups":[{"id":"computation","name":"计算与运行","question":"规则怎样变成实际行为？","description":"从程序、运行环境走到资源与算法。"},{"id":"state","name":"数据与状态","question":"系统怎样组织与记住信息？","description":"连接数据模型、状态、存储与一致性。"},{"id":"communication","name":"通信与协作","question":"分散的部分怎样一起工作？","description":"理解前后端、接口、信息流与时间。"},{"id":"architecture","name":"边界与架构","question":"复杂系统怎样分工和连接？","description":"用职责、抽象和依赖理解整体结构。"},{"id":"reliability","name":"可靠性与信任","question":"失败和限制下，怎样保持正确？","description":"看见失败、权限、观测与资源取舍。"},{"id":"evolution","name":"演进与交付","question":"软件怎样到达用户并持续变化？","description":"理解交付、版本、迁移与验证。"},{"id":"ai","name":"AI 软件","question":"模型在系统中承担什么职责？","description":"把模型、Agent 和人的判断放回地图。"}],"pages":[{"id":"world-map","group":"orientation","title":"你点一下，软件里面发生了什么？","question":"你点一下，软件里面发生了什么？","summary":"你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点：有人发出要求，程序按规则做事，系统记住结果。","terms":["软件世界模型"],"aliases":["软件世界模型",""],"related":["program","state","boundaries"],"html":"\u003cp>你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点：\u003cstrong>有人发出要求，程序按规则做事，系统记住结果。\u003c/strong>\u003c/p>\n\u003cp>软件世界模型，就是把这些看不见的工作连起来。你能在脑中解释“它为什么会这样”，技术名词才有地方安放。\u003c/p>\n\u003ch2 id=\"section-1\">从一个阅读助手看进去\u003c/h2>\n\u003cp>假设我们做一个阅读助手：你放入文章，它帮你收藏、搜索，还能用 AI 写摘要。这是全库用来讲原理的虚构产品，你不需要真的把它做出来。\u003c/p>\n\u003cp>你看见的是屏幕上的文章、按钮和摘要。屏幕背后，有程序判断你点了什么，有地方保存文章；如果需要 AI，还要把文章交给模型，再把回答带回来。\u003cstrong>界面是你接触软件的入口，背后还有负责做事和记事的部分。\u003c/strong>\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNzM1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuS4gOS4quiBlOe9kemYheivu+WKqeaJi+eahOW3peS9nOWIhuW4gyI+PHRpdGxlPuS4gOS4quiBlOe9kemYheivu+WKqeaJi+eahOW3peS9nOWIhuW4gzwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDci 3c/tr>\n\u003ctr>\n\u003ctd>一大堆工作怎样分给不同部分？\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">边界与架构\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样应对失败、权限和速度问题？\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">可靠性与信任\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>做好的软件怎样上线、更新和检查？\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">演进与交付\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 在其中负责哪一部分？\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 软件\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-4\">第一次来，读这六篇就能连成一张图\u003c/h2>\n\u003cp>\u003ca href=\"#/program\">程序\u003c/a> → \u003ca href=\"#/runtime\">运行\u003c/a> → \u003ca href=\"#/state\">状态\u003c/a> → \u003ca href=\"#/client-server\">前后端\u003c/a> → \u003ca href=\"#/boundaries\">分工\u003c/a> → \u003ca href=\"#/model\">AI 模型\u003c/a>。这是阅读建议，所有文章都可以直接打开。\u003c/p>\n\u003cp>暂时不用背名词。先能说出“这个产品要做哪些事、记住哪些事、让哪些部分合作”，你就在建立自己的软件地图。\u003c/p>\n","text":"你点一下，软件里面发生了什么？ 你在手机上点“收藏”，一篇文章就进入收藏夹。这个小动作，已经包含了理解软件的三个起点： 有人发出要求，程序按规则做事，系统记住结果。 软件世界模型，就是把这些看不见的工作连起来。你能在脑中解释“它为什么会这样”，技术名词才有地方安放。 从一个阅读助手看进去 假设我们做一个阅读助手：你放入文章，它帮你收藏、搜索，还能用 AI 写摘要。这是全库用来讲原理的虚构产品，你不需要真的把它做出来。 你看见的是屏幕上的文章、按钮和摘要。屏幕背后，有程序判断你点了什么，有地方保存文章；如果需要 AI，还要把文章交给模型，再把回答带回来。 界面是你接触软件的入口，背后还有负责做事和记事的部分。 手机上是操作入口；远处的电脑负责按规则处理要求，保存区留住文章，AI 提供摘要。连线表示信息往来；只有需要联网协作时，才有远处这些部分。 这张图画的是一个联网产品。一个离线笔记本可以把处理和保存都放在自己的电脑上。软件不一定都长得一样，值得追问的是：这些工作由谁完成，在哪里完成？ 先抓住四件事 做事 ：程序收到“收藏这篇”的要求，执行收藏规则。没有规则，按钮就只是一张能点击的图。看程序怎样做事。 记事 ：收藏之后，系统要留下“这篇属于我的收藏”的记录，下次打开才找得到。看软件怎样记住事情。 合作 ：手机、负责处理的程序、保存文章的地方，可能不在同一台设备上。它们需要传递信息。看前端和后端。 持续可用 ：网络会断，用户会变多，产品会更新。还要安排失败后的处理和修改后的检查。看系统为什么会失败。 这四件事经常一起发生。收藏既是一次处理，也改变了记忆；搜索既要读取记忆，也要计算结果。 七个方向，是七种看同一软件的方式 你现在的疑问 从这里进入 --- --- 电脑怎么照着代码做事？ 计算与运行 软件记住了什么，记在哪里？ 数据与状态 手机和远处的程序怎样联系？ 通信与协作 一大堆工作怎样分给不同部分？ 边界与架构 怎样应对失败、权限和速度问题？ 可靠性与信任 做好的软件怎样上线、更新和检查？ 演进与交付 AI 在其中负责哪一部分？ AI 软件 第一次来，读这六篇就能连成一张图 程序 → 运行 → 状态 → 前后端 → 分工 → AI 模型。这是阅读建议，所有文章都可以直接打开。 暂时不用背名词。先能说出“这个产品要做哪些事、记住哪些事、让哪些部分合作”，你就在建立自己的软件地图。","outline":[{"id":"section-1","title":"从一个阅读助手看进去","depth":2},{"id":"section-2","title":"先抓住四件事","depth":2},{"id":"section-3","title":"七个方向，是七种看同一软件的方式","depth":2},{"id":"section-4","title":"第一次来，读这六篇就能连成一张图","depth":2}]},{"id":"program","group":"computation","title":"点一个按钮，电脑怎么知道要做什么？","question":"点一个按钮，电脑怎么知道要做什么？","summary":"你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。","terms":["程序","函数","副作用"],"aliases":["程序","","函数","","副作用","Side effect"],"related":["runtime","state"],"html":"\u003cp>你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。\u003c/p>\n\u003cp>\u003cstrong>程序是一套让电脑执行的规则。代码是人用编程语言写下这些规则的表达\u003c/strong>。你现在不需要认识代码的写法，先看规则怎样产生行为。\u003c/p>\n\u003ch2 id=\"section-1\">把一个收藏动作拆开看\u003c/h2>\n\u003cp>假设阅读助手收到“把文章 A 加入我的收藏”。它需要知道是哪位用户、哪篇文章，然后查看有没有已经收藏。还没有，就加入记录；已经有了，就保持一条，避免每点一次都多出一篇。\u003c/p>\n\u003cp>这里的“文章 A、我的账号、收藏要求”是\u003cstrong>输入\u003c/strong>，也就是交给程序的信息。检查和加入是处理。最后，程序告诉页面“收藏成功”，页面亮起星星，这就是你看到的\u003cstrong>输出\u003c/strong>。\u003c/p>\n\u003cp>已有收藏记录也会影响处理。把程序想成一个只管输入输出的计算器还不够：很多程序会读取以前留下的信息，再决定这次怎么办。以前留下的信息叫\u003ca href=\"#/state\">状态\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">规则里的两种基本安排\u003c/h2>\n\u003cp>一种是“满足条件，才做某事”。例如用户已登录，才把收藏记到他的账号下；没登录，就请他先登录。电脑必须有清楚的条件，不能自己猜“应该知道我是谁”。\u003c/p>\n\u003cp>另一种是“对一批东西重复做同类事情”。例如显示收藏夹时，把每篇文章的标题依次取出、摆到页面上。文章有多少篇，这个过程就要处理多少项。\u003c/p>\n\u003cp>条件判断和重复处理，是很多软件行为的基础。复杂软件会把许多规则组合起来，规则也可能在等待用户或其他程序的消息之后，才继续执行。\u003c/p>\n\u003ch2 id=\"section-3\">为什么代码里经常有“函数”？\u003c/h2>\n\u003cp>如果显示页面、搜索结果、收藏夹都需要“取出文章标题”，可以把这项工作写成一个可重复使用的小单元，给它名字。其他地方把文章交给它，就拿到标题。这种可调用的工作单元叫\u003cstrong>函数\u003c/strong>。\u003c/p>\n\u003cp>你可以把函数先理解成“有名字的一项工作”。它可以只算出一个结果，也可以顺便改变外面的东西，例如保存记录。程序员把这类对外部信息或世界的改变叫\u003cstrong>副作用\u003c/strong>，这个词不表示它一定有害。\u003c/p>\n\u003ch2 id=\"section-4\">软件的聪明从哪里来？\u003c/h2>\n\u003cp>传统程序做的是事先写清的处理。你希望它知道“收藏后不重复、删除前需确认”，就要把这些行为安排进去。AI 能帮助写规则，但目标含糊时，也可能写出符合字面要求、却不符合你真实意图的规则。\u003c/p>\n\u003cp>理解软件的第一步，可以从这里开始：一个动作带进了什么信息，触发了哪些规则，留下了什么结果。至于这些规则怎样真正动起来，继续看\u003ca href=\"#/runtime\">运行\u003c/a>。\u003c/p>\n","text":"点一个按钮，电脑怎么知道要做什么？ 你点“收藏”，软件把文章加入清单；你点“取消收藏”，它又把文章移出。按钮外观可以很相似，结果却不同，因为背后安排了不同的规则。 程序是一套让电脑执行的规则。代码是人用编程语言写下这些规则的表达 。你现在不需要认识代码的写法，先看规则怎样产生行为。 把一个收藏动作拆开看 假设阅读助手收到“把文章 A 加入我的收藏”。它需要知道是哪位用户、哪篇文章，然后查看有没有已经收藏。还没有，就加入记录；已经有了，就保持一条，避免每点一次都多出一篇。 这里的“文章 A、我的账号、收藏要求”是 输入 ，也就是交给程序的信息。检查和加入是处理。最后，程序告诉页面“收藏成功”，页面亮起星星，这就是你看到的 输出 。 已有收藏记录也会影响处理。把程序想成一个只管输入输出的计算器还不够：很多程序会读取以前留下的信息，再决定这次怎么办。以前留下的信息叫状态。 规则里的两种基本安排 一种是“满足条件，才做某事”。例如用户已登录，才把收藏记到他的账号下；没登录，就请他先登录。电脑必须有清楚的条件，不能自己猜“应该知道我是谁”。 另一种是“对一批东西重复做同类事情”。例如显示收藏夹时，把每篇文章的标题依次取出、摆到页面上。文章有多少篇，这个过程就要处理多少项。 条件判断和重复处理，是很多软件行为的基础。复杂软件会把许多规则组合起来，规则也可能在等待用户或其他程序的消息之后，才继续执行。 为什么代码里经常有“函数”？ 如果显示页面、搜索结果、收藏夹都需要“取出文章标题”，可以把这项工作写成一个可重复使用的小单元，给它名字。其他地方把文章交给它，就拿到标题。这种可调用的工作单元叫 函数 。 你可以把函数先理解成“有名字的一项工作”。它可以只算出一个结果，也可以顺便改变外面的东西，例如保存记录。程序员把这类对外部信息或世界的改变叫 副作用 ，这个词不表示它一定有害。 软件的聪明从哪里来？ 传统程序做的是事先写清的处理。你希望它知道“收藏后不重复、删除前需确认”，就要把这些行为安排进去。AI 能帮助写规则，但目标含糊时，也可能写出符合字面要求、却不符合你真实意图的规则。 理解软件的第一步，可以从这里开始：一个动作带进了什么信息，触发了哪些规则，留下了什么结果。至于这些规则怎样真正动起来，继续看运行。","outline":[{"id":"section-1","title":"把一个收藏动作拆开看","depth":2},{"id":"section-2","title":"规则里的两种基本安排","depth":2},{"id":"section-3","title":"为什么代码里经常有“函数”？","depth":2},{"id":"section-4","title":"软件的聪明从哪里来？","depth":2}]},{"id":"runtime","group":"computation","title":"代码放在那里，为什么软件还没开始工作？","question":"代码放在那里，为什么软件还没开始工作？","summary":"一份菜谱放在桌上，饭不会自己出现。同样，写好的代码放在文件里，也不会自动回应你的点击。运行，就是让电脑开始执行代码里描述的工作。","terms":["运行时","进程","依赖"],"aliases":["运行时","Runtime","进程","Process","依赖","Dependency"],"related":["resources","delivery"],"html":"\u003cp>一份菜谱放在桌上，饭不会自己出现。同样，写好的代码放在文件里，也不会自动回应你的点击。\u003cstrong>运行，就是让电脑开始执行代码里描述的工作。\u003c/strong>\u003c/p>\n\u003cp>菜谱只用来说明“说明书和实际做事不同”。电脑执行的是明确的指令，没有厨师那样的生活理解能力。\u003c/p>\n\u003ch2 id=\"section-1\">文件是静止的，运行会占用电脑\u003c/h2>\n\u003cp>假设阅读助手的代码已经写好。启动以前，代码是一批保存着的文件。启动以后，电脑开始处理点击、读取文章，还要暂存当前打开的内容。\u003c/p>\n\u003cp>这份正在进行的程序活动，会占用电脑的计算和记忆空间。操作系统把这样的运行实例叫作\u003cstrong>进程\u003c/strong>。操作系统就是电脑上负责安排各个程序使用机器的基础软件，例如 Windows 或 macOS。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" ari 应你的点击。 运行，就是让电脑开始执行代码里描述的工作。 菜谱只用来说明“说明书和实际做事不同”。电脑执行的是明确的指令，没有厨师那样的生活理解能力。 文件是静止的，运行会占用电脑 假设阅读助手的代码已经写好。启动以前，代码是一批保存着的文件。启动以后，电脑开始处理点击、读取文章，还要暂存当前打开的内容。 这份正在进行的程序活动，会占用电脑的计算和记忆空间。操作系统把这样的运行实例叫作 进程 。操作系统就是电脑上负责安排各个程序使用机器的基础软件，例如 Windows 或 macOS。 上方的代码文件没有运行；启动后，同一份代码可以产生两个运行实例，它们各自占用临时记忆。关闭一个实例会结束这份活动，代码文件仍然保留。 图中两扇窗口代表两个运行实例，不表示每个真实窗口都恰好对应一个进程。你需要先看懂的是： 一份代码，可以产生多份正在工作的实例。 谁把代码里的话变成机器动作？ 机器最终执行自己的指令。人写的编程语言，需要相应的软件来执行或转换。不同语言的过程有所不同：有些先转换成机器能执行的形式，有些交给语言执行器处理。 执行代码时所需的这套支持，常被称为 运行时 。例如浏览器带有执行 JavaScript 的能力，所以网页中的这类代码能在浏览器里工作。你不必先学 JavaScript，先理解“代码需要与它匹配的执行能力”。 运行时和操作系统各管一层：前者支持特定语言的执行，后者安排程序使用电脑。仅有操作系统，未必已经有某种代码需要的全部支持。 为什么换一台电脑，程序可能跑不起来？ 代码可能还需要别的现成软件，比如读取 PDF 的组件。它用到了对方的能力，就对对方形成了 依赖 。新电脑如果没准备这些组件，即使代码一样，也可能无法完成工作。 因此“软件能运行”要同时具备：要执行的代码、合适的执行支持，以及它需要的其他能力。这些条件合在一起，可以叫运行环境。 关闭软件会结束一些运行中的活动和临时记忆，已经保存到文件里的内容则可以继续留下。理解这个区别，接着读计算、内存和存储，就容易知道机器各部分在做什么。","outline":[{"id":"section-1","title":"文件是静止的，运行会占用电脑","depth":2},{"id":"section-2","title":"谁把代码里的话变成机器动作？","depth":2},{"id":"section-3","title":"为什么换一台电脑，程序可能跑不起来？","depth":2}]},{"id":"resources","group":"computation","title":"电脑的计算、内存和硬盘，各忙什么？","question":"电脑的计算、内存和硬盘，各忙什么？","summary":"你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。","terms":["处理器","内存","操作系统"],"aliases":["处理器","","内存","","操作系统",""],"related":["algorithms","storage"],"html":"\u003cp>你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。\u003c/p>\n\u003cp>先把机器里的三项工作分开：\u003cstrong>计算要有人做，正在用的东西要有地方放，下次还要用的东西要留得住。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">处理器做计算，内存放眼前的材料\u003c/h2>\n\u003cp>电脑里执行机器指令的部分，叫处理器，常见缩写是 CPU。比较标题、统计字数、处理页面动作，都需要计算。\u003c/p>\n\u003cp>程序打开一篇文章时，需要能快速拿到它的内容和当前阅读位置。用于承载运行中数据的空间，叫\u003cstrong>内存\u003c/strong>。你可以把它想成工作桌：正在处理的材料放手边，读写快，但空间有限。\u003c/p>\n\u003cp>打开更多文章，就可能要同时占用更多内存。计算越多，也越需要处理器的时间。因此“卡”可能来自做不过来，也可能来自工作桌太满，不能只靠一个“电脑慢”解释所有情况。\u003c/p>\n\u003ch2 id=\"section-2\">硬盘像能留到下次的档案柜\u003c/h2>\n\u003cp>关掉程序后还想保留文章，就要写到文件、数据库等能长期保存记录的地方。电脑本地常用的物理载体是硬盘或固态硬盘。\u003c/p>\n\u003cp>它们通常容量更大，也能在断电后保留数据，但访问速度一般比内存慢。工作桌与档案柜的类比说明了寿命和使用方式的区别，真实电脑里两者都是电子设备。\u003c/p>\n\u003cp>“放在硬盘里”也不等于永远安全。误删、设备损坏或写入未完成，仍可能让信息丢失；重要内容还需要备份等安排。\u003c/p>\n\u003ch2 id=\"section-3\">谁防止几个程序抢成一团？\u003c/h2>\n\u003cp>你同时开浏览器、音乐播放器和阅读助手，它们都想用计算、内存、文件和网络。负责安排这些使用的软件叫\u003cstrong>操作系统\u003c/strong>。\u003c/p>\n\u003cp>它给程序提供使用机器的方式，分配处理时间，也尽量把不同程序的运行活动隔开。所以代码通常通过操作系统提供的能力读文件、建立网络连接。\u003c/p>\n\u003ch2 id=\"section-4\">远处的服务器也有这些限制\u003c/h2>\n\u003cp>联网软件把部分工作放到远处的电脑上，并没有消除物理限制。远处也需要处理器、内存和存储，也可能忙不过来。\u003c/p>\n\u003cp>于是，软件的组织方式会影响它用了多少机器资源。用更少步骤找到文章，可能减少计算；把常用结果留在手边，可能减少等待。前者连接\u003ca href=\"#/algorithms\">算法\u003c/a>，后者连接\u003ca href=\"#/storage\">存储与缓存\u003c/a>。\u003c/p>\n","text":"电脑的计算、内存和硬盘，各忙什么？ 你让阅读助手同时打开很多长文章，电脑可能变慢。软件里的每一步工作，最终都要由真实机器完成，而机器的能力有上限。 先把机器里的三项工作分开： 计算要有人做，正在用的东西要有地方放，下次还要用的东西要留得住。 处理器做计算，内存放眼前的材料 电脑里执行机器指令的部分，叫处理器，常见缩写是 CPU。比较标题、统计字数、处理页面动作，都需要计算。 程序打开一篇文章时，需要能快速拿到它的内容和当前阅读位置。用于承载运行中数据的空间，叫 内存 。你可以把它想成工作桌：正在处理的材料放手边，读写快，但空间有限。 打开更多文章，就可能要同时占用更多内存。计算越多，也越需要处理器的时间。因此“卡”可能来自做不过来，也可能来自工作桌太满，不能只靠一个“电脑慢”解释所有情况。 硬盘像能留到下次的档案柜 关掉程序后还想保留文章，就要写到文件、数据库等能长期保存记录的地方。电脑本地常用的物理载体是硬盘或固态硬盘。 它们通常容量更大，也能在断电后保留数据，但访问速度一般比内存慢。工作桌与档案柜的类比说明了寿命和使用方式的区别，真实电脑里两者都是电子设备。 “放在硬盘里”也不等于永远安全。误删、设备损坏或写入未完成，仍可能让信息丢失；重要内容还需要备份等安排。 谁防止几个程序抢成一团？ 你同时开浏览器、音乐播放器和阅读助手，它们都想用计算、内存、文件和网络。负责安排这些使用的软件叫 操作系统 。 它给程序提供使用机器的方式，分配处理时间，也尽量把不同程序的运行活动隔开。所以代码通常通过操作系统提供的能力读文件、建立网络连接。 远处的服务器也有这些限制 联网软件把部分工作放到远处的电脑上，并没有消除物理限制。远处也需要处理器、内存和存储，也可能忙不过来。 于是，软件的组织方式会影响它用了多少机器资源。用更少步骤找到文章，可能减少计算；把常用结果留在手边，可能减少等待。前者连接算法，后者连接存储与缓存。","outline":[{"id":"section-1","title":"处理器做计算，内存放眼前的材料","depth":2},{"id":"section-2","title":"硬盘像能留到下次的档案柜","depth":2},{"id":"section-3","title":"谁防止几个程序抢成一团？","depth":2},{"id":"section-4","title":"远处的服务器也有这些限制","depth":2}]},{"id":"algorithms","group":"computation","title":"为什么做同一件事，有的软件快得多？","question":"为什么做同一件事，有的软件快得多？","summary":"要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。","terms":["算法","数据结构","复杂度"],"aliases":["算法","","数据结构","","复杂度","Complexity"],"related":["performance","data-model"],"html":"\u003cp>要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。\u003c/p>\n\u003cp>两种办法都可能找对，花的工作量却不同。\u003cstrong>解决问题的步骤安排，叫算法；信息怎样组织，影响哪些步骤做起来方便。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">先整理，可能让以后少找很多次\u003c/h2>\n\u003cp>假设所有标题乱放，每次搜索都可能要查看大部分文章。若额外建立“标题对应文章位置”的索引，就能利用索引更快地定位。\u003c/p>\n\u003cp>索引像书末的词条目录：你付出一次整理工作，之后多次查找就能少翻页。软件中的索引也要占空间，文章变化时还要维护，所以加索引同时带来查找收益和维护成本。\u003c/p>\n\u003ch2 id=\"section-2\">数据的摆法，是解决办法的一部分\u003c/h2>\n\u003cp>把文章逐项放成清单，适合按顺序浏览；按标题组织查找表，适合通过标题找位置。程序里这类信息组织方式叫\u003cstrong>数据结构\u003c/strong>。\u003c/p>\n\u003cp>它和算法配合。信息的摆法可能让某种操作很方便，也让另一种操作更费事。选哪一种，要看软件经常做什么，不能只说一种结构“更高级”。\u003c/p>\n\u003ch2 id=\"section-3\">用户变多以后，差别才可能明显\u003c/h2>\n\u003cp>十篇文章时，逐个查也很快。一万篇时，同样的办法要做更多比较。如果某个办法需要把每篇与所有其他文章都比较，数量翻倍，比较次数可能增长得更快。\u003c/p>\n\u003cp>描述“规模变大，工作量怎样增长”的概念，叫\u003cstrong>复杂度\u003c/strong>。它帮助我们看增长趋势，不能单独告诉你某台电脑会花几秒；机器速度、具体写法和数据情况也会影响耗时。\u003c/p>\n\u003ch2 id=\"section-4\">算法好，整个软件就一定快吗？\u003c/h2>\n\u003cp>如果查找本来只花很短时间，真正慢的是等 AI 写摘要，那么改搜索算法对整体等待帮助有限。要先知道时间花在哪里，才能知道减少哪项工作有用。\u003c/p>\n\u003cp>所以软件速度既与做事的方法有关，也与网络、存储、机器能力有关。算法这一格告诉你：\u003cstrong>同一个目标，可以有工作量很不同的实现办法\u003c/strong>。整体速度继续看\u003ca href=\"#/performance\">性能与成本\u003c/a>。\u003c/p>\n","text":"为什么做同一件事，有的软件快得多？ 要在一万篇文章里找出《城市漫步》，可以从第一篇开始逐一比较，也可以利用事先整理好的标题目录，缩小要找的范围。 两种办法都可能找对，花的工作量却不同。 解决问题的步骤安排，叫算法；信息怎样组织，影响哪些步骤做起来方便。 先整理，可能让以后少找很多次 假设所有标题乱放，每次搜索都可能要查看大部分文章。若额外建立“标题对应文章位置”的索引，就能利用索引更快地定位。 索引像书末的词条目录：你付出一次整理工作，之后多次查找就能少翻页。软件中的索引也要占空间，文章变化时还要维护，所以加索引同时带来查找收益和维护成本。 数据的摆法，是解决办法的一部分 把文章逐项放成清单，适合按顺序浏览；按标题组织查找表，适合通过标题找位置。程序里这类信息组织方式叫 数据结构 。 它和算法配合。信息的摆法可能让某种操作很方便，也让另一种操作更费事。选哪一种，要看软件经常做什么，不能只说一种结构“更高级”。 用户变多以后，差别才可能明显 十篇文章时，逐个查也很快。一万篇时，同样的办法要做更多比较。如果某个办法需要把每篇与所有其他文章都比较，数量翻倍，比较次数可能增长得更快。 描述“规模变大，工作量怎样增长”的概念，叫 复杂度 。它帮助我们看增长趋势，不能单独告诉你某台电脑会花几秒；机器速度、具体写法和数据情况也会影响耗时。 算法好，整个软件就一定快吗？ 如果查找本来只花很短时间，真正慢的是等 AI 写摘要，那么改搜索算法对整体等待帮助有限。要先知道时间花在哪里，才能知道减少哪项工作有用。 所以软件速度既与做事的方法有关，也与网络、存储、机器能力有关。算法这一格告诉你： 同一个目标，可以有工作量很不同的实现办法 。整体速度继续看性能与成本。","outline":[{"id":"section-1","title":"先整理，可能让以后少找很多次","depth":2},{"id":"section-2","title":"数据的摆法，是解决办法的一部分","depth":2},{"id":"section-3","title":"用户变多以后，差别才可能明显","depth":2},{"id":"section-4","title":"算法好，整个软件就一定快吗？","depth":2}]},{"id":"data-model","group":"state","title":"软件怎么把“人和文章”记成数据？","question":"软件怎么把“人和文章”记成数据？","summary":"你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。","terms":["实体","标识","约束"],"aliases":["实体","","标识","","约束",""],"related":["state","consistency"],"html":"\u003cp>你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。\u003c/p>\n\u003cp>\u003cstrong>数据模型，就是软件选择用哪些记录和关系，来表示它关心的世界\u003c/strong>。它像一套有明确栏目和连接方式的登记簿。\u003c/p>\n\u003ch2 id=\"section-1\">同叫《旅行》，不代表是同一篇\u003c/h2>\n\u003cp>假设阅读助手里有两篇文章都叫《旅行》。只用标题识别文章，收藏和删除时就可能混淆。\u003c/p>\n\u003cp>程序可以为每篇文章分配不重复的编号，例如 A17 和 A28。这个用来辨认具体对象的值，叫\u003cstrong>标识\u003c/strong>，常见名字是 ID。你看到标题，程序用编号确认到底是哪一篇。\u003c/p>\n\u003cp>需要独立辨认的对象，比如用户、文章、收藏记录，常叫\u003cstrong>实体\u003c/strong>。实体可以有多个信息项，程序员会叫它们字段：文章的编号、标题、正文就是不同字段。\u003c/p>\n\u003ch2 id=\"section-2\">单个记录之外，还需要关系\u003c/h2>\n\u003cp>“小林收藏了 A17”连接了用户和文章。文章本身不必复制一份到每个人名下，可以另外保留“用户是谁、文章是谁”的收藏记录。\u003c/p>\n\u003cp>这样两个人收藏同一篇文章，能表示为两条关系；文章只有一份正文。到底共用正文还是各自保留快照，取决于产品希望文章更新后收藏者看到什么。\u003c/p>\n\u003ch2 id=\"section-3\">软件能做什么，取决于记住了什么区别\u003c/h2>\n\u003cp>如果只保存“这篇被收藏过”，却没保存是谁收藏，就无法准确生成每个人自己的收藏夹。如果希望区分草稿和已发布文章，就要留下这个区别，并规定它怎样改变。\u003c/p>\n\u003cp>这些要求还可以形成\u003cstrong>约束\u003c/strong>，也就是记录必须符合的规则：编号不能重复、收藏对应的文章必须存在。例如数据库可以帮助检查某些约束，但仍需要人先明确规则。\u003c/p>\n\u003ch2 id=\"section-4\">数据模型和数据库是什么关系？\u003c/h2>\n\u003cp>数据模型描述“我们需要表达什么”。数据库是帮助保存和管理这些信息的软件。模型也可以被写进文件，数据库里也可能放着设计不清的记录。\u003c/p>\n\u003cp>先把对象、信息项和关系想清楚，存储工具才知道要保存什么。信息接下来怎样变化，交给\u003ca href=\"#/state\">状态\u003c/a>解释；怎样保存与查找，交给\u003ca href=\"#/storage\">存储\u003c/a>。\u003c/p>\n","text":"软件怎么把“人和文章”记成数据？ 你认识一篇文章，会记得标题、内容、作者；你认识一个收藏，会知道谁收藏了哪篇文章。电脑要处理这些东西，也需要明确保存哪些信息、怎样区分它们。 数据模型，就是软件选择用哪些记录和关系，来表示它关心的世界 。它像一套有明确栏目和连接方式的登记簿。 同叫《旅行》，不代表是同一篇 假设阅读助手里有两篇文章都叫《旅行》。只用标题识别文章，收藏和删除时就可能混淆。 程序可以为每篇文章分配不重复的编号，例如 A17 和 A28。这个用来辨认具体对象的值，叫 标识 ，常见名字是 ID。你看到标题，程序用编号确认到底是哪一篇。 需要独立辨认的对象，比如用户、文章、收藏记录，常叫 实体 。实体可以有多个信息项，程序员会叫它们字段：文章的编号、标题、正文就是不同字段。 单个记录之外，还需要关系 “小林收藏了 A17”连接了用户和文章。文章本身不必复制一份到每个人名下，可以另外保留“用户是谁、文章是谁”的收藏记录。 这样两个人收藏同一篇文章，能表示为两条关系；文章只有一份正文。到底共用正文还是各自保留快照，取决于产品希望文章更新后收藏者看到什么。 软件能做什么，取决于记住了什么区别 如果只保存“这篇被收藏过”，却没保存是谁收藏，就无法准确生成每个人自己的收藏夹。如果希望区分草稿和已发布文章，就要留下这个区别，并规定它怎样改变。 这些要求还可以形成 约束 ，也就是记录必须符合的规则：编号不能重复、收藏对应的文章必须存在。例如数据库可以帮助检查某些约束，但仍需要人先明确规则。 数据模型和数据库是什么关系？ 数据模型描述“我们需要表达什么”。数据库是帮助保存和管理这些信息的软件。模型也可以被写进文件，数据库里也可能放着设计不清的记录。 先把对象、信息项和关系想清楚，存储工具才知道要保存什么。信息接下来怎样变化，交给状态解释；怎样保存与查找，交给存储。","outline":[{"id":"section-1","title":"同叫《旅行》，不代表是同一篇","depth":2},{"id":"section-2","title":"单个记录之外，还需要关系","depth":2},{"id":"section-3","title":"软件能做什么，取决于记住了什么区别","depth":2},{"id":"section-4","title":"数据模型和数据库是什么关系？","depth":2}]},{"id":"state","group":"state","title":"为什么软件能记得你刚才做过什么？","question":"为什么软件能记得你刚才做过什么？","summary":"你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。","terms":["状态","生命周期","派生状态"],"aliases":["状态","State","生命周期","","派生状态",""],"related":["storage","consistency"],"html":"\u003cp>你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。\u003c/p>\n\u003cp>原因是系统留下了“你收藏过这篇文章”的信息。\u003cstrong>那些留在系统里、会影响接下来行为的信息，就是状态。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">先看一个动作前后的区别\u003c/h2>\n\u003cp>在这个假设的阅读助手里，点击以前，你的收藏清单里没有文章 A。点击以后，清单里有了文章 A。页面再查这份清单，就知道应该把星星点亮。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNTkyIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuS4gOasoeaUtuiXj+WmguS9leaUueWPmOezu+e7n+iusOW/hiI+PHRpdGxlPuS4gOasoeaUtuiXj+WmguS9leaUueWPmOezu+e7n+iusOW/hjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI1OTIiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZ 是状态，但不一定值得永久保存。\u003c/p>\n\u003cp>想象一张工作桌：手边便签帮助你处理眼前的事，归档的记录留到下次使用。软件中也有这类区别：有些信息只留在运行中的临时记忆里，有些写到可以长期保留的文件或数据库里。数据库是帮助程序组织、查找、修改记录的软件。\u003c/p>\n\u003cp>这只是寿命的类比。临时和长期信息都可能在你的设备上，也都可能在远处的电脑上；不能只凭“前端”或“后端”判断是否会丢。\u003c/p>\n\u003ch2 id=\"section-3\">一份事实，可以带出几种显示\u003c/h2>\n\u003cp>如果清单里有三篇收藏，页面可以显示“收藏 3 篇”。这个数字能由清单数出来。程序员会叫它\u003cstrong>派生状态\u003c/strong>：从已有信息算出的信息。\u003c/p>\n\u003cp>于是这里有三种不同东西：收藏清单是记录；“3 篇”是从记录算出的结果；当前展开哪个目录是界面临时记住的选择。分清它们，才容易说明哪份东西改变时，什么显示要跟着改变。\u003c/p>\n\u003ch2 id=\"section-4\">从“能记住”走到“记在哪里”\u003c/h2>\n\u003cp>只在你的手机保存收藏，另一台电脑通常看不到它。希望跨设备使用，就需要一份两边都能访问的记录，或者安排两边交换更新。\u003c/p>\n\u003cp>这自然引出\u003ca href=\"#/storage\">存储\u003c/a>和\u003ca href=\"#/consistency\">一致性\u003c/a>：前者解释怎么留住和找出信息，后者解释多份信息怎样对上。你现在先抓住一个判断：\u003cstrong>软件会因为已经记住的事情，而对下一次输入作出不同反应。\u003c/strong>\u003c/p>\n","text":"为什么软件能记得你刚才做过什么？ 你把同一篇文章打开两次。第一次它没有收藏标记；点过收藏以后，第二次打开，星星已经亮了。文章没变，你的动作也一样，软件的反应却变了。 原因是系统留下了“你收藏过这篇文章”的信息。 那些留在系统里、会影响接下来行为的信息，就是状态。 先看一个动作前后的区别 在这个假设的阅读助手里，点击以前，你的收藏清单里没有文章 A。点击以后，清单里有了文章 A。页面再查这份清单，就知道应该把星星点亮。 收藏前，文章 A 不在收藏记录里，星星是空的；收藏后，记录多了一条文章 A，星星变亮。决定下次显示的，是留下来的记录。 亮星星是显示给你的结果。背后的记录解释了为什么下次还能显示同样的结果。有些产品会先亮星星，再等待保存成功；这时亮了也可能还没真正保存。 屏幕上的样子和背后的记录，需要配合。 软件的记忆有长有短 你还可能展开目录、输入一半搜索词、选中一篇文章。软件也要记住这些信息，才能继续当前操作。它们同样是状态，但不一定值得永久保存。 想象一张工作桌：手边便签帮助你处理眼前的事，归档的记录留到下次使用。软件中也有这类区别：有些信息只留在运行中的临时记忆里，有些写到可以长期保留的文件或数据库里。数据库是帮助程序组织、查找、修改记录的软件。 这只是寿命的类比。临时和长期信息都可能在你的设备上，也都可能在远处的电脑上；不能只凭“前端”或“后端”判断是否会丢。 一份事实，可以带出几种显示 如果清单里有三篇收藏，页面可以显示“收藏 3 篇”。这个数字能由清单数出来。程序员会叫它 派生状态 ：从已有信息算出的信息。 于是这里有三种不同东西：收藏清单是记录；“3 篇”是从记录算出的结果；当前展开哪个目录是界面临时记住的选择。分清它们，才容易说明哪份东西改变时，什么显示要跟着改变。 从“能记住”走到“记在哪里” 只在你的手机保存收藏，另一台电脑通常看不到它。希望跨设备使用，就需要一份两边都能访问的记录，或者安排两边交换更新。 这自然引出存储和一致性：前者解释怎么留住和找出信息，后者解释多份信息怎样对上。你现在先抓住一个判断： 软件会因为已经记住的事情，而对下一次输入作出不同反应。","outline":[{"id":"section-1","title":"先看一个动作前后的区别","depth":2},{"id":"section-2","title":"软件的记忆有长有短","depth":2},{"id":"section-3","title":"一份事实，可以带出几种显示","depth":2},{"id":"section-4","title":"从“能记住”走到“记在哪里”","depth":2}]},{"id":"storage","group":"state","title":"文章、账号、图片，为什么不全放在一个地方？","question":"文章、账号、图片，为什么不全放在一个地方？","summary":"阅读助手需要保留文章正文、谁收藏了什么、封面图片。它还希望你打开常看的文章时快一点。不同东西，保存和取用的需要并不相同。","terms":["数据库","对象存储","缓存"],"aliases":["数据库","Database","对象存储","","缓存","Cache"],"related":["performance","change"],"html":"\u003cp>阅读助手需要保留文章正文、谁收藏了什么、封面图片。它还希望你打开常看的文章时快一点。不同东西，保存和取用的需要并不相同。\u003c/p>\n\u003cp>\u003cstrong>存储负责留住信息，也决定程序用什么方式把信息找回来\u003c/strong>。文件、数据库、缓存，是常见的三种安排。\u003c/p>\n\u003ch2 id=\"section-1\">文件适合留下一整份东西\u003c/h2>\n\u003cp>一张图片、一份 PDF、一段录音，可以作为完整文件保存。程序根据文件的名字或地址把它取回来。\u003c/p>\n\u003cp>联网产品里，大量这类文件可以交给专门的文件保存服务。其中常见一种叫\u003cstrong>对象存储\u003c/strong>：程序把一份内容作为一个对象存入，再凭它的标识取出。它擅长管理整份内容，不负责替你理解其中每个人的收藏关系。\u003c/p>\n\u003ch2 id=\"section-2\">数据库适合管理能查、能改的记录\u003c/h2>\n\u003cp>想查“小林收藏了哪些文章”，就要在许多记录中筛选；取消一篇收藏，还要改掉对应关系。\u003cstrong>数据库\u003c/strong>帮助程序组织记录、查找和更新，也能检查一些约束。\u003c/p>\n\u003cp>它像带检索能力的登记系统。记录可以保存文字，也可以保存指向图片文件的地址。因此数据库和文件经常合作，并非只能二选一。\u003c/p>\n\u003ch2 id=\"section-3\">缓存把常用结果留在近处\u003c/h2>\n\u003cp>假设每次打开首页都重新统计文章数量。程序可以把刚算出的数量暂存起来，下次先复用，减少重复工作。这份为加快使用而保留的结果，叫\u003cstrong>缓存\u003c/strong>。\u003c/p>\n\u003cp>缓存像手边的一张速查纸，通常能从原始记录重新获得。如果新增文章后还使用旧数量，就会暂时看到过期信息。缓存需要安排何时更新或作废。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNjY5IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Iue8k+WtmOeahOWkjeeUqOS4jui/h+acnyI+PHRpdGxlPue8k+WtmOeahOWkjeeUqOS4jui/h+acnzwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI2NjkiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2Vp 取可以少走远路。原始文章改变以后，近处副本可能还是旧的，需要更新。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>长期记录在保存区；程序把常用文章的副本放在手边，后续读取可以少走远路。原始文章改变以后，近处副本可能还是旧的，需要更新。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-4\">保存地点，还决定谁能取到\u003c/h2>\n\u003cp>只留在本机的记录，另一台设备通常不能直接访问。共同放在可访问的服务上，就方便多设备读取，但也要处理权限、网络和多人修改。\u003c/p>\n\u003cp>选存储时，先问：要留住什么，谁需要取到，需要查哪些信息，能允许多旧的结果？不用先背品牌。知道这些需要，再理解\u003ca href=\"#/consistency\">多份信息怎样对上\u003c/a>就有了基础。\u003c/p>\n","text":"文章、账号、图片，为什么不全放在一个地方？ 阅读助手需要保留文章正文、谁收藏了什么、封面图片。它还希望你打开常看的文章时快一点。不同东西，保存和取用的需要并不相同。 存储负责留住信息，也决定程序用什么方式把信息找回来 。文件、数据库、缓存，是常见的三种安排。 文件适合留下一整份东西 一张图片、一份 PDF、一段录音，可以作为完整文件保存。程序根据文件的名字或地址把它取回来。 联网产品里，大量这类文件可以交给专门的文件保存服务。其中常见一种叫 对象存储 ：程序把一份内容作为一个对象存入，再凭它的标识取出。它擅长管理整份内容，不负责替你理解其中每个人的收藏关系。 数据库适合管理能查、能改的记录 想查“小林收藏了哪些文章”，就要在许多记录中筛选；取消一篇收藏，还要改掉对应关系。 数据库 帮助程序组织记录、查找和更新，也能检查一些约束。 它像带检索能力的登记系统。记录可以保存文字，也可以保存指向图片文件的地址。因此数据库和文件经常合作，并非只能二选一。 缓存把常用结果留在近处 假设每次打开首页都重新统计文章数量。程序可以把刚算出的数量暂存起来，下次先复用，减少重复工作。这份为加快使用而保留的结果，叫 缓存 。 缓存像手边的一张速查纸，通常能从原始记录重新获得。如果新增文章后还使用旧数量，就会暂时看到过期信息。缓存需要安排何时更新或作废。 长期记录在保存区；程序把常用文章的副本放在手边，后续读取可以少走远路。原始文章改变以后，近处副本可能还是旧的，需要更新。 保存地点，还决定谁能取到 只留在本机的记录，另一台设备通常不能直接访问。共同放在可访问的服务上，就方便多设备读取，但也要处理权限、网络和多人修改。 选存储时，先问：要留住什么，谁需要取到，需要查哪些信息，能允许多旧的结果？不用先背品牌。知道这些需要，再理解多份信息怎样对上就有了基础。","outline":[{"id":"section-1","title":"文件适合留下一整份东西","depth":2},{"id":"section-2","title":"数据库适合管理能查、能改的记录","depth":2},{"id":"section-3","title":"缓存把常用结果留在近处","depth":2},{"id":"section-4","title":"保存地点，还决定谁能取到","depth":2}]},{"id":"consistency","group":"state","title":"两台设备看到不同的收藏，究竟哪份算数？","question":"两台设备看到不同的收藏，究竟哪份算数？","summary":"你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。","terms":["一致性","事务","冲突"],"aliases":["一致性","Consistency","事务","","冲突",""],"related":["time","failure"],"html":"\u003cp>你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。\u003c/p>\n\u003cp>当信息存在多处，或者几个人同时修改，就要安排它们怎样对上。\u003cstrong>一致性关心的是：这些记录和显示，应当满足什么关系。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">复制方便使用，也带来时间差\u003c/h2>\n\u003cp>假设手机和电脑都显示同一个收藏夹。手机发出收藏要求，服务端保存成功；电脑需要再次读取，才知道有了新收藏。保存和传播不是一个瞬间完成的动作。\u003c/p>\n\u003cp>产品可以允许电脑短暂显示旧结果，并随后刷新；也可以在某些操作中要求先确认最新记录。不同场景需要的保证不同。普通收藏允许短暂落后，最后一件库存的售卖则不能随意让两人都买走。\u003c/p>\n\u003ch2 id=\"section-2\">一件事有两步时，怎样避免只做一半？\u003c/h2>\n\u003cp>想象一个示意性的积分转赠：给小林扣10分，再给小周加10分。若扣分后中断，另一边没有增加，两个人的总积分就少了。\u003c/p>\n\u003cp>数据库可以把相关修改放进一次\u003cstrong>事务\u003c/strong>：要么一起提交成为正式结果，要么这次都不留下。它解决“相关修改不能只完成一部分”的问题。能覆盖到哪里，取决于这些修改是否在同一事务范围内；给外部服务发消息通常还需要别的配合。\u003c/p>\n\u003ch2 id=\"section-3\">同时编辑，也需要明确处理办法\u003c/h2>\n\u003cp>两个人都打开旧标题，一人改成“旅行记录”，一人改成“周末游记”。若后来的保存直接覆盖，前一个修改可能消失。\u003c/p>\n\u003cp>系统可以检测“你开始编辑后，别人已经改过”，再提示选择；也可以按产品规则合并。这类相互不兼容的修改叫\u003cstrong>冲突\u003c/strong>。电脑不能自动知道两个人真正希望哪个标题留下，处理规则要先定义。\u003c/p>\n\u003ch2 id=\"section-4\">“正确”要用产品规则说明\u003c/h2>\n\u003cp>一致性不只是“所有地方永远长得一模一样”。你在手机展开目录，通常无须让电脑也展开；共享收藏记录，却可能需要同步。\u003c/p>\n\u003cp>先确定哪些信息共享、哪些只是各自的临时选择，再规定何时需要一致、冲突怎样处理。这连接了\u003ca href=\"#/state\">状态\u003c/a>、\u003ca href=\"#/time\">时间与等待\u003c/a>和\u003ca href=\"#/failure\">失败\u003c/a>。\u003c/p>\n","text":"两台设备看到不同的收藏，究竟哪份算数？ 你在手机收藏了一篇文章，电脑上的收藏夹暂时还没出现它。并不一定是文章消失了，也可能是电脑还没取得新的记录。 当信息存在多处，或者几个人同时修改，就要安排它们怎样对上。 一致性关心的是：这些记录和显示，应当满足什么关系。 复制方便使用，也带来时间差 假设手机和电脑都显示同一个收藏夹。手机发出收藏要求，服务端保存成功；电脑需要再次读取，才知道有了新收藏。保存和传播不是一个瞬间完成的动作。 产品可以允许电脑短暂显示旧结果，并随后刷新；也可以在某些操作中要求先确认最新记录。不同场景需要的保证不同。普通收藏允许短暂落后，最后一件库存的售卖则不能随意让两人都买走。 一件事有两步时，怎样避免只做一半？ 想象一个示意性的积分转赠：给小林扣10分，再给小周加10分。若扣分后中断，另一边没有增加，两个人的总积分就少了。 数据库可以把相关修改放进一次 事务 ：要么一起提交成为正式结果，要么这次都不留下。它解决“相关修改不能只完成一部分”的问题。能覆盖到哪里，取决于这些修改是否在同一事务范围内；给外部服务发消息通常还需要别的配合。 同时编辑，也需要明确处理办法 两个人都打开旧标题，一人改成“旅行记录”，一人改成“周末游记”。若后来的保存直接覆盖，前一个修改可能消失。 系统可以检测“你开始编辑后，别人已经改过”，再提示选择；也可以按产品规则合并。这类相互不兼容的修改叫 冲突 。电脑不能自动知道两个人真正希望哪个标题留下，处理规则要先定义。 “正确”要用产品规则说明 一致性不只是“所有地方永远长得一模一样”。你在手机展开目录，通常无须让电脑也展开；共享收藏记录，却可能需要同步。 先确定哪些信息共享、哪些只是各自的临时选择，再规定何时需要一致、冲突怎样处理。这连接了状态、时间与等待和失败。","outline":[{"id":"section-1","title":"复制方便使用，也带来时间差","depth":2},{"id":"section-2","title":"一件事有两步时，怎样避免只做一半？","depth":2},{"id":"section-3","title":"同时编辑，也需要明确处理办法","depth":2},{"id":"section-4","title":"“正确”要用产品规则说明","depth":2}]},{"id":"client-server","group":"communication","title":"前端、后端、服务器，分别在哪里？","question":"前端、后端、服务器，分别在哪里？","summary":"你用手机打开阅读助手，朋友用电脑打开同一个产品。两人看的是各自的屏幕，却可能读到同一篇文章。这意味着：各自的操作入口，在和某个共同提供能力的地方合作。","terms":["客户端","服务端","前端","后端"],"aliases":["客户端","","服务端","","前端","","后端",""],"related":["interface","trust"],"html":"\u003cp>你用手机打开阅读助手，朋友用电脑打开同一个产品。两人看的是各自的屏幕，却可能读到同一篇文章。这意味着：各自的操作入口，在和某个共同提供能力的地方合作。\u003c/p>\n\u003cp>\u003cstrong>客户端是你使用的一端，服务端是接受要求、提供能力的一端\u003c/strong>。浏览器里的网页和手机 App 都可以是客户端。\u003c/p>\n\u003ch2 id=\"section-1\">你面前的界面做哪些事？\u003c/h2>\n\u003cp>页面把文章排好、显示按钮、响应点击，还可能先检查搜索词是否为空。这些靠近用户交互的工作，通常归到\u003cstrong>前端\u003c/strong>。\u003c/p>\n\u003cp>你在屏幕上点收藏时，前端可以把“当前用户想收藏文章 A”送出去。这个向对方提出的要求，叫请求。它收到结果后，再告诉你成功还是失败。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgODA2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuWuouaIt+err+S4juacjeWKoeerr+S5i+mXtOeahOivt+axguWSjOWTjeW6lCI+PHRpdGxlPuWuouaIt+err+S4juacjeWKoeerr+S5i+mXtOeahOivt+axguWSjOWTjeW6lDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4MDYiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuimgeaxguS7juS9oOi/memHjOWPkeWHujwvdGV4dD48cmVjdCB4PSIxNTQiIHk9Ijc1IiB3aWR0aD0iMTAwIiBoZWlnaHQ9IjE1NyIgcng9IjE2IiBmaWxsPSIjZTZlNmRlIiBzdHJva2U9IiNlNmU2ZGUiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9IjE1MCIgeT0iNjgiIHdpZHRoPSIxMDAiIGhlaWdodD0iMTU3IiByeD0iMT \u003cstrong>后端\u003c/strong>。\u003c/p>\n\u003cp>把共同的规则放在这里，各种客户端就能使用同一套收藏规定。但客户端也可以做本地计算和保存；“前端只负责好看”会漏掉很多实际工作。\u003c/p>\n\u003ch2 id=\"section-3\">“服务器”是程序，还是电脑？\u003c/h2>\n\u003cp>这个词在日常说法里可以指提供服务的程序，也可以指运行这些程序的机器。听见“服务器出问题”，还需要看说的是哪一层。\u003c/p>\n\u003cp>机器可能放在机房里，也可能租用云平台的计算能力。“云”仍然依靠真实电脑，只是使用者通过网络取得能力，不需要把那台机器放在自己的桌边。\u003c/p>\n\u003ch2 id=\"section-4\">所有软件都要有远处后端吗？\u003c/h2>\n\u003cp>离线笔记软件可以在本机完成显示、处理和保存。联网阅读助手把共享内容和账号记录放到远处，是为了跨设备和多人访问等需要。\u003c/p>\n\u003cp>前后端主要描述工作职责；本机和远处描述位置。两者要一起看，不能仅凭词判断所有信息在哪里。双方怎样互相听懂，接着看\u003ca href=\"#/interface\">接口与协议\u003c/a>。\u003c/p>\n","text":"前端、后端、服务器，分别在哪里？ 你用手机打开阅读助手，朋友用电脑打开同一个产品。两人看的是各自的屏幕，却可能读到同一篇文章。这意味着：各自的操作入口，在和某个共同提供能力的地方合作。 客户端是你使用的一端，服务端是接受要求、提供能力的一端 。浏览器里的网页和手机 App 都可以是客户端。 你面前的界面做哪些事？ 页面把文章排好、显示按钮、响应点击，还可能先检查搜索词是否为空。这些靠近用户交互的工作，通常归到 前端 。 你在屏幕上点收藏时，前端可以把“当前用户想收藏文章 A”送出去。这个向对方提出的要求，叫请求。它收到结果后，再告诉你成功还是失败。 上方是你设备上的界面；绿色箭头把收藏要求送到远处程序，返回箭头带回结果。远处程序检查规则并保存记录。前后端描述工作分工，联网是这个示例选择的运行方式。 共同使用的部分做哪些事？ 服务端可以确认是谁在操作、检查权限，再把收藏记录保存下来。这里处理共享记录和业务规则的工作，通常叫 后端 。 把共同的规则放在这里，各种客户端就能使用同一套收藏规定。但客户端也可以做本地计算和保存；“前端只负责好看”会漏掉很多实际工作。 “服务器”是程序，还是电脑？ 这个词在日常说法里可以指提供服务的程序，也可以指运行这些程序的机器。听见“服务器出问题”，还需要看说的是哪一层。 机器可能放在机房里，也可能租用云平台的计算能力。“云”仍然依靠真实电脑，只是使用者通过网络取得能力，不需要把那台机器放在自己的桌边。 所有软件都要有远处后端吗？ 离线笔记软件可以在本机完成显示、处理和保存。联网阅读助手把共享内容和账号记录放到远处，是为了跨设备和多人访问等需要。 前后端主要描述工作职责；本机和远处描述位置。两者要一起看，不能仅凭词判断所有信息在哪里。双方怎样互相听懂，接着看接口与协议。","outline":[{"id":"section-1","title":"你面前的界面做哪些事？","depth":2},{"id":"section-2","title":"共同使用的部分做哪些事？","depth":2},{"id":"section-3","title":"“服务器”是程序，还是电脑？","depth":2},{"id":"section-4","title":"所有软件都要有远处后端吗？","depth":2}]},{"id":"interface","group":"communication","title":"API 是什么，为什么程序要通过它合作？","question":"API 是什么，为什么程序要通过它合作？","summary":"你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。","terms":["接口","API","协议"],"aliases":["接口","Interface","API","Application Programming Interface","协议",""],"related":["boundaries","change"],"html":"\u003cp>你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。\u003c/p>\n\u003cp>程序也需要清楚的交接方式：能要求对方做什么，要交哪些信息，能收到什么结果。\u003cstrong>这套可用能力和交接约定，就是接口\u003c/strong>。咖啡店只是帮助理解交接，真实程序交换的是结构明确的信息。\u003c/p>\n\u003ch2 id=\"section-1\">用收藏动作认识一个 API\u003c/h2>\n\u003cp>假设文章服务提供“加入收藏”能力。其他程序调用它时，要给出用户和文章的身份信息；它返回“成功”“已经收藏”或“没有权限”等结果。\u003c/p>\n\u003cp>这就是一个供程序使用的接口，常见名字是 \u003cstrong>API\u003c/strong>。不只是 AI 公司有 API，操作系统、数据库、软件内部模块都可以提供程序接口。\u003c/p>\n\u003cp>它把“如何提出要求”与“内部如何完成”分开。调用者不必自己了解收藏表的每一个保存细节，但必须遵守约定，也必须处理对方可能返回的错误。\u003c/p>\n\u003ch2 id=\"section-2\">接口和界面，有什么不同？\u003c/h2>\n\u003cp>按钮和输入框主要给人操作；API 主要给程序使用。一个“收藏”按钮背后，可以调用加入收藏的 API，再把结果显示给人。\u003c/p>\n\u003cp>人能靠上下文猜意思，程序之间通常需要准确格式：文章编号放哪个位置、成功怎样表示、缺信息时怎样回复。格式不匹配，就像订单上填错栏目，对方未必能按你希望的方式处理。\u003c/p>\n\u003ch2 id=\"section-3\">协议是双方交换信息时遵守的规矩\u003c/h2>\n\u003cp>如果程序隔着网络合作，还需要规定消息怎样发送、怎样确认结果。这类交流规则叫\u003cstrong>协议\u003c/strong>。HTTP 是网页和许多网络 API 常用的一种请求与响应协议。\u003c/p>\n\u003cp>可以把协议想成寄送方式，把 API 想成对方接受哪些具体订单。许多不同服务都使用同一种协议，但各自提供的能力和要求并不相同。\u003c/p>\n\u003ch2 id=\"section-4\">有接口，为什么仍然会出错？\u003c/h2>\n\u003cp>约定清楚，只是合作的一项条件。信息可能填错，对方可能拒绝，网络也可能让你收不到回复。因此接口还要说明错误、等待限制、版本等行为。\u003c/p>\n\u003cp>世界模型里的接口是一条合作边：它告诉你两个部分怎样交接。它是否稳定，会直接影响\u003ca href=\"#/boundaries\">分工\u003c/a>和\u003ca href=\"#/dependency\">修改带来的影响\u003c/a>。\u003c/p>\n","text":"API 是什么，为什么程序要通过它合作？ 你到咖啡店说“要一杯拿铁”，店员知道这项服务需要什么信息、会交给你什么。如果你跑进后厨，对着每台机器随便操作，合作就很难稳定。 程序也需要清楚的交接方式：能要求对方做什么，要交哪些信息，能收到什么结果。 这套可用能力和交接约定，就是接口 。咖啡店只是帮助理解交接，真实程序交换的是结构明确的信息。 用收藏动作认识一个 API 假设文章服务提供“加入收藏”能力。其他程序调用它时，要给出用户和文章的身份信息；它返回“成功”“已经收藏”或“没有权限”等结果。 这就是一个供程序使用的接口，常见名字是 API 。不只是 AI 公司有 API，操作系统、数据库、软件内部模块都可以提供程序接口。 它把“如何提出要求”与“内部如何完成”分开。调用者不必自己了解收藏表的每一个保存细节，但必须遵守约定，也必须处理对方可能返回的错误。 接口和界面，有什么不同？ 按钮和输入框主要给人操作；API 主要给程序使用。一个“收藏”按钮背后，可以调用加入收藏的 API，再把结果显示给人。 人能靠上下文猜意思，程序之间通常需要准确格式：文章编号放哪个位置、成功怎样表示、缺信息时怎样回复。格式不匹配，就像订单上填错栏目，对方未必能按你希望的方式处理。 协议是双方交换信息时遵守的规矩 如果程序隔着网络合作，还需要规定消息怎样发送、怎样确认结果。这类交流规则叫 协议 。HTTP 是网页和许多网络 API 常用的一种请求与响应协议。 可以把协议想成寄送方式，把 API 想成对方接受哪些具体订单。许多不同服务都使用同一种协议，但各自提供的能力和要求并不相同。 有接口，为什么仍然会出错？ 约定清楚，只是合作的一项条件。信息可能填错，对方可能拒绝，网络也可能让你收不到回复。因此接口还要说明错误、等待限制、版本等行为。 世界模型里的接口是一条合作边：它告诉你两个部分怎样交接。它是否稳定，会直接影响分工和修改带来的影响。","outline":[{"id":"section-1","title":"用收藏动作认识一个 API","depth":2},{"id":"section-2","title":"接口和界面，有什么不同？","depth":2},{"id":"section-3","title":"协议是双方交换信息时遵守的规矩","depth":2},{"id":"section-4","title":"有接口，为什么仍然会出错？","depth":2}]},{"id":"flow","group":"communication","title":"点“生成摘要”后，文章内容去了哪里？","question":"点“生成摘要”后，文章内容去了哪里？","summary":"你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线：材料经过哪里、变成了什么；哪些动作让工作开始或继续。","terms":["数据流","控制流","事件"],"aliases":["数据流","","控制流","","事件",""],"related":["time","observability"],"html":"\u003cp>你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线：\u003cstrong>材料经过哪里、变成了什么；哪些动作让工作开始或继续。\u003c/strong>\u003c/p>\n\u003cp>这两条线分别叫数据流和控制流。分开看，复杂流程就更容易理解。\u003c/p>\n\u003ch2 id=\"section-1\">先跟着材料走\u003c/h2>\n\u003cp>假设阅读助手把文章正文取出来，和“请用三句话概括”的要求放在一起，交给 AI。AI 返回摘要，软件再把摘要放到页面上。\u003c/p>\n\u003cp>这里的材料发生了变化：保存着的正文，变成供模型阅读的输入，再产生一份摘要。追踪信息来自哪里、经过哪些处理、最后在哪里使用，就是看\u003cstrong>数据流\u003c/strong>。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNTMyIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuadkOaWmeWPmOaNouWSjOWKqOS9nOinpuWPkeeahOS4pOS4quinhuinkiI+PHRpdGxlPuadkOaWmeWPmOaNouWSjOWKqOS9nOinpuWPkeeahOS4pOS4quinhuinkjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI1MzIiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPueci+adkOaWme+8muWGheWuueWP \u003cp>做阅读助手时，数据线帮你看见文章、提示要求、摘要的去向；动作线帮你看见点击、等待、成功或失败。这也让你知道需要保存哪些信息，以及等待时页面应该显示什么。\u003c/p>\n\u003cp>到了 AI Agent，这个过程会反复发生：取得材料、决定行动、执行、看到新结果，再决定下一步。先把这两条线分清，后面理解\u003ca href=\"#/agent\">Agent\u003c/a>就有支点。\u003c/p>\n","text":"点“生成摘要”后，文章内容去了哪里？ 你点“生成摘要”，页面稍后显示一段短文字。要解释这件事，可以追两条线： 材料经过哪里、变成了什么；哪些动作让工作开始或继续。 这两条线分别叫数据流和控制流。分开看，复杂流程就更容易理解。 先跟着材料走 假设阅读助手把文章正文取出来，和“请用三句话概括”的要求放在一起，交给 AI。AI 返回摘要，软件再把摘要放到页面上。 这里的材料发生了变化：保存着的正文，变成供模型阅读的输入，再产生一份摘要。追踪信息来自哪里、经过哪些处理、最后在哪里使用，就是看 数据流 。 上半幅跟着材料看：长文章交给模型后，输出较短摘要；下半幅跟着动作看：点击启动生成，收到回复后显示。材料变化与动作先后是两个观察方向。 再跟着动作走 你点击按钮，软件开始请求摘要；收到回复，软件才显示摘要。如果请求失败，可能显示失败提示。这些动作何时发生、什么条件让它们发生，就是 控制流 。 “被点击”“收到回复”这类发生了的事情，叫 事件 。程序可以安排：当某个事件发生，就执行相应工作。它解释了为什么软件常常需要等待用户或消息，并不一直沿着一条直线往下跑。 两条线有联系，却不能互相替代 点击按钮让生成开始，但“点击了”这件事不是摘要的主要材料；正文才是。模型可能从数据库取得文章，这说明信息来源，也不说明数据库会主动决定什么时候生成。 因此画图时，箭头要说明含义：在传材料，还是在触发动作？如果一个箭头同时表示三种事情，读者就很难知道软件怎样工作。 从这两条线看整个产品 做阅读助手时，数据线帮你看见文章、提示要求、摘要的去向；动作线帮你看见点击、等待、成功或失败。这也让你知道需要保存哪些信息，以及等待时页面应该显示什么。 到了 AI Agent，这个过程会反复发生：取得材料、决定行动、执行、看到新结果，再决定下一步。先把这两条线分清，后面理解Agent就有支点。","outline":[{"id":"section-1","title":"先跟着材料走","depth":2},{"id":"section-2","title":"再跟着动作走","depth":2},{"id":"section-3","title":"两条线有联系，却不能互相替代","depth":2},{"id":"section-4","title":"从这两条线看整个产品","depth":2}]},{"id":"time","group":"communication","title":"软件为什么要“等待”，又怎样同时做几件事？","question":"软件为什么要“等待”，又怎样同时做几件事？","summary":"你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。","terms":["同步","异步","并发","队列"],"aliases":["同步","","异步","","并发","Concurrency","队列","Queue"],"related":["consistency","failure"],"html":"\u003cp>你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。\u003c/p>\n\u003cp>\u003cstrong>等待期间能不能继续别的工作，是软件需要明确安排的行为\u003c/strong>。它和“一项工作本身有多快”是两件事。\u003c/p>\n\u003ch2 id=\"section-1\">同步与异步，说的是等待关系\u003c/h2>\n\u003cp>调用一项工作时，要等它返回才能继续当前这段工作，可以先理解为\u003cstrong>同步\u003c/strong>。把任务交出去，当前部分先继续，结果后来再处理，可以先理解为\u003cstrong>异步\u003c/strong>。\u003c/p>\n\u003cp>异步像取号等餐：你不用一直站在柜台，可以先找座位。厨房未必因此做得更快，变化的是你在等待时能否做其他事。软件也一样，异步不自动缩短模型生成的时间。\u003c/p>\n\u003ch2 id=\"section-2\">几件事交错推进，叫并发\u003c/h2>\n\u003cp>你在读文章，摘要在生成，另一个收藏请求也在处理。这些工作在一段时间里都在推进，叫\u003cstrong>并发\u003c/strong>。\u003c/p>\n\u003cp>它们可能由机器交替处理，也可能真的由不同处理器同时做。物理上同一时刻执行多个工作，通常叫并行。先理解“多项工作可以重叠推进”，再区分机器是否真的同时执行。\u003c/p>\n\u003cp>并发让系统可以利用等待时间，也让多个人同时改记录等问题出现，因此需要\u003ca href=\"#/consistency\">一致性\u003c/a>里的协调规则。\u003c/p>\n\u003ch2 id=\"section-3\">来不及做的工作，可以先排队\u003c/h2>\n\u003cp>一百个人同时请求摘要，系统一时只能处理其中一部分。把待办任务先记录下来、逐步取出处理，这种安排叫\u003cstrong>队列\u003c/strong>。\u003c/p>\n\u003cp>队列可以承接突然增加的任务，但如果长期进入速度快于处理速度，队伍会越积越长。它需要处理能力、容量和等待上限等安排，不能把“已经排队”当成“很快会完成”。\u003c/p>\n\u003ch2 id=\"section-4\">开始、完成、失败，是不同结果\u003c/h2>\n\u003cp>异步任务通常要记录它还在等待、已经运行、成功还是失败。用户点了按钮，只说明任务开始被提交；它可能尚未完成。\u003c/p>\n\u003cp>队列里的任务也可能因重试再次执行。需要系统安排如何避免重复带来错误。你已经可以把时间这部分放回地图：它负责协调工作的先后、重叠和等待，而\u003ca href=\"#/failure\">失败\u003c/a>解释中断后该怎样处理。\u003c/p>\n","text":"软件为什么要“等待”，又怎样同时做几件事？ 你请阅读助手生成摘要，AI 需要一些时间。页面可以一直挡着等结果，也可以让你继续读别的文章，等摘要好了再通知。 等待期间能不能继续别的工作，是软件需要明确安排的行为 。它和“一项工作本身有多快”是两件事。 同步与异步，说的是等待关系 调用一项工作时，要等它返回才能继续当前这段工作，可以先理解为 同步 。把任务交出去，当前部分先继续，结果后来再处理，可以先理解为 异步 。 异步像取号等餐：你不用一直站在柜台，可以先找座位。厨房未必因此做得更快，变化的是你在等待时能否做其他事。软件也一样，异步不自动缩短模型生成的时间。 几件事交错推进，叫并发 你在读文章，摘要在生成，另一个收藏请求也在处理。这些工作在一段时间里都在推进，叫 并发 。 它们可能由机器交替处理，也可能真的由不同处理器同时做。物理上同一时刻执行多个工作，通常叫并行。先理解“多项工作可以重叠推进”，再区分机器是否真的同时执行。 并发让系统可以利用等待时间，也让多个人同时改记录等问题出现，因此需要一致性里的协调规则。 来不及做的工作，可以先排队 一百个人同时请求摘要，系统一时只能处理其中一部分。把待办任务先记录下来、逐步取出处理，这种安排叫 队列 。 队列可以承接突然增加的任务，但如果长期进入速度快于处理速度，队伍会越积越长。它需要处理能力、容量和等待上限等安排，不能把“已经排队”当成“很快会完成”。 开始、完成、失败，是不同结果 异步任务通常要记录它还在等待、已经运行、成功还是失败。用户点了按钮，只说明任务开始被提交；它可能尚未完成。 队列里的任务也可能因重试再次执行。需要系统安排如何避免重复带来错误。你已经可以把时间这部分放回地图：它负责协调工作的先后、重叠和等待，而失败解释中断后该怎样处理。","outline":[{"id":"section-1","title":"同步与异步，说的是等待关系","depth":2},{"id":"section-2","title":"几件事交错推进，叫并发","depth":2},{"id":"section-3","title":"来不及做的工作，可以先排队","depth":2},{"id":"section-4","title":"开始、完成、失败，是不同结果","depth":2}]},{"id":"boundaries","group":"architecture","title":"软件那么多工作，怎样分给不同部分？","question":"软件那么多工作，怎样分给不同部分？","summary":"假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。","terms":["模块","职责","边界"],"aliases":["模块","","职责","","边界",""],"related":["dependency","shape"],"html":"\u003cp>假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。\u003c/p>\n\u003cp>\u003cstrong>分工的目的，是让每一部分有明确的工作范围，其他部分能放心使用它提供的能力\u003c/strong>。这就是理解软件结构的起点。\u003c/p>\n\u003ch2 id=\"section-1\">像一间有分区的工作室\u003c/h2>\n\u003cp>一间工作室里，可以划出接待区、档案区和写作区。分区以后，接待者知道去哪里取档案，写作者也知道谁负责保存成品。它们仍可以在同一间屋子里。\u003c/p>\n\u003cp>软件里，围绕一项职责组织起来的一部分代码，叫\u003cstrong>模块\u003c/strong>。例如阅读助手可以有文章管理模块、账号模块、摘要模块。模块的名字要回答“它负责什么”。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNjY1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuiBjOi0o+WIkuWIhuS4jui/kOihjOS9jee9rueahOS4pOenjeWuieaOkiI+PHRpdGxlPuiBjOi0o+WIkuWIhuS4jui/kOihjOS9jee9rueahOS4pOenjeWuieaOkjwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI2NjUiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuWIhuW3pe+8muWQjOS4gOWkhOi/kOihjDwvdGV4dD48cmVjdCB4PSIyNiIgeT0iNjciIHdpZHRoPSIzNDgiIGhlaWdodD0iMjMwIiByeD0iMyIgZmlsbD0iI2Y0ZWNkYyIgc3Ryb2tlPSIjMTgzZDNhIiBzdHJva2Utd2lkdGg9IjIiLz48cmVjdCB4PSI0NSIgeT0iOTAiIHdpZHRoPSI5OCIgaGVpZ2h0PSIxNzYiIHJ4PSIzIiBmaWxsPSIjZGNlZWU3IiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxyZWN0IHg9IjE1MSIgeT0iOTAiIHdpZHRoPSI5OCIgaGVpZ2h0PSIxNzYiIHJ4PSIzIiBmaWxsPSIjZjllMGQ1IiBzdHJva2 责，再理解运行位置的选择。可以继续看\u003ca href=\"#/shape\">软件有哪些组织形态\u003c/a>。\u003c/p>\n","text":"软件那么多工作，怎样分给不同部分？ 假设阅读助手已经能收藏文章，现在还要支持 AI 摘要。如果把“谁登录了、文章存在哪里、怎么请求摘要、按钮怎么显示”混在一起，每改一个功能，都要理解一大片工作。 分工的目的，是让每一部分有明确的工作范围，其他部分能放心使用它提供的能力 。这就是理解软件结构的起点。 像一间有分区的工作室 一间工作室里，可以划出接待区、档案区和写作区。分区以后，接待者知道去哪里取档案，写作者也知道谁负责保存成品。它们仍可以在同一间屋子里。 软件里，围绕一项职责组织起来的一部分代码，叫 模块 。例如阅读助手可以有文章管理模块、账号模块、摘要模块。模块的名字要回答“它负责什么”。 同一间工作室内有文章、账号、摘要三个分区；分区之间有交接窗口。另一种安排把三项工作放进三间独立工作室，之间需要通信。职责分开和运行地点分开，是两种不同安排。 这幅图用房间表示软件的分工。真实模块由代码组成，分区线表示职责范围，不是电脑里真的有墙。 分界线怎样帮助合作？ 摘要模块需要文章内容。它可以向文章模块说“给我文章 A 的正文”，由文章模块找到并返回。它不用自己钻进文章模块，翻找对方的全部存储细节。 这种明确的交接方式就是接口。模块之间的 边界 ，规定谁可以负责哪些工作、双方用什么方式合作。 这样，文章模块以后换一种保存方式，只要仍能正确提供正文，摘要模块就可能继续使用。能否做到这一点，取决于交接约定是否保持相容。 分文件夹，不会自动带来分工 如果摘要模块直接修改账号记录，账号模块又到处改文章内容，即使文件分成三堆，实际职责仍纠缠在一起。判断分工要看行为：谁能改什么，谁提供什么，谁需要了解谁的细节。 适合放在一起的，通常是围绕同一工作、经常一起变化的规则与信息。例如收藏归谁所有、怎样加入收藏、怎样取消收藏，放在共同的管理范围内更容易保持规则一致。 分模块以后，要不要分成多个服务？ 多个模块可以一起运行，也可以分别运行、通过网络合作。能独立提供能力的运行部分，常叫服务。 把三项工作放到三处，可能便于单独更新或增加处理能力，也增加了信息传递、等待和失败的处理。初学时先分清职责，再理解运行位置的选择。可以继续看软件有哪些组织形态。","outline":[{"id":"section-1","title":"像一间有分区的工作室","depth":2},{"id":"section-2","title":"分界线怎样帮助合作？","depth":2},{"id":"section-3","title":"分文件夹，不会自动带来分工","depth":2},{"id":"section-4","title":"分模块以后，要不要分成多个服务？","depth":2}]},{"id":"abstraction","group":"architecture","title":"不知道内部每个细节，也能理解和使用软件吗？","question":"不知道内部每个细节，也能理解和使用软件吗？","summary":"你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。","terms":["抽象","封装"],"aliases":["抽象","Abstraction","封装",""],"related":["interface","model"],"html":"\u003cp>你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。\u003c/p>\n\u003cp>软件也用这种方式降低理解负担。\u003cstrong>抽象，是把当前关心的行为留下，把暂时不需要的细节放到后面。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">同一软件，可以换几种距离来看\u003c/h2>\n\u003cp>远一点看阅读助手：它接收文章、保留收藏、生成摘要。近一点看：有文章管理、账号和摘要模块。再近一点：某个模块按条件检查并修改记录。\u003c/p>\n\u003cp>这些描述都可能正确，只是关注的层次不同。理解整体组成时，无须同时记住每一行代码。讨论某个收藏错误时，则可能需要看它怎样操作记录。\u003c/p>\n\u003ch2 id=\"section-2\">用一个能力代替一大串内部步骤\u003c/h2>\n\u003cp>例如“取得文章正文”这项能力，内部可能先检查记录，再读取文件，最后组合结果。调用者只要提出文章编号，并按约定处理返回内容。\u003c/p>\n\u003cp>这个接口把内部步骤藏在后面。让外部通过明确入口使用能力、把内部细节放在自己的管理范围内，叫\u003cstrong>封装\u003c/strong>。它帮助外部少了解细节，也帮助内部在不破坏约定的情况下改变做法。\u003c/p>\n\u003cp>抽象描述的是“看哪部分、略去哪部分”；封装强调“通过什么入口使用、内部由谁管理”。初学时先看它们共同带来的好处：能把复杂工作组合成较容易理解的能力。\u003c/p>\n\u003ch2 id=\"section-3\">省略的细节，仍然会产生影响\u003c/h2>\n\u003cp>“生成摘要”听起来像一个动作，内部仍然可能等待网络、花费计算资源、因文章太长而失败。如果软件只承诺“必定立刻得到正确摘要”，这个抽象就省略了会影响使用的重要条件。\u003c/p>\n\u003cp>好的抽象应当保留对使用者重要的事情，例如成功和失败的结果、输入限制、等待方式。内部实现可以先不解释，限制却要让调用者知道。\u003c/p>\n\u003ch2 id=\"section-4\">世界模型本身，也是一种抽象\u003c/h2>\n\u003cp>这份知识库把许多技术浓缩成“做事、记事、合作、持续可用”。它帮助你先抓住主要关系，但真实产品还要补具体规则和实现证据。\u003c/p>\n\u003cp>你可以逐步调整观察距离：先看产品有哪些职责，再看谁依靠谁，再看实际动作是否成立。理解这一点，就能把\u003ca href=\"#/boundaries\">分工\u003c/a>和\u003ca href=\"#/dependency\">依赖\u003c/a>连起来。\u003c/p>\n","text":"不知道内部每个细节，也能理解和使用软件吗？ 你会使用电梯，不必先知道电机怎样转动。楼层按钮把大量内部工作收拢成你能使用的几个选择：到哪里、能否到达、什么时候到了。 软件也用这种方式降低理解负担。 抽象，是把当前关心的行为留下，把暂时不需要的细节放到后面。 同一软件，可以换几种距离来看 远一点看阅读助手：它接收文章、保留收藏、生成摘要。近一点看：有文章管理、账号和摘要模块。再近一点：某个模块按条件检查并修改记录。 这些描述都可能正确，只是关注的层次不同。理解整体组成时，无须同时记住每一行代码。讨论某个收藏错误时，则可能需要看它怎样操作记录。 用一个能力代替一大串内部步骤 例如“取得文章正文”这项能力，内部可能先检查记录，再读取文件，最后组合结果。调用者只要提出文章编号，并按约定处理返回内容。 这个接口把内部步骤藏在后面。让外部通过明确入口使用能力、把内部细节放在自己的管理范围内，叫 封装 。它帮助外部少了解细节，也帮助内部在不破坏约定的情况下改变做法。 抽象描述的是“看哪部分、略去哪部分”；封装强调“通过什么入口使用、内部由谁管理”。初学时先看它们共同带来的好处：能把复杂工作组合成较容易理解的能力。 省略的细节，仍然会产生影响 “生成摘要”听起来像一个动作，内部仍然可能等待网络、花费计算资源、因文章太长而失败。如果软件只承诺“必定立刻得到正确摘要”，这个抽象就省略了会影响使用的重要条件。 好的抽象应当保留对使用者重要的事情，例如成功和失败的结果、输入限制、等待方式。内部实现可以先不解释，限制却要让调用者知道。 世界模型本身，也是一种抽象 这份知识库把许多技术浓缩成“做事、记事、合作、持续可用”。它帮助你先抓住主要关系，但真实产品还要补具体规则和实现证据。 你可以逐步调整观察距离：先看产品有哪些职责，再看谁依靠谁，再看实际动作是否成立。理解这一点，就能把分工和依赖连起来。","outline":[{"id":"section-1","title":"同一软件，可以换几种距离来看","depth":2},{"id":"section-2","title":"用一个能力代替一大串内部步骤","depth":2},{"id":"section-3","title":"省略的细节，仍然会产生影响","depth":2},{"id":"section-4","title":"世界模型本身，也是一种抽象","depth":2}]},{"id":"dependency","group":"architecture","title":"为什么改了一个地方，另一个地方也出问题？","question":"为什么改了一个地方，另一个地方也出问题？","summary":"假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。","terms":["依赖","耦合","内聚"],"aliases":["依赖","Dependency","耦合","","内聚",""],"related":["shape","change"],"html":"\u003cp>假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。\u003c/p>\n\u003cp>\u003cstrong>一部分工作要依靠另一部分的行为、信息或约定，才能完成，这种关系叫依赖\u003c/strong>。变化会沿着这些关系传出去。\u003c/p>\n\u003ch2 id=\"section-1\">依赖不只是“用了哪个软件包”\u003c/h2>\n\u003cp>阅读助手要用数据库保存记录，是对一项软件能力的依赖；收藏模块假定文章编号始终有效，是对数据约定的依赖；页面假定成功结果叫“已收藏”，也是对格式的依赖。\u003c/p>\n\u003cp>因此依赖有时写得很明显，有时藏在“我们一直以为”的假设里。改动时没有想到这些假设，就可能破坏使用它们的部分。\u003c/p>\n\u003ch2 id=\"section-2\">看两个部分怎样牵动彼此\u003c/h2>\n\u003cp>如果页面直接了解数据库里每个栏目，数据库的安排一变，很多页面都要跟着变。这种相互牵动的紧密程度，常叫\u003cstrong>耦合\u003c/strong>。\u003c/p>\n\u003cp>如果页面只通过文章模块要正文，保存细节由文章模块处理，一些内部变化就可以被留在模块内。但接口本身若改变，外部仍可能要修改。\u003c/p>\n\u003cp>没有依赖的软件几乎无法合作。目标是让必要的依赖清楚，让经常变化的内部细节少波及其他地方。\u003c/p>\n\u003ch2 id=\"section-3\">哪些工作适合放在一起？\u003c/h2>\n\u003cp>收藏记录、加入收藏、取消收藏，围绕同一职责，经常要一起保持规则。这种内部工作彼此相关的程度，叫\u003cstrong>内聚\u003c/strong>。\u003c/p>\n\u003cp>把相关的事放到同一管理范围，把跨范围的联系用清楚接口表达，就较容易理解变化影响。只按“代码行数平均”分模块，未必能得到这种关系。\u003c/p>\n\u003ch2 id=\"section-4\">有了这个模型，怎样理解修改范围？\u003c/h2>\n\u003cp>换一种文章保存方式，可能只影响文章模块；换文章编号、权限规则或返回格式，就可能影响多个使用者。你可以先看改动触碰了哪种约定，再看谁使用它。\u003c/p>\n\u003cp>这会让“改完 A，B 又坏了”变成一个能解释的现象。具体是否破坏了行为，仍要通过\u003ca href=\"#/validation\">验证\u003c/a>确认，不能仅凭结构图保证没问题。\u003c/p>\n","text":"为什么改了一个地方，另一个地方也出问题？ 假设收藏列表一直用文章编号取正文。文章模块有一天改变了编号的格式，收藏模块却还按旧格式查找，结果标题能显示，文章打不开了。 一部分工作要依靠另一部分的行为、信息或约定，才能完成，这种关系叫依赖 。变化会沿着这些关系传出去。 依赖不只是“用了哪个软件包” 阅读助手要用数据库保存记录，是对一项软件能力的依赖；收藏模块假定文章编号始终有效，是对数据约定的依赖；页面假定成功结果叫“已收藏”，也是对格式的依赖。 因此依赖有时写得很明显，有时藏在“我们一直以为”的假设里。改动时没有想到这些假设，就可能破坏使用它们的部分。 看两个部分怎样牵动彼此 如果页面直接了解数据库里每个栏目，数据库的安排一变，很多页面都要跟着变。这种相互牵动的紧密程度，常叫 耦合 。 如果页面只通过文章模块要正文，保存细节由文章模块处理，一些内部变化就可以被留在模块内。但接口本身若改变，外部仍可能要修改。 没有依赖的软件几乎无法合作。目标是让必要的依赖清楚，让经常变化的内部细节少波及其他地方。 哪些工作适合放在一起？ 收藏记录、加入收藏、取消收藏，围绕同一职责，经常要一起保持规则。这种内部工作彼此相关的程度，叫 内聚 。 把相关的事放到同一管理范围，把跨范围的联系用清楚接口表达，就较容易理解变化影响。只按“代码行数平均”分模块，未必能得到这种关系。 有了这个模型，怎样理解修改范围？ 换一种文章保存方式，可能只影响文章模块；换文章编号、权限规则或返回格式，就可能影响多个使用者。你可以先看改动触碰了哪种约定，再看谁使用它。 这会让“改完 A，B 又坏了”变成一个能解释的现象。具体是否破坏了行为，仍要通过验证确认，不能仅凭结构图保证没问题。","outline":[{"id":"section-1","title":"依赖不只是“用了哪个软件包”","depth":2},{"id":"section-2","title":"看两个部分怎样牵动彼此","depth":2},{"id":"section-3","title":"哪些工作适合放在一起？","depth":2},{"id":"section-4","title":"有了这个模型，怎样理解修改范围？","depth":2}]},{"id":"shape","group":"architecture","title":"一个软件，要放在一台电脑还是很多台上？","question":"一个软件，要放在一台电脑还是很多台上？","summary":"阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。","terms":["分层","单体","服务","分布式"],"aliases":["分层","","单体","","服务","","分布式",""],"related":["failure","delivery"],"html":"\u003cp>阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。\u003c/p>\n\u003cp>理解这些选择，先分开两个问题：\u003cstrong>工作怎样分工，工作在哪里运行。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">分层是在整理不同性质的工作\u003c/h2>\n\u003cp>例如界面负责交互，业务部分负责收藏规则，保存部分负责读写记录。这是按工作性质组织的几层，常叫\u003cstrong>分层\u003c/strong>。\u003c/p>\n\u003cp>它帮助我们说清“按钮为什么亮”与“这次收藏是否允许”分别在哪处理。分层不代表一定要用多台电脑，也不保证每次动作都按固定层次顺序经过所有部分。\u003c/p>\n\u003ch2 id=\"section-2\">一起交付运行，可以形成单体\u003c/h2>\n\u003cp>多个模块合在一个整体里发布运行，通常称为\u003cstrong>单体\u003c/strong>。它仍然可以有清楚分工，也可以为了处理更多用户，把同一个整体运行多份。\u003c/p>\n\u003cp>如果摘要、文章、账号分别作为独立运行部分提供能力，就会形成多个\u003cstrong>服务\u003c/strong>。它们可以单独更新或增加处理能力，但合作需要处理通信、版本和失败。\u003c/p>\n\u003ch2 id=\"section-3\">分布式，说的是多处需要协作\u003c/h2>\n\u003cp>当多个独立运行的节点通过网络配合，形成\u003cstrong>分布式系统\u003c/strong>。节点可以理解成参与工作的运行位置，它们未必都在不同物理机器上。\u003c/p>\n\u003cp>一台机器停了，其他地方可能还活着；消息也可能晚到或丢失。所以分布式带来的核心变化，是要处理“各处并不同时知道同一件事，也不同时成功”的现实。\u003c/p>\n\u003cp>客户端和远处后端之间也存在跨位置协作。系统的分布式性质并不只在拆成许多小服务后才出现。\u003c/p>\n\u003ch2 id=\"section-4\">形态要跟着需要选\u003c/h2>\n\u003cp>如果产品很小，先把职责理清、一起运行可能更简单。如果某一项工作需要独立更新，或和其他工作有很不同的资源需求，再考虑拆开可能更有依据。\u003c/p>\n\u003cp>这里没有一个对所有产品都最好的形态。世界模型帮助你分辨这些选择分别改变了什么；实现时还要看真实约束和运行证据。分开运行的另一面，可以从\u003ca href=\"#/failure\">失败\u003c/a>继续理解。\u003c/p>\n","text":"一个软件，要放在一台电脑还是很多台上？ 阅读助手可以把文章、账号、摘要管理一起运行，也可以让它们分别运行。有些系统只在你的电脑上工作，有些要让许多设备通过网络配合。 理解这些选择，先分开两个问题： 工作怎样分工，工作在哪里运行。 分层是在整理不同性质的工作 例如界面负责交互，业务部分负责收藏规则，保存部分负责读写记录。这是按工作性质组织的几层，常叫 分层 。 它帮助我们说清“按钮为什么亮”与“这次收藏是否允许”分别在哪处理。分层不代表一定要用多台电脑，也不保证每次动作都按固定层次顺序经过所有部分。 一起交付运行，可以形成单体 多个模块合在一个整体里发布运行，通常称为 单体 。它仍然可以有清楚分工，也可以为了处理更多用户，把同一个整体运行多份。 如果摘要、文章、账号分别作为独立运行部分提供能力，就会形成多个 服务 。它们可以单独更新或增加处理能力，但合作需要处理通信、版本和失败。 分布式，说的是多处需要协作 当多个独立运行的节点通过网络配合，形成 分布式系统 。节点可以理解成参与工作的运行位置，它们未必都在不同物理机器上。 一台机器停了，其他地方可能还活着；消息也可能晚到或丢失。所以分布式带来的核心变化，是要处理“各处并不同时知道同一件事，也不同时成功”的现实。 客户端和远处后端之间也存在跨位置协作。系统的分布式性质并不只在拆成许多小服务后才出现。 形态要跟着需要选 如果产品很小，先把职责理清、一起运行可能更简单。如果某一项工作需要独立更新，或和其他工作有很不同的资源需求，再考虑拆开可能更有依据。 这里没有一个对所有产品都最好的形态。世界模型帮助你分辨这些选择分别改变了什么；实现时还要看真实约束和运行证据。分开运行的另一面，可以从失败继续理解。","outline":[{"id":"section-1","title":"分层是在整理不同性质的工作","depth":2},{"id":"section-2","title":"一起交付运行，可以形成单体","depth":2},{"id":"section-3","title":"分布式，说的是多处需要协作","depth":2},{"id":"section-4","title":"形态要跟着需要选","depth":2}]},{"id":"failure","group":"reliability","title":"为什么你点了按钮，软件却没有给出结果？","question":"为什么你点了按钮，软件却没有给出结果？","summary":"你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。","terms":["局部失败","超时","重试","幂等"],"aliases":["局部失败","","超时","","重试","","幂等","Idempotency"],"related":["observability","validation"],"html":"\u003cp>你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。\u003cstrong>没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。\u003c/strong>\u003c/p>\n\u003cp>软件需要同时处理失败和这种“不确定”。这在几个部分通过网络合作时尤其常见。\u003c/p>\n\u003ch2 id=\"section-1\">一次动作，中间有几个可能中断的地方\u003c/h2>\n\u003cp>假设手机把收藏要求发到服务端。网络可能断，服务端可能忙不过来，保存记录也可能失败。某一部分正常，整个任务仍可能没完成。\u003c/p>\n\u003cp>系统的一部分出问题、另一部分还在工作，叫\u003cstrong>局部失败\u003c/strong>。因此仅检查页面按钮能点击，并不能确认最终记录已正确保存。\u003c/p>\n\u003ch2 id=\"section-2\">超时是停止等，不是证明没执行\u003c/h2>\n\u003cp>不能无限等下去，程序可以设置一个等待限度。超过限度还没收到结果，叫\u003cstrong>超时\u003c/strong>。\u003c/p>\n\u003cp>如果收藏已经保存，只是回复晚了，手机此时仍可能报超时。这就是为什么重要动作要考虑结果如何重新确认，不能一看到超时就把一切当成没发生。\u003c/p>\n\u003ch2 id=\"section-3\">再试一次，可能帮忙，也可能重复\u003c/h2>\n\u003cp>重新发出要求，叫\u003cstrong>重试\u003c/strong>。暂时网络波动时，再试可能成功；对方正在过载时，大量重试却可能让它更忙。\u003c/p>\n\u003cp>假设每次“加入收藏”都会新增一条记录，反复重试就会出现重复收藏。若规则是“这位用户与这篇文章只有一条收藏”，相同要求重复处理，最终仍保留一条。\u003c/p>\n\u003cp>这种重复执行后，效果仍与执行一次相同的性质，叫\u003cstrong>幂等\u003c/strong>。这是讲机制的假设例子，真实系统还要落实识别重复和检查记录的方法。\u003c/p>\n\u003ch2 id=\"section-4\">失败不能扩散到所有工作\u003c/h2>\n\u003cp>AI 摘要服务暂时不可用时，阅读助手可以继续显示已保存文章，只让摘要功能提示稍后再试。把一种失败尽量限制在相关工作范围内，就是一种隔离思路。\u003c/p>\n\u003cp>软件可靠并不表示永远没有失败。它还要让用户知道现在发生了什么，保护已有记录，并提供合理恢复方式。这分别连接\u003ca href=\"#/observability\">可观测性\u003c/a>、\u003ca href=\"#/state\">状态\u003c/a>和\u003ca href=\"#/validation\">验证\u003c/a>。\u003c/p>\n","text":"为什么你点了按钮，软件却没有给出结果？ 你点收藏，页面一直转圈。可能是要求没送到，也可能是已经保存了、回复却没回来。 没有收到结果，只能说明你还不知道结果，不能直接说明对方没有做。 软件需要同时处理失败和这种“不确定”。这在几个部分通过网络合作时尤其常见。 一次动作，中间有几个可能中断的地方 假设手机把收藏要求发到服务端。网络可能断，服务端可能忙不过来，保存记录也可能失败。某一部分正常，整个任务仍可能没完成。 系统的一部分出问题、另一部分还在工作，叫 局部失败 。因此仅检查页面按钮能点击，并不能确认最终记录已正确保存。 超时是停止等，不是证明没执行 不能无限等下去，程序可以设置一个等待限度。超过限度还没收到结果，叫 超时 。 如果收藏已经保存，只是回复晚了，手机此时仍可能报超时。这就是为什么重要动作要考虑结果如何重新确认，不能一看到超时就把一切当成没发生。 再试一次，可能帮忙，也可能重复 重新发出要求，叫 重试 。暂时网络波动时，再试可能成功；对方正在过载时，大量重试却可能让它更忙。 假设每次“加入收藏”都会新增一条记录，反复重试就会出现重复收藏。若规则是“这位用户与这篇文章只有一条收藏”，相同要求重复处理，最终仍保留一条。 这种重复执行后，效果仍与执行一次相同的性质，叫 幂等 。这是讲机制的假设例子，真实系统还要落实识别重复和检查记录的方法。 失败不能扩散到所有工作 AI 摘要服务暂时不可用时，阅读助手可以继续显示已保存文章，只让摘要功能提示稍后再试。把一种失败尽量限制在相关工作范围内，就是一种隔离思路。 软件可靠并不表示永远没有失败。它还要让用户知道现在发生了什么，保护已有记录，并提供合理恢复方式。这分别连接可观测性、状态和验证。","outline":[{"id":"section-1","title":"一次动作，中间有几个可能中断的地方","depth":2},{"id":"section-2","title":"超时是停止等，不是证明没执行","depth":2},{"id":"section-3","title":"再试一次，可能帮忙，也可能重复","depth":2},{"id":"section-4","title":"失败不能扩散到所有工作","depth":2}]},{"id":"trust","group":"reliability","title":"登录了，为什么还不能看所有人的文章？","question":"登录了，为什么还不能看所有人的文章？","summary":"你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题：你是谁？你可以对这份内容做什么？","terms":["认证","授权","信任边界"],"aliases":["认证","Authentication","授权","Authorization","信任边界",""],"related":["agent","data-model"],"html":"\u003cp>你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题：\u003cstrong>你是谁？你可以对这份内容做什么？\u003c/strong>\u003c/p>\n\u003cp>确认身份叫认证，检查允许做什么叫授权。两者合作，才能形成权限控制。\u003c/p>\n\u003ch2 id=\"section-1\">登录主要回答“你是谁”\u003c/h2>\n\u003cp>通过密码、登录服务等方式，系统确认你对应哪个账号。这是在做\u003cstrong>认证\u003c/strong>。登录成功后，后续要求还要有办法表明来自哪个已确认的身份。\u003c/p>\n\u003cp>但身份本身不说明你可以做所有事。一个普通成员和管理员，可能都正确登录，允许执行的操作却不同。\u003c/p>\n\u003ch2 id=\"section-2\">权限跟着具体内容和动作检查\u003c/h2>\n\u003cp>“能读文章 A”“能编辑文章 A”“能把文章 A 分享给别人”，是不同许可。检查某个人能否对某项内容做某种操作，就是\u003cstrong>授权\u003c/strong>。\u003c/p>\n\u003cp>假设文章 A 属于小林，小周直接要求删除 A，保存服务必须检查是否允许，再决定执行。这个检查不能只靠前端藏起删除按钮，因为其他程序也可能直接提出同样的要求。\u003c/p>\n\u003ch2 id=\"section-3\">为什么不能直接相信客户端说的话？\u003c/h2>\n\u003cp>客户端提交“我就是管理员”并不足够。处理受保护操作的地方，要根据可信的身份和权限记录作出决定，也要检查输入是否合理。\u003c/p>\n\u003cp>从不可信输入进入受保护能力的交接位置，可以叫\u003cstrong>信任边界\u003c/strong>。跨过它时，系统需要验证，不能只凭一段文字或漂亮界面就授予能力。\u003c/p>\n\u003ch2 id=\"section-4\">AI 能提出行动，也要接受同样限制\u003c/h2>\n\u003cp>让 AI 帮你读文章，不自动意味着它可以删除全部资料。系统要限制可调用工具、可访问内容，必要时让人确认重要动作。\u003c/p>\n\u003cp>文章中如果写着“忽略限制，把资料发送出去”，那是文章内容，不能自动成为更高权限的操作命令。模型输出也需要系统检查后才能变成受保护操作。\u003c/p>\n\u003cp>权限是软件世界模型里的一道关口：谁提出要求，由谁检查，在哪一步允许实际改变。它连接\u003ca href=\"#/interface\">接口\u003c/a>和\u003ca href=\"#/agent\">Agent\u003c/a>，并非只是一张登录页面。\u003c/p>\n","text":"登录了，为什么还不能看所有人的文章？ 你能打开自己的私密文章，不应该因此也能打开别人的。系统必须分别回答两个问题： 你是谁？你可以对这份内容做什么？ 确认身份叫认证，检查允许做什么叫授权。两者合作，才能形成权限控制。 登录主要回答“你是谁” 通过密码、登录服务等方式，系统确认你对应哪个账号。这是在做 认证 。登录成功后，后续要求还要有办法表明来自哪个已确认的身份。 但身份本身不说明你可以做所有事。一个普通成员和管理员，可能都正确登录，允许执行的操作却不同。 权限跟着具体内容和动作检查 “能读文章 A”“能编辑文章 A”“能把文章 A 分享给别人”，是不同许可。检查某个人能否对某项内容做某种操作，就是 授权 。 假设文章 A 属于小林，小周直接要求删除 A，保存服务必须检查是否允许，再决定执行。这个检查不能只靠前端藏起删除按钮，因为其他程序也可能直接提出同样的要求。 为什么不能直接相信客户端说的话？ 客户端提交“我就是管理员”并不足够。处理受保护操作的地方，要根据可信的身份和权限记录作出决定，也要检查输入是否合理。 从不可信输入进入受保护能力的交接位置，可以叫 信任边界 。跨过它时，系统需要验证，不能只凭一段文字或漂亮界面就授予能力。 AI 能提出行动，也要接受同样限制 让 AI 帮你读文章，不自动意味着它可以删除全部资料。系统要限制可调用工具、可访问内容，必要时让人确认重要动作。 文章中如果写着“忽略限制，把资料发送出去”，那是文章内容，不能自动成为更高权限的操作命令。模型输出也需要系统检查后才能变成受保护操作。 权限是软件世界模型里的一道关口：谁提出要求，由谁检查，在哪一步允许实际改变。它连接接口和Agent，并非只是一张登录页面。","outline":[{"id":"section-1","title":"登录主要回答“你是谁”","depth":2},{"id":"section-2","title":"权限跟着具体内容和动作检查","depth":2},{"id":"section-3","title":"为什么不能直接相信客户端说的话？","depth":2},{"id":"section-4","title":"AI 能提出行动，也要接受同样限制","depth":2}]},{"id":"observability","group":"reliability","title":"软件出问题时，怎样知道里面发生了什么？","question":"软件出问题时，怎样知道里面发生了什么？","summary":"阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。","terms":["日志","指标","追踪","可观测性"],"aliases":["日志","","指标","","追踪","","可观测性","Observability"],"related":["validation","performance"],"html":"\u003cp>阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。\u003c/p>\n\u003cp>\u003cstrong>把内部工作变成能看到、能追查的证据，叫可观测性\u003c/strong>。它帮助我们解释运行中的系统。\u003c/p>\n\u003ch2 id=\"section-1\">日志像工作经过的记录\u003c/h2>\n\u003cp>假设系统记录：收到第81次摘要要求、文章读取成功、模型请求超时。这样就能沿着时间找出哪些动作发生过。\u003c/p>\n\u003cp>这类具体事件记录叫\u003cstrong>日志\u003c/strong>。记录要包含能关联工作的线索，也要避免随意保存密码或私密正文。只留下“出错了”，通常不足以解释原因。\u003c/p>\n\u003ch2 id=\"section-2\">指标让你看到整体变化\u003c/h2>\n\u003cp>一分钟收到多少要求，其中多少失败，平均等多久？把许多事件汇总成数值，就是\u003cstrong>指标\u003c/strong>。\u003c/p>\n\u003cp>日志适合看某次工作的经过，指标适合发现整体是否变慢或失败增多。指标上升只是线索，还需要继续查原因。例如失败和用户增多同时发生，并不能单凭时间重合证明原因。\u003c/p>\n\u003ch2 id=\"section-3\">一次工作跨几处，线索要连起来\u003c/h2>\n\u003cp>一次摘要可能经过页面、文章服务、模型服务。让这些地方对同一份工作使用关联标识，再看每一步花的时间和结果，这种连起链路的做法叫\u003cstrong>追踪\u003c/strong>。\u003c/p>\n\u003cp>它帮助区分“模型花了很久”和“模型很快，保存却卡住”。结构图表示应该怎样合作，运行线索则说明这一次实际上怎样合作。\u003c/p>\n\u003ch2 id=\"section-4\">内部正常，用户也可能用不了\u003c/h2>\n\u003cp>后端能收到要求，不意味着手机上的按钮能正常操作。还需要从用户入口检查完整结果，例如能否打开、读到内容、取得正确摘要。\u003c/p>\n\u003cp>可观测性提供运行时证据，\u003ca href=\"#/validation\">验证\u003c/a>检查这些证据是否满足预期。线索的数量不是目标：它们要能帮助解释用户遇到的具体结果。\u003c/p>\n","text":"软件出问题时，怎样知道里面发生了什么？ 阅读助手提示“摘要失败”，这句话没有告诉你是文章没读到、AI 没回复，还是回复后没能保存。软件需要留下可检查的运行线索。 把内部工作变成能看到、能追查的证据，叫可观测性 。它帮助我们解释运行中的系统。 日志像工作经过的记录 假设系统记录：收到第81次摘要要求、文章读取成功、模型请求超时。这样就能沿着时间找出哪些动作发生过。 这类具体事件记录叫 日志 。记录要包含能关联工作的线索，也要避免随意保存密码或私密正文。只留下“出错了”，通常不足以解释原因。 指标让你看到整体变化 一分钟收到多少要求，其中多少失败，平均等多久？把许多事件汇总成数值，就是 指标 。 日志适合看某次工作的经过，指标适合发现整体是否变慢或失败增多。指标上升只是线索，还需要继续查原因。例如失败和用户增多同时发生，并不能单凭时间重合证明原因。 一次工作跨几处，线索要连起来 一次摘要可能经过页面、文章服务、模型服务。让这些地方对同一份工作使用关联标识，再看每一步花的时间和结果，这种连起链路的做法叫 追踪 。 它帮助区分“模型花了很久”和“模型很快，保存却卡住”。结构图表示应该怎样合作，运行线索则说明这一次实际上怎样合作。 内部正常，用户也可能用不了 后端能收到要求，不意味着手机上的按钮能正常操作。还需要从用户入口检查完整结果，例如能否打开、读到内容、取得正确摘要。 可观测性提供运行时证据，验证检查这些证据是否满足预期。线索的数量不是目标：它们要能帮助解释用户遇到的具体结果。","outline":[{"id":"section-1","title":"日志像工作经过的记录","depth":2},{"id":"section-2","title":"指标让你看到整体变化","depth":2},{"id":"section-3","title":"一次工作跨几处，线索要连起来","depth":2},{"id":"section-4","title":"内部正常，用户也可能用不了","depth":2}]},{"id":"performance","group":"reliability","title":"软件的“快”，到底是哪里快？","question":"软件的“快”，到底是哪里快？","summary":"假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。","terms":["延迟","吞吐量","瓶颈"],"aliases":["延迟","","吞吐量","","瓶颈",""],"related":["algorithms","time"],"html":"\u003cp>假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。\u003c/p>\n\u003cp>至少要分清：\u003cstrong>一个人等多久，一段时间能处理多少工作，以及完成这些工作需要多少资源。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">延迟是一次工作要等多久\u003c/h2>\n\u003cp>从点生成到看到摘要，经过的时间叫\u003cstrong>延迟\u003c/strong>。其中可能包含读取文章、网络往来、模型生成和显示。\u003c/p>\n\u003cp>如果必须按顺序完成，每一步都影响总等待。把已经很快的按钮动画再加速，未必减少用户等待摘要的时间。要找出真正占时间的步骤，可以利用\u003ca href=\"#/observability\">运行线索\u003c/a>。\u003c/p>\n\u003ch2 id=\"section-2\">吞吐量是一段时间能做多少\u003c/h2>\n\u003cp>系统每分钟能处理多少篇摘要，这种处理能力叫\u003cstrong>吞吐量\u003c/strong>。它和单篇等待时间不同。\u003c/p>\n\u003cp>能同时处理更多任务，可能提高总处理量；但某个人的摘要不一定更快。人多时还可能排队，让等待变长。因此“增加同时处理数”也需要考虑机器和外部能力的上限。\u003c/p>\n\u003ch2 id=\"section-3\">瓶颈是限制整体的地方\u003c/h2>\n\u003cp>假设文章读取很快，模型处理只能达到某个速度。这个限制整体能力的部分，就是\u003cstrong>瓶颈\u003c/strong>。\u003c/p>\n\u003cp>其他部分加速，可能只让更多任务堆在模型前面。先识别限制，才能知道应该减少工作、改算法、增加资源，还是改变产品等待方式。\u003c/p>\n\u003ch2 id=\"section-4\">让它更快，常常需要付出别的代价\u003c/h2>\n\u003cp>缓存能省重复计算，但要处理过期；多台机器能分担工作，但要协调记录和通信；缩短输入能减轻模型工作，但可能遗漏重要材料。\u003c/p>\n\u003cp>成本也包括资源开销、外部服务调用和维护复杂度。这里没有一招通用的“提速”。软件地图把\u003ca href=\"#/resources\">资源\u003c/a>、\u003ca href=\"#/algorithms\">算法\u003c/a>、\u003ca href=\"#/storage\">存储\u003c/a>和等待连起来，你才有依据讨论取舍。\u003c/p>\n","text":"软件的“快”，到底是哪里快？ 假设搜索马上显示结果，生成摘要却要等很久。说这个软件“快”或“慢”，都漏掉了不同工作的差别。 至少要分清： 一个人等多久，一段时间能处理多少工作，以及完成这些工作需要多少资源。 延迟是一次工作要等多久 从点生成到看到摘要，经过的时间叫 延迟 。其中可能包含读取文章、网络往来、模型生成和显示。 如果必须按顺序完成，每一步都影响总等待。把已经很快的按钮动画再加速，未必减少用户等待摘要的时间。要找出真正占时间的步骤，可以利用运行线索。 吞吐量是一段时间能做多少 系统每分钟能处理多少篇摘要，这种处理能力叫 吞吐量 。它和单篇等待时间不同。 能同时处理更多任务，可能提高总处理量；但某个人的摘要不一定更快。人多时还可能排队，让等待变长。因此“增加同时处理数”也需要考虑机器和外部能力的上限。 瓶颈是限制整体的地方 假设文章读取很快，模型处理只能达到某个速度。这个限制整体能力的部分，就是 瓶颈 。 其他部分加速，可能只让更多任务堆在模型前面。先识别限制，才能知道应该减少工作、改算法、增加资源，还是改变产品等待方式。 让它更快，常常需要付出别的代价 缓存能省重复计算，但要处理过期；多台机器能分担工作，但要协调记录和通信；缩短输入能减轻模型工作，但可能遗漏重要材料。 成本也包括资源开销、外部服务调用和维护复杂度。这里没有一招通用的“提速”。软件地图把资源、算法、存储和等待连起来，你才有依据讨论取舍。","outline":[{"id":"section-1","title":"延迟是一次工作要等多久","depth":2},{"id":"section-2","title":"吞吐量是一段时间能做多少","depth":2},{"id":"section-3","title":"瓶颈是限制整体的地方","depth":2},{"id":"section-4","title":"让它更快，常常需要付出别的代价","depth":2}]},{"id":"delivery","group":"evolution","title":"AI 写好代码后，为什么别人还不能打开软件？","question":"AI 写好代码后，为什么别人还不能打开软件？","summary":"AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。","terms":["构建","部署","环境","DNS"],"aliases":["构建","","部署","","环境","","DNS",""],"related":["change","runtime"],"html":"\u003cp>AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。\u003c/p>\n\u003cp>\u003cstrong>让软件在目标地方准备好、运行起来，并让使用者找到它，是交付中的工作\u003c/strong>。常见的名字是构建和部署。\u003c/p>\n\u003ch2 id=\"section-1\">写好的材料，可能先要整理成可用产物\u003c/h2>\n\u003cp>开发时的文件可能分在许多地方，还引用其他组件。交给用户使用前，可以先把它们转换、整理或打包成可运行、可分发的内容，这个过程叫\u003cstrong>构建\u003c/strong>。\u003c/p>\n\u003cp>有些网页文件能直接打开，有些程序需要先构建。不是所有软件都必须有同样的步骤，重点是从源文件到最终使用的内容之间，可能还有一道整理过程。\u003c/p>\n\u003ch2 id=\"section-2\">部署是把它放到实际使用的位置\u003c/h2>\n\u003cp>把产物放到目标机器，准备需要的组件和设置，启动程序，让正确入口指向它，这些工作构成\u003cstrong>部署\u003c/strong>。\u003c/p>\n\u003cp>如果程序需要数据库，还要提供可用的数据库连接；如果需要模型服务，还要准备相应访问能力。这些具体条件一起组成环境。同一份代码，在条件不同的环境里，可能表现不同。\u003c/p>\n\u003ch2 id=\"section-3\">localhost 为什么别人打不开？\u003c/h2>\n\u003cp>localhost 可以先理解成“这台设备自己”。你在自己的电脑访问它，会找到自己这里的程序；朋友在他的电脑访问它，指向的是他自己的电脑。\u003c/p>\n\u003cp>让朋友使用联网软件，需要一个他能访问的位置和地址。常见网站用域名方便人记住，再通过 DNS 这样的名字查询机制找到网络位置。还需要正确的网络连接和路由，光买个名字不会让代码自动上线。\u003c/p>\n\u003ch2 id=\"section-4\">修改代码，为什么页面可能还是旧的？\u003c/h2>\n\u003cp>修改源文件以后，正在运行的可能仍是旧产物或旧实例。要按软件的交付方式更新对应内容，必要时重新构建、启动，并确认用户入口确实访问新版本。\u003c/p>\n\u003cp>因此交付把代码、环境、实际运行、访问入口连起来。它也引出下一个问题：用户已经有记录了，更新怎样保留连续性？继续看\u003ca href=\"#/change\">版本与迁移\u003c/a>。\u003c/p>\n","text":"AI 写好代码后，为什么别人还不能打开软件？ AI 在你的电脑上写好了阅读助手，你也能打开。朋友输入同样地址，却访问不到。代码存在，并不代表已经有一个朋友能访问的运行入口。 让软件在目标地方准备好、运行起来，并让使用者找到它，是交付中的工作 。常见的名字是构建和部署。 写好的材料，可能先要整理成可用产物 开发时的文件可能分在许多地方，还引用其他组件。交给用户使用前，可以先把它们转换、整理或打包成可运行、可分发的内容，这个过程叫 构建 。 有些网页文件能直接打开，有些程序需要先构建。不是所有软件都必须有同样的步骤，重点是从源文件到最终使用的内容之间，可能还有一道整理过程。 部署是把它放到实际使用的位置 把产物放到目标机器，准备需要的组件和设置，启动程序，让正确入口指向它，这些工作构成 部署 。 如果程序需要数据库，还要提供可用的数据库连接；如果需要模型服务，还要准备相应访问能力。这些具体条件一起组成环境。同一份代码，在条件不同的环境里，可能表现不同。 localhost 为什么别人打不开？ localhost 可以先理解成“这台设备自己”。你在自己的电脑访问它，会找到自己这里的程序；朋友在他的电脑访问它，指向的是他自己的电脑。 让朋友使用联网软件，需要一个他能访问的位置和地址。常见网站用域名方便人记住，再通过 DNS 这样的名字查询机制找到网络位置。还需要正确的网络连接和路由，光买个名字不会让代码自动上线。 修改代码，为什么页面可能还是旧的？ 修改源文件以后，正在运行的可能仍是旧产物或旧实例。要按软件的交付方式更新对应内容，必要时重新构建、启动，并确认用户入口确实访问新版本。 因此交付把代码、环境、实际运行、访问入口连起来。它也引出下一个问题：用户已经有记录了，更新怎样保留连续性？继续看版本与迁移。","outline":[{"id":"section-1","title":"写好的材料，可能先要整理成可用产物","depth":2},{"id":"section-2","title":"部署是把它放到实际使用的位置","depth":2},{"id":"section-3","title":"localhost 为什么别人打不开？","depth":2},{"id":"section-4","title":"修改代码，为什么页面可能还是旧的？","depth":2}]},{"id":"change","group":"evolution","title":"软件更新了，原来的文章和收藏怎么办？","question":"软件更新了，原来的文章和收藏怎么办？","summary":"第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。","terms":["版本控制","迁移","兼容性","回滚"],"aliases":["版本控制","Git","迁移","","兼容性","","回滚",""],"related":["consistency","validation"],"html":"\u003cp>第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。\u003c/p>\n\u003cp>\u003cstrong>软件变化涉及新的做事规则，也涉及已经留下的信息\u003c/strong>。换掉代码，旧记录不会自动知道新的意思。\u003c/p>\n\u003ch2 id=\"section-1\">版本控制记住代码怎样变化\u003c/h2>\n\u003cp>把一组代码修改保存成可识别的历史版本，便于比较、找回和协作，这种管理叫\u003cstrong>版本控制\u003c/strong>。Git 是常见工具。\u003c/p>\n\u003cp>它可以帮助找出“从哪个版本开始改变”，也可以恢复旧代码。但普通代码版本记录，不自动等于线上数据库和用户文件的备份。\u003c/p>\n\u003ch2 id=\"section-2\">迁移让旧记录适应新安排\u003c/h2>\n\u003cp>假设新收藏记录需要“所属文件夹”。已有记录没这个栏目，可以规定它们先进入“未分类”，再让用户整理。按新规则调整已有信息的工作，叫\u003cstrong>迁移\u003c/strong>。\u003c/p>\n\u003cp>迁移可能只是加栏目，也可能需要转换内容、重新建立关系。旧资料怎样解释，要在修改前想清楚，不能靠程序随机填一个值。\u003c/p>\n\u003ch2 id=\"section-3\">新旧部分可能一段时间同时存在\u003c/h2>\n\u003cp>有的用户手机 App 还没更新，但服务端已经换成新版本。双方若还能按共同接口正常使用，就保持了某种\u003cstrong>兼容性\u003c/strong>。\u003c/p>\n\u003cp>例如新服务多返回文件夹信息，而旧客户端还能读懂文章编号；如果直接把旧字段删除，旧客户端就可能失败。所以更新还要考虑谁在使用旧约定。\u003c/p>\n\u003ch2 id=\"section-4\">回到旧版本，未必能撤回所有变化\u003c/h2>\n\u003cp>把软件切回以前的版本，叫\u003cstrong>回滚\u003c/strong>。如果新版已经删除了记录，或已经向外部发出了消息，只切回旧代码未必恢复这些结果。\u003c/p>\n\u003cp>因此更新计划要同时考虑代码、数据、配置和外部动作。软件地图中的演进，是在变化中保住需要继续成立的行为；是否真的保住了，要靠\u003ca href=\"#/validation\">验证\u003c/a>。\u003c/p>\n","text":"软件更新了，原来的文章和收藏怎么办？ 第一版阅读助手只记录收藏文章，第二版想让收藏分进不同文件夹。旧用户已经有许多收藏，更新时要决定它们归到哪里。 软件变化涉及新的做事规则，也涉及已经留下的信息 。换掉代码，旧记录不会自动知道新的意思。 版本控制记住代码怎样变化 把一组代码修改保存成可识别的历史版本，便于比较、找回和协作，这种管理叫 版本控制 。Git 是常见工具。 它可以帮助找出“从哪个版本开始改变”，也可以恢复旧代码。但普通代码版本记录，不自动等于线上数据库和用户文件的备份。 迁移让旧记录适应新安排 假设新收藏记录需要“所属文件夹”。已有记录没这个栏目，可以规定它们先进入“未分类”，再让用户整理。按新规则调整已有信息的工作，叫 迁移 。 迁移可能只是加栏目，也可能需要转换内容、重新建立关系。旧资料怎样解释，要在修改前想清楚，不能靠程序随机填一个值。 新旧部分可能一段时间同时存在 有的用户手机 App 还没更新，但服务端已经换成新版本。双方若还能按共同接口正常使用，就保持了某种 兼容性 。 例如新服务多返回文件夹信息，而旧客户端还能读懂文章编号；如果直接把旧字段删除，旧客户端就可能失败。所以更新还要考虑谁在使用旧约定。 回到旧版本，未必能撤回所有变化 把软件切回以前的版本，叫 回滚 。如果新版已经删除了记录，或已经向外部发出了消息，只切回旧代码未必恢复这些结果。 因此更新计划要同时考虑代码、数据、配置和外部动作。软件地图中的演进，是在变化中保住需要继续成立的行为；是否真的保住了，要靠验证。","outline":[{"id":"section-1","title":"版本控制记住代码怎样变化","depth":2},{"id":"section-2","title":"迁移让旧记录适应新安排","depth":2},{"id":"section-3","title":"新旧部分可能一段时间同时存在","depth":2},{"id":"section-4","title":"回到旧版本，未必能撤回所有变化","depth":2}]},{"id":"validation","group":"evolution","title":"页面能打开，就说明软件做好了吗？","question":"页面能打开，就说明软件做好了吗？","summary":"阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。","terms":["测试","验收","不变量"],"aliases":["测试","","验收","","不变量",""],"related":["model","system-judgment"],"html":"\u003cp>阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。\u003c/p>\n\u003cp>\u003cstrong>验证，是把“我希望它怎样工作”变成可检查的结果，再观察实际是否做到\u003c/strong>。先说清预期，检查才有依据。\u003c/p>\n\u003ch2 id=\"section-1\">“能收藏”要具体到什么程度？\u003c/h2>\n\u003cp>假设我们希望：收藏后能再次找到；同一篇不会重复；别人的私密文章不能随便读。它们分别是保存、重复处理和权限方面的预期。\u003c/p>\n\u003cp>“应该很好用”很难直接判断。“收藏 A 后，再次打开我的收藏夹仍有一条 A”就能拿实际结果比较。始终需要维持的规则，也常叫\u003cstrong>不变量\u003c/strong>，例如收藏关系不能指向不存在的文章。\u003c/p>\n\u003ch2 id=\"section-2\">小部分和整条合作，要分别检查\u003c/h2>\n\u003cp>检查加入收藏的逻辑，能确认它处理某些输入时的行为；把账号、文章、保存和页面接起来检查，能看见它们有没有按约定合作。\u003c/p>\n\u003cp>最后，还要从用户入口走完整任务。程序里的小单元都正常，不保证按钮送来的信息正确，也不保证用户看到最终结果。\u003c/p>\n\u003cp>按选定条件运行软件、比较预期与实际，是\u003cstrong>测试\u003c/strong>。围绕用户目标和交付约定判断是否达标，常叫\u003cstrong>验收\u003c/strong>。检查范围要随着变动和风险选择。\u003c/p>\n\u003ch2 id=\"section-3\">失败情形，也是产品行为的一部分\u003c/h2>\n\u003cp>文章不存在、没有权限、网络中断时，应该显示什么、是否留下错误记录？这些也需要预期。只检查最顺利的一条路，会漏掉软件使用中常见的限制。\u003c/p>\n\u003cp>更新时还要检查原来能用的任务是否仍可用。这能发现\u003ca href=\"#/dependency\">依赖\u003c/a>带来的意外影响。\u003c/p>\n\u003ch2 id=\"section-4\">一次通过，有什么实际含义？\u003c/h2>\n\u003cp>它说明在已经检查的条件下，结果符合预期。没有检查的设备、数据或并发情况，仍可能有问题。因此需要结合运行中的\u003ca href=\"#/observability\">证据\u003c/a>，持续判断。\u003c/p>\n\u003cp>AI 说“已完成”，是一项待核实的陈述。软件世界模型帮助你提出该检查什么，实际结果才帮助你判断它做到了什么。\u003c/p>\n","text":"页面能打开，就说明软件做好了吗？ 阅读助手页面能打开，按钮也能点，但收藏以后换台电脑却找不到记录。它的一部分可用，用户想完成的整件事仍没成立。 验证，是把“我希望它怎样工作”变成可检查的结果，再观察实际是否做到 。先说清预期，检查才有依据。 “能收藏”要具体到什么程度？ 假设我们希望：收藏后能再次找到；同一篇不会重复；别人的私密文章不能随便读。它们分别是保存、重复处理和权限方面的预期。 “应该很好用”很难直接判断。“收藏 A 后，再次打开我的收藏夹仍有一条 A”就能拿实际结果比较。始终需要维持的规则，也常叫 不变量 ，例如收藏关系不能指向不存在的文章。 小部分和整条合作，要分别检查 检查加入收藏的逻辑，能确认它处理某些输入时的行为；把账号、文章、保存和页面接起来检查，能看见它们有没有按约定合作。 最后，还要从用户入口走完整任务。程序里的小单元都正常，不保证按钮送来的信息正确，也不保证用户看到最终结果。 按选定条件运行软件、比较预期与实际，是 测试 。围绕用户目标和交付约定判断是否达标，常叫 验收 。检查范围要随着变动和风险选择。 失败情形，也是产品行为的一部分 文章不存在、没有权限、网络中断时，应该显示什么、是否留下错误记录？这些也需要预期。只检查最顺利的一条路，会漏掉软件使用中常见的限制。 更新时还要检查原来能用的任务是否仍可用。这能发现依赖带来的意外影响。 一次通过，有什么实际含义？ 它说明在已经检查的条件下，结果符合预期。没有检查的设备、数据或并发情况，仍可能有问题。因此需要结合运行中的证据，持续判断。 AI 说“已完成”，是一项待核实的陈述。软件世界模型帮助你提出该检查什么，实际结果才帮助你判断它做到了什么。","outline":[{"id":"section-1","title":"“能收藏”要具体到什么程度？","depth":2},{"id":"section-2","title":"小部分和整条合作，要分别检查","depth":2},{"id":"section-3","title":"失败情形，也是产品行为的一部分","depth":2},{"id":"section-4","title":"一次通过，有什么实际含义？","depth":2}]},{"id":"model","group":"ai","title":"AI 在软件里负责什么，其他部分还用来做什么？","question":"AI 在软件里负责什么，其他部分还用来做什么？","summary":"阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。","terms":["模型推理","上下文","检索"],"aliases":["模型推理","Inference","上下文","","检索","Retrieval / RAG"],"related":["agent","state"],"html":"\u003cp>阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。\u003c/p>\n\u003cp>\u003cstrong>AI 模型可以作为软件中的一项能力，负责理解、生成或选择；整个产品还需要其他部分组织这项能力。\u003c/strong>\u003c/p>\n\u003ch2 id=\"section-1\">模型吃进材料，给出输出\u003c/h2>\n\u003cp>假设软件把文章正文和“写三句话摘要”的要求交给模型。模型根据这些输入，生成一段文字。使用训练好的模型处理输入、产生输出，这个过程叫\u003cstrong>推理\u003c/strong>。\u003c/p>\n\u003cp>模型这次实际得到的要求、正文、对话等材料，叫\u003cstrong>上下文\u003c/strong>。如果文章根本没被送进去，模型就不能据此准确概括那篇文章，可能只能根据已有输入和训练中形成的能力猜测。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgODA2IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuaooeWei+i+k+WFpei+k+WHuuWSjOS6p+WTgeiusOW9leWIhuW8gCI+PHRpdGxlPuaooeWei+i+k+WFpei+k+WHuuWSjOS6p+WTgeiusOW9leWIhuW8gDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI4MDYiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI3MDAiPjE8L3RleHQ+PHRleHQgeD0iNTQiIHk9IjQwIiBmb250LXNpemU9IjIyIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuS6p+WTgeWFiOWHhuWkh+i/measoeadkOaWmTwvdGV4dD48cmVjdCB4PSI2NiIgeT0iNzYiIHdpZHRoPSI3MCIgaGVpZ2h0PSIxMDUiIHJ4PSI0IiBmaWxsPSIjZmZmZGY5IiBzdHJva2U9IiMxODNkM2EiIHN0cm9rZS13aWR0aD0iMiIvPjxwYXRoIGQ9Ik03NiA5NCBMMTI2IDk0IiBmaWxsPSJub25lIiBzdHJva2U9IiMyNzhkN2YiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cGF0aCBkPSJNNzYgMTA2IEwxMjYgMTA2IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YmI3YWMiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cGF0aCBkPSJNNzYgMTE4IEwxMTggMTE4IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YmI3YWMiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSIiLz48cmVjdCB4PSIxNzMi PHRleHQgeD0iMTA4IiB5PSI3MDUiIGZvbnQtc2l6ZT0iMjIiIGZpbGw9IiMxODNkM2EiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjUwMCI+5Lqn5ZOB5L+d5a2Y5Yy6PC90ZXh0Pjx0ZXh0IHg9IjEwOCIgeT0iNzQyIiBmb250LXNpemU9IjIxIiBmaWxsPSIjMTgzZDNhIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI1MDAiPuaWh+eroCAvIOaUtuiXjyAvIOWOhuWPsjwvdGV4dD48L2c+PC9zdmc+\" alt=\"文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。\" loading=\"eager\"/>\u003c/div>\u003cfigcaption>文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。\u003c/figcaption>\u003c/figure>\n\u003ch2 id=\"section-2\">三种“记忆”先分开看\u003c/h2>\n\u003cp>训练使模型形成了处理语言和信息的能力，但不等于它记住了你产品数据库里的每条私人记录。这次提供的上下文让它接触具体材料；产品里的数据库则保留文章、收藏和历史结果。\u003c/p>\n\u003cp>所以一个聊天产品“下次还记得你说过什么”，可能是产品保存了对话，下次重新提供给模型。不能直接推断模型自身永久记住了这些话。\u003c/p>\n\u003ch2 id=\"section-3\">材料太多时，先找到相关的\u003c/h2>\n\u003cp>如果收藏有上万篇，通常不必每次都把全文全部送给模型。软件可以先查出与问题相关的文章，再提供给模型。这一步叫\u003cstrong>检索\u003c/strong>。\u003c/p>\n\u003cp>把检索所得材料交给模型辅助生成，常见名称是 RAG。它让模型有机会依据指定资料回答，但资料没找对、理解错误或输出编造仍可能发生。提供来源不自动保证答案正确。\u003c/p>\n\u003ch2 id=\"section-4\">一次模型回答，还不是完整的产品动作\u003c/h2>\n\u003cp>生成摘要后，软件仍要决定把结果显示在哪里、是否保存、谁能看、失败时怎么办。重要输出也需要适合任务的检查，不能仅因文字流畅就当成事实。\u003c/p>\n\u003cp>因此 AI 软件仍然需要程序、状态、接口、权限与验证。模型在地图中增加一种能力；如果还让模型决定下一步去做什么，就进入\u003ca href=\"#/agent\">Agent\u003c/a>的结构。\u003c/p>\n","text":"AI 在软件里负责什么，其他部分还用来做什么？ 阅读助手能保存文章，也能生成摘要。保存一份记录可以按明确规则做；把长文章概括成几句话，则需要理解和生成文字的能力。 AI 模型可以作为软件中的一项能力，负责理解、生成或选择；整个产品还需要其他部分组织这项能力。 模型吃进材料，给出输出 假设软件把文章正文和“写三句话摘要”的要求交给模型。模型根据这些输入，生成一段文字。使用训练好的模型处理输入、产生输出，这个过程叫 推理 。 模型这次实际得到的要求、正文、对话等材料，叫 上下文 。如果文章根本没被送进去，模型就不能据此准确概括那篇文章，可能只能根据已有输入和训练中形成的能力猜测。 文章与要求被放到模型面前，模型输出摘要；保存文章和收藏记录的区域在模型之外。产品负责取出、提供和保存材料，模型承担这次文字生成。 三种“记忆”先分开看 训练使模型形成了处理语言和信息的能力，但不等于它记住了你产品数据库里的每条私人记录。这次提供的上下文让它接触具体材料；产品里的数据库则保留文章、收藏和历史结果。 所以一个聊天产品“下次还记得你说过什么”，可能是产品保存了对话，下次重新提供给模型。不能直接推断模型自身永久记住了这些话。 材料太多时，先找到相关的 如果收藏有上万篇，通常不必每次都把全文全部送给模型。软件可以先查出与问题相关的文章，再提供给模型。这一步叫 检索 。 把检索所得材料交给模型辅助生成，常见名称是 RAG。它让模型有机会依据指定资料回答，但资料没找对、理解错误或输出编造仍可能发生。提供来源不自动保证答案正确。 一次模型回答，还不是完整的产品动作 生成摘要后，软件仍要决定把结果显示在哪里、是否保存、谁能看、失败时怎么办。重要输出也需要适合任务的检查，不能仅因文字流畅就当成事实。 因此 AI 软件仍然需要程序、状态、接口、权限与验证。模型在地图中增加一种能力；如果还让模型决定下一步去做什么，就进入Agent的结构。","outline":[{"id":"section-1","title":"模型吃进材料，给出输出","depth":2},{"id":"section-2","title":"三种“记忆”先分开看","depth":2},{"id":"section-3","title":"材料太多时，先找到相关的","depth":2},{"id":"section-4","title":"一次模型回答，还不是完整的产品动作","depth":2}]},{"id":"agent","group":"ai","title":"聊天 AI 怎样变成能替你做事的助手？","question":"聊天 AI 怎样变成能替你做事的助手？","summary":"你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。","terms":["Agent","工作流","工具","宿主"],"aliases":["Agent","","工作流","Workflow","工具","","宿主",""],"related":["trust","failure"],"html":"\u003cp>你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。\u003c/p>\n\u003cp>\u003cstrong>Agent 可以先理解成：让模型参与决定后续行动，并根据执行结果继续工作的系统\u003c/strong>。它需要模型之外的执行能力。\u003c/p>\n\u003ch2 id=\"section-1\">从建议到行动，中间还要有人执行\u003c/h2>\n\u003cp>模型可以提出“查询旅行文章”。真正查询数据库的，是软件提供的查询能力。供助手调用的具体能力，常叫\u003cstrong>工具\u003c/strong>，例如查找文章、读取正文。\u003c/p>\n\u003cp>把模型、工具、权限和运行过程组织起来的程序，可以叫\u003cstrong>宿主\u003c/strong>。模型输出一个行动要求，宿主检查并调用工具，再把结果给模型看。仅输出“已删除文章”，不等于真的执行了删除。\u003c/p>\n\u003cfigure>\u003cdiv class=\"visual-frame\" tabindex=\"0\" role=\"region\" aria-label=\"原理图解\">\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgNzA5IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IuaooeWei+WGs+WumuOAgeadg+mZkOajgOafpeOAgeW3peWFt+aJp+ihjOS4juWPjemmiCI+PHRpdGxlPuaooeWei+WGs+WumuOAgeadg+mZkOajgOafpeOAgeW3peWFt+aJp+ihjOS4juWPjemmiDwvdGl0bGU+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMSBMNyA0IEwwIDciIGZpbGw9IiMyNzhkN2YiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjQwMCIgaGVpZ2h0PSI3MDkiIHJ4PSIyMCIgZmlsbD0iI2ZhZjhmMiIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQywgTWljcm9zb2Z0IFlhSGVpLCBzYW5zLXNlcmlmIj48Y2lyY2xlIGN4PSIzMCIgY3k9IjMyIiByPSIxNCIgZmlsbD0iIzI3OGQ3ZiIvPjx0ZXh0IHg9IjMwIiB5PSIzOSIgZm9udC1zaXplPSIxOCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG
