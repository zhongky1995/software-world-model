确认，应由系统落实。模型的判断不能替代执行位置的\u003ca href=\"#/trust\">权限检查\u003c/a>。\u003c/p>\n\u003cp>Agent 把决定、执行和反馈连接成循环；它依然有\u003ca href=\"#/state\">状态\u003c/a>、\u003ca href=\"#/time\">等待\u003c/a>、失败和成本。这也是为什么“接一个模型”与“做一个可靠助手”之间，还有许多普通软件工作。\u003c/p>\n","text":"聊天 AI 怎样变成能替你做事的助手？ 你说“找出我收藏里与旅行有关的文章，整理一份摘要”。普通回答可能直接给出建议；能做事的助手需要查收藏、取得文章、读结果，再决定下一步。 Agent 可以先理解成：让模型参与决定后续行动，并根据执行结果继续工作的系统 。它需要模型之外的执行能力。 从建议到行动，中间还要有人执行 模型可以提出“查询旅行文章”。真正查询数据库的，是软件提供的查询能力。供助手调用的具体能力，常叫 工具 ，例如查找文章、读取正文。 把模型、工具、权限和运行过程组织起来的程序，可以叫 宿主 。模型输出一个行动要求，宿主检查并调用工具，再把结果给模型看。仅输出“已删除文章”，不等于真的执行了删除。 模型根据已有材料提出查询行动；执行程序先检查权限，再调用查找工具；实际找到的文章回到模型，成为下一次判断的材料。检查不通过时，行动不能直接执行。 反馈让下一步可以改变 第一次查询找到20篇，模型可能只读其中几篇；如果没找到，它可能换搜索词。它根据新结果调整行动，而不是只在开头生成一段长计划。 这个循环需要明确什么时候停止：已经完成、没有可用资料、遇到错误，或者达到步数和资源限制。否则系统可能一直查下去，却没有更有用的结果。 固定工作流和 Agent 怎样区分？ 如果顺序事先规定为“收到文章→生成摘要→保存”，路径主要由软件预先安排，通常称为 工作流 。 如果某些后续步骤由模型根据结果动态选择，就更接近 Agent。真实产品可以组合两者：外层保持固定审核流程，里面允许模型选择查询方式。自主程度有高有低，并非每个 AI 产品都需要同样自由度。 能做事，也要知道哪些事不能做 读文章和删除全部收藏，是不同权限。工具范围、访问身份和重要动作的确认，应由系统落实。模型的判断不能替代执行位置的权限检查。 Agent 把决定、执行和反馈连接成循环；它依然有状态、等待、失败和成本。这也是为什么“接一个模型”与“做一个可靠助手”之间，还有许多普通软件工作。","outline":[{"id":"section-1","title":"从建议到行动，中间还要有人执行","depth":2},{"id":"section-2","title":"反馈让下一步可以改变","depth":2},{"id":"section-3","title":"固定工作流和 Agent 怎样区分？","depth":2},{"id":"section-4","title":"能做事，也要知道哪些事不能做","depth":2}]},{"id":"system-judgment","group":"ai","title":"有了这张地图，怎样更清楚地和 AI 讨论软件？","question":"有了这张地图，怎样更清楚地和 AI 讨论软件？","summary":"你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。","terms":["设计约定","取舍"],"aliases":["设计约定","","取舍",""],"related":["world-map","boundaries"],"html":"\u003cp>你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。\u003c/p>\n\u003cp>下面是一个虚构设计例子。它展示思考过程，不代表已经做出的产品或成功结果。\u003c/p>\n\u003ch2 id=\"section-1\">第一版想法：一个页面接上 AI\u003c/h2>\n\u003cp>我们的目标是：放入文章、收藏、生成摘要，手机和电脑都能再次找到。最开始的要求可能只有：“帮我做个漂亮页面，把文章发给模型，显示摘要。”\u003c/p>\n\u003cp>这个想法讲清了可见的一段过程，但还没说清文章和收藏要保存在哪里、谁可以读、生成失败怎么办。AI 即使完成字面要求，产品也可能缺少你需要的行为。\u003c/p>\n\u003ch2 id=\"section-2\">顺着地图，补上几条关键关系\u003c/h2>\n\u003cp>先看记事：文章、收藏和摘要都是下次可能还需要的内容，不能只存在本次页面的临时记忆里。\u003c/p>\n\u003cp>再看合作：手机和电脑需要访问同一份账号下的记录，或者有明确同步办法；模型要得到文章正文，软件要负责提供这些材料。\u003c/p>\n\u003cp>再看分工和信任：文章管理负责保存与取出，摘要部分负责模型调用；谁能访问私人文章，要在实际读取的位置检查。\u003c/p>\n\u003cp>最后看持续可用：模型没有回复时，原文章仍可阅读，界面要说明摘要未完成。这些判断分别来自状态、通信、边界、权限和失败，互相连成一个产品。\u003c/p>\n\u003ch2 id=\"section-3\">修订后的设想，已经能具体讨论\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工作\u003c/th>\n\u003cth>明确安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>保存\u003c/td>\n\u003ctd>每个账号的文章与收藏保留在共享记录里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成\u003c/td>\n\u003ctd>取正文，提供给模型，接收摘要\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显示\u003c/td>\n\u003ctd>区分生成中、成功与失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>权限\u003c/td>\n\u003ctd>读取和修改前检查当前用户能否操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失败\u003c/td>\n\u003ctd>摘要失败不删除文章，允许合理重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检查\u003c/td>\n\u003ctd>收藏后另一设备能找到；无权限不能读取；失败提示成立\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>现在可以向 AI 说明这些行为，再让它实现。各部分不必一开始就拆成独立服务；要先把职责和规则讲清。\u003c/p>\n\u003cp>这份结果可以叫设计约定：实现和检查时共同参照的行为说明。要选择放在哪、用什么工具、怎样安排等待，就需要权衡方便、成本和限制，这叫取舍。\u003c/p>\n\u003ch2 id=\"section-4\">换一个产品，同样的问题会得出不同安排\u003c/h2>\n\u003cp>如果目标改成“仅在本机使用的离线阅读器”，可以把文章和收藏放在本机，省去跨设备共享。但若还要调用远处 AI，生成这部分仍需要联网；要完全离线，就要另行考虑本机可用的模型能力。\u003c/p>\n\u003cp>你没有照抄上一张组件清单，而是根据目标改变了安排。世界模型的价值就在这里：你能解释为什么需要某个部分，也能解释为什么这次可以省去它。\u003c/p>\n\u003cp>最后仍要看实际结果。概念清楚可以改善要求和判断，可靠软件还要靠实现、\u003ca href=\"#/validation\">验证\u003c/a>和运行证据。\u003c/p>\n","text":"有了这张地图，怎样更清楚地和 AI 讨论软件？ 你不必先写出所有代码，也可以把产品要做的事和需要保持的规则讲清楚。软件世界模型帮助你把“做个阅读助手”这样的愿望，展开成可以讨论的工作安排。 下面是一个虚构设计例子。它展示思考过程，不代表已经做出的产品或成功结果。 第一版想法：一个页面接上 AI 我们的目标是：放入文章、收藏、生成摘要，手机和电脑都能再次找到。最开始的要求可能只有：“帮我做个漂亮页面，把文章发给模型，显示摘要。” 这个想法讲清了可见的一段过程，但还没说清文章和收藏要保存在哪里、谁可以读、生成失败怎么办。AI 即使完成字面要求，产品也可能缺少你需要的行为。 顺着地图，补上几条关键关系 先看记事：文章、收藏和摘要都是下次可能还需要的内容，不能只存在本次页面的临时记忆里。 再看合作：手机和电脑需要访问同一份账号下的记录，或者有明确同步办法；模型要得到文章正文，软件要负责提供这些材料。 再看分工和信任：文章管理负责保存与取出，摘要部分负责模型调用；谁能访问私人文章，要在实际读取的位置检查。 最后看持续可用：模型没有回复时，原文章仍可阅读，界面要说明摘要未完成。这些判断分别来自状态、通信、边界、权限和失败，互相连成一个产品。 修订后的设想，已经能具体讨论 工作 明确安排 --- --- 保存 每个账号的文章与收藏保留在共享记录里 生成 取正文，提供给模型，接收摘要 显示 区分生成中、成功与失败 权限 读取和修改前检查当前用户能否操作 失败 摘要失败不删除文章，允许合理重试 检查 收藏后另一设备能找到；无权限不能读取；失败提示成立 现在可以向 AI 说明这些行为，再让它实现。各部分不必一开始就拆成独立服务；要先把职责和规则讲清。 这份结果可以叫设计约定：实现和检查时共同参照的行为说明。要选择放在哪、用什么工具、怎样安排等待，就需要权衡方便、成本和限制，这叫取舍。 换一个产品，同样的问题会得出不同安排 如果目标改成“仅在本机使用的离线阅读器”，可以把文章和收藏放在本机，省去跨设备共享。但若还要调用远处 AI，生成这部分仍需要联网；要完全离线，就要另行考虑本机可用的模型能力。 你没有照抄上一张组件清单，而是根据目标改变了安排。世界模型的价值就在这里：你能解释为什么需要某个部分，也能解释为什么这次可以省去它。 最后仍要看实际结果。概念清楚可以改善要求和判断，可靠软件还要靠实现、验证和运行证据。","outline":[{"id":"section-1","title":"第一版想法：一个页面接上 AI","depth":2},{"id":"section-2","title":"顺着地图，补上几条关键关系","depth":2},{"id":"section-3","title":"修订后的设想，已经能具体讨论","depth":2},{"id":"section-4","title":"换一个产品，同样的问题会得出不同安排","depth":2}]},{"id":"glossary","group":"reference","title":"遇到陌生名词，来这里查一句解释","question":"遇到陌生名词，来这里查一句解释","summary":"术语索引提供简短定义、别名和唯一正文入口。","terms":[],"aliases":[],"related":["world-map","sources"],"html":"\u003cp>不用从头读完，也不用背这些词。阅读时遇到陌生名字，再到这里看一句普通话解释；点击右侧文章，可以跟着例子看它怎样工作。英文名字也可以直接搜索。\u003c/p>\n\u003ch2 id=\"section-1\">整体地图\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>软件世界模型\u003c/td>\n\u003ctd>把软件怎样做事、记事和合作连成一张脑中的地图。\u003c/td>\n\u003ctd>\u003ca href=\"#/world-map\">你点一下，软件里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-2\">计算与运行\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>程序\u003c/td>\n\u003ctd>让电脑执行的一套规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>函数\u003c/td>\n\u003ctd>有名字、能被其他地方调用的一项工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>副作用 · Side effect\u003c/td>\n\u003ctd>处理时还改变了外部东西，例如写入文件。\u003c/td>\n\u003ctd>\u003ca href=\"#/program\">点一个按钮，电脑怎么知道要做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行时 · Runtime\u003c/td>\n\u003ctd>让某种语言的代码能执行的支持。\u003c/td>\n\u003ctd>\u003ca href=\"#/runtime\">代码放在那里，为什么软件还没开始工作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>进程 · Process\u003c/td>\n\u003ctd>一份正在进行的程序运行活动。\u003c/td>\n\u003ctd>\u003ca href=\"#/runtime\">代码放在那里，为什么软件还没开始工作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>处理器\u003c/td>\n\u003ctd>执行指令并推进计算的硬件。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内存\u003c/td>\n\u003ctd>程序运行时，放眼前数据的快速空间。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>操作系统\u003c/td>\n\u003ctd>安排程序使用计算、内存、文件和网络的基础软件。\u003c/td>\n\u003ctd>\u003ca href=\"#/resources\">电脑的计算、内存和硬盘，各忙什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>算法\u003c/td>\n\u003ctd>解决一类问题的计算步骤。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据结构\u003c/td>\n\u003ctd>把信息摆成怎样的形式，方便以后操作。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>复杂度 · Complexity\u003c/td>\n\u003ctd>信息数量变大时，工作量怎样增长。\u003c/td>\n\u003ctd>\u003ca href=\"#/algorithms\">为什么做同一件事，有的软件快得多？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-3\">数据与状态\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>实体\u003c/td>\n\u003ctd>需要独立辨认的对象，例如某个用户或某篇文章。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标识\u003c/td>\n\u003ctd>辨认具体对象的值，例如文章的编号。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>约束\u003c/td>\n\u003ctd>记录必须符合的规则，例如编号不能重复。\u003c/td>\n\u003ctd>\u003ca href=\"#/data-model\">软件怎么把“人和文章”记成数据？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态 · State\u003c/td>\n\u003ctd>已经留下、会影响下一次行为的信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生命周期\u003c/td>\n\u003ctd>信息从出现到变化，再到失效或删除的过程。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>派生状态\u003c/td>\n\u003ctd>从已有信息算出来的结果，例如收藏篇数。\u003c/td>\n\u003ctd>\u003ca href=\"#/state\">为什么软件能记得你刚才做过什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据库 · Database\u003c/td>\n\u003ctd>帮助程序组织、查找和修改记录的软件。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对象存储\u003c/td>\n\u003ctd>整份保存图片、文档等内容，再凭标识取回的服务。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存 · Cache\u003c/td>\n\u003ctd>把可重新取得的结果留在手边，减少重复工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/storage\">文章、账号、图片，为什么不全放在一个地方？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一致性 · Consistency\u003c/td>\n\u003ctd>多份记录或显示需要满足怎样的关系。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事务\u003c/td>\n\u003ctd>一组相关修改一起提交，或者一起不留下。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冲突\u003c/td>\n\u003ctd>多次修改或不同信息彼此不能同时满足预期关系。\u003c/td>\n\u003ctd>\u003ca href=\"#/consistency\">两台设备看到不同的收藏，究竟哪份算数？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-4\">通信与协作\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户端\u003c/td>\n\u003ctd>一次交互中发起请求或使用服务的一方。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务端\u003c/td>\n\u003ctd>一次交互中提供服务、响应请求的一方。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前端\u003c/td>\n\u003ctd>接近用户呈现和交互的职责部分。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后端\u003c/td>\n\u003ctd>承担服务处理、共享规则与数据能力的职责部分。\u003c/td>\n\u003ctd>\u003ca href=\"#/client-server\">前端、后端、服务器，分别在哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口 · Interface\u003c/td>\n\u003ctd>能要求对方做什么、要给什么、会得到什么的约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API · Application Programming Interface\u003c/td>\n\u003ctd>供程序使用的接口。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协议\u003c/td>\n\u003ctd>交换信息与协作时遵守的规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/interface\">API 是什么，为什么程序要通过它合作？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据流\u003c/td>\n\u003ctd>材料来自哪里，怎样改变，最后用在哪里。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制流\u003c/td>\n\u003ctd>什么事情让某个动作开始、继续或分支。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事件\u003c/td>\n\u003ctd>系统记录或通知某件事情已经发生的信息。\u003c/td>\n\u003ctd>\u003ca href=\"#/flow\">点“生成摘要”后，文章内容去了哪里？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同步\u003c/td>\n\u003ctd>调用方等待当前操作完成，再继续相关流程的协作方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>异步\u003c/td>\n\u003ctd>发起与完成在时间上分离，结果通过后续机制接收。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>并发 · Concurrency\u003c/td>\n\u003ctd>多个执行活动在时间上重叠推进。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>队列 · Queue\u003c/td>\n\u003ctd>缓冲等待处理的工作，并协调生产与消费。\u003c/td>\n\u003ctd>\u003ca href=\"#/time\">软件为什么要“等待”，又怎样同时做几件事？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-5\">边界与架构\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模块\u003c/td>\n\u003ctd>一组相关规则和实现的组织单位。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>职责\u003c/td>\n\u003ctd>一个部分应该解释和维护的行为与规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>边界\u003c/td>\n\u003ctd>一个部分负责到哪里、怎样与其他部分交接。\u003c/td>\n\u003ctd>\u003ca href=\"#/boundaries\">软件那么多工作，怎样分给不同部分？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抽象 · Abstraction\u003c/td>\n\u003ctd>保留当前用途重要的行为，同时省略部分实现细节。\u003c/td>\n\u003ctd>\u003ca href=\"#/abstraction\">不知道内部每个细节，也能理解和使用软件吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>封装\u003c/td>\n\u003ctd>限制外部直接访问内部实现与状态的组织方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/abstraction\">不知道内部每个细节，也能理解和使用软件吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>依赖 · Dependency\u003c/td>\n\u003ctd>要靠另一部分的能力或约定才能完成工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>耦合\u003c/td>\n\u003ctd>一个部分的变化会牵动另一部分的紧密程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内聚\u003c/td>\n\u003ctd>同一部分内部的工作围绕共同职责的程度。\u003c/td>\n\u003ctd>\u003ca href=\"#/dependency\">为什么改了一个地方，另一个地方也出问题？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分层\u003c/td>\n\u003ctd>按不同职责层次组织系统的方式。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单体\u003c/td>\n\u003ctd>主要应用能力以一个部署单位组织的形态。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务\u003c/td>\n\u003ctd>通过明确接口提供能力的部分，部署语境下可独立运行。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分布式\u003c/td>\n\u003ctd>多个独立运行节点通过通信共同工作的系统形态。\u003c/td>\n\u003ctd>\u003ca href=\"#/shape\">一个软件，要放在一台电脑还是很多台上？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-6\">可靠性与信任\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>局部失败\u003c/td>\n\u003ctd>系统一部分失败而其他部分仍在运行。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时\u003c/td>\n\u003ctd>等待超过设定期限；并不证明对方没有执行。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重试\u003c/td>\n\u003ctd>再次尝试操作，以处理暂时性失败或未知结果。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等 · Idempotency\u003c/td>\n\u003ctd>同样要求重复处理，效果仍与处理一次相同。\u003c/td>\n\u003ctd>\u003ca href=\"#/failure\">为什么你点了按钮，软件却没有给出结果？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>认证 · Authentication\u003c/td>\n\u003ctd>判断请求方是谁。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授权 · Authorization\u003c/td>\n\u003ctd>判断该身份可对某个资源执行什么行为。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信任边界\u003c/td>\n\u003ctd>进入受保护能力时，需要重新检查的交接位置。\u003c/td>\n\u003ctd>\u003ca href=\"#/trust\">登录了，为什么还不能看所有人的文章？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日志\u003c/td>\n\u003ctd>有关具体事件的记录。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指标\u003c/td>\n\u003ctd>对系统行为与资源状况的数值汇总。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>追踪\u003c/td>\n\u003ctd>把一次工作经过多个部分的过程关联起来的记录。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可观测性 · Observability\u003c/td>\n\u003ctd>用可获得的信号理解系统内部行为的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/observability\">软件出问题时，怎样知道里面发生了什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>延迟\u003c/td>\n\u003ctd>一次工作从开始到所需结果的时间。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吞吐量\u003c/td>\n\u003ctd>一段时间里能完成多少工作。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>瓶颈\u003c/td>\n\u003ctd>限制整体能力的环节或资源。\u003c/td>\n\u003ctd>\u003ca href=\"#/performance\">软件的“快”，到底是哪里快？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-7\">演进与交付\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>构建\u003c/td>\n\u003ctd>把源材料处理成可运行或可分发产物。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部署\u003c/td>\n\u003ctd>将版本及配置放入目标环境，并安排访问入口。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>环境\u003c/td>\n\u003ctd>运行所使用的配置、依赖、资源与外部条件。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS\u003c/td>\n\u003ctd>把域名解析到相应网络地址等记录的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/delivery\">AI 写好代码后，为什么别人还不能打开软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本控制 · Git\u003c/td>\n\u003ctd>记录文件变化历史，帮助比较、协作和恢复。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>迁移\u003c/td>\n\u003ctd>把数据或结构从旧约定调整到新约定。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>兼容性\u003c/td>\n\u003ctd>新旧部分按所承诺的约定继续协作的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回滚\u003c/td>\n\u003ctd>恢复之前的版本或状态，范围需要明确。\u003c/td>\n\u003ctd>\u003ca href=\"#/change\">软件更新了，原来的文章和收藏怎么办？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>测试\u003c/td>\n\u003ctd>在选定条件下检查行为是否符合预期。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验收\u003c/td>\n\u003ctd>围绕使用目标判断交付是否满足要求。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不变量\u003c/td>\n\u003ctd>在允许的变化中仍应成立的关系或规则。\u003c/td>\n\u003ctd>\u003ca href=\"#/validation\">页面能打开，就说明软件做好了吗？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003ch2 id=\"section-8\">AI 软件\u003c/h2>\n\u003cdiv class=\"table-frame\" tabindex=\"0\" role=\"region\" aria-label=\"内容对照表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>简短含义\u003c/th>\n\u003cth>继续阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型推理 · Inference\u003c/td>\n\u003ctd>利用模型参数处理当前输入并产生输出的过程。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>模型这次真正拿到的材料和要求。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检索 · Retrieval / RAG\u003c/td>\n\u003ctd>从已有资料中选择相关信息供后续使用。\u003c/td>\n\u003ctd>\u003ca href=\"#/model\">AI 在软件里负责什么，其他部分还用来做什么？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>由模型动态选择部分后续行动的系统，术语定义并不统一。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流 · Workflow\u003c/td>\n\u003ctd>按预先定义的路径组织步骤与能力的系统。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具\u003c/td>\n\u003ctd>由系统提供、可实际读取或改变外部状态的能力。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>宿主\u003c/td>\n\u003ctd>把模型、工具与运行过程组织起来的执行环境。\u003c/td>\n\u003ctd>\u003ca href=\"#/agent\">聊天 AI 怎样变成能替你做事的助手？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设计约定\u003c/td>\n\u003ctd>对行为、职责、状态、失败和验证的明确承诺。\u003c/td>\n\u003ctd>\u003ca href=\"#/system-judgment\">有了这张地图，怎样更清楚地和 AI 讨论软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取舍\u003c/td>\n\u003ctd>在目标和约束下选择收益与代价的组合。\u003c/td>\n\u003ctd>\u003ca href=\"#/system-judgment\">有了这张地图，怎样更清楚地和 AI 讨论软件？\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/div>\u003cp>遇到产品名或框架名时，先看它提供哪一种能力：做事、记事、合作，还是帮助软件运行。具体品牌可以以后再了解。\u003c/p>\n","text":"概念索引：把名词放回地图 不用从头读完，也不用背这些词。阅读时遇到陌生名字，再到这里看一句普通话解释；点击右侧文章，可以跟着例子看它怎样工作。英文名字也可以直接搜索。 整体地图 概念 简短含义 继续阅读 --- --- --- 软件世界模型 把软件怎样做事、记事和合作连成一张脑中的地图。 你点一下，软件里面发生了什么？ 计算与运行 概念 简短含义 继续阅读 --- --- --- 程序 让电脑执行的一套规则。 点一个按钮，电脑怎么知道要做什么？ 函数 有名字、能被其他地方调用的一项工作。 点一个按钮，电脑怎么知道要做什么？ "id":"section-1","title":"整体地图","depth":2},{"id":"section-2","title":"计算与运行","depth":2},{"id":"section-3","title":"数据与状态","depth":2},{"id":"section-4","title":"通信与协作","depth":2},{"id":"section-5","title":"边界与架构","depth":2},{"id":"section-6","title":"可靠性与信任","depth":2},{"id":"section-7","title":"演进与交付","depth":2},{"id":"section-8","title":"AI 软件","depth":2}]},{"id":"sources","group":"reference","title":"想再深入，去哪里读？","question":"想再深入，去哪里读？","summary":"列出一手资料的支持范围，并区分通用解释、教学分类与尚未验证的效果。","terms":[],"aliases":[],"related":["world-map","glossary"],"html":"\u003cp>这份知识库先帮助你理解软件的主要工作和关系。你可以只读中文正文；下面的资料是想进一步查证或深入时的可选入口，大多是英文。\u003c/p>\n\u003ch2 id=\"section-1\">这些资料分别解释什么？\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/First_steps/Client-Server_overview\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：客户端与服务端\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：网页向远处程序提出要求，再收到响应的过程。\u003c/li>\n\u003cli>\u003ca href=\"https://pages.cs.wisc.edu/~remzi/OSTEP/\" target=\"_blank\" rel=\"noopener noreferrer\">操作系统教材 OSTEP\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：程序运行、计算、内存、存储，以及多项工作怎样配合。\u003c/li>\n\u003cli>\u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Execution_model\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：JavaScript 执行模型\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：一种语言的代码怎样执行，浏览器等环境怎样提供支持。\u003c/li>\n\u003cli>\u003ca href=\"https://www.postgresql.org/docs/current/tutorial-transactions.html\" target=\"_blank\" rel=\"noopener noreferrer\">PostgreSQL：事务\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：相关修改怎样一起提交或撤销。\u003c/li>\n\u003cli>\u003ca href=\"https://www.postgresql.org/docs/current/ddl-constraints.html\" target=\"_blank\" rel=\"noopener noreferrer\">PostgreSQL：数据约束\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：数据库怎样帮助限制记录必须满足的规则。\u003c/li>\n\u003cli>\u003ca href=\"https://martinfowler.com/articles/modularizing-react-apps.html\" target=\"_blank\" rel=\"noopener noreferrer\">模块化软件的作者文章\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：怎样通过模块和清楚入口组织代码。具体示例较深入，可以以后再读。\u003c/li>\n\u003cli>\u003ca href=\"https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control\" target=\"_blank\" rel=\"noopener noreferrer\">Git 教材：版本控制\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：记录、比较和恢复文件的变化历史。\u003c/li>\n\u003cli>\u003ca href=\"https://sre.google/sre-book/monitoring-distributed-systems/\" target=\"_blank\" rel=\"noopener noreferrer\">SRE：监测分布式系统\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：怎样用运行信号判断系统是否正常。\u003c/li>\n\u003cli>\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：构建有效的 Agent\u003cspan class=\"external\" aria-hidden=\"true\">↗\u003c/span>\u003c/a>：固定工作流与模型动态选择行动的区别。本文采用其结构解释，具体工具选择需另行了解。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"section-2\">哪些是本知识库为讲解而做的安排？\u003c/h2>\n\u003cp>“七个观察方向”和“做事、记事、合作”是帮助理解的教学分类。阅读助手、收藏动作、工作室分区等是虚构示意，用来展示机制，没有真实用户数据或成功指标。\u003c/p>\n\u003cp>类比会省略细节。工作室的分区对应软件职责，电脑里并没有真的房间；工作桌对应临时使用的空间，内存仍是电子设备。正文在相关位置说明了这类局限。\u003c/p>\n\u003ch2 id=\"section-3\">读懂这张地图以后，还需要学什么？\u003c/h2>\n\u003cp>具体开发时，还要结合自己的产品了解编程语言、实现工具、部署条件和检查方法。地图让你更容易提出问题、理解安排，不能替代实际运行结果。\u003c/p>\n\u003cp>这一版按完全零基础的读者重写了解释和图解。可读性经过编辑审读与手机、桌面显示检查，尚未开展真实读者学习效果研究。\u003c/p>\n","text":"想再深入，去哪里读？ 这份知识库先帮助你理解软件的主要工作和关系。你可以只读中文正文；下面的资料是想进一步查证或深入时的可选入口，大多是英文。 这些资料分别解释什么？ - MDN：客户端与服务端：网页向远处程序提出要求，再收到响应的过程。 - 操作系统教材 OSTEP：程序运行、计算、内存、存储，以及多项工作怎样配合。 - MDN：JavaScript 执行模型：一种语言的代码怎样执行，浏览器等环境怎样提供支持。 - PostgreSQL：事务：相关修改怎样一起提交或撤销。 - PostgreSQL：数据约束：数据库怎样帮助限制记录必须满足的规则。 - 模块化软件的作者文章：怎样通过模块和清楚入口组织代码。具体示例较深入，可以以后再读。 - Git 教材：版本控制：记录、比较和恢复文件的变化历史。 - SRE：监测分布式系统：怎样用运行信号判断系统是否正常。 - Anthropic：构建有效的 Agent：固定工作流与模型动态选择行动的区别。本文采用其结构解释，具体工具选择需另行了解。 哪些是本知识库为讲解而做的安排？ “七个观察方向”和“做事、记事、合作”是帮助理解的教学分类。阅读助手、收藏动作、工作室分区等是虚构示意，用来展示机制，没有真实用户数据或成功指标。 类比会省略细节。工作室的分区对应软件职责，电脑里并没有真的房间；工作桌对应临时使用的空间，内存仍是电子设备。正文在相关位置说明了这类局限。 读懂这张地图以后，还需要学什么？ 具体开发时，还要结合自己的产品了解编程语言、实现工具、部署条件和检查方法。地图让你更容易提出问题、理解安排，不能替代实际运行结果。 这一版按完全零基础的读者重写了解释和图解。可读性经过编辑审读与手机、桌面显示检查，尚未开展真实读者学习效果研究。","outline":[{"id":"section-1","title":"这些资料分别解释什么？","depth":2},{"id":"section-2","title":"哪些是本知识库为讲解而做的安排？","depth":2},{"id":"section-3","title":"读懂这张地图以后，还需要学什么？","depth":2}]}]}</script>

        // Keep automatic engagement attached to the current virtual article.
        window.gtag('config', config.measurementId, { ...page, send_page_view: false });
      }
      window.gtag('event', payload.name ? payload.name.replace(/-/g, '_') : 'page_view', {
        ...page, project: config.project, ...payload.data, send_to: config.measurementId
      });
    } catch {} // A blocked tracker must never interrupt reading or navigation.
  }

  window.readerAnalytics = {
    page(article, title) {
      const url = config.basePath + article;
      if (url === lastUrl) return;
      view = { url, title, referrer: lastUrl ? 'https://' + config.hostname + lastUrl : referrer };
      lastUrl = url;
      send({ ...view });
    },
    event(name, properties = {}) {
      if (!view) return;
      send({ ...view, name, data: { ...properties } });
    }
  };

  if (!enabled) return;
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
  window.gtag('js', new Date());
  window.gtag('config', config.measurementId, {
    send_page_view: false,
    page_location: 'https://' + config.hostname + config.basePath,
    page_referrer: referrer,
    page_title: config.project,
    allow_google_signals: false,
    allow_ad_personalization_signals: false,
    cookie_prefix: config.project.replace(/-/g, '_'),
    cookie_path: config.basePath,
    cookie_flags: 'SameSite=Lax;Secure'
  });
  const script = document.createElement('script');
  script.src = 'https://www.googletagmanager.com/gtag/js?id=' + config.measurementId;
  script.async = true;
  script.onload = () => { ready = true; queue.splice(0).forEach(send); };
  script.onerror = () => { failed = true; queue.length = 0; };
  document.head.appendChild(script);
})();
</script>
<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('knowledge-data').textContent),pages=data.pages,byId=new Map(pages.map(p=>[p.id,p])),groupById=new Map(data.groups.map(g=>[g.id,g]));
const main=document.getElementById('main'),nav=document.getElementById('navigation'),side=document.getElementById('sidebar'),dialog=document.getElementById('search-dialog'),input=document.getElementById('search-input'),results=document.getElementById('search-results');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=p=>p.title.split('：')[0],groupName=p=>groupById.get(p.group)?.name||(p.group==='orientation'?'整体地图':'概念与资料');
const store={get(key,fallback){try{return JSON.parse(localStorage.getItem('swm.'+key))??fallback}catch{return fallback}},set(key,value){try{localStorage.setItem('swm.'+key,JSON.stringify(value))}catch{}}};
const analytics=window.readerAnalytics;
let current='home',resumeTarget=null,scrollTimer=null,searchTimer=null,lastTrigger=null,restoring=false,menuPosition=0;
let fontSize=store.get('font',17);fontSize=Number.isFinite(fontSize)?Math.min(21,Math.max(15,fontSize)):17;
document.documentElement.style.setProperty('--article-size',fontSize+'px');
nav.innerHTML=`<a class="nav-home" href="#/home">知识地图</a><a class="nav-home" href="#/world-map">先看整张地图</a>`+data.groups.map((g,i)=>`<section class="nav-group"><h2><span class="mono">${String(i+1).padStart(2,'0')}</span>${esc(g.name)}</h2>${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}">${esc(short(p))}</a>`).join('')}</section>`).join('')+`<section class="nav-group"><h2>概念与资料</h2><a class="nav-reference" href="#/glossary">概念索引</a><a class="nav-reference" href="#/sources">阅读资料与知识边界</a></section>`;
function closeMenu(){const wasOpen=side.classList.contains('open');side.classList.remove('open');document.getElementById('backdrop').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false');document.body.style.overflow='';if(innerWidth<=850){side.inert=true;side.setAttribute('aria-hidden','true')}if(wasOpen)scrollTo(0,menuPosition)}
function openMenu(){menuPosition=scrollY;savePosition();side.inert=false;side.removeAttribute('aria-hidden');side.classList.add('open');document.getElementById('backdrop').classList.add('open');document.getElementById('menu-button').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';document.getElementById('menu-close').focus({preventScroll:true})}
function sizeMenu(){if(innerWidth>850){side.inert=false;side.removeAttribute('aria-hidden');closeMenu()}else if(!side.classList.contains('open')){side.inert=true;side.setAttribute('aria-hidden','true')}}
sizeMenu();addEventListener('resize',sizeMenu);
document.getElementById('menu-button').addEventListener('click',openMenu);
document.getElementById('menu-close').addEventListener('click',()=>{closeMenu();document.getElementById('menu-button').focus()});
document.getElementById('backdrop').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch(e.target)}
 if(e.key==='Escape'&&side.classList.contains('open')){closeMenu();document.getElementById('menu-button').focus()}
 if(e.key==='Tab'&&side.classList.contains('open')){const items=[...side.querySelectorAll('a,button')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
function savePosition(){if(byId.has(current)&&!dialog.open&&!restoring&&!side.classList.contains('open')){const positions=store.get('positions',{});positions[current]=scrollY;store.set('positions',positions);store.set('last',current)}}
function authorCredit(){return `<footer class="author-credit" aria-label="作者与联系方式"><span>作者：钟坤颖</span><span>联系方式：<a href="mailto:zhongky1995@gmail.com">zhongky1995@gmail.com</a></span></footer>`;}
function home(){const last=byId.get(store.get('last',''));
 return `<div class="home"><section class="hero"><p class="eyebrow mono">A map for understanding software</p><h1>软件世界模型</h1><p class="lead">从你看得见的按钮，<br>理解软件背后怎样做事、记事和合作。</p><p class="sub">为第一次理解软件的人写。先看熟悉的现象，再认识背后的原理；不用先会写代码。</p><div class="hero-actions"><a class="primary" href="#/world-map">从这里开始 <span aria-hidden="true">↗</span></a><a class="secondary" href="#/glossary">按名词查找 <span aria-hidden="true">→</span></a></div>${last?`<a class="resume" href="#/${last.id}" data-resume>继续上次阅读：${esc(short(last))}<span aria-hidden="true">→</span></a>`:''}</section><div class="section-title"><h2>七个观察方向</h2><p>同一个系统，彼此连接的不同视角</p></div><div class="atlas">${data.groups.map((g,i)=>`<section class="map-card"><div class="map-card-head"><span class="map-number mono">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(g.name)}</h3><p class="map-question">${esc(g.question)}</p></div></div><div class="entries">${pages.filter(p=>p.group===g.id).map(p=>`<a href="#/${p.id}"><span>${esc(short(p))}</span><span aria-hidden="true">↗</span></a>`).join('')}</div></section>`).join('')}</div><p class="home-note">自由阅读，无需打卡或完成练习。阅读位置保存在本机。<br>在线使用 Google Analytics 统计浏览与搜索操作，用于改进内容；不上传搜索词。<br><a href="#/sources">阅读资料与知识边界</a> · <a href="https://github.com/zhongky1995/software-world-model" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="https://github.com/zhongky1995/software-world-model/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT</a></p>${authorCredit()}</div>`;
}
function article(p){const core=pages.filter(x=>x.group!=='reference'),i=core.findIndex(x=>x.id===p.id),prev=core[i-1],next=core[i+1];
return `<div class="reader"><article class="article" data-article="${p.id}"><header class="article-head"><p class="eyebrow">${esc(groupName(p))}</p><h1>${esc(p.title)}</h1></header><div class="article-body">${p.html}</div><section class="related"><h2>沿着关系继续读</h2><div class="related-links">${p.related.map(id=>byId.get(id)).filter(Boolean).map(x=>`<a href="#/${x.id}">${esc(short(x))}<span aria-hidden="true">→</span></a>`).join('')}</div></section><nav class="reader-footer" aria-label="建议阅读次序">${prev?`<a href="#/${prev.id}">← ${esc(short(prev))}</a>`:'<a href="#/home">← 回到知识地图</a>'}${next?`<a href="#/${next.id}">${esc(short(next))} →</a>`:'<a href="#/home">回到知识地图 →</a>'}</nav><p class="article-note">这些概念帮助理解系统；具体实现需要结合对应文档与运行证据。</p>${authorCredit()}</article><aside class="outline" aria-label="文章大纲"><h2>本篇内容</h2>${p.outline.filter(x=>x.title!=='相关概念').map(x=>`<a href="#/${p.id}" data-section="${x.id}">${esc(x.title)}</a>`).join('')}<a href="#/home" style="margin-top:26px">← 返回地图</a></aside></div>`;
}
function render(){clearTimeout(searchTimer);clearTimeout(scrollTimer);savePosition();restoring=true;closeMenu();let id='home';try{id=decodeURIComponent(location.hash.replace(/^#\//,'')||'home')}catch{}current=byId.has(id)?id:'home';const p=byId.get(current);
 main.innerHTML=p?article(p):home();document.title=p?short(p)+' · 软件世界模型':'软件世界模型';document.getElementById('breadcrumb').textContent=p?'知识地图 / '+groupName(p):'知识地图';
 nav.querySelectorAll('a').forEach(a=>a.getAttribute('href')===`#/${current}`?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 analytics.page(current,p?.title||data.title);
 const target=resumeTarget===current?store.get('positions',{})[current]||0:0;resumeTarget=null;requestAnimationFrame(()=>{scrollTo(0,target);main.focus({preventScroll:true});restoring=false});if(p)store.set('last',p.id);
}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;
 if(a.dataset.section){e.preventDefault();document.getElementById(a.dataset.section)?.scrollIntoView({block:'start'});return}
 if(a.hasAttribute('data-resume')){resumeTarget=a.hash.slice(2);analytics.event('resume-reading',{article:resumeTarget})}
 if(a.closest('#search-results')&&a.hash.startsWith('#/'))analytics.event('search-result-click',{article:a.hash.slice(2)});
 if(a.hostname==='github.com')analytics.event('github-click');
 if(a.hash.startsWith('#/')){if(dialog.open)dialog.close();if(a.hash===location.hash){closeMenu();if(a.hasAttribute('data-resume'))scrollTo(0,store.get('positions',{})[current]||0);else scrollTo(0,0)}}
});
addEventListener('hashchange',render);addEventListener('beforeunload',savePosition);
addEventListener('scroll',()=>{document.getElementById('top-button').style.display=scrollY>600?'block':'none';clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,180)},{passive:true});
document.getElementById('top-button').addEventListener('click',()=>scrollTo(0,0));
document.getElementById('font-smaller').addEventListener('click',()=>{fontSize=Math.max(15,fontSize-1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('font-larger').addEventListener('click',()=>{fontSize=Math.min(21,fontSize+1);document.documentElement.style.setProperty('--article-size',fontSize+'px');store.set('font',fontSize)});
document.getElementById('print-button').addEventListener('click',()=>{analytics.event('print',{article:current});window.print()});
function openSearch(trigger){lastTrigger=trigger;closeMenu();if(!dialog.open){dialog.showModal();analytics.event('search-open',{article:current})}input.focus();search()}
document.querySelectorAll('[data-search]').forEach(b=>b.addEventListener('click',()=>openSearch(b)));
document.getElementById('search-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{if(lastTrigger&&!lastTrigger.closest('[inert]'))lastTrigger.focus()});
dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dialog.close()}});
dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
function highlight(text,q){if(!q)return esc(text);const i=text.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function search(){clearTimeout(searchTimer);const q=input.value.trim(),lower=q.toLowerCase();
 if(!q){document.getElementById('search-status').textContent='搜索全部 29 篇正文、概念索引与英文别名';results.innerHTML='<div class="empty">试试：状态、API、抽象、并发、Runtime、Agent…<br>也可以输入正文里的问题或关键词。</div>';return}
 const found=pages.map(p=>{const title=p.title.toLowerCase(),alias=p.aliases.join(' ').toLowerCase(),body=p.text.toLowerCase();return {p,score:(title.includes(lower)?20:0)+(alias.includes(lower)?10:0)+(body.includes(lower)?1:0)}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||pages.indexOf(a.p)-pages.indexOf(b.p));
 document.getElementById('search-status').textContent=`全库搜索 · 找到 ${found.length} 篇相关内容`;
 searchTimer=setTimeout(()=>analytics.event('search',{query_length:q.length,result_count:found.length}),800);
 results.innerHTML=found.length?found.map(({p})=>{const i=p.text.toLowerCase().indexOf(lower);let snippet=p.text.slice(Math.max(0,i-35),Math.max(0,i-35)+145);return `<a class="result" href="#/${p.id}"><small>${esc(groupName(p))}</small><strong>${highlight(p.title,q)}</strong><p>${highlight(snippet,q)}${snippet.length>=145?'…':''}</p></a>`}).join(''):'<div class="empty">没有找到相关内容。可以缩短关键词，或使用概念的中文名。<br><a href="#/glossary" style="text-decoration:underline">打开概念索引 →</a></div>';
}
input.addEventListener('input',search);render();
})();
</script>
